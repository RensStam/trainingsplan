/* ===========================================================================
   HARDLOPEN — deel 4: Atempo Personal Coach (proef) — trainingen naar Intervals.icu → Garmin
   Rechtstreeks vanuit de app, zonder tussenserver en zonder API-sleutel: je verbindt Atempo per sessie met je
   Intervals.icu-account (OAuth met PKCE, alleen het recht CALENDAR:WRITE). Het toegangsbewijs staat alleen in
   sessionStorage (weg zodra het tabblad sluit) en nooit in je gegevens, back-ups, exports of de cloud.
   Koppelgegevens per training staan in session.ext.intervals, los van garminExternalId (uitgevoerde activiteiten).
   =========================================================================== */
var COACH_CLIENT_ID = '1644';                                   // Client ID van de Atempo-app bij Intervals.icu (openbaar, geen geheim)
const COACH_REDIRECT = 'https://rensstam.github.io/trainingsplan/';
const COACH_API = 'https://intervals.icu/api/v1/athlete/0';
const COACH_SS = 'atempo-intervals';                        // sessionStorage-sleutel (alleen dit tabblad, tijdelijk)
const COACH_EXT_RE = /^atempo-[A-Za-z0-9_-]{1,64}$/;
const COACH_TEST_STEPS = [{ t:'warmup', sec:300 }, { t:'run', sec:180 }, { t:'walk', sec:120 }, { t:'cooldown', sec:300 }];

function coachSet(){ const st = RP().settings; st.coach = { variant:'fit', lastOkAt:null, lastError:null, athlete:null, test:null, ...(st.coach||{}) }; return st.coach; }
const coachExtId = s => 'atempo-' + s.id;
const coachInfo = s => (s && s.ext && s.ext.intervals) || null;
function coachHash(s){       // vingerafdruk van wat naar Garmin gaat: datum, naam, stappen en doel
  const str = JSON.stringify([s.date, s.name, (s.steps||[]).map(x=>[x.t,x.sec]), s.target||null]);
  let h = 5381; for(let i=0;i<str.length;i++) h = ((h<<5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36);
}
/* lokaal · verzonden · gewijzigd na verzenden · fout · verwijderd */
function coachState(s){
  const i = coachInfo(s); if(!i || i.status==='deleted') return 'local';
  if(i.status==='error') return 'error';
  return i.hash===coachHash(s) ? 'sent' : 'changed';
}

/* ---------- verbinden met Intervals.icu (OAuth + PKCE) ---------- */
function coachSess(){ try { return JSON.parse(sessionStorage.getItem(COACH_SS)||'{}'); } catch(e){ return {}; } }
function coachSessSave(o){ try { sessionStorage.setItem(COACH_SS, JSON.stringify(o)); } catch(e){} }
const coachHere = () => location.href.split(/[?#]/)[0].replace(/index\.html$/, '');
const coachCanConnect = () => !!COACH_CLIENT_ID && coachHere()===COACH_REDIRECT;
const coachConnected = () => !!coachSess().token;
function coachRnd(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b=>('0'+b.toString(16)).slice(-2)).join(''); }
async function coachChallenge(verifier){
  const dig = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  let b = ''; dig.forEach(x=>{ b += String.fromCharCode(x); });
  return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function coachAuthUrl(){
  const verifier = coachRnd(48), state = coachRnd(16);
  coachSessSave({ ...coachSess(), pkce:{ verifier, state, at:Date.now() } });
  return 'https://intervals.icu/oauth/authorize?' + new URLSearchParams({ client_id:COACH_CLIENT_ID, redirect_uri:COACH_REDIRECT, scope:'CALENDAR:WRITE',
    state, code_challenge: await coachChallenge(verifier), code_challenge_method:'S256' });
}
async function coachConnect(){
  if(!COACH_CLIENT_ID) return runMsg('De Atempo-app is nog niet goedgekeurd door Intervals.icu.', 'err');
  if(coachHere()!==COACH_REDIRECT) return runMsg('Verbinden met Intervals.icu kan alleen in de webversie (rensstam.github.io/trainingsplan).', 'err');
  const url = await coachAuthUrl();
  coachSessSave({ ...coachSess(), back:{ view:ui.view, tab:RUI.tab, selId:RUI.selId } });
  location.href = url;
}
/* terugkomst van Intervals.icu: ?code=…&state=… omwisselen voor een toegangsbewijs */
async function coachHandleRedirect(search){
  const q = new URLSearchParams(search!=null ? search : location.search), code = q.get('code'), st = q.get('state'), err = q.get('error');
  if(!code && !err) return false;
  if(search==null) history.replaceState(null, '', location.pathname + location.hash);
  const ss = coachSess(), p = ss.pkce; delete ss.pkce; coachSessSave(ss);
  const c = coachSet();
  if(err){ c.lastError = 'Geen toestemming gegeven bij Intervals.icu'; return true; }
  if(!p || p.state!==st || Date.now()-p.at > 10*60*1000){ c.lastError = 'Verbinden mislukt (onbekende of verlopen poging) — probeer opnieuw'; return true; }
  try {
    const r = await fetch('https://intervals.icu/api/oauth/token', { method:'POST', body:new URLSearchParams({ client_id:COACH_CLIENT_ID, code, code_verifier:p.verifier, redirect_uri:COACH_REDIRECT }) });
    const j = await r.json().catch(()=>null);
    if(!r.ok || !j || !j.access_token) throw new Error((j && j.error) || ('fout '+r.status));
    coachSessSave({ ...coachSess(), token:j.access_token, at:Date.now() });
    c.athlete = j.athlete ? { id:j.athlete.id, name:j.athlete.name||null } : c.athlete; c.lastOkAt = runNow(); c.lastError = null;
  } catch(e){ c.lastError = 'Verbinden met Intervals.icu mislukt: '+e.message; }
  return true;
}
async function coachDisconnect(){
  const t = coachSess().token; coachSessSave({});
  if(t){ try { await fetch('https://intervals.icu/api/v1/disconnect-app', { method:'DELETE', headers:{ Authorization:'Bearer '+t } }); } catch(e){} }
  runMsg('Verbinding met Intervals.icu verbroken en het toegangsbewijs ingetrokken.'); coachRerender();
}

/* ---------- aanroepen (alleen agenda-afspraken met een Atempo-sleutel) ---------- */
function coachToEvent(e){
  if(!COACH_EXT_RE.test(String(e.externalId||''))) throw new Error('Ongeldige Atempo-sleutel');
  if(!runValidDate(e.date)) throw new Error('Ongeldige datum');
  const ev = { category:'WORKOUT', type:'Run', start_date_local:e.date+'T00:00:00', name:String(e.name||'Atempo-training').slice(0,80), external_id:e.externalId };
  if(e.fitBase64){ ev.filename = e.filename || 'atempo.fit'; ev.file_contents_base64 = e.fitBase64; if(e.note) ev.description = e.note; }
  else if(e.text){ ev.description = e.text; }
  else throw new Error('Training zonder stappen');
  return ev;
}
async function coachCall(data){
  const token = coachSess().token;
  if(!token) throw new Error('Eerst verbinden met Intervals.icu (knop Verbinden met Intervals.icu)');
  let method = 'GET', path = '', body;
  if(data.action==='upsert'){ method = 'POST'; path = '/events/bulk?upsert=true'; body = data.events.map(coachToEvent); }
  else if(data.action==='delete'){ if(!data.externalIds.every(x=>COACH_EXT_RE.test(x))) throw new Error('Alleen Atempo-afspraken kunnen worden verwijderd'); method = 'PUT'; path = '/events/bulk-delete'; body = data.externalIds.map(x=>({ external_id:x })); }
  else if(data.action!=='ping') throw new Error('Onbekende handeling');
  let r;
  try { r = await fetch(COACH_API+path, { method, headers:{ Authorization:'Bearer '+token, Accept:'application/json', ...(body?{ 'Content-Type':'application/json' }:{}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch(e){ throw new Error('Geen verbinding met Intervals.icu'); }
  const j = await r.json().catch(()=>null);
  if(r.status===401 || r.status===403){ coachSessSave({}); throw new Error('Toegang verlopen of ingetrokken — verbind opnieuw met Intervals.icu'); }
  if(!r.ok) throw new Error(r.status===429 ? 'Te veel verzoeken bij Intervals.icu, probeer het later opnieuw' : 'Intervals.icu gaf fout '+r.status);
  if(data.action==='ping') return { athlete: j ? { id:j.id, name:j.name||null } : null };
  if(data.action==='upsert') return { events: (Array.isArray(j)?j:[]).map(ev=>({ id:ev.id, external_id:ev.external_id })) };
  return { deleted: j && j.eventsDeleted };
}
/* bij het opstarten: terugkomst van Intervals.icu afhandelen */
window.addEventListener('load', ()=>{ coachHandleRedirect().then(back=>{ if(back){ saveState(); const ss = coachSess(), b = ss.back || {}; delete ss.back; coachSessSave(ss); if(typeof showView==='function'){ RUI.tab = b.tab || 'garmin'; if(b.selId) RUI.selId = b.selId; showView(b.view || 'running'); } } }); });

/* Intervals.icu-workouttekst (variant B); Warmup/Cooldown als kopjes zodat Intervals.icu de stapsoort herkent */
function coachText(s){
  const dur = sec => { const m = Math.floor(sec/60), r = sec%60; return m && r ? m+'m'+r+'s' : m ? m+'m' : r+'s'; };
  const tg = s.target||{}, runTg = tg.type==='hr' && num(tg.low) ? ' '+tg.low+'-'+tg.high+'bpm HR' : (tg.type==='pace' && num(tg.low) ? ' '+secToPace(tg.low)+'-'+secToPace(tg.high)+'/km Pace' : '');
  // stapsoort expliciet meegeven: zonder dit leidt Intervals.icu de soort af uit de hartslagzone (alles Z1 → alles dezelfde soort op het horloge)
  const kind = { warmup:'warmup', run:'active', walk:'recovery', cooldown:'cooldown' };
  const line = (t, sec) => '- '+RUN_STEP[t].nl+' '+dur(sec)+(t==='run' ? runTg : '')+' intensity='+kind[t];
  const L = [];
  runCompress(s.steps).forEach(g=>{
    if(g.kind==='repeat'){ L.push('', g.count+'x', line('run', g.items[0].sec), line('walk', g.items[1].sec)); }
    else if(g.t==='warmup') L.push('Warmup', line('warmup', g.sec));
    else if(g.t==='cooldown') L.push('', 'Cooldown', line('cooldown', g.sec));
    else L.push('', line(g.t, g.sec));
  });
  return L.join('\n').trim();
}
function coachB64(bytes){ let b = ''; for(let i=0;i<bytes.length;i++) b += String.fromCharCode(bytes[i]); return btoa(b); }
/* één training omzetten naar wat de serverfunctie accepteert */
function coachPayload(s, variant, extId){
  const base = { externalId: extId || coachExtId(s), date: s.date, name: s.name };
  if(variant==='text') return { ...base, text: coachText(s) };
  const f = fitExportSession(s); if(!f.ok) throw new Error('FIT-controle mislukt: '+f.errors.join('; '));
  return { ...base, fitBase64: coachB64(f.bytes), filename: fitAscii(s.name, 40)+'.fit', note: 'Gepland in Atempo.' };
}
function coachRerender(){ saveState(); if(typeof ui!=='undefined' && (ui.view==='running' || ui.view==='data')) renderCurrent(); }

async function coachSend(s){
  const c = coachSet(), extId = coachExtId(s), prev = coachInfo(s) || {};
  RUI.coachBusy = s.id; coachRerender();
  try {
    const res = await coachCall({ action:'upsert', events:[coachPayload(s, c.variant)] });
    const ev = (res.events||[])[0] || {};
    s.ext = s.ext || {}; s.ext.intervals = { externalId:extId, eventId: ev.id ?? prev.eventId ?? null, syncedAt:runNow(), status:'sent', error:null, hash:coachHash(s), variant:c.variant, gcSeen:false, watchSeen:false };
    c.lastOkAt = runNow(); c.lastError = null; runMsg('Verzonden naar Intervals.icu. Garmin krijgt hem binnen het venster van ongeveer 7 dagen; synchroniseer daarna je horloge.');
  } catch(e){
    s.ext = s.ext || {}; s.ext.intervals = { ...prev, externalId:extId, status:'error', error:e.message, failedAt:runNow() };
    c.lastError = e.message; runMsg('Synchronisatie mislukt: '+e.message+' — de training staat gewoon in Atempo.', 'err');
  } finally { RUI.coachBusy = null; coachRerender(); }
}
async function coachRemove(extId, s){
  try {
    await coachCall({ action:'delete', externalIds:[extId] });
    if(s){ s.ext = s.ext || {}; s.ext.intervals = { ...(coachInfo(s)||{}), externalId:extId, status:'deleted', syncedAt:runNow(), error:null }; }
    coachSet().lastError = null; runMsg('Uit Intervals.icu verwijderd. Garmin werkt dat bij de volgende synchronisatie bij (nog te controleren).');
  } catch(e){ coachSet().lastError = e.message; runMsg('Verwijderen in Intervals.icu mislukt: '+e.message, 'err'); }
  coachRerender();
}
/* bij overslaan, annuleren of verwijderen in Atempo: aanbieden de externe afspraak weg te halen (nooit automatisch) */
function coachOfferRemove(s){
  const i = coachInfo(s); if(!i || (i.status!=='sent' && i.status!=='error')) return;
  if(confirm('Deze training staat ook in Intervals.icu (en mogelijk op je Garmin). Daar ook weghalen?')) coachRemove(i.externalId, s);
}
async function coachPing(){
  const c = coachSet(); RUI.coachBusy = 'ping'; coachRerender();
  try { const r = await coachCall({ action:'ping' }); c.athlete = r.athlete; c.lastOkAt = runNow(); c.lastError = null; runMsg('Verbinding met Intervals.icu werkt.'); }
  catch(e){ c.lastError = e.message; runMsg('Verbinding mislukt: '+e.message, 'err'); }
  finally { RUI.coachBusy = null; coachRerender(); }
}
/* test 2: de testtraining van 15 minuten in beide varianten, als aparte afspraken */
async function coachSendTest(date){
  if(!runValidDate(date)) return runMsg('Kies een geldige datum voor de testtraining.', 'err');
  const c = coachSet(), t = { id:'test', name:'Atempo TEST — 15 minuten', date, steps:COACH_TEST_STEPS.map(x=>({ ...x })), target:{ type:'none' } };
  RUI.coachBusy = 'test'; coachRerender();
  try {
    await coachCall({ action:'upsert', events:[ coachPayload({ ...t, name:'Atempo TEST (FIT)' }, 'fit', 'atempo-test-fit'), coachPayload({ ...t, name:'Atempo TEST (tekst)' }, 'text', 'atempo-test-tekst') ] });
    c.test = { date, sentAt:runNow() }; c.lastOkAt = runNow(); c.lastError = null;
    runMsg('Twee testtrainingen verzonden voor '+runDateShort(date)+': "Atempo TEST (FIT)" en "Atempo TEST (tekst)". Kijk in Intervals.icu, Garmin Connect en op je horloge welke goed overkomt.');
  } catch(e){ c.lastError = e.message; runMsg('Testtraining niet verzonden: '+e.message, 'err'); }
  finally { RUI.coachBusy = null; coachRerender(); }
}
async function coachRemoveTest(){
  try { await coachCall({ action:'delete', externalIds:['atempo-test-fit','atempo-test-tekst'] }); coachSet().test = null; runMsg('Testtrainingen verwijderd uit Intervals.icu.'); }
  catch(e){ coachSet().lastError = e.message; runMsg('Verwijderen mislukt: '+e.message, 'err'); }
  coachRerender();
}
function coachAct(act, args){
  const s = args[0] ? runSes(args[0]) : null;
  if(['coachSend','coachRemove','coachPing','coachTest','coachTestDel'].includes(act) && !coachConnected())
    return runMsg('Verbind eerst met Intervals.icu met de knop Verbinden met Intervals.icu.', 'err');
  switch(act){
    case 'coachSend': {
      if(!s || s.status!=='planned') return runMsg('Alleen een geplande training kun je naar Garmin sturen.', 'err');
      const rd = runReadiness(todayISO());
      if(s.date <= addDays(todayISO(),1) && rd.shown==='red' && !confirm('Je herstelstatus is rood: '+runStatusHeadline(rd)+'\n\nToch naar Garmin sturen? Jij beslist.')) return;
      coachSend(s); return;
    }
    case 'coachRemove': { const i = coachInfo(s); if(i && confirm('Deze training uit Intervals.icu halen? In Atempo blijft hij staan.')) coachRemove(i.externalId, s); return; }
    case 'coachSeen': { const i = coachInfo(s); if(!i) return; if(args[1]==='gc') i.gcSeen = !i.gcSeen; if(args[1]==='watch') i.watchSeen = !i.watchSeen; return; }
    case 'coachPing': coachPing(); return;
    case 'coachConnect': coachConnect(); return;
    case 'coachDisconnect': if(confirm('Verbinding met Intervals.icu verbreken? Je kunt later opnieuw verbinden.')) coachDisconnect(); return;
    case 'coachTest': coachSendTest((document.getElementById('coachTestDate')||{}).value); return;
    case 'coachTestDel': if(confirm('De twee testtrainingen uit Intervals.icu verwijderen?')) coachRemoveTest(); return;
    case 'coachVariant': coachSet().variant = args[0]==='text' ? 'text' : 'fit'; return;
  }
}
