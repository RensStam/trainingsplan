<!doctype html>
<html lang="nl">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Trainingsplan Rens 2.0 — Trainingsblok 2</title>
<style>
:root{
  --ink:#1b3a30;--green:#276b52;--green2:#3a7d64;--green3:#2f6a55;--mint:#eef5f1;--mint2:#e2efe8;
  --paper:#f4f6f3;--card:#ffffff;--line:#dde5e0;--line2:#eef2ef;--muted:#6b7872;--text:#22302b;
  --amber:#f6e6a6;--amber-bg:#fbf5e2;--amber-ink:#715600;
  --blue:#dceaf3;--blue-ink:#2b566b;--purple:#ece4f5;--purple-ink:#5b3d78;
  --pos:#1e6a45;--neg:#9a3529;
  --shadow:0 1px 2px rgba(27,58,48,.04), 0 6px 20px rgba(27,58,48,.06);
  --radius:16px;--radius-sm:11px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);background:var(--paper);line-height:1.5;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{color:var(--ink);font-weight:750}
a{color:var(--green)}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:17px;font-weight:800;margin:0 8px 14px;line-height:1.3}
.brand small{display:block;font-size:11.5px;font-weight:500;opacity:.65;margin-top:5px}
.nav-btn{display:flex;align-items:center;width:100%;border:0;background:transparent;color:#d3e3dc;padding:12px 12px;border-radius:10px;text-align:left;gap:11px;margin:2px 0;font-weight:600;font-size:14.5px;min-height:44px}
.nav-btn:hover{background:#26564699}
.nav-btn.active{background:#348063;color:#fff}
.nav-ico{width:20px;text-align:center;flex:0 0 20px;opacity:.85}
.sidebar-sep{border-top:1px solid #ffffff1f;margin:12px 6px}
.sidebar-foot{font-size:11px;color:#9fb6ac;margin:16px 10px;line-height:1.5}
.main{min-width:0;display:flex;flex-direction:column}
#backupBar{background:var(--amber-bg);border-bottom:1px solid #e5d59b;color:var(--amber-ink);padding:9px 24px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#backupBar[hidden]{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{margin:0;font-size:19px}
.save-state{font-size:11.5px;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.mobile-menu{display:none}
.mobile-tabs{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650;min-height:40px;line-height:1.2}
.btn:hover{border-color:var(--green2);background:var(--mint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green3);border-color:var(--green3)}
.btn.danger{color:var(--neg);border-color:#e6c9c4}
.btn.sm{padding:7px 10px;font-size:12.5px;min-height:34px}
.btn.block{width:100%}

.content{padding:22px 24px 90px;max-width:1180px;margin:0 auto;width:100%}
.view{display:none}.view.active{display:block}

.pagehead{margin:0 0 20px}
.pagehead .eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green2)}
.pagehead h2{margin:4px 0 0;font-size:24px}
.pagehead p{margin:8px 0 0;color:var(--muted);max-width:760px;font-size:13.5px}

.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h3{margin:0 0 14px;font-size:16px}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12.5px}
.card h4{margin:16px 0 8px;color:var(--green);font-size:13.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tny{font-size:11.5px}
.field input::placeholder{color:var(--muted);opacity:.85}

.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:750;background:var(--mint2);color:var(--green)}
.pill.priority{background:#fbedc2;color:var(--amber-ink)}
.pill.done{background:#d5efe1;color:var(--pos)}
.pill.warn{background:var(--amber);color:var(--amber-ink)}
.pill.grey{background:#ebeeec;color:#5c6660}
.tag-coach{background:var(--blue);color:var(--blue-ink)}
.tag-learning{background:#e2efe8;color:#2f6a55}
.tag-strength{background:var(--purple);color:var(--purple-ink)}
.tag-recovery{background:var(--mint2);color:var(--green)}
.tag-longwalk{background:var(--amber);color:var(--amber-ink)}
.tag-rest{background:#eef1ef;color:#5c6660}
.phase-pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.02em;background:#e6efe9;color:#2f6a55;text-transform:uppercase}
.stage-badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:750}
.stage-leren{background:#e2efe8;color:#2f6a55}
.stage-vertrouwd{background:#dceaf3;color:#2b566b}
.stage-trainen{background:#ece4f5;color:#5b3d78}
.dot-learn{color:#8bb7a4}
.dot-session{color:#5b3d78}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 12px}
.section-title h2{margin:0;font-size:17px}

.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px}
.metric .label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.metric .value{font-size:30px;font-weight:800;color:var(--green);margin-top:2px;line-height:1.05;letter-spacing:-.01em}
.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}

/* Geregistreerde training = inklapbare kaart */
details.regcard{padding:0;overflow:hidden}
details.regcard > summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
details.regcard > summary::-webkit-details-marker{display:none}
details.regcard > summary::before{content:"▸";color:var(--muted);font-size:10px;align-self:center}
details.regcard[open] > summary::before{content:"▾"}
details.regcard > summary .rc-title{font-weight:750;font-size:14.5px;color:var(--ink)}
details.regcard > summary .rc-sum{font-size:11.5px;color:var(--muted)}
details.regcard[open] > summary{border-bottom:1px solid var(--line2)}
details.regcard .rc-body{padding:14px 16px 16px}

/* Dagadvies — compact, hiërarchie: advies centraal, rest achter toggles */
.dagadvies{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;border-left:3px solid var(--line2);margin-bottom:16px}
.dagadvies.st-green{border-left-color:var(--pos)}
.dagadvies.st-orange{border-left-color:var(--amber)}
.dagadvies.st-red{border-left-color:var(--neg)}
.dagadvies .lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dagadvies .lbl .own-tag{margin-left:6px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.dagadvies .status{font-size:15.5px;font-weight:750;color:var(--ink);line-height:1.25;margin-top:1px}
.dagadvies .sub{font-size:12px;color:var(--muted);margin-top:1px}
.dagadvies .act{font-size:12.5px;color:var(--ink);margin-top:5px}
.dagadvies .toggles{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:7px}
.dagadvies .toggles details{flex:0 0 auto}
.dagadvies .toggles details[open]{flex:1 1 100%}
.dagadvies .toggles summary{font-size:11.5px;font-weight:650;color:var(--green);cursor:pointer;list-style:none}
.dagadvies .toggles summary::-webkit-details-marker{display:none}
.dagadvies .toggles summary::marker{content:""}
.dagadvies .toggles .panel{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
.dagadvies .toggles .own-row{margin-left:8px;font-size:16px}
.dagadvies .toggles .own-row a{text-decoration:none;margin-right:6px}

/* Today: crisp segmented answer */
.answer{display:flex;flex-direction:column;gap:2px}
.answer .seg{padding:14px 0;border-top:1px solid var(--line2)}
.answer .seg:first-child{border-top:0;padding-top:2px}
.answer .seg h4{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.answer .seg .big{font-size:17px;font-weight:750;color:var(--ink);line-height:1.35}
.answer .seg .lines label{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.answer .seg .lines label input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--green)}
.answer .seg .reglist{margin:2px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.answer .seg .reglist li{margin:2px 0}

.week-track{display:flex;flex-direction:column}
.week-track .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:14.5px}
.week-track .row:first-child{border-top:0}
.week-track .k{font-weight:600}
.week-track .v{font-variant-numeric:tabular-nums;font-weight:750;white-space:nowrap}
.week-track .v.todo{color:var(--amber-ink)}
.week-track .v.ok{color:var(--pos)}
.week-track .v.na{color:var(--muted);font-weight:500}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.field{display:flex;flex-direction:column}
.field label{font-size:11.5px;color:var(--muted);font-weight:700;margin:0 0 5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #cdd7d1;border-radius:10px;padding:11px 12px;background:var(--card);min-height:44px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green2);outline-offset:0;border-color:var(--green2)}
.field textarea{min-height:64px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field.wide{grid-column:1/-1}
.helpbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--mint);color:#3d534b;font-size:12px}

.recovery-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.recovery-strip .rc{background:var(--mint);border:1px solid var(--line2);border-radius:10px;padding:10px 6px;text-align:center}
.recovery-strip .rc b{display:block;font-size:18px;color:var(--ink);line-height:1.1}
.recovery-strip .rc span{font-size:10.5px;color:var(--muted)}

.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dayslot{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.dayslot.today{border-color:var(--green2);box-shadow:0 0 0 2px var(--green2) inset}
.dayslot .dhead{padding:8px 9px;font-size:11.5px;font-weight:800;background:var(--mint);display:flex;justify-content:space-between;align-items:center}
.dayslot .dbody{padding:9px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat-chip{border-radius:8px;padding:4px 8px;font-size:11px;font-weight:750;text-align:center}

.warnline{background:var(--amber-bg);border:1px solid #e5d59b;border-radius:10px;padding:10px 13px;font-size:12.5px;color:var(--amber-ink);margin:6px 0}
.advice{background:var(--mint2);border:1px solid #c3dccf;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#2f5a49;margin:6px 0}
.notice{background:var(--amber-bg);border:1px solid #e5d59b;border-radius:12px;padding:12px 14px;font-size:13px;color:#4a4433}

.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;min-width:560px}
table.data th{background:var(--ink);color:#fff;text-align:left;font-size:11.5px;font-weight:700;padding:10px}
table.data td{border-bottom:1px solid var(--line2);padding:9px 10px;font-size:13px;vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tr.group td{background:var(--mint);font-weight:700;color:var(--ink)}
/* Dagdata-tabel: rustige dagtabel, datumkolom sticky */
table.dagdata{min-width:0;border-collapse:collapse}
table.dagdata th,table.dagdata td{padding:9px 13px;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line2);border-right:0}
table.dagdata thead th{border-bottom:2px solid var(--line)}
table.dagdata th.n,table.dagdata td.n{text-align:right}
table.dagdata tbody tr:last-child td{border-bottom:0}
table.dagdata th:first-child,table.dagdata td:first-child{position:sticky;left:0;z-index:2;text-align:left}
table.dagdata td.dd-date{min-width:118px;font-weight:600;font-variant-numeric:normal}
table.dagdata th:first-child{background:var(--ink);z-index:4}
/* tabel scrolt in eigen kader: zijwaartse schuifbalk altijd in beeld, kopregel + datum blijven staan */
.advrow{display:flex;align-items:center;gap:10px;margin:3px 0}.advwk{min-width:96px;white-space:nowrap}.advcells{display:flex;gap:3px}.advcell{width:18px;height:18px;border-radius:4px;display:inline-block}
.dd-topscroll{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:2px}
.dd-topscroll>div{height:1px}
.table-wrap.dd-wrap{max-height:calc(100vh - 90px);min-height:260px;overflow:auto;overscroll-behavior:contain}
table.dagdata thead th{position:sticky;top:0;z-index:3}
table.dagdata td:first-child{background:var(--card)}
table.dagdata tr.ro td:first-child{background:#f4f6f5}
table.dagdata tr.ro td{color:#5c6b64;background:#fafbfa}
table.dagdata tr.ro .lock{opacity:.5;font-size:11px}
table.dagdata tbody tr:hover td{background:#f0f5f2}
table.dagdata tbody tr:hover td:first-child{background:#eaf1ed}
table.dagdata input.cell,table.dagdata select.cell{width:100%;min-width:52px;box-sizing:border-box;border:1px solid transparent;background:transparent;
  font:inherit;text-align:right;padding:4px 5px;border-radius:6px;color:inherit}
table.dagdata td.n{min-width:58px}
table.dagdata select.cell{text-align:left}
table.dagdata input.cell.g{color:var(--muted)}   /* Garmin-waarde: lichter, geen losse letter */
table.dagdata input.cell:hover,table.dagdata select.cell:hover{border-color:var(--line2)}
table.dagdata input.cell:focus,table.dagdata select.cell:focus{border-color:var(--green);background:var(--card);color:var(--ink);outline:none}
table.dagdata input.cell::placeholder{color:var(--muted);opacity:.75}
table.dagdata .src{font-size:10px;color:var(--muted);margin-left:2px}
table.dagdata .miss{color:var(--muted)}
.dd-flabel{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px;min-width:62px}
.delta-pos{color:var(--pos);font-weight:700}
.delta-neg{color:var(--neg);font-weight:700}

.klist{display:flex;flex-direction:column;gap:8px}
.krow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.krow b{color:var(--ink)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:12px;height:12px;border-radius:4px;display:inline-block}

.exercise-card h4{margin:0 0 2px;color:var(--ink);font-size:15px}
.exercise-card .dose{display:inline-block;background:var(--mint2);color:var(--green);border-radius:999px;padding:3px 10px;font-weight:750;font-size:11.5px;margin:7px 0}
.exercise-card p{margin:6px 0;font-size:13px}
.needs-review{display:inline-block;background:#f0e3cd;color:#7a5a1c;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}

.chart-wrap{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px}
.chart-wrap h4{margin:0 0 8px;font-size:13.5px}
svg .axis{stroke:#cdd8d2;stroke-width:1}
svg .grid{stroke:#eef2f0;stroke-width:1}
svg text{fill:#6b7872;font-size:10px}
svg .pt{cursor:crosshair}
svg .pt.on circle:last-child,svg .pt:hover circle:last-child{r:4.5}
#chartTip{position:fixed;z-index:9999;pointer-events:none;background:#1b2e28;color:#fff;
  font-size:12px;line-height:1.3;padding:5px 9px;border-radius:7px;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;transition:opacity .08s;transform:translateY(-2px)}
#chartTip.show{opacity:1}

.range-toggle{display:flex;gap:6px;flex-wrap:wrap}
.range-toggle .btn.active{background:var(--green);border-color:var(--green);color:#fff}

.hidden{display:none!important}
details.acc{border:1px solid var(--line);border-radius:11px;margin:10px 0;background:var(--card)}
details.acc>summary{cursor:pointer;font-weight:700;padding:12px 14px;background:var(--mint);border-radius:11px;font-size:13.5px;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"▸ ";color:var(--green2)}
details.acc[open]>summary::before{content:"▾ "}
details.acc[open]>summary{border-radius:11px 11px 0 0}
details.acc .acc-body{padding:14px}
pre.sketch{overflow:auto;background:#eef2ef;padding:12px;border-radius:10px;font-size:11px;line-height:1.55}

@media print{
  .sidebar,.topbar,.no-print,.mobile-tabs{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .view{display:none!important}#print-sheet{display:block!important}
  .card{box-shadow:none;border:1px solid #aaa}
}
#print-sheet{display:none}
.print-page{page-break-after:always;padding:6mm}
.print-page:last-child{page-break-after:auto}

/* ---- tablet ---- */
@media(max-width:1000px){
  .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ---- mobile: bottom tab bar ---- */
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:50;left:-280px;width:264px;transition:left .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{left:0}
  .mobile-menu{display:inline-flex}
  .topbar{padding:12px 14px}
  .content{padding:16px 13px 96px}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
  .form-grid,.form-grid.cols-2,.form-grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .weekbar{grid-template-columns:1fr;gap:8px}
  .recovery-strip{grid-template-columns:repeat(3,1fr)}
  .pagehead h2{font-size:21px}
  .top-actions{display:none}
  .mobile-tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .mobile-tabs button{border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:650;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;border-radius:9px}
  .mobile-tabs button .ti{font-size:18px;line-height:1}
  .mobile-tabs button.active{color:var(--green);background:var(--mint)}
}
@media(max-width:560px){
  .form-grid,.form-grid.cols-2,.form-grid.cols-4{grid-template-columns:1fr}
  .recovery-strip{grid-template-columns:repeat(3,1fr)}
  .metric .value{font-size:26px}
}
@media(max-width:380px){
  .content{padding:14px 10px 96px}
  .card{padding:16px}
}
</style>
</head>

ling / hike","purpose":"Aerobe basis en actief herstel.","duration":"20–45 min op werkdagen; een normale hike mag 60–180 min zijn en vervangt die dag andere cardio.","intensity":"RPE 2–4; volledige zinnen blijven gemakkelijk.","steps":["Start Garmin ‘Wandelen’ en wacht op GPS.","Loop natuurlijk op praattempo; geen doeltempo najagen.","Na afloop opslaan en RPE/energie noteren."],"register":"Duur, afstand, gemiddeld tempo, gem./max. HR, RPE, energie vóór/na en bijzonderheden."},"C1":{"title":"Cardio nulmeting 30 min","purpose":"Conditie meten bij dezelfde submaximale belasting.","duration":"5 min warming-up + exact 30 min test + 2 min herstelmeting.","intensity":"RPE 4: stevig maar gecontroleerd; volledige zinnen blijven mogelijk.","steps":["Gebruik dezelfde vlakke bekende route, activiteit, schoenen en bij voorkeur hetzelfde dagdeel.","Wandel 5 min zeer rustig; dit hoort niet bij de test.","Start een nieuwe Garmin-activiteit en beweeg exact 30:00 min constant op RPE 4.","Stop exact op 30:00 en noteer afstand, tempo, gem./max. HR en RPE.","Wandel zeer rustig en noteer HR na precies 1 en 2 min."],"register":"Afstand, tempo, gem./max. HR, RPE, HR herstel 1 en 2 min. Geen sprint of heuvelroute."},"M1":{"title":"Mobiliteitsroutine 8–10 min","purpose":"Soepelheid onderhouden zonder maximale rekprikkel.","duration":"8–10 min.","intensity":"RPE 1–2.","steps":["Cat-camel — 6 langzame herhalingen: op handen/knieën; rug rustig bol en licht hol.","Open book — 6 per zijde: zijlig; knieën bij elkaar en borstkas rustig opendraaien.","Knee-to-wall rocks — 8 per zijde: voet plat en hiel blijft op de grond.","Heupbuiger — 30 sec per zijde: halve knielstand; bekken licht achterover.","Diepe squat met steun — 2 x 20-30 sec: voeten plat en comfortabel zakken.","Wall slides — 8 rustige herhalingen: rug tegen muur en schouders laag."],"register":"Alleen duur en eventuele beperking/pijn."},"M0":{"title":"Mobiliteitsnulmeting","purpose":"Reproduceerbare uitgangswaarden voor enkel, squat, ach /* ===========================================================================

const SCHEMA_VERSION = 5;
const APP_VERSION = "block2-1.8.7";
const APP_BUILD = "2026-09-07";   // zichtbaar bovenaan onder de paginatitel — zo zie je meteen of de nieuwste versie geladen is
const STORAGE_KEY = "trainingsplan-rens-blok2";
/* Overgangsweek (vaste historische periode): het programma en de registratiemethode waren nog
   niet definitief. Geen officiële trainingsweek, geen adherence, geen achteraf-reconstructie. */
const TRANSITION_START = '2026-08-31';
const TRANSITION_END = '2026-09-06';
const TRANSITION_END_PLUS1 = '2026-09-07';   // formele start van het 12-weeks programma
function isTransitionDate(d){ return d>=TRANSITION_START && d<=TRANSITION_END; }
/* echte recursieve read-only bescherming voor historicalData (elk genest object/array) */
function deepFreeze(obj){
  if(!obj || typeof obj !== 'object' || Object.isFrozen(obj)) return obj;
  Object.freeze(obj);
  Object.getOwnPropertyNames(obj).forEach(key => deepFreeze(obj[key]));
  return obj;
}
const HISTORICAL = deepFreeze((()=>{
  const h = JSON.parse(document.getElementById('historical-data').textContent);
  // gepubliceerde (openbare) versie bevat geen persoonlijke historie; die komt uit de cloud en wordt lokaal gecachet
  if(!h.logs || !Object.keys(h.logs).length){
    try{ const priv = JSON.parse(localStorage.getItem('trainingsplan-rens-hist')||'null'); if(priv) Object.assign(h, priv); }catch(e){}
  }
  return h;
})());

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
/* zet view-HTML neer maar behoud open/dicht-status van <details class="acc">-uitklappers
   (anders klapt elke re-render — bv. na het invullen van een veld — ze weer dicht). */
function setViewHTML(sel, html){
  const el = $(sel); if(!el) return;
  const prevOpen = [...el.querySelectorAll('details.acc')].map(d=>d.open);
  // focus + caret behouden over de herrender heen (voorkomt "cursor schiet uit het veld"
  // bij het van veld naar veld klikken/tabben terwijl een re-render loopt)
  const ae = document.activeElement;
  let refocus = null;
  if(ae && el.contains(ae) && ae.dataset && ae.dataset.bind){
    refocus = { bind: ae.dataset.bind };
    try { refocus.start = ae.selectionStart; refocus.end = ae.selectionEnd; } catch(e){}
  }
  // scrollposities (pagina + scrollende kaders zoals de Dagdata-tabel) behouden over de herrender
  const pageY = window.scrollY;
  const boxes = [...el.querySelectorAll('.dd-wrap')].map(b=>[b.scrollLeft,b.scrollTop]);
  el.innerHTML = html;
  el.querySelectorAll('.dd-wrap').forEach((b,i)=>{ if(boxes[i]){ b.scrollLeft=boxes[i][0]; b.scrollTop=boxes[i][1]; } });
  if(Math.abs(window.scrollY-pageY)>2) window.scrollTo(0,pageY);
  el.querySelectorAll('details.acc').forEach((d,i)=>{ if(prevOpen[i]) d.open = true; });
  if(refocus){
    const next = el.querySelector('[data-bind="' + refocus.bind.replace(/["\\]/g,'\\$&') + '"]');
    if(next){
      next.focus();
      try { if(refocus.start!=null && next.setSelectionRange) next.setSelectionRange(refocus.start, refocus.end); } catch(e){}
    }
  }
}
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDate = s => new Date(s+'T12:00:00');
const todayISO = () => iso(new Date());
const addDays = (s,n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return iso(d); };
const num = v => { if(v===''||v==null) return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
const esc = v => String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt = (s,o={weekday:'long',day:'numeric',month:'long'}) => parseDate(s).toLocaleDateString('nl-NL',o);
const nl = n => (n==null?'—':String(n).replace('.',','));
const round = (n,d=1) => n==null?null:Math.round(n*10**d)/10**d;
const avg = a => { const v = a.map(num).filter(x=>x!=null); return v.length ? v.reduce((x,y)=>x+y,0)/v.length : null; };
const paceToSec = p => (!p||!/^\d{1,2}:\d{2}$/.test(p)) ? null : (p.split(':').reduce((m,s,i)=> i===0?+s*60:m+ +s,0));
const secToPace = s => s==null?'':Math.floor(s/60)+':'+pad(Math.round(s%60));
const timeToMin = v => { if(v==null||v==='') return null; if(typeof v==='number') return v;
  if(/^\d{1,2}:\d{2}$/.test(v)){ const [h,m]=v.split(':').map(Number); return h*60+m; } return num(v); };

const DOW = ['mon','tue','wed','thu','fri','sat','sun'];

function weekConfig(wi){
  const c = blockCurriculum();
  if(wi>=0 && wi<c.length) return c[wi];
  return { week:wi+1, phase:'integreren', focusExercise:null, learningTarget:0, strengthA:true, strengthB:true,
           learningGoal:'Vervolg na week 12: structureel trainen op basis van wat aantoonbaar goed werkt.' };
}
function exName(exId){ const e = (state.exercises||[]).find(x=>x.id===exId); return e ? e.name : exId; }

function exStage(exId){ return CB.exerciseStage?.[exId] || 'leren'; }

function migrate(saved){
  // --- pre-v3: onbekende oudere vorm -> herkenbare velden onder currentBlock ---
  if(!saved.schemaVersion || saved.schemaVersion < 3){
    const legacyBlock = saved.currentBlock || saved.block || {};
    saved = { schemaVersion:3, meta:saved.meta||{}, currentBlock:{
      ...legacyBlock,
      dailyLogs: saved.dailyLogs || legacyBlock.dailyLogs || {},
      coachRuns: saved.coachRuns || legacyBlock.coachRuns || [],
      strengthSessions: saved.strengthSessions || legacyBlock.strengthSessions || [],
      walks: saved.walks || saved.longWalks || legacyBlock.walks || [],
      measurements: saved.measurements || legacyBlock.measurements || {baseline:{},week6:{}},
    }, exercises:saved.exercises, sources:saved.sources, rationale:saved.rationale, garmin:saved.garmin };
  }
  // --- v3 -> v4: 6-weeks krachtblok wordt 12-weeks opbouw-/integratieblok ---
  if(saved.schemaVersion < 4){
    const cb = saved.currentBlock = saved.currentBlock || {};
    if(!cb.durationWeeks || cb.durationWeeks <= 6) cb.durationWeeks = 12;   // 6 -> 12
    if(!Array.isArray(cb.learningSessions)) cb.learningSessions = [];
    if(!cb.exerciseStage || typeof cb.exerciseStage !== 'object') cb.exerciseStage = {};
    cb.measurements = cb.measurements || {};
    if(!cb.measurements.week12) cb.measurements.week12 = {};     // Week 6-data blijft ongewijzigd
    if(!cb.measurements.week12eval) cb.measurements.week12eval = {};
    saved.schemaVersion = 4;
  }
  // --- v4 -> v5: formele programmastart 31-08 -> 07-09; 31-08 t/m 06-09 wordt overgangsweek ---
  if(saved.schemaVersion < 5){
    const cb = saved.currentBlock = saved.currentBlock || {};
    if(cb.startDate === '2026-08-31') cb.startDate = TRANSITION_END_PLUS1;   // alleen de auto-gegenereerde default corrigeren, geen handmatige keuze overschrijven
    saved.schemaVersion = 5;
  }
  return saved;
}
function mergeState(base, savedRaw){
  const saved = migrate(structuredClone(savedRaw));
  const m = structuredClone(base);
  m.meta = { ...base.meta, ...(saved.meta||{}) };
  m.meta.appVersion = APP_VERSION;
  m.schemaVersion = SCHEMA_VERSION;
  const sb = saved.currentBlock || {};
  m.currentBlock = { ...base.currentBlock, ...sb };
  m.currentBlock.goals = base.currentBlock.goals;
  m.currentBlock.secondary = base.currentBlock.secondary;
  m.currentBlock.hoofddoel = base.currentBlock.hoofddoel;
  m.currentBlock.tagline = base.currentBlock.tagline;
  m.currentBlock.weekGoals = { ...base.currentBlock.weekGoals, ...(sb.weekGoals||{}) };
  m.currentBlock.weekPlans = { ...(sb.weekPlans||{}) };
  m.currentBlock.dailyLogs = { ...(sb.dailyLogs||{}) };
  m.currentBlock.coachRuns = Array.isArray(sb.coachRuns)?sb.coachRuns:[];
  m.currentBlock.strengthSessions = Array.isArray(sb.strengthSessions)?sb.strengthSessions:[];
  m.currentBlock.learningSessions = Array.isArray(sb.learningSessions)?sb.learningSessions:[];
  m.currentBlock.exerciseStage = (sb.exerciseStage && typeof sb.exerciseStage==='object') ? { ...sb.exerciseStage } : {};
  m.currentBlock.walks = Array.isArray(sb.walks)?sb.walks:[];
  m.currentBlock.measurements = { ...base.currentBlock.measurements, ...(sb.measurements||{}) };
  m.currentBlock.measurements.baseline = { ...(sb.measurements?.baseline||{}) };
  m.currentBlock.measurements.week6 = { ...(sb.measurements?.week6||{}) };
  m.currentBlock.measurements.week12 = { ...(sb.measurements?.week12||{}) };
  m.currentBlock.measurements.week12eval = { ...(sb.measurements?.week12eval||{}) };
  m.currentBlock.measurements.baselineRecovery = { ...(sb.measurements?.baselineRecovery||{}) };
  if(Array.isArray(saved.exercises)){
    m.exercises = base.exercises.map(ex=>{ const s = saved.exercises.find(x=>x.id===ex.id);
      return s ? { ...ex, load:s.load??ex.load, videoUrl:s.videoUrl??ex.videoUrl } : ex; });
  }
  if(Array.isArray(saved.sources)) m.sources = saved.sources;
  if(Array.isArray(saved.rationale)) m.rationale = saved.rationale;
  if(saved.garmin && typeof saved.garmin==='object'){
    m.garmin = {
      daily: { ...(saved.garmin.daily||{}) },
      activities: Array.isArray(saved.garmin.activities) ? saved.garmin.activities : [],
      meta: { ...(saved.garmin.meta||{}) },
    };
  }
  return m;
}
function loadState(){
  let saved = null;
  try { const raw = localStorage.getItem(STORAGE_KEY); if(raw) saved = JSON.parse(raw); } catch(e){ console.warn(e); }
  if(!saved){
    const emb = document.getElementById('app-state')?.textContent?.trim();
    if(emb){ try { saved = JSON.parse(emb); } catch(e){ console.warn(e); } }
  }
  return saved ? mergeState(defaultState(), saved) : defaultState();
}
function saveState(){
  state.meta.updatedAt = new Date().toISOString();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){ console.warn('Opslaan mislukt', e); }
  if(typeof syncSoon==='function') syncSoon();
  const el = $('#saveState');
  if(el){ el.textContent = 'Opgeslagen ' + new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    clearTimeout(window._st); window._st = setTimeout(()=> el.textContent='Lokaal opgeslagen', 1600); }
}

/* ===========================================================================
   BLOK-/WEEKBEREKENING
   =========================================================================== */
function blockStart(){ return CB.startDate; }
function blockWeeks(){ return num(CB.durationWeeks) || 12; }
function blockEnd(){ return addDays(blockStart(), blockWeeks()*7 - 1); }
function clampToBlock(d){ const e=blockEnd(); return d>e ? e : d; }   // geen ondergrens: vrij terugbladeren naar oudere dagen blijft mogelijk
function weekIndexFor(d){
  const diff = Math.floor((parseDate(d) - parseDate(blockStart()))/86400000);
  if(diff < 0) return -1;
  return Math.min(blockWeeks()-1, Math.floor(diff/7));
}
function weekStartISO(wi){ return addDays(blockStart(), wi*7); }
function weekDates(wi){ const s = weekStartISO(wi); return Array.from({length:7}, (_,i)=> addDays(s,i)); }
function inWeek(dateStr, wi){ const ds = weekDates(wi); return dateStr>=ds[0] && dateStr<=ds[6]; }
function isLongWalkWeek(wi){ return !CB.weekGoals.longWalkEveryOtherWeek || wi%2===1; } // om de week: week 2,4,6 -> wi 1,3,5
function weekPlan(wi){
  return CB.weekPlans[wi] || { coachTarget:null, coachDays:[], strengthADay:'', strengthBDay:'', longWalkDay:'sun', note:'' };
}
/* Coach-loopdagen per week: jouw eigen planning (meestal op zondag gemaakt, tussendoor
   aanpasbaar). Alleen wélke weekdagen — geen afstand/tijd vooraf, geen bindend schema. */
function coachPlanDays(wi){ const c = weekPlan(wi).coachDays; return Array.isArray(c) ? c : []; }
function isPlannedCoachDay(dateStr){ const wi = weekIndexFor(dateStr); return wi>=0 && coachPlanDays(wi).includes(dowKey(dateStr)); }
function toggleCoachDay(wi, dk){
  if(wi<0 || !DOW.includes(dk)) return;
  const wp = CB.weekPlans[wi] = CB.weekPlans[wi] || {};
  const cur = Array.isArray(wp.coachDays) ? wp.coachDays.slice() : [];
  const i = cur.indexOf(dk);
  if(i>=0) cur.splice(i,1); else cur.push(dk);
  cur.sort((a,b)=> DOW.indexOf(a)-DOW.indexOf(b));
  wp.coachDays = cur;
  saveState(); renderCurrent();
}
function coachDayChips(wi){
  const days = coachPlanDays(wi);
  return `<div class="chips" style="margin-top:6px;flex-wrap:wrap">${DOW.map(k=>
    `<button class="btn sm ${days.includes(k)?'active':''}" data-coach-day="${wi}|${k}">${DOW_NL[k]}</button>`
  ).join('')}</div>`;
}

/* herstel-tijdlijn: historische logs + nieuwe dailyLogs + garmin-samenvatting  */
function recoveryTimeline(){
  const map = {};
  const put = (d,k,v)=>{ if(v==null||v==='') return; (map[d] = map[d]||{date:d}); if(map[d][k]==null) map[d][k]=v; };
  for(const [d,l] of Object.entries(HISTORICAL.logs||{})){
    put(d,'energy', num(l.morningEnergy)); put(d,'stiffness', num(l.morningStiffness)); put(d,'pain', num(l.morningPain));
    put(d,'restingHr', num(l.rhr)); put(d,'hrv', num(l.hrv));
    put(d,'sleepHours', l.sleepTime ? round(timeToMin(l.sleepTime)/60,2) : num(l.sleepHours));
    put(d,'pushups', num(l.pushups)); put(d,'weight', num(l.weightKg)); put(d,'era','historisch');
  }
  for(const [d,l] of Object.entries(CB.dailyLogs)){
    const g = state.garmin.daily[d] || {};
    put(d,'energy', num(l.energy)); put(d,'stiffness', num(l.stiffness)); put(d,'pain', num(l.pain));
    put(d,'restingHr', num(l.restingHr) ?? num(g.restingHr));
    put(d,'hrv', num(l.hrv) ?? num(g.nightHrv));
    put(d,'sleepHours', num(l.sleepHours) ?? num(g.sleepDuration));
    put(d,'weight', num(l.weightKg));
    put(d,'pushups', num(l.routineDetail?.pushupReps));
    for(const f of ['forwardBendReps','legRaiseReps','toeTouchReps','ohpL','ohpR','balanceReachL','balanceReachR']) put(d, f, num(l.routineDetail?.[f]));
    put(d,'era','blok2');
  }
  for(const [d,g] of Object.entries(state.garmin.daily)){
    // 'put' is first-wins: handmatige dailyLogs-waarden (hierboven) blijven voorrang houden
    put(d,'hrv', num(g.nightHrv)); put(d,'restingHr', num(g.restingHr)); put(d,'sleepHours', num(g.sleepDuration));
    put(d,'weight', num(g.weightKg));
  }
  return Object.values(map).sort((a,b)=> a.date.localeCompare(b.date));
}
/* 7-daagse hersteltrend = KALENDERVENSTER: vandaag en de 6 voorafgaande dagen.
   Geeft {value, n, of} zodat de UI "3 van 7 dagen" / "onvoldoende data" kan tonen. */
function recent7(key, refDate){
  const end = refDate || todayISO();
  const start = addDays(end, -6);
  const rows = recoveryTimeline().filter(r=> r.date>=start && r.date<=end && r[key]!=null);
  return { value: rows.length ? avg(rows.map(r=>r[key])) : null, n: rows.length, of:7, start, end };
}
function r7(key, refDate){ return recent7(key, refDate).value; }   // korte vorm waar alleen de waarde telt
function recent7Label(key, refDate){
  const r = recent7(key, refDate);
  if(r.n===0) return 'onvoldoende data';
  if(r.n < 4) return `${r.n} van 7 dagen`;
  return `${r.n}/7 dagen`;
}
function histAvg(key){
  const b = HISTORICAL.baselineSummary || {};
  return ({hrv:b.hrvAvg, restingHr:b.rhrAvg, sleepHours:b.sleepHoursAvg, energy:b.morningEnergyAvg,
    stiffness:b.morningStiffnessAvg, pain:b.morningPainAvg, pushups:b.pushupsLast})[key] ?? null;
}
/* Week 0-herstelwaarde: bevroren snapshot als vastgelegd, anders de live 7-daagse trend */
function w0Recovery(key){
  const M = CB.measurements;
  if(M.baselineFrozen && M.baselineRecovery && M.baselineRecovery[key]!=null)
    return { v:M.baselineRecovery[key], frozen:true };
  const r = recent7(key);
  return { v:r.value, frozen:false, n:r.n };
}
function freezeBaseline(){
  const M = CB.measurements;
  M.baselineRecovery = {};
  // Week 0 hoort bij de overgangsweek: vast venster 31 aug - 6 sep, niet "vandaag"
  const refDate = TRANSITION_END;
  for(const k of ['hrv','restingHr','sleepHours','energy','stiffness','pain']){
    const r = recent7(k, refDate); if(r.value!=null) M.baselineRecovery[k] = round(r.value, k==='sleepHours'?2:1);
  }
  M.baselineFrozen = true;
  M.baselineFrozenAt = todayISO();
  if(!M.baseline.date) M.baseline.date = refDate;
  saveState(); renderMeasure();
}
function unfreezeBaseline(){
  const M = CB.measurements;
  M.baselineFrozen = false; M.baselineFrozenAt = null;
  saveState(); renderMeasure();
}
function latestVo2(){
  const a = state.currentBlock.coachRuns.filter(r=>r.done===true).map(r=>num(r.vo2max)).filter(x=>x!=null);
  const g = Object.keys(state.garmin.daily).sort().map(k=>num(state.garmin.daily[k].vo2max)).filter(x=>x!=null);
  return a[a.length-1] ?? g[g.length-1] ?? null;
}

  return h.length ? h[h.length-1].techniqueStatus : null;
}
function parseSetReps(v){ if(v==null) return []; return String(v).split(/[,\s/xX]+/).map(x=>num(x)).filter(x=>x!=null); }
function loadKey(e, side){
  const w = side==='L'?e.weightL : side==='R'?e.weightR : e.weight;
  const reps = parseSetReps(side==='L'?e.setRepsL : side==='R'?e.setRepsR : e.setReps);
  const top = reps.length?Math.min(...reps):null; // laagste set = zwakste; progressie vraagt álle sets aan bovengrens
  return { w:num(w), reps, minReps:top };
}
/* double-progression advies (adviseert, verplicht niets).
   Criterium: 2 vergelijkbare sessies · zelfde gewicht · alle sets aan de bovengrens ·
   techniek goed · reserve over (RIR ≥ 2, of bij ontbreken RPE ≤ 8). */
function progressionAdvice(ex){
  if(ex.kind!=='strength' || !ex.range) return [];
  if(exStage(ex.id) !== 'trainen') return [];   // geen gewichtsprogressie-advies in LEREN of VERTROUWD
  const [lo,hi] = ex.range;
  // overgangsweek-sessies tellen niet mee voor double progression (nog geen officieel programma)
  const hist = strengthHistory(ex.id).filter(h=> !isTransitionDate(h.date));
  const sides = ex.lr ? ['L','R'] : [null];
  const out = [];
  for(const side of sides){
    const rows = hist.map(h=>({ date:h.date, ...loadKey(h.e, side), rir:num(h.e.rir), rpe:num(h.e.rpeLast), tech:h.e.tech }))
                     .filter(r=> r.w!=null && r.reps.length);
    if(rows.length < 2) continue;
    const last2 = rows.slice(-2);
    const sameW  = last2[0].w === last2[1].w;
    const atTop  = last2.every(r=> r.minReps!=null && r.minReps >= hi);
    const techOk = last2.every(r=> r.tech!=='minder');
    const reserveOk = last2.every(r=>{
      if(r.rir!=null) return r.rir >= 2;
      if(r.rpe!=null) return r.rpe <= 8;
      return false;   // geen reserve-informatie → geen advies
    });
    if(sameW && atTop && techOk && reserveOk){
      out.push({ side, msg:`${side?('Zijde '+side+' — '):''}progressiecriterium bereikt: 2 sessies alle sets ${hi}, techniek goed, ~2+ herhalingen in reserve. Hogere weerstand overwegen; daarna terug naar ${lo}–${lo+2}. Jij beslist.` });
    }
  }
  if(ex.lr && out.length===1) out.push({ note:'De zwakkere zijde bepaalt wanneer je het gewicht verhoogt.' });
  return out;
}

/* ===========================================================================
   DEZE-WEEK TRACKER  (fasebewust — leermoment ≠ gemiste krachttraining)
   =========================================================================== */
function weekStatus(wi){
  const ds = weekDates(wi);
  const cfg = weekConfig(wi);
  // alleen expliciet uitgevoerd (done===true) telt; null (onbekend) en false tellen niet mee
  const runsDone = CB.coachRuns.filter(r=> r.done===true && inWeek(r.date,wi));
  const runsLogged = CB.coachRuns.filter(r=> inWeek(r.date,wi));
  const wp = weekPlan(wi);
  const coachDays = Array.isArray(wp.coachDays) ? wp.coachDays : [];
  const coachTarget = num(wp.coachTarget) ?? (coachDays.length || null);
  const aDone = CB.strengthSessions.some(s=> s.session==='A' && inWeek(s.date,wi));
  const bDone = CB.strengthSessions.some(s=> s.session==='B' && inWeek(s.date,wi));
  const walkWeek = isLongWalkWeek(wi);
  const walkDone = CB.walks.some(w=> inWeek(w.date,wi));
  let routineDays = 0;
  for(const d of ds){ if(routineDoneish(CB.dailyLogs[d])) routineDays++; }
  // leermomenten deze week (voor de focus-oefening + eventuele herhaling van eerder geleerde)
  const learnWeek = (CB.learningSessions||[]).filter(x=> inWeek(x.date,wi));
  const focusLearn = cfg.focusExercise ? learnWeek.filter(x=> x.exerciseId===cfg.focusExercise) : [];
  return {
    wi, dates:ds, walkWeek, cfg,
    coach:{ done:runsDone.length, logged:runsLogged.length, unknown:runsLogged.filter(r=>r.done==null).length, target:coachTarget, days:coachDays, label: coachTarget!=null ? `${runsDone.length} / ${coachTarget}` : `${runsDone.length} uitgevoerd${runsLogged.length>runsDone.length?` · ${runsLogged.length-runsDone.length} onbekend/niet`:''}` },
    strengthA:{ applicable:cfg.strengthA, done:aDone },
    strengthB:{ applicable:cfg.strengthB, done:bDone },
    longWalk:{ done:walkDone, applicable:walkWeek },
    routine:{ done:routineDays, of:7 },
    learning:{
      target: cfg.learningTarget, done: focusLearn.length, total: learnWeek.length,
      focusExercise: cfg.focusExercise,
      focusTech: focusLearn.length ? focusLearn[focusLearn.length-1].techniqueStatus : (cfg.focusExercise ? latestTechniqueStatus(cfg.focusExercise) : null),
      met: !cfg.focusExercise || cfg.learningTarget===0 || focusLearn.length >= cfg.learningTarget,
    },
    openItems: [
      cfg.learningTarget>0 && cfg.focusExercise && focusLearn.length < cfg.learningTarget && `Leermoment ${exName(cfg.focusExercise)}`,
      cfg.strengthA && !aDone && 'Kracht A',
      cfg.strengthB && !bDone && 'Kracht B',
      walkWeek && !walkDone && 'Lange wandeling',
    ].filter(Boolean),
  };
}

/* uitvoering blok (%) — fasebewust: alleen wat het curriculum die week vraagt.
   Leermomenten: soft geteld, geen "achterstand". */
function blockAdherence(){
  let planned=0, done=0, learnPlanned=0, learnDone=0;
  const today = todayISO();
  for(let wi=0; wi<=Math.max(0,weekIndexFor(today)); wi++){
    if(weekDates(wi)[0] > today) break;
    const ws = weekStatus(wi);
    if(ws.strengthA.applicable){ planned++; if(ws.strengthA.done) done++; }
    if(ws.strengthB.applicable){ planned++; if(ws.strengthB.done) done++; }
    if(ws.walkWeek){ planned++; if(ws.longWalk.done) done++; }
    if(ws.coach.target!=null){ planned += ws.coach.target; done += Math.min(ws.coach.done, ws.coach.target); }
    if(ws.learning.target>0){ learnPlanned += ws.learning.target; learnDone += Math.min(ws.learning.done, ws.learning.target); }
  }
  return { planned, done, pct: planned ? Math.round(done/planned*100) : 0, learnPlanned, learnDone };
}

/* uitgevoerde trainingsminuten per week uit ECHT geregistreerde duur; geen verzonnen planning.
   'plan' bevat alleen wat we werkelijk weten (ochtendroutine-richttijd); rest = null → UI toont "—". */
function weekMinutes(wi){
  const ds = weekDates(wi);
  const target = num(CB.routineMinutesTarget) || 45;
  const done = { hardlopen:0, leermomenten:0, kracht:0, ochtendroutine:0, 'lange wandeling':0, avondwandeling:0 };
  let routineDays = 0;
  for(const d of ds){
    const l = CB.dailyLogs[d] || {};
    const rMin = num(l.routineMin);
    // routine 'gedaan' telt als 1 routinedag voor adherence, maar NIET automatisch als
    // exacte trainingsminuten — alleen een echt ingevulde routineMin telt in de minuten.
    if(rMin!=null) done.ochtendroutine += rMin;
    if(rMin!=null || routineDoneish(l)) routineDays++;
    done.avondwandeling += num(l.eveningWalkMin) || 0;
    CB.coachRuns.filter(r=>r.date===d).forEach(r=> done.hardlopen += num(r.totalMin)||0);
    CB.strengthSessions.filter(s=>s.date===d).forEach(s=> done.kracht += num(s.durationMin)||0);
    (CB.learningSessions||[]).filter(x=>x.date===d).forEach(x=> done.leermomenten += num(x.durationMin)||0);
    CB.walks.filter(w=>w.date===d).forEach(w=> done['lange wandeling'] += num(w.totalMin)||0);
  }
  Object.keys(done).forEach(k=> done[k]=Math.round(done[k]));
  // ochtendroutine-richttijd is een schatting, geen meting → geen 'gepland'-minuten opdringen
  const plan = { hardlopen:null, leermomenten:null, kracht:null, ochtendroutine: null, 'lange wandeling':null, avondwandeling:null };
  const doneTotal = Object.values(done).reduce((a,b)=>a+b,0);
  return { plan, done, routineDays, routineTarget:target, doneTotal };
}

/* Garmin-minuten per week (uit state.garmin.activities), gesplitst in hardlopen / wandelen / overig */
function garminWeekMinutes(wi){
  const ds = new Set(weekDates(wi));
  const out = { run:0, walk:0, other:0 };
  for(const a of (state.garmin.activities||[])){
    if(!ds.has(a.date)) continue;
    const m = num(a.durationMin) || 0;
    if(GARMIN_RUN_TYPES.includes(a.type)) out.run += m; else if(GARMIN_WALK_TYPES.includes(a.type)) out.walk += m; else out.other += m;
  }
  Object.keys(out).forEach(k=> out[k]=Math.round(out[k]));
  return out;
}
/* belastingsconflicten — signaleren, niet blokkeren */
function weekConflicts(wi){
  const ds = weekDates(wi);
  const legDays = new Set();  // datums met (voorgenomen of uitgevoerde) zware beenprikkel
  const learnLegDays = new Set(); // technische leermomenten voor benen (lichte prikkel)
  const wp = weekPlan(wi);
  const LEG_EX = new Set(['goblet-squat','rdl','split-squat','calf-a','calf-b']);
  CB.strengthSessions.filter(s=> inWeek(s.date,wi) && (s.session==='A'||s.session==='B')).forEach(s=> legDays.add(s.date));
  if(wp.strengthADay && !CB.strengthSessions.some(s=>s.session==='A'&&inWeek(s.date,wi))){ const d = ds[DOW.indexOf(wp.strengthADay)]; if(d) legDays.add(d); }
  if(wp.strengthBDay && !CB.strengthSessions.some(s=>s.session==='B'&&inWeek(s.date,wi))){ const d = ds[DOW.indexOf(wp.strengthBDay)]; if(d) legDays.add(d); }
  (CB.learningSessions||[]).filter(x=> inWeek(x.date,wi) && LEG_EX.has(x.exerciseId)).forEach(x=> learnLegDays.add(x.date));
  const runDays = new Set(CB.coachRuns.filter(r=> inWeek(r.date,wi)).map(r=>r.date));
  const walkDay = (isLongWalkWeek(wi) && wp.longWalkDay) ? ds[DOW.indexOf(wp.longWalkDay)] : null;
  const walkLogged = CB.walks.filter(w=> inWeek(w.date,wi)).map(w=>w.date);
  const walkDays = new Set([...(walkDay?[walkDay]:[]), ...walkLogged]);

  const out = [];
  const near = (a,b)=> Math.abs((parseDate(a)-parseDate(b))/86400000) <= 1;
  const leg = [...legDays].sort();
  for(const d of leg){
    for(const r of runDays){ if(near(d,r) && d!==r) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: zware beenprikkel ligt vlak bij een Garmin Coach-run (${fmt(r,{weekday:'short'})}).`); }
    for(const w of walkDays){ if(near(d,w) && d!==w) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: zware beenprikkel ligt vlak bij de lange wandeling (${fmt(w,{weekday:'short'})}).`); }
  }
  for(let i=1;i<leg.length;i++){ if(near(leg[i-1],leg[i])) out.push(`${fmt(leg[i-1],{weekday:'short'})}–${fmt(leg[i],{weekday:'short'})}: twee zware beenprikkels liggen dicht bij elkaar — las er een rustige dag tussen.`); }
  for(const d of learnLegDays){
    for(const r of runDays){ if(near(d,r) && d!==r) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: technisch leermoment voor de benen ligt vlak bij een Garmin Coach-run (${fmt(r,{weekday:'short'})}) — hou het leermoment dan echt licht.`); }
  }
  return [...new Set(out)];
}

/* ===========================================================================
   RENDER-BOUWSTENEN
   =========================================================================== */
/* velden die string moeten blijven; al het andere wordt Number zodra het een zuiver getal is */
const TEXT_KEYS = new Set(['type','planned','done','tech','note','notes','avgPace','movingPace','bestPace',
  'plannedContent','doneContent','traffic','routineDone','date','startDate','hoofddoel',
  'forwardBendFloor','pushupTech','balanceRvsL','strengthADay','strengthBDay','longWalkDay',
  'setReps','setRepsL','setRepsR',
  'exerciseId','techniqueStatus','loadFeeling','reps','tagline']);
function coerce(key, raw){
  if(raw==='' || raw==null) return null;
  if(key==='longWalkEveryOtherWeek') return raw===true || raw==='ja' || raw==='true';
  // Coach-run 'Uitgevoerd': 3 echte toestanden — true / false / null (leeg = null via bovenstaande)
  if(key==='done') return raw===true||raw==='ja' ? true : raw===false||raw==='nee' ? false : null;
  // Slaapduur: accepteer u:mm (uit de Dagdata-tabel) én decimaal; sla altijd decimaal op
  if(key==='sleepHours' && typeof raw==='string' && /^\s*\d{1,2}:\d{1,2}\s*$/.test(raw)){
    const [h,m] = raw.trim().split(':').map(Number); return round(h + m/60, 4);
  }
  if(TEXT_KEYS.has(key)) return raw;
  if(typeof raw==='number') return raw;
  if(typeof raw==='string' && /^-?\d+(?:[.,]\d+)?$/.test(raw.trim())) return Number(raw.trim().replace(',','.'));
  return raw;
}
function fInput(label,path,val,type='number',extra=''){ return `<div class="field"><label>${esc(label)}</label><input type="${type}" data-bind="${path}" value="${val==null?'':esc(val)}" ${extra}></div>`; }
function fSelect(label,path,val,opts){ return `<div class="field"><label>${esc(label)}</label><select data-bind="${path}">${opts.map(o=>{ const [v,t]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t||'—')}</option>`; }).join('')}</select></div>`; }
function fText(label,path,val,wide=true){ return `<div class="field ${wide?'wide':''}"><label>${esc(label)}</label><textarea data-bind="${path}">${esc(val||'')}</textarea></div>`; }
function pctChange(base,latest){ if(base==null||latest==null||base===0) return null; return round((latest-base)/Math.abs(base)*100,1); }
function deltaCell(base,latest,dir,showPct){
  if(base==null||latest==null) return '<td class="num muted">—</td>';
  const d = latest-base;
  const good = (dir==='down'||dir==='downPace') ? d<0 : d>0;
  const p = showPct ? pctChange(base,latest) : null;
  return `<td class="num ${d===0?'':good?'delta-pos':'delta-neg'}">${(d>0?'+':'')+round(d,2)}${p!=null?` <span class="small">(${p>0?'+':''}${p}%)</span>`:''}</td>`;
}
function lineChart(rows, opts={}){
  const w=opts.w||520, h=opts.h||150, pl=40, pr=12, pt=12, pb=22;
  rows = (rows||[]).filter(r=>r&&r.y!=null);
  if(rows.length<2) return `<div class="small muted">Nog onvoldoende meetpunten (${rows.length}).</div>`;
  const s2 = (opts.series2||[]).filter(r=>r&&r.y!=null);   // optionele tweede reeks; bestaande calls geven dit niet mee
  const all = rows.concat(s2);
  const xs=all.map(r=>parseDate(r.x).getTime()), ys=all.map(r=>r.y);
  let ymin=Math.min(...ys), ymax=Math.max(...ys); if(ymin===ymax){ymin-=1;ymax+=1;}
  const p=(ymax-ymin)*0.12; ymin-=p; ymax+=p;
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const X=t=>pl+(t-xmin)/((xmax-xmin)||1)*(w-pl-pr);
  const Y=v=>pt+(ymax-v)/((ymax-ymin)||1)*(h-pt-pb);
  const poly=(arr)=>arr.map(r=>`${round(X(parseDate(r.x).getTime()),1)},${round(Y(r.y),1)}`).join(' ');
  const yl=v=>opts.invertLabel?secToPace(v):round(v,(ymax-ymin)<5?1:0);
  const gy=[0,.5,1].map(f=>{const v=ymin+(ymax-ymin)*f,y=Y(v);return `<line class="grid" x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${yl(v)}</text>`;}).join('');
  const line2 = s2.length>=2 ? `<polyline fill="none" stroke="${opts.color2||'#1b3a30'}" stroke-width="2.8" points="${poly(s2)}"/>` : '';
  // per punt: onzichtbare ruime hover-zone + zichtbare stip; data-tip voedt de zwevende tooltip (#chartTip)
  const fv = v => opts.invertLabel ? secToPace(v) : round(v, 2);
  const dots = (arr, col, op, name) => arr.map(r=>{
    const cx = round(X(parseDate(r.x).getTime()),1), cy = round(Y(r.y),1);
    const t = `${fmt(r.x,{weekday:'short',day:'numeric',month:'long'})} — ${fv(r.y)}${opts.unit?' '+opts.unit:''}${name?` · ${name}`:''}`;
    return `<g class="pt" data-tip="${esc(t)}">`
      + `<circle cx="${cx}" cy="${cy}" r="8" fill="transparent" stroke="transparent"/>`
      + `<circle cx="${cx}" cy="${cy}" r="${s2.length?2:2.6}" fill="${col}"${op?` opacity="${op}"`:''}/></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">${gy}
    <line class="axis" x1="${pl}" y1="${pt}" x2="${pl}" y2="${h-pb}"/><line class="axis" x1="${pl}" y1="${h-pb}" x2="${w-pr}" y2="${h-pb}"/>
    <polyline fill="none" stroke="${opts.color||'#245b48'}" stroke-width="${s2.length?1.5:2.5}" ${s2.length?'opacity="0.55"':''} points="${poly(rows)}"/>
    ${line2}
    ${s2.length ? dots(s2, opts.color2||'#1b3a30', 0, opts.name2||'7-daags gemiddelde') : ''}
    ${dots(rows, opts.color||'#245b48', s2.length?0.6:0, s2.length?(opts.name1||'dagwaarde'):null)}
    <text x="${pl}" y="${h-6}">${fmt(rows[0].x,{day:'numeric',month:'short'})}</text>
    <text x="${w-pr}" y="${h-6}" text-anchor="end">${fmt(rows[rows.length-1].x,{day:'numeric',month:'short'})}</text></svg>`;
}

/* ===========================================================================
   VIEW: VANDAAG  — antwoord binnen 5 seconden op: wat vandaag / wat deze week / wat registreren
   =========================================================================== */
/* Eén context per dag: wat is vandaag de relevante volgende actie — "less is more".
   Geen black-box: puur datum + fase + planning + bestaande data → één primaire suggestie. */
function getTodayContext(d){
  const inTransition = isTransitionDate(d);
  const wi = weekIndexFor(d);
  const logged = {
    coach: CB.coachRuns.some(r=>r.date===d),
    learning: (CB.learningSessions||[]).some(x=>x.date===d),
    strengthA: CB.strengthSessions.some(s=>s.date===d && s.session==='A'),
    strengthB: CB.strengthSessions.some(s=>s.date===d && s.session==='B'),
    longwalk: CB.walks.some(w=>w.date===d),
  };
  if(inTransition || wi<0){
    return {
      period: inTransition ? 'transition' : 'before',
      cfg:null, ws:null, focusEx:null,
      title: inTransition ? 'Overgangsweek' : 'Vóór de programmastart',
      subtitle: inTransition ? `programma start ${fmt(blockStart(),{day:'numeric',month:'long'})}` : '',
      primary: null,
      logged, plannedCoach:false,
    };
  }

  const dk = dowKey(d);
  const cfg = weekConfig(wi);
  const ws = weekStatus(wi);
  const wp = weekPlan(wi);
  const focusEx = cfg.focusExercise ? state.exercises.find(x=>x.id===cfg.focusExercise) : null;
  const registeredToday = logged.coach || logged.strengthA || logged.strengthB || logged.longwalk || logged.learning;

  // --- Prioriteit: 1) expliciet op deze dag gepland  2) geregistreerd op deze dag
  //     3) vaste dagspecifieke activiteit (voorstel-dag uit weekplan)  4) openstaand weekdoel = suggestie ---
  const plannedCoach     = coachPlanDays(wi).includes(dk);
  const walkPlannedToday = ws.walkWeek && wp.longWalkDay===dk && !ws.longWalk.done;
  const strengthADayToday = cfg.strengthA && wp.strengthADay===dk && !ws.strengthA.done;
  const strengthBDayToday = cfg.strengthB && wp.strengthBDay===dk && !ws.strengthB.done;

  let primary = null;
  if(registeredToday) primary = null;                    // de kaart(en) tonen het al
  else if(plannedCoach) primary = { type:'coach', minimal:true, label:'Garmin Coach-run — gepland vandaag' };
  else if(walkPlannedToday) primary = { type:'longwalk', label:'Lange wandeling' };
  else if(strengthADayToday) primary = { type:'strengthA', label:'Kracht A' };
  else if(strengthBDayToday) primary = { type:'strengthB', label:'Kracht B' };

  // openstaande weekdoelen — nooit primair, alleen klein/secundair op Vandaag
  const openGoals = [];
  if(focusEx && !ws.learning.met) openGoals.push({ type:'learning', label:`Leermoment ${focusEx.name} leren` });
  if(cfg.strengthA && !ws.strengthA.done && !strengthADayToday) openGoals.push({ type:'strengthA', label:'Kracht A' });
  if(cfg.strengthB && !ws.strengthB.done && !strengthBDayToday) openGoals.push({ type:'strengthB', label:'Kracht B' });
  if(ws.walkWeek && !ws.longWalk.done && !walkPlannedToday) openGoals.push({ type:'longwalk', label:'Lange wandeling' });

  return {
    period:'program', cfg, ws, focusEx, plannedCoach, openGoals,
    learnRelevant: !!(focusEx && !ws.learning.met), walkToday: walkPlannedToday,
    title:`Week ${wi+1} · ${PHASE_LABEL[cfg.phase]||cfg.phase}`,
    primary, logged,
  };
}
/* welke invoerkaarten toont Vandaag: alleen wat al geregistreerd is, of expliciet aangeklikt
   (via de primaire actie of "Iets anders gedaan?") — nooit automatisch een volledig formulier. */
function todayCards(d){
  const set = new Set();
  if(ui.addOn===d && ui.addType) set.add(ui.addType);
  if(CB.coachRuns.some(r=>r.date===d)) set.add('coach');
  CB.strengthSessions.filter(s=>s.date===d).forEach(s=> set.add(s.session==='A'?'strengthA':'strengthB'));
  if(CB.walks.some(w=>w.date===d)) set.add('longwalk');
  if((CB.learningSessions||[]).some(x=>x.date===d)) set.add('learning');
  return [...set];
}

/* "Iets anders gedaan? / training aanpassen" — beheerpaneel voor bestaande records.
   Toont bewust alleen: records op de bekeken dag, plus records die (verkeerd) op een
   datum ná vandaag staan (kan niet kloppen). Geen brede ±week-lijst meer — dat gaf
   ruis met trainingen die gewoon goed staan. Nieuwe activiteit toevoegen kan ook. */
function otherActivitiesPanel(d, opts){
  opts = opts || {};
  const isFuture = !!opts.isFuture;
  const cardsToday = opts.cardsToday || [];
  const primaryType = opts.primaryType || null;
  [['c',CB.coachRuns],['s',CB.strengthSessions],['w',CB.walks],['l',CB.learningSessions]].forEach(([pre,arr])=>{
    (arr||[]).forEach(r=>{ if(!r.id) r.id = pre + Date.now().toString(36) + Math.random().toString(36).slice(2,6); });
  });
  const dashJoin = a => a.filter(Boolean).join(' · ');
  const relevant = dt => dt===d || dt>todayISO();
  const nearby = [];
  CB.coachRuns.forEach(r=>{ if(relevant(r.date)){
    const ga = r.garminExternalId ? (state.garmin.activities||[]).find(a=>a.externalId===r.garminExternalId) : null;
    nearby.push({kind:'coach', id:r.id, date:r.date, label:'Garmin Coach-run', tint:'#bcd6e5',
      detail: dashJoin([r.distanceKm!=null?`${nl(r.distanceKm)} km`:null, r.totalMin!=null?`${nl(r.totalMin)} min`:null, r.avgPace||null, r.avgHr!=null?`HR ${nl(r.avgHr)}`:null, r.maxHr!=null?`max ${nl(r.maxHr)}`:null, r.vo2max!=null?`VO₂ ${nl(r.vo2max)}`:null]),
      srcNote: ga ? `Uit Garmin-import — activiteit van ${fmt(ga.date,{weekday:'short',day:'numeric',month:'long'})}${ga.startTime?', '+ga.startTime.slice(11,16):''}` : (r._source && String(r._source).startsWith('garmin') ? 'Uit Garmin-import' : null),
      garminDate: ga && ga.date!==r.date ? ga.date : null });
  }});
  (CB.learningSessions||[]).forEach(x=>{ if(relevant(x.date)) nearby.push({kind:'learning', id:x.id, date:x.date, label:'Leermoment', tint:'#a9cdbb',
    detail: dashJoin([exName(x.exerciseId), x.durationMin!=null?`${nl(x.durationMin)} min`:null]) }); });
  CB.strengthSessions.forEach(s=>{ if(relevant(s.date)) nearby.push({kind:'strength', id:s.id, date:s.date, label:`Kracht ${s.session}`, tint:'#d5c8e6',
    detail: s.durationMin!=null?`${nl(s.durationMin)} min`:'' }); });
  CB.walks.forEach(w=>{ if(relevant(w.date)) nearby.push({kind:'walk', id:w.id, date:w.date, label:'Lange wandeling', tint:'#e6d9a8',
    detail: dashJoin([w.distanceKm!=null?`${nl(w.distanceKm)} km`:null, w.totalMin!=null?`${nl(w.totalMin)} min`:null]) }); });
  nearby.sort((a,b)=> a.date.localeCompare(b.date) || a.label.localeCompare(b.label));

  const otherTypes = [
    ['learning','+ Leermoment'], ['coach','+ Garmin Coach'], ['longwalk','+ Lange wandeling'],
    ['strengthA','+ Kracht A'], ['strengthB','+ Kracht B'],
  ].filter(([t])=> !cardsToday.includes(t) && t!==primaryType);

  const hasFut = nearby.some(n=>n.date>todayISO());
  if(!nearby.length && !(otherTypes.length && !isFuture)) return '';
  let html = `<details class="acc"${hasFut?' open':''}><summary>Iets anders gedaan? / training aanpassen</summary><div class="acc-body">`;
  if(nearby.length){
    html += `<p class="tny muted" style="margin-top:0">${hasFut
      ? 'Een training kan niet op een datum in de toekomst staan — verzet naar de juiste dag of verwijder:'
      : 'Op deze dag geregistreerd — verzet naar de juiste dag of verwijder:'}</p>`;
    html += nearby.map(n=>{
      const moving = ui.moveOn && ui.moveOn.kind===n.kind && ui.moveOn.id===n.id;
      const fut = n.date>todayISO();
      return `<div style="border:1px solid var(--line2);border-left:3px solid ${n.tint};border-radius:10px;padding:10px 12px;margin:8px 0">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline">
          <b>${esc(n.label)}</b>
          <span class="tny muted">${esc(fmt(n.date,{weekday:'long',day:'numeric',month:'long'}))}${n.date===d?' · deze dag':(fut?' · staat in de toekomst':'')}</span>
        </div>
        ${n.detail?`<div class="small muted" style="margin-top:2px">${esc(n.detail)}</div>`:''}
        ${n.srcNote?`<div class="tny muted" style="margin-top:2px">${esc(n.srcNote)}</div>`:''}
        <div class="chips" style="margin-top:8px">
          ${moving
            ? `<input type="date" id="moveDateInput" value="${n.date}" max="${todayISO()}"><button class="btn primary sm" data-move-save="${n.kind}|${n.id}">Opslaan</button><button class="btn sm" data-move-cancel>Annuleren</button>`
            : `${n.garminDate?`<button class="btn primary sm" data-move-save-to="${n.kind}|${n.id}|${n.garminDate}">Zet op ${esc(fmt(n.garminDate,{day:'numeric',month:'long'}))} (Garmin-datum)</button>`:''}<button class="btn sm" data-move-start="${n.kind}|${n.id}">${n.garminDate?'Andere datum':'Verzetten'}</button><button class="btn danger sm" data-move-delete="${n.kind}|${n.id}">Verwijderen</button>`}
        </div>
      </div>`;
    }).join('');
  }
  if(otherTypes.length && !isFuture){
    html += `<p class="tny muted"${nearby.length?'':' style="margin-top:0"'}>Nog niet geregistreerd — toevoegen:</p>
      <div class="addbar">${otherTypes.map(([t,label])=>`<button class="btn sm" data-add="${t}|${d}">${esc(label)}</button>`).join('')}</div>`;
  }
  html += `</div></details>`;
  return html;
}

/* ===========================================================================
   DAGADVIES v1 — transparant, regelgebaseerd, geen black box, blokkeert niets.
   VANDAAG-waarden (energie/stijfheid/pijn) zijn primair; slaap + 7-daagse
   HRV/RHR-trend zijn context. Schalen: energie hoger = gunstiger; stijfheid
   en pijn hoger = ongunstiger. Historische waarden worden nooit geïnverteerd.
   =========================================================================== */
const ADVICE_VERSION = 1;
const ADVICE_LABEL = { green:'Normaal belastbaar', orange:'Verminderde belastbaarheid', red:'Herstel heeft prioriteit' };
const ADVICE_EMOJI = { green:'🟢', orange:'🟠', red:'🔴' };
function adviceInputs(d){
  const l = CB.dailyLogs[d] || {};
  const g = state.garmin.daily[d] || {};
  return {
    energy: num(l.energy), stiffness: num(l.stiffness), pain: num(l.pain),
    sleepHours: num(l.sleepHours) ?? num(g.sleepDuration),
    hrv7: r7('hrv', d), rhr7: r7('restingHr', d),
  };
}
function dayAdvice(d){
  const inp = adviceInputs(d);
  const base = HISTORICAL.baselineSummary || {};
  const reasons = [];   // { sev:'strong'|'moderate'|'info'|'good', text }
  const add = (sev,text)=> reasons.push({ sev, text });
  const { energy:e, stiffness:st, pain:pn, sleepHours:sl, hrv7, rhr7 } = inp;
  if(e!=null){
    if(e<=3) add('strong', `energie laag (${nl(e)}/10)`);
    else if(e===4) add('moderate', `energie aan de lage kant (4/10)`);
    else if(e>=7) add('good', `energie goed (${nl(e)}/10)`);
  }
  if(st!=null){
    if(st>=7) add('strong', `stijfheid hoog (${nl(st)}/10)`);
    else if(st>=5) add('moderate', `stijfheid verhoogd (${nl(st)}/10)`);
    else if(st<=2) add('good', `weinig stijfheid (${nl(st)}/10)`);
  }
  if(pn!=null){
    if(pn>=4) add('strong', `pijn (${nl(pn)}/10)`);
    else if(pn>=2) add('moderate', `lichte pijn (${nl(pn)}/10)`);
    else if(pn===0) add('good', `geen pijn`);
  }
  if(sl!=null){
    if(sl<5.5) add('moderate', `korte slaap (${nl(round(sl,1))} u)`);
    else if(sl<6.5) add('info', `slaap aan de korte kant (${nl(round(sl,1))} u)`);
  }
  if(rhr7!=null && base.rhrAvg!=null && rhr7 > base.rhrAvg+5) add('info', `RHR-trend > 5 bpm boven historisch gemiddelde`);
  if(hrv7!=null && base.hrvAvg!=null && hrv7 < base.hrvAvg-10) add('info', `HRV-trend duidelijk onder historisch gemiddelde`);

  const strong = reasons.filter(r=>r.sev==='strong').length;
  const moderate = reasons.filter(r=>r.sev==='moderate').length;
  const hasCore = e!=null || st!=null || pn!=null;

  let status = null;
  if(hasCore){
    if(strong>=2 || (pn!=null && pn>=6)) status = 'red';
    else if(strong>=1 || moderate>=2) status = 'orange';
    else status = 'green';
  }
  return {
    status, label: status ? ADVICE_LABEL[status] : 'Nog niet te bepalen',
    emoji: status ? ADVICE_EMOJI[status] : '⚪',
    reasons, inputs: inp, version: ADVICE_VERSION,
    summary: status ? reasons.filter(r=>['strong','moderate','good'].includes(r.sev)).slice(0,3).map(r=>r.text).join(' · ') : 'vul energie / stijfheid / pijn in',
  };
}
/* per activiteit: wat betekent dit advies concreet — nooit blokkerend */
function adviceForActivity(status, primaryType){
  if(status==='red') return 'Geen normale trainingsprikkel adviseren. Jij beslist of en wat je vandaag doet.';
  if(status==='orange'){
    if(primaryType==='coach') return 'Begin rustig; beperk zo nodig duur of intensiteit.';
    if(primaryType==='learning') return 'Kort en technisch rustig uitvoeren.';
    if(primaryType==='strengthA'||primaryType==='strengthB') return 'Verlaag zo nodig volume of gewicht; techniek eerst.';
    if(primaryType==='longwalk') return 'Rustig tempo, kort houden indien nodig.';
    return 'Rustiger aan; volume of intensiteit eventueel beperken.';
  }
  return primaryType ? 'Normaal uitvoeren.' : 'Ochtendroutine is voldoende.';
}
/* snapshot: bewaar het advies + de inputs waarop het is gebaseerd. Alleen
   (her)schrijven als de inputs veranderd zijn of er nog geen snapshot is —
   geen retroactieve herberekening van oude dagen zonder reden. */
function snapshotAdvice(d){
  if(d > todayISO()) return;
  const a = dayAdvice(d);
  if(!a.status && !(CB.dailyLogs[d] && CB.dailyLogs[d].advice)) return;
  const l = ensureLog(d);
  const key = JSON.stringify(a.inputs);
  if(l.advice && l.advice.inputsKey === key && l.advice.version === a.version) return;
  l.advice = { status:a.status, reasons:a.reasons.map(r=>r.text), version:a.version, inputs:a.inputs, inputsKey:key, computedAt: new Date().toISOString() };
}
/* effectieve dagstatus voor historie/tellingen: eigen beoordeling (l.traffic)
   wint van het automatische advies; anders het bewaarde advies. */
function effectiveDayStatus(d){
  const l = CB.dailyLogs[d]; if(!l) return null;
  return l.traffic || (l.advice && l.advice.status) || null;
}
/* -- alleen nog voor de Progressie › Herstel-trend (beschrijvend, geen advies) -- */
function recoveryFlags(){
  const e=r7('energy'), st=r7('stiffness'), sl=r7('sleepHours'), rh=r7('restingHr'), hv=r7('hrv');
  const base=HISTORICAL.baselineSummary||{};
  const out=[];
  if(e!=null && e<5) out.push('ochtendenergie < 5');
  if(st!=null && st>=5) out.push('spierpijn/stijfheid ≥ 5');
  if(sl!=null && sl<6.5) out.push('slaap < 6,5 u');
  if(rh!=null && base.rhrAvg!=null && rh > base.rhrAvg+4) out.push('RHR > 4 bpm boven historisch gemiddelde');
  if(hv!=null && base.hrvAvg!=null && hv < base.hrvAvg-8) out.push('HRV duidelijk onder historisch gemiddelde');
  return out;
}
function recoveryLabel(){
  const n = recoveryFlags().length;
  return n>=2 ? 'meerdere hersteltrends wijken af van je historische gemiddelde'
       : n===1 ? 'één hersteltrend wijkt af van je historische gemiddelde'
       : 'hersteltrends in lijn met je historische gemiddelde';
}
/* Dagadvies-blok op Vandaag: automatisch advies + "Waarom?" + koppeling aan de
   geplande activiteit + ruimte voor je eigen afwijkende beoordeling. */
function dayAdviceBlock(d, primaryType){
  const a = dayAdvice(d);
  const l = CB.dailyLogs[d] || {};
  const own = l.traffic && DAY_STATUS[l.traffic] ? l.traffic : null;
  if(!a.status){
    return `<div class="dagadvies">
      <div class="lbl">Dagadvies</div>
      <div class="status">⚪ Nog niet te bepalen</div>
      <div class="sub">vul energie, stijfheid en pijn in bij de Ochtendcheck</div>
    </div>`;
  }
  const ownPanel = own
    ? `<div class="panel">Jouw beoordeling: <b>${DAY_STATUS[own].emoji} ${esc(DAY_STATUS[own].label)}</b>${own!==a.status?' — wijkt af van het automatische advies':', gelijk aan het advies'}. <a href="#" data-own-clear="${d}">wissen</a></div>`
    : `<div class="panel">Eigen inschatting kiezen (staat los van het automatische advies):
        <span class="own-row">${['green','orange','red'].map(s=>`<a href="#" data-own-set="${d}|${s}" title="${esc(DAY_STATUS[s].label)}">${DAY_STATUS[s].emoji}</a>`).join('')}</span></div>`;
  return `<div class="dagadvies st-${a.status}">
    <div class="lbl">Dagadvies${own&&own!==a.status?` <span class="own-tag">eigen ${DAY_STATUS[own].emoji}</span>`:''}</div>
    <div class="status">${a.emoji} ${esc(a.label)}</div>
    <div class="sub">${esc(a.summary)}</div>
    <div class="act">${esc(adviceForActivity(a.status, primaryType))}</div>
    <div class="toggles">
      <details><summary>Waarom?</summary><div class="panel">Gebruikte waarden (regelversie ${a.version}): ${adviceValueList(a.inputs)}. Waarden van vandaag wegen zwaarder dan de 7-daagse trend. De app beslist en blokkeert niets.</div></details>
      <details><summary>Eigen beoordeling</summary>${ownPanel}</details>
    </div>
  </div>`;
}
function adviceValueList(inp){
  const bits = [];
  if(inp.energy!=null) bits.push(`energie ${nl(inp.energy)}`);
  if(inp.stiffness!=null) bits.push(`stijfheid ${nl(inp.stiffness)}`);
  if(inp.pain!=null) bits.push(`pijn ${nl(inp.pain)}`);
  if(inp.sleepHours!=null) bits.push(`slaap ${nl(round(inp.sleepHours,1))} u`);
  if(inp.hrv7!=null) bits.push(`HRV 7d ${nl(round(inp.hrv7,0))}`);
  if(inp.rhr7!=null) bits.push(`RHR 7d ${nl(round(inp.rhr7,0))}`);
  return bits.length ? esc(bits.join(' · ')) : 'geen';
}
function latestContinuous(){ const v = CB.coachRuns.filter(r=>r.done===true).map(r=>num(r.continuousMin)).filter(x=>x!=null); return v[v.length-1] ?? null; }
function biggestAsymmetry(){
  const M = CB.measurements.baseline; let best=null;
  for(const def of kpiDefs().filter(x=>x.asym)){
    const L=num(M[def.key+'L']), R=num(M[def.key+'R']);
    if(L!=null&&R!=null){ const diff=Math.abs(L-R); if(!best||diff>best.val) best={ val:diff, label:`${def.label} (W0)` }; }
  }
  return best;
}

/* Bestaande trainingen beheren vanuit "Iets anders gedaan? / training aanpassen":
   verzetten (alleen de datum verandert, alle overige velden incl. garminExternalId blijven)
   of verwijderen. Geen nieuw record, geen kopie. */
const MOVE_ARRAYS = { coach:'coachRuns', strength:'strengthSessions', walk:'walks', learning:'learningSessions' };
function moveRecordDate(kind, id, newDate){
  if(!isoDate(newDate)) { alert('Ongeldige datum.'); return; }
  if(newDate > todayISO()){ alert('Een training kun je niet naar een datum in de toekomst verplaatsen — je kunt hem daar immers nog niet gedaan hebben.'); return; }
  const arr = CB[MOVE_ARRAYS[kind]];
  const rec = arr && arr.find(x=>x.id===id);
  if(!rec) return;
  rec.date = newDate;
  arr.sort((a,b)=> a.date.localeCompare(b.date));
  ui.moveOn = null;
  ui.date = clampToBlock(newDate);   // meteen naar de nieuwe datum, zodat de verplaatsing zichtbaar bevestigd wordt
  ui.weekIdx = Math.max(0, weekIndexFor(ui.date));
  saveState(); renderCurrent();
}
function deleteRecordById(kind, id){
  const arr = CB[MOVE_ARRAYS[kind]];
  const i = arr ? arr.findIndex(x=>x.id===id) : -1;
  if(i<0) return;
  arr.splice(i,1);
  ui.moveOn = null;
  saveState(); renderCurrent();
}

/* velden die "vorige waarde als grijze richtwaarde" ondersteunen — uitsluitend de
   routinemetingen, nooit subjectieve dagvelden en nooit de notitie (zie UX-correctie). */
const ROUTINE_DETAIL_FIELDS = ['pushupReps','pushupTech','pushupRpe','forwardBendReps','forwardBendFloor',
  'balanceReachL','balanceReachR','balanceRvsL','legRaiseReps','toeTouchReps','ohpL','ohpR'];
/* meest recente eerdere waarde per veld, strikt vóór datum d — nooit vandaag of later,
   en per veld apart gezocht (niet blind één vorige dag kopiëren). */
function prevRoutineValue(field, d){
  const ds = Object.keys(CB.dailyLogs).filter(x=> x < d).sort();
  for(let i=ds.length-1;i>=0;i--){
    const v = CB.dailyLogs[ds[i]]?.routineDetail?.[field];
    if(v!=null && v!=='') return { value:v, date:ds[i] };
  }
  return null;
}
function relativeDayLabel(dateStr, refDate){
  const diff = Math.round((parseDate(refDate)-parseDate(dateStr))/86400000);
  if(diff===1) return 'gisteren';
  if(diff===2) return 'eergisteren';
  return fmt(dateStr,{day:'numeric',month:'short'});
}
/* "Vorige waarden overnemen" — vult per leeg veld de laatst bekende waarde in als concept
   voor vandaag. Dit IS de bevestiging (expliciete klik); daarna gewoon aanpasbaar/opslaanbaar
   via de bestaande invoerlogica. Nooit de notitie, nooit velden die al een waarde hebben. */
function applyPreviousRoutineValues(d){
  const rd = ensureLog(d).routineDetail = ensureLog(d).routineDetail || {};
  for(const f of ROUTINE_DETAIL_FIELDS){
    if(rd[f]==null || rd[f]===''){
      const prev = prevRoutineValue(f, d);
      if(prev) rd[f] = prev.value;
    }
  }
  saveState(); renderToday();
}

/* ===========================================================================
   DRAFT-BEHEER + COMMIT
   =========================================================================== */
let _draft = {};
function draftSet(parts, val){
  let ptr = _draft;
  for(let i=1;i<parts.length-1;i++){ ptr[parts[i]] = ptr[parts[i]] || {}; ptr = ptr[parts[i]]; }
  ptr[parts[parts.length-1]] = (val===''?null:val);
}
function draftGet(path){ return path.split('.').reduce((o,k)=> (o&&o[k]!=null)?o[k]:undefined, _draft); }
function normNums(o){ const out={}; for(const [k,v] of Object.entries(o||{})){
  if(k==='entries'){ const e={}; for(const [id,vals] of Object.entries(v||{})) e[id]=normNums(vals); out[k]=e; continue; }
  out[k] = coerce(k, v); } return out; }
function ensureLog(d){ return CB.dailyLogs[d] = CB.dailyLogs[d] || {}; }
/* canonical = dailyLogs[d].routineDone ('ja'|'deels'|'nee'|''); checks.routine blijft
   compatibel uitleesbaar voor oude records. 'ja' en 'deels' tellen als routinedag. */
function routineDoneish(l){ return !!(l && (l.routineDone==='ja' || l.routineDone==='deels' || (l.checks && l.checks.routine))); }

function commitDraft(spec){
  const [kind, a, b] = spec.split('|');
  if(isoDate(a) && a > todayISO()){ alert('Je kunt geen training registreren op een datum in de toekomst. Registreer op de dag zelf of daarna.'); return; }
  if(kind==='coach'){
    const d = (draftGet('coach.'+a)) || {};
    const rec = { id:'c'+Date.now().toString(36), date:a, ...normNums(d) };
    // 3 echte toestanden: 'ja'->true, 'nee'->false, leeg/anders->null (nog niet bekend)
    rec.done = d.done==='ja' ? true : d.done==='nee' ? false : null;
    CB.coachRuns.push(rec); CB.coachRuns.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.coach) delete _draft.coach[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='strength'){
    const d = (draftGet(`strength.${a}.${b}`)) || {};
    const entries = {};
    for(const [exId,vals] of Object.entries(d.entries||{})) entries[exId] = normNums(vals);
    CB.strengthSessions.push({ id:'s'+Date.now().toString(36), date:a, session:b, entries, note:d.note||'', durationMin: num(d.durationMin) });
    CB.strengthSessions.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.strength && _draft.strength[a]) delete _draft.strength[a][b];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='walk'){
    const d = (draftGet('walk.'+a)) || {};
    CB.walks.push({ id:'w'+Date.now().toString(36), date:a, ...normNums(d) });
    CB.walks.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.walk) delete _draft.walk[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='learning'){
    const d = (draftGet('learning.'+a)) || {};
    const wi = Math.max(0, weekIndexFor(a));
    const rec = { id:'l'+Date.now().toString(36), date:a, ...normNums(d) };
    if(!rec.exerciseId) rec.exerciseId = weekConfig(wi).focusExercise || (state.exercises.find(e=>e.kind==='strength')||{}).id || '';
    CB.learningSessions.push(rec);
    CB.learningSessions.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.learning) delete _draft.learning[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.learnDone = true;
  }
  ui.addOn = null; ui.addType = null;
  saveState(); renderCurrent();
}
function deleteRecord(spec){
  const [kind, idx] = spec.split('|'); const i = Number(idx);
  if(kind==='coach') CB.coachRuns.splice(i,1);
  if(kind==='strength') CB.strengthSessions.splice(i,1);
  if(kind==='walk') CB.walks.splice(i,1);
  if(kind==='learning') CB.learningSessions.splice(i,1);
  saveState(); renderCurrent();
}
