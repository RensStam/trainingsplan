function liftLatest(exId){
  const h = strengthHistory(exId); if(!h.length) return null;
  return h[h.length-1].e;
}
function fmtLift(e){
  if(!e) return '—';
  if(e.weightL!=null||e.weightR!=null||e.setRepsL!=null||e.setRepsR!=null)
    return `L ${nl(e.weightL)}×${esc(e.setRepsL||'–')} / R ${nl(e.weightR)}×${esc(e.setRepsR||'–')}`;
  return `${nl(e.weight)} × ${esc(e.setReps||e.reps||'–')}${e.sets?` (${e.sets} sets)`:''}`;
}
function measLatest(key){
  switch(key){
    case 'hrv': case 'restingHr': case 'sleepHours': case 'energy': case 'stiffness': case 'pain':
      return r7(key);
    case 'vo2max': return latestVo2();
    case 'runContinuousMin': return latestContinuous();
    case 'runPace': { const v = CB.coachRuns.filter(r=>r.done===true).map(r=>r.avgPace).filter(Boolean); return v[v.length-1]??null; }
    case 'runAvgHr': { const v = CB.coachRuns.filter(r=>r.done===true).map(r=>num(r.avgHr)).filter(x=>x!=null); return v[v.length-1]??null; }
    case 'runRpe': { const v = CB.coachRuns.filter(r=>r.done===true).map(r=>num(r.rpe)).filter(x=>x!=null); return v[v.length-1]??null; }
    case 'pushups': return lastRoutineField('pushupReps');
    default: return null;
  }
}
function lastRoutineField(f){
  const ds = Object.keys(CB.dailyLogs).sort();
  for(let i=ds.length-1;i>=0;i--){ const v = CB.dailyLogs[ds[i]]?.routineDetail?.[f]; if(v!=null&&v!=='') return num(v); }
  return null;
}
/* Historische vóór-vakantiereferentie. GEEN hardloopvelden hier — de wandeltest van 27-07
   is geen hardloopmeting en wordt apart getoond, niet als runContinuousMin/runPace/runAvgHr/runRpe. */
function histRef(key){
  const b = HISTORICAL.baselineSummary || {};
  return ({ hrv:b.hrvAvg, restingHr:b.rhrAvg, sleepHours:b.sleepHoursAvg, energy:b.morningEnergyAvg,
    stiffness:b.morningStiffnessAvg, pain:b.morningPainAvg, pushups:b.pushupsLast })[key] ?? null;
}
/* per-domein voortgang van een meting: hoeveel van de functionele KPI's zijn ingevuld.
   Herstel telt hier niet mee (komt uit het 7-daags venster, niet uit dit formulier). */
function measCompletion(M){
  const domains = {};
  for(const def of kpiDefs()){
    if(def.rec) continue;
    const dom = domains[def.dom] = domains[def.dom] || {done:0, total:0, missing:[]};
    if(def.lift && def.lr){
      // lift + L/R (row/splitSquat/ohp): opgeslagen als <key>L.weight / <key>R.weight
      dom.total += 2;
      if(M[def.key+'L']?.weight!=null) dom.done++; else dom.missing.push(def.label+' links');
      if(M[def.key+'R']?.weight!=null) dom.done++; else dom.missing.push(def.label+' rechts');
    } else if(def.lift){
      dom.total++;
      if(M[def.key]?.weight!=null) dom.done++; else dom.missing.push(def.label);
    } else if(def.lr){
      dom.total += 2;
      if(num(M[def.key+'L'])!=null) dom.done++; else dom.missing.push(def.label+' links');
      if(num(M[def.key+'R'])!=null) dom.done++; else dom.missing.push(def.label+' rechts');
    } else {
      dom.total++;
      const has = def.key==='runPace' ? !!M.runPace : num(M[def.key])!=null;
      if(has) dom.done++; else dom.missing.push(def.label);
    }
  }
  return domains;
}

function ddDate(iso){ const t = parseDate(iso); return `${DD_DOW[t.getDay()]} ${t.getDate()} ${DD_MON[t.getMonth()]} ${t.getFullYear()}`; }
/* slaapduur als u:mm tonen (alleen presentatie; opgeslagen waarde blijft de decimale) */
function ddSleep(hoursDec){
  if(hoursDec==null || hoursDec==='' || isNaN(hoursDec)) return null;
  let h = Math.floor(hoursDec), m = Math.round((hoursDec - h) * 60);
  if(m===60){ h++; m = 0; }
  return `${h}:${String(m).padStart(2,'0')}`;
}

    { key:'legRaiseReps',    label:'Beenheffing (aantal reps)',    short:'Beenhef',   m:'routineDetail.legRaiseReps',   g:null, h:null, num:true },
    { key:'toeTouchReps',    label:'Toe-touch (aantal reps)',      short:'Toe-touch', m:'routineDetail.toeTouchReps',   g:null, h:null, num:true },
    { key:'ohpL',            label:'Overhead press links @ 9 kg',  short:'OHP L',     m:'routineDetail.ohpL',           g:null, h:null, num:true },
    { key:'ohpR',            label:'Overhead press rechts @ 9 kg', short:'OHP R',     m:'routineDetail.ohpR',           g:null, h:null, num:true },
  ];

  const run = [

function dagdataRunVal(date, col, g){
  const r = (CB.coachRuns||[]).find(x=>x.date===date && x.done===true);
  if(col.key==='vo2max'){
    const v = r && num(r.vo2max)!=null ? num(r.vo2max) : num(g && g.vo2max);
    return v ?? null;
  }
  return r && num(r.continuousMin)!=null ? num(r.continuousMin) : null;
}
function dagdataHistVal(h, col){
  if(!h) return null;
  if(col.h==='__sleepH') return h.sleepTime ? round(timeToMin(h.sleepTime)/60,4) : (num(h.sleepHours) ?? null);
  if(!col.h) return null;
  const raw = h[col.h];
  return raw==null || raw==='' ? null : (typeof raw==='string' ? raw : num(raw));
}
function dagdataCurVal(l, g, col){
  const mp = col.m;
  let man;
  if(mp==='__routine') man = l.routineDone || (l.checks && l.checks.routine ? 'ja' : null);
  else if(mp && mp.indexOf('routineDetail.')===0) man = l.routineDetail ? l.routineDetail[mp.slice(14)] : undefined;
  else man = l[mp];
  if(man!=null && man!==''){
    return { val: (col.text||col.sel) ? man : num(man), src:'M', override: !!(col.g && g && g[col.g]!=null) };
  }
  if(col.g && g && g[col.g]!=null) return { val:num(g[col.g]), src:'G', override:false };
  return { val:null, src:null, override:false };
}
function dagdataRows(){
  const today = todayISO();
  const from = ui.dagdataRange==='all' ? '0000-00-00' : addDays(today, ui.dagdataRange==='14' ? -13 : -29);
  const dates = new Set([
    ...Object.keys(HISTORICAL.logs||{}),
    ...Object.keys(CB.dailyLogs||{}),
    ...Object.keys(state.garmin.daily||{}),
    ...(CB.coachRuns||[]).map(r=>r.date),
  ]);
  const cols = dagdataColumns();
  const rows = [];
  for(const date of [...dates].filter(d=> d>=from && d<=today).sort().reverse()){
    const h = HISTORICAL.logs[date];
    const isHist = !!h;
    const l = CB.dailyLogs[date] || {};
    const g = state.garmin.daily[date] || {};
    const cells = {};
    for(const col of cols){
      if(col.run){
        cells[col.key] = { val: isHist ? null : dagdataRunVal(date, col, g), src:'run', editable:false, ro:true };
      } else if(col.computed){
        // Dagadvies (read-only in de tabel): eigen beoordeling wint, anders het automatische advies.
        // Live berekend voor weergave; de dag-snapshot (l.advice) blijft ongewijzigd.
        const s = isHist ? null : (l.traffic || dayAdvice(date).status);
        cells[col.key] = { val: s || null, src: s && l.traffic ? 'own' : (s?'auto':null), editable:false, ro:true };
      } else if(isHist){
        cells[col.key] = { val: dagdataHistVal(h, col), src:'H', editable:false };
      } else {
        const r = dagdataCurVal(l, g, col);
        cells[col.key] = { ...r, editable:true, path: col.m==='__routine' ? `currentBlock.dailyLogs.${date}.routineDone` : `currentBlock.dailyLogs.${date}.${col.m}` };
      }
    }
    // Prestatie-weergave: alleen dagen met minstens één waarde, zodat de tabel compact blijft
    if(ui.dagdataView==='prestatie' && !cols.some(c=>{ const v=cells[c.key].val; return v!=null && v!==''; })) continue;
    rows.push({ date, isHist, era: isHist ? 'historisch' : 'blok2', cells });
  }
  return { rows, cols };
}
function dagdataCell(row, col){
  const c = row.cells[col.key];
  const alignCls = (col.num || col.time) ? ' n' : '';
  const showVal = v => {
    if(v==null || v==='') return null;
    if(col.time) return ddSleep(typeof v==='number' ? v : parseFloat(String(v).replace(',','.')));
    if(col.sel) return (col.sel.find(o=>String(o[0])===String(v))||[,v])[1];
    return String(nl(v));
  };
  if(col.run){
    return `<td class="ro n" title="uit de Coach-run van die dag"${''}>${c.val==null ? '<span class="miss">—</span>' : esc(String(nl(c.val)))}</td>`;
  }
  if(col.computed){
    const label = c.val ? (DD_ADVICE[c.val] || c.val) : null;
    const tip = c.src==='own' ? 'jouw eigen beoordeling' : c.src==='auto' ? 'automatisch berekend dagadvies' : '';
    return `<td class="ro"${tip?` title="${esc(tip)}"`:''}>${label ? `${esc(label)}${c.src==='own'?' <span class="miss">·eigen</span>':''}` : '<span class="miss">—</span>'}</td>`;
  }
  if(row.isHist){
    const s = showVal(c.val);
    return `<td class="ro${alignCls}">${s==null ? '<span class="miss">—</span>' : esc(s)}</td>`;
  }
  if(col.sel){
    return `<td class="${alignCls?'n':''}"><select class="cell" data-bind="${c.path}">${col.sel.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(c.val??'')?'selected':''}>${esc(t)}</option>`).join('')}</select></td>`;
  }
  const garmin = c.src==='G';
  const title = garmin ? ' title="Bron: Garmin — typ om handmatig te corrigeren"'
              : c.override ? ' title="Handmatig gecorrigeerd — een latere Garmin-import overschrijft dit niet"' : '';
  const cls = 'cell' + (garmin ? ' g' : '');
  const val  = c.src==='M' ? esc(String(col.time && typeof c.val==='number' ? (ddSleep(c.val) ?? c.val) : c.val)) : '';
  const ph   = garmin ? ` placeholder="${esc(String(showVal(c.val) ?? nl(c.val)))}"` : (c.val==null ? ' placeholder="—"' : '');
  const mark = (!garmin && c.override) ? '<span class="src">✎</span>' : '';
  return `<td class="${alignCls?'n':''}"${title}><input class="${cls}" type="${col.time||col.text?'text':'number'}" ${col.time||col.text?'':'inputmode="decimal"'}${col.step?` step="${col.step}"`:''} data-bind="${c.path}" value="${val}"${ph}>${mark}</td>`;
}

function ddSyncTopScroll(){
  const top = document.querySelector('.dd-topscroll'), wrap = document.querySelector('.dd-wrap');
  if(!top || !wrap) return;
  const inner = top.firstElementChild;
  const size = ()=>{ inner.style.width = wrap.scrollWidth + 'px'; top.style.display = wrap.scrollWidth > wrap.clientWidth + 1 ? '' : 'none'; };
  size();
  let lock = false;
  top.onscroll  = ()=>{ if(lock){lock=false;return;} lock=true; wrap.scrollLeft = top.scrollLeft; };
  wrap.onscroll = ()=>{ if(lock){lock=false;return;} lock=true; top.scrollLeft = wrap.scrollLeft; };
  top.scrollLeft = wrap.scrollLeft;
  window.addEventListener('resize', size);
}

function seriesFor(key, range){
  let rows;
  if(['vo2max','runContinuousMin','runPaceSec','runAvgHr'].includes(key)){
    rows = CB.coachRuns.filter(r=>r.done===true).map(r=>{
      const y = key==='vo2max'?num(r.vo2max) : key==='runContinuousMin'?num(r.continuousMin)
              : key==='runPaceSec'?paceToSec(r.avgPace) : num(r.avgHr);
      return y==null?null:{x:r.date,y};
    }).filter(Boolean);
  } else {
    rows = recoveryTimeline().filter(r=>r[key]!=null).map(r=>({x:r.date,y:r[key]}));
  }
  rows.sort((a,b)=>a.x.localeCompare(b.x));
  if(range!=='all'){ const cut = addDays(todayISO(), -Number(range)); rows = rows.filter(r=>r.x>=cut); }
  return rows;
}
/* primaire krachtreeks = GEWICHT over tijd (geen kunstmatige score). Per punt de context. */
function strengthWeightRows(exId, range, side){
  return strengthHistory(exId).map(h=>{
    const g = loadKey(h.e, side);
    return { x:h.date, y:g.w, reps:g.reps, rir:num(h.e.rir), rpe:num(h.e.rpeLast), tech:h.e.tech };
  }).filter(r=> r.y!=null && (range==='all' || r.x >= addDays(todayISO(),-Number(range))));
}
function fmtStrengthPoint(r){
  return `${nl(r.y)} kg · ${r.reps.length?r.reps.join('+'):'–'}${r.rir!=null?` · RIR ${r.rir}`:r.rpe!=null?` · RPE ${r.rpe}`:''}${r.tech==='minder'?' · techniek minder':''}`;
}
/* ---- gewicht: uitsluitend bestaande weightKg-data uit recoveryTimeline() ---- */
function weightDailyRows(){
  return recoveryTimeline().filter(r=> r.weight!=null).map(r=>({ x:r.date, y:r.weight }))
    .sort((a,b)=> a.x.localeCompare(b.x));
}
/* voortschrijdend 7-daags gemiddelde: per meetdatum de metingen van die datum + 6 voorafgaande
   KALENDERdagen; alleen als er >=4 werkelijk gemeten dagen in dat venster zijn; 1 decimaal.
   Ontbrekende dagen tellen niet mee (geen nul, geen interpolatie). */
function weightRollingAvg(dailyRows){
  const byDate = {}; dailyRows.forEach(r=> byDate[r.x]=r.y);
  const out = [];
  for(const r of dailyRows){
    const vals = [];
    for(let i=0;i<7;i++){ const d = addDays(r.x,-i); if(byDate[d]!=null) vals.push(byDate[d]); }
    if(vals.length >= 4) out.push({ x:r.x, y: round(vals.reduce((a,b)=>a+b,0)/vals.length, 1), n:vals.length });
  }
  return out;
}
/* algemeen voortschrijdend 7-daags gemiddelde (kalendervenster: datum + 6 voorafgaande dagen);
   alleen op meetdagen, alleen echt gemeten waarden, minimaal minN meetdagen in het venster. Geen interpolatie. */
function rollingAvg(rows, minN=4){
  const by = {}; rows.forEach(r=> by[r.x]=r.y);
  const out = [];
  for(const r of rows){
    const vals = [];
    for(let i=0;i<7;i++){ const d = addDays(r.x,-i); if(by[d]!=null) vals.push(by[d]); }
    if(vals.length >= minN) out.push({ x:r.x, y: round(vals.reduce((a,b)=>a+b,0)/vals.length, 2), n:vals.length });
  }
  return out;
}
/* voor schaarse reeksen (bv. hardlopen, ~1x per week): gemiddelde van de laatste N metingen (incl. deze), vanaf 2 metingen */
function lastNAvg(rows, n=3){
  const out = [];
  for(let i=1;i<rows.length;i++){
    const w = rows.slice(Math.max(0,i-n+1), i+1);
    out.push({ x:rows[i].x, y: round(w.reduce((a,b)=>a+b.y,0)/w.length, 2), n:w.length });
  }
  return out;
}
/* grafiek met dagwaarde + 7-daags gemiddelde; gemiddelde eerst over ALLE data berekend, daarna pas op de periode gefilterd */
function chartWithAvg(key, range, o, minN){
  const full = seriesFor(key,'all');
  const last3 = minN==='last3';
  let rows = full, avg = last3 ? lastNAvg(full, 3) : rollingAvg(full, minN||4);
  if(range!=='all'){ const cut = addDays(todayISO(), -Number(range)); rows = rows.filter(r=>r.x>=cut); avg = avg.filter(r=>r.x>=cut); }
  return lineChart(rows, { ...o, series2: avg, color2:'#1b3a30', name1:'meting', name2: last3 ? 'gemiddelde laatste 3 metingen' : '7-daags gemiddelde' });
}
function weightAvgWindow(endDate){
  const byDate = {}; weightDailyRows().forEach(r=> byDate[r.x]=r.y);
  const vals = []; for(let i=0;i<7;i++){ const d = addDays(endDate,-i); if(byDate[d]!=null) vals.push(byDate[d]); }
  return { value: vals.length>=4 ? round(vals.reduce((a,b)=>a+b,0)/vals.length,1) : null, n:vals.length };
}

/* Dagadvies als statistiek: per kalenderweek de dagen als gekleurde blokjes + telling.
   Status = eigen beoordeling (traffic) of het automatisch dagadvies; dagen zonder gegevens blijven grijs. */
function anyStatusCard(){
  const c = {green:0, orange:0, red:0}, cut = addDays(todayISO(), -13);
  Object.keys(CB.dailyLogs).forEach(dt=>{ if(dt>=cut && dt<=todayISO()){ const s=effectiveDayStatus(dt); if(s && c[s]!=null) c[s]++; } });
  return (c.green||c.orange||c.red) ? `<p class="tny muted">Laatste 14 dagen: 🟢 ${c.green} · 🟠 ${c.orange} · 🔴 ${c.red} — telling, geen score.</p>` : '';
}
function adviceStatsHTML(range){
  const dates = new Set([...Object.keys(HISTORICAL.logs||{}), ...Object.keys(CB.dailyLogs)]);
  const today = todayISO(), cut = range==='all' ? '0000' : addDays(today, -Number(range));
  const days = [...dates].filter(d=> d<=today && d>=cut).sort();
  if(!days.length) return '';
  const st = {};
  days.forEach(d=>{ let s = CB.dailyLogs[d]?.traffic || CB.dailyLogs[d]?.advice?.status || null; if(!s){ try{ s = dayAdvice(d).status || null; }catch(e){ s = null; } } st[d] = s; });
  const monday = d=>{ const x=parseDate(d); return addDays(d, -((x.getDay()+6)%7)); };
  const weeks = {}; days.forEach(d=>{ (weeks[monday(d)] = weeks[monday(d)] || []).push(d); });
  const tl = {}; recoveryTimeline().forEach(r=> tl[r.date]=r);
  const isoWeek = d=>{ const x=parseDate(d); const th=new Date(x.getFullYear(),x.getMonth(),x.getDate()+3-((x.getDay()+6)%7)); const w1=new Date(th.getFullYear(),0,4); return 1+Math.round(((th-w1)/86400000-3+((w1.getDay()+6)%7))/7); };
  const tip = (d,lab)=>{ const r=tl[d]||{}; const v=(k,u,dec)=> r[k]!=null ? `${nl(round(r[k],dec??1))}${u}` : '—';
    return `${ddDate(d)} — ${lab}
Energie ${v('energy','',0)} · Stijfheid ${v('stiffness','',0)} · Pijn ${v('pain','',0)}
Slaap ${v('sleepHours',' u')} · HRV ${v('hrv',' ms',0)} · RHR ${v('restingHr',' bpm',0)}`; };
  const col = { green:'#2f8f5b', orange:'#e08a1e', red:'#c0392b' };
  const tot = {green:0, orange:0, red:0};
  const rows = Object.keys(weeks).sort().reverse().map(m=>{
    const cnt = {green:0, orange:0, red:0};
    const cells = Array.from({length:7},(_,i)=>{
      const d = addDays(m,i); if(!weeks[m].includes(d)) return '<span class="advcell" style="background:transparent;border:1px dashed var(--line2)"></span>';
      const s = st[d]; if(s){ cnt[s]++; tot[s]++; }
      const lab = s ? DD_ADVICE[s] : 'geen advies (te weinig gegevens)';
      return `<span class="advcell" style="background:${s?col[s]:'var(--line2)'}" title="${esc(tip(d,lab))}"></span>`;
    }).join('');
    return `<div class="advrow"><span class="tny muted advwk">wk ${isoWeek(m)} · ${esc(fmt(m,{day:'numeric',month:'short'}))}</span><span class="advcells">${cells}</span><span class="tny">🟢 ${cnt.green} · 🟠 ${cnt.orange} · 🔴 ${cnt.red}</span></div>`;
  }).join('');
  return `<div class="chart-wrap">
    <div class="tny muted" style="margin-bottom:6px">Elk blokje is één dag (ma → zo), vanaf de maandag van die week (weeknummer = kalenderweek). Ga met de muis (of tik) op een blokje voor de waarden van die dag. Totaal in deze periode: 🟢 ${tot.green} · 🟠 ${tot.orange} · 🔴 ${tot.red}. Telling, geen score.</div>
    <div class="tny" style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px;align-items:center">
      <span><span class="advcell" style="background:#2f8f5b;vertical-align:middle"></span> Normaal</span>
      <span><span class="advcell" style="background:#e08a1e;vertical-align:middle"></span> Rustiger</span>
      <span><span class="advcell" style="background:#c0392b;vertical-align:middle"></span> Herstel</span>
      <span><span class="advcell" style="background:var(--line2);vertical-align:middle"></span> dag bestaat, maar geen advies (te weinig gegevens)</span>
      <span><span class="advcell" style="background:transparent;border:1px dashed var(--line2);vertical-align:middle"></span> geen dag (nog niet geweest / geen registratie)</span>
    </div>${rows}</div>`;
}
function asymBars(label,lB,rB,lW,rW,endLbl='W12'){
  const vals=[lB,rB,lW,rW].map(v=>num(v)||0); const max=Math.max(...vals,1);
  const bar=(v,c,t)=>`<div style="flex:1;text-align:center"><div style="height:88px;display:flex;align-items:flex-end;justify-content:center"><div style="width:55%;background:${c};height:${(num(v)||0)/max*100}%;border-radius:5px 5px 0 0;min-height:2px"></div></div><div class="tny">${t}<br>${v==null?'—':v}</div></div>`;
  const dB=(num(lB)!=null&&num(rB)!=null)?Math.abs(num(lB)-num(rB)):null;
  const dW=(num(lW)!=null&&num(rW)!=null)?Math.abs(num(lW)-num(rW)):null;
  return `<div class="chart-wrap"><h4>${esc(label)}</h4><div style="display:flex;gap:6px">
    ${bar(lB,'#9fc4b4','L W0')}${bar(rB,'#c4b0dd','R W0')}<div style="width:10px"></div>${bar(lW,'#276b52','L '+endLbl)}${bar(rW,'#5b3d78','R '+endLbl)}</div>
    <div class="tny muted" style="margin-top:6px">Asymmetrie |L−R|: ${nl(dB)} (W0) → ${nl(dW)} (${endLbl})${(dB!=null&&dW!=null)?` — ${dW<dB?'afgenomen':dW>dB?'toegenomen':'gelijk'}`:''}. Trainingsinformatie, geen medische conclusie.</div></div>`;
}

        </p>
        ${ex.search?`<p class="tny muted">Zoekterm: ${esc(ex.search)}</p>`:''}
      </div>`;
    }
    sec += `</div>`;
    return sec;
  }).join('')}

  <div class="card"><h3>Video's — welke bronnen</h3>
    <p class="small">Geen verzonnen links. Zolang een specifieke video niet gecontroleerd is: <code>videoStatus: needs_review</code> en alleen een zoekknop.</p>
    <p class="small"><b>Voorkeur:</b> fysiotherapie en functionele beweging, rustig uitgelegd, normale demonstratie, thuis-uitvoerbare varianten — bijvoorbeeld <b>E3 Rehab</b> en <b>Physiotutors</b>.</p>
    <p class="small"><b>Vermijd als standaard:</b> bodybuilding-, powerlifting- of sportschoolcultuur en nadruk op gespierde fitnessmodellen. Squat University alleen wanneer een specifieke rustige techniekvideo aantoonbaar geschikt is.</p>
  </div>

  <div class="card"><h3>Startdosering &amp; double progression</h3>
    <p><b>Start:</b> ±2 sets · 6–12 herhalingen · ~2–3 herhalingen in reserve (RIR). Tijdsoefeningen 20–60 seconden.</p>
    <p><b>Double progression:</b> haal je alle sets aan de bovengrens met goede techniek en RIR ≥ 2, twee opeenvolgende sessies, dan is het criterium bereikt en overweeg je één stap zwaarder — daarna terug naar de onderkant van de range. De app adviseert, verplicht nooit.</p>
    <p><b>Nooit tegelijk verhogen:</b> gewicht, sets, reps én moeilijkheid. Eén variabele per stap. Progressie ≠ meer reps: meer weerstand of een moeilijker variant bij dezelfde techniek kan vooruitgang zijn, ook met minder herhalingen.</p>
    <p><b>Drie stadia per oefening:</b> <span class="stage-badge stage-leren">leren</span> geen gewichtsprogressie-advies · <span class="stage-badge stage-vertrouwd">vertrouwd</span> mag in een korte combinatiesessie, nog conservatief · <span class="stage-badge stage-trainen">trainen</span> pas hier wordt de double-progressionregel actief. Geen automatisch promoveren op basis van één goede training — jij zet het stadium.</p>
    <p class="tny muted"><b>volume</b> (hoeveelheid) ≠ <b>kwaliteit</b> (techniek/controle) ≠ <b>progressie</b> (meer weerstand bij gelijke kwaliteit; bij mobiliteit gelijk bereik met minder volume; bij hardlopen langer/sneller bij vergelijkbare belasting).</p>
  </div>

  <details class="acc"><summary>Historische protocollen uit de oude app (referentie, niet leidend)</summary><div class="acc-body">
    ${Object.entries(HISTORICAL.reference.protocols||{}).map(([c,p])=>`<p class="small"><b>${esc(c)} — ${esc(p.title)}:</b> ${esc(p.purpose)} <span class="muted">(${esc(p.duration)}, ${esc(p.intensity)})</span></p>`).join('')}
    <p class="tny muted">Deze protocollen horen bij de nulmeting- en vakantieperiode.</p></div></details>

  </div></details>`;
  setViewHTML('#view-exercises', html);
}

function fmtActivity(a){
  const t = GARMIN_RUN_TYPES.includes(a.type) ? 'Hardlopen' : GARMIN_WALK_TYPES.includes(a.type) ? 'Wandelen' : GARMIN_RIDE_TYPES.includes(a.type) ? 'Fietsen' : (a.type||'Activiteit');
  const parts = [
    a.distanceKm!=null ? `${nl(a.distanceKm)} km` : null,
    a.durationMin!=null ? `${nl(round(a.durationMin,1))} min` : null,
    a.avgPace ? `${a.avgPace}/km` : null,
    a.avgHr!=null ? `gem. HR ${nl(a.avgHr)}` : null,
    a.maxHr!=null ? `max. HR ${nl(a.maxHr)}` : null,
    a.continuousMin!=null ? `aaneengesloten ${nl(round(a.continuousMin,1))} min` : null,
    a.vo2max!=null ? `VO₂-max ${nl(a.vo2max)}` : null,
  ].filter(Boolean);
  return { t, line: parts.join(' · ') };
}

function findEOCD(buf){
  const dv = new DataView(buf);
  const lo = Math.max(0, buf.byteLength - 65557);
  for(let i=buf.byteLength-22; i>=lo; i--){ if(dv.getUint32(i,true)===0x06054b50) return i; }

function readZipEntries(buf){

  const cdCount = dv.getUint16(eocd+10,true);
  const cdOffset = dv.getUint32(eocd+16,true);
  if(cdOffset===0xffffffff || cdCount===0xffff) throw new Error('Dit ZIP-bestand gebruikt ZIP64 en wordt niet ondersteund door de in-app lezer. Gebruik garmin_export_to_summary.py.');
  const entries = []; let p = cdOffset;
  for(let i=0;i<cdCount;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('Onverwachte ZIP-structuur (central directory kon niet worden gelezen).');
    const method = dv.getUint16(p+10,true);
    const compSize = dv.getUint32(p+20,true);
    const uncompSize = dv.getUint32(p+24,true);
    const nameLen = dv.getUint16(p+28,true);
    const extraLen = dv.getUint16(p+30,true);
    const commentLen = dv.getUint16(p+32,true);
    const localOffset = dv.getUint32(p+42,true);
    const name = new TextDecoder('utf-8').decode(new Uint8Array(buf, p+46, nameLen));
    entries.push({ name, method, compSize, uncompSize, localOffset });
    p += 46 + nameLen + extraLen + commentLen;

async function readZipEntryBytes(buf, entry){
  const dv = new DataView(buf);
  const lp = entry.localOffset;
  if(dv.getUint32(lp,true)!==0x04034b50) throw new Error(`Onverwachte lokale ZIP-header voor ${entry.name}.`);
  const nameLen = dv.getUint16(lp+26,true);
  const extraLen = dv.getUint16(lp+28,true);
  const dataStart = lp + 30 + nameLen + extraLen;
  const compBytes = new Uint8Array(buf, dataStart, entry.compSize);
  if(entry.method===0) return compBytes.slice();
  if(entry.method===8){
    if(typeof DecompressionStream !== 'function') throw new Error('Deze browser ondersteunt geen ZIP-decompressie (DecompressionStream ontbreekt). Gebruik een recente Chrome/Edge, of garmin_export_to_summary.py.');
    const stream = new Blob([compBytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error(`Niet-ondersteunde ZIP-compressiemethode (${entry.method}) voor ${entry.name}.`);

function findZipMembers(entries, ...patterns){
  const hits = []; const seen = new Set();
  for(const pat of patterns){
    const rx = new RegExp(pat, 'i');
    for(const e of entries){ if(!seen.has(e.name) && rx.test(e.name)){ hits.push(e); seen.add(e.name); } }
  }
  return hits;
}

    } catch(e){ console.warn('kon '+entry.name+' niet lezen', e); }

  for(const health of await readZipJsonAll(buf, entries, 'healthStatusData.*\\.json$')){
    if(!Array.isArray(health)) continue;
    for(const e of health){
      const metrics = {}; (e.metrics||[]).forEach(m=>{ if(m && m.type) metrics[m.type]=m; });
      const hrv = metrics.HRV || {};
      const v = gzNum(hrv.value); if(v) setd(e.calendarDate,'hrv', Math.round(v*10)/10);
      const lo = gzNum(hrv.baselineLowerLimit), hi = gzNum(hrv.baselineUpperLimit);
      if(lo>0 && hi>0){ setd(e.calendarDate,'hrvBaselineLow', Math.round(lo*10)/10); setd(e.calendarDate,'hrvBaselineHigh', Math.round(hi*10)/10); }
    }
  }
  for(const uds of await readZipJsonAll(buf, entries, 'UDSFile_.*\\.json$', 'DI-Connect-Aggregator/.*UDS.*\\.json$')){
    if(!Array.isArray(uds)) continue;
    for(const e of uds){
      setd(e.calendarDate,'restingHr', gzNum(e.restingHeartRate));
      const stats = (e.bodyBattery && e.bodyBattery.bodyBatteryStatList) || [];
      const hi = stats.find(s=>s.bodyBatteryStatType==='HIGHEST');
      if(hi && gzNum(hi.statsValue)!=null) setd(e.calendarDate,'bodyBattery', Math.round(gzNum(hi.statsValue)));
    }
  }
  for(const sleep of await readZipJsonAll(buf, entries, 'sleepData.*\\.json$')){
    if(!Array.isArray(sleep)) continue;
    for(const e of sleep){
      if(!e.calendarDate) continue;
      const secs = ['deepSleepSeconds','lightSleepSeconds','remSleepSeconds','awakeSleepSeconds'].reduce((a,k)=> a+(gzNum(e[k])||0), 0);
      if(secs>0) setd(e.calendarDate,'sleepHours', Math.round(secs/3600*100)/100);
      const score = e.sleepScores && e.sleepScores.overallScore;
      if(score!=null) setd(e.calendarDate,'sleepScore', Math.round(score));
    }
  }
  for(const vo2 of await readZipJsonAll(buf, entries, 'MetricsMaxMetData_.*\\.json$')){
    if(!Array.isArray(vo2)) continue;
    const sorted = vo2.slice().sort((a,b)=> (a.calendarDate||'').localeCompare(b.calendarDate||'') || String(a.updateTimestamp||'').localeCompare(String(b.updateTimestamp||'')));
    for(const e of sorted){

async function garminZipToSummary(buf, fileName){
  const entries = readZipEntries(buf);
  const [daily, activities] = await Promise.all([
    buildGarminDailyFromZip(buf, entries, GARMIN_ZIP_SINCE),
    buildGarminActivitiesFromZip(buf, entries, GARMIN_ZIP_SINCE),
  ]);
  if(!daily.length && !activities.length){
    throw new Error('Geen bruikbare Garmin-bestanden gevonden in deze ZIP (healthStatusData / UDSFile / sleepData / MetricsMaxMetData / summarizedActivities). Is dit de "Uw gegevens exporteren"-ZIP van Garmin Connect?');
  }
  return { schemaVersion:1, generatedAt: new Date().toISOString(),
    source: `garmin-export-zip (in-app) <- ${fileName}`, daily, activities };
}
async function loadGarminZipFile(file){
  const status = $('#garminZipStatus'); if(status) status.textContent = 'ZIP wordt gelezen…';
  try {
    const buf = await file.arrayBuffer();
    const summary = await garminZipToSummary(buf, file.name);
    if(status) status.textContent = '';
    loadGarminText(JSON.stringify(summary), file.name);
  } catch(e){
    if(status) status.textContent = '';
    alert('Kon de Garmin export-ZIP niet lezen.\n\n' + (e && e.message || e) + '\n\nEr is niets gewijzigd.');
  }
}

/* parse + valideer + normaliseer -> { ok, error, generatedAt, source, daily:[], activities:[] } */
function parseGarminSummary(text){
  let data;
  try { data = JSON.parse(text); }
  catch(e){ return { ok:false, error:'Ongeldige JSON — het bestand kon niet worden gelezen.' }; }
  if(!data || typeof data!=='object' || Array.isArray(data))
    return { ok:false, error:'Onverwachte structuur: het toplevel moet een JSON-object zijn.' };
  if(data.schemaVersion == null)
    return { ok:false, error:'`schemaVersion` ontbreekt. Dit is geen geldig garmin_summary.json.' };
  if(Number(data.schemaVersion) !== 1)
    return { ok:false, error:`schemaVersion ${data.schemaVersion} wordt niet ondersteund (verwacht 1).` };
  if(data.daily!=null && !Array.isArray(data.daily))
    return { ok:false, error:'`daily` moet een array zijn.' };
  if(data.activities!=null && !Array.isArray(data.activities))
    return { ok:false, error:'`activities` moet een array zijn.' };

  const errs = [];
  const daily = (data.daily||[]).map((row,i)=>{
    const p = `daily[${i}]`;
    if(!row || typeof row!=='object'){ errs.push(`${p}: geen object`); return null; }
    if(!isoDate(row.date)){ errs.push(`${p}.date: "${row.date}" is geen geldige datum (YYYY-MM-DD)`); return null; }
    return {
      date: row.date,
      nightHrv:        gnum(row.hrv, p+'.hrv', errs),
      restingHr:       gnum(row.restingHr, p+'.restingHr', errs),
      sleepDuration:   gnum(row.sleepHours, p+'.sleepHours', errs),
      sleepScore:      gnum(row.sleepScore, p+'.sleepScore', errs),
      bodyBattery:     gnum(row.bodyBattery, p+'.bodyBattery', errs),
      vo2max:          gnum(row.vo2max, p+'.vo2max', errs),
      weightKg:        gnum(row.weightKg, p+'.weightKg', errs),
      hrv7d:           gnum(row.hrv7d, p+'.hrv7d', errs),
      hrvBaselineLow:  gnum(row.hrvBaselineLow, p+'.hrvBaselineLow', errs),
      hrvBaselineHigh: gnum(row.hrvBaselineHigh, p+'.hrvBaselineHigh', errs),
    };
  }).filter(Boolean);

  const activities = (data.activities||[]).map((row,i)=>{
    const p = `activities[${i}]`;
    if(!row || typeof row!=='object'){ errs.push(`${p}: geen object`); return null; }
    if(row.externalId==null || String(row.externalId).trim()===''){ errs.push(`${p}.externalId: verplicht en niet leeg`); return null; }
    if(!isoDate(row.date)){ errs.push(`${p}.date: "${row.date}" is geen geldige datum`); return null; }
    // avgPace = gemiddeld bewogen tempo (m:ss/km); wordt ongewijzigd overgenomen uit de summary — niet herberekend.
    const pace = (typeof row.avgPace==='string' && /^\d{1,2}:\d{2}$/.test(row.avgPace)) ? row.avgPace : (row.avgPace==null?null:(errs.push(`${p}.avgPace: "${row.avgPace}" verwacht m:ss`),null));
    return {
      externalId: String(row.externalId),
      date: row.date,
      startTime: typeof row.startTime==='string' ? row.startTime : null,
      type: typeof row.type==='string' && row.type ? row.type : 'unknown',
      durationMin:   gnum(row.durationMin, p+'.durationMin', errs),
      movingMin:     gnum(row.movingMin, p+'.movingMin', errs),
      distanceKm:    gnum(row.distanceKm, p+'.distanceKm', errs),
      avgPace: pace,
      avgHr:         gnum(row.avgHr, p+'.avgHr', errs),
      maxHr:         gnum(row.maxHr, p+'.maxHr', errs),
      cadence:       gnum(row.cadence, p+'.cadence', errs),
      ascentM:       gnum(row.ascentM, p+'.ascentM', errs),
      descentM:      gnum(row.descentM, p+'.descentM', errs),
      vo2max:        gnum(row.vo2max, p+'.vo2max', errs),
      continuousMin: gnum(row.continuousMin, p+'.continuousMin', errs),
      rpe:           gnum(row.rpe, p+'.rpe', errs),
    };
  }).filter(Boolean);

  if(errs.length) return { ok:false, error:'Validatiefouten:\n• ' + errs.slice(0,12).join('\n• ') + (errs.length>12?`\n• … (${errs.length-12} meer)`:'') };
  return { ok:true, generatedAt: typeof data.generatedAt==='string'?data.generatedAt:null,
           source: typeof data.source==='string'?data.source:null, daily, activities };
}

/* vergelijk met bestaande state -> preview-cijfers */
function garminPreview(parsed){
  const dailyNew=[], dailyUpd=[], weightConflicts=[];
  for(const d of parsed.daily){
    (state.garmin.daily[d.date] ? dailyUpd : dailyNew).push(d.date);
    if(d.weightKg!=null){
      const manual = num(CB.dailyLogs[d.date]?.weightKg);
      if(manual!=null && Math.abs(manual - d.weightKg) > 0.001) weightConflicts.push({ date:d.date, manual, garmin:d.weightKg });
    }
  }
  const existIds = new Set(state.garmin.activities.map(a=>a.externalId));
  const actNew = parsed.activities.filter(a=> !existIds.has(a.externalId));
  const actUpd = parsed.activities.filter(a=> existIds.has(a.externalId));
  return { dailyNew, dailyUpd, actNew, actUpd, weightConflicts };
}

/* toon preview (zet ui.garminPreview en herteken de Garmin-view) */
function loadGarminText(text, fileName){
  const parsed = parseGarminSummary(text);

  ui.garminPreview = { parsed, fileName, ...garminPreview(parsed) };
  renderGarmin();
}

async function garminRefresh(){
  if(!garminFileHandle){ garminPickFile(); return; }
  try {
    if(garminFileHandle.queryPermission){
      let perm = await garminFileHandle.queryPermission({ mode:'read' });
      if(perm!=='granted' && garminFileHandle.requestPermission) perm = await garminFileHandle.requestPermission({ mode:'read' });
      if(perm!=='granted'){ alert('Geen leestoegang meer tot dat bestand. Kies het opnieuw.'); garminFileHandle=null; renderGarmin(); return; }
    }
    const f = await garminFileHandle.getFile();
    await loadGarminAnyFile(f);
  } catch(e){ alert('Kon het Garmin-bestand niet opnieuw lezen. Kies het opnieuw.'); garminFileHandle=null; renderGarmin(); }
}

/* echte import — idempotent, met snapshot + rollback */
function garminCommitImport(){
  const pv = ui.garminPreview; if(!pv) return;
  const snap = structuredClone(state);
  try {
    const now = new Date().toISOString();
    const gen = pv.parsed.generatedAt;
    for(const d of pv.parsed.daily){
      const g = state.garmin.daily[d.date] = state.garmin.daily[d.date] || {};
      for(const k of ['nightHrv','restingHr','sleepDuration','sleepScore','bodyBattery','vo2max','hrv7d','hrvBaselineLow','hrvBaselineHigh'])
        if(d[k]!=null) g[k] = d[k];
      if(d.weightKg!=null) g.weightKg = d.weightKg;   // handmatige waarde wint in de weergave (recoveryTimeline is first-wins)
      g._source = 'garmin'; g._syncedAt = now; if(gen) g._generatedAt = gen;
    }
    for(const a of pv.parsed.activities){
      const ex = state.garmin.activities.find(x=> x.externalId === a.externalId);
      const rec = { ...a, _syncedAt: now, _generatedAt: gen || null };
      if(ex) Object.assign(ex, rec); else state.garmin.activities.push(rec);
      // RPE: het cijfer van Garmin is leidend voor gekoppelde Coach-runs (alleen dit veld wordt bijgewerkt)
      if(a.rpe != null) state.currentBlock.coachRuns.forEach(r=>{ if(r.garminExternalId === a.externalId) r.rpe = a.rpe; });
    }
    state.garmin.activities.sort((x,y)=> (x.startTime||x.date).localeCompare(y.startTime||y.date));
    state.garmin.meta = { fileName: pv.fileName || null, generatedAt: gen || null, source: pv.parsed.source || null, lastImportedAt: now };
    saveState();
  } catch(e){
    state = snap; CB = state.currentBlock; saveState();
    alert('Import mislukt — de vorige toestand is exact hersteld.\n\n' + (e && e.message || e));
    ui.garminPreview = null; renderGarmin(); return;
  }
  ui.garminPreview = null;
  renderCurrent();
}

/* Garmin-activiteit -> Coach-run (idempotent op garminExternalId; handmatige velden blijven) */
function garminActivityToCoachRun(externalId){
  const a = state.garmin.activities.find(x=> x.externalId === externalId); if(!a) return;
  let r = CB.coachRuns.find(x=> x.garminExternalId === externalId);
  // Staat er op dezelfde dag al een handmatige run (zonder Garmin-koppeling), of een run waarvan de koppeling
  // naar een Garmin-activiteit op een ANDERE dag wijst (kapotte koppeling)? Dan die run koppelen i.p.v. een tweede aan te maken.
  let adopt = null;
  if(!r){
    const near = x => x.date === a.date && (a.distanceKm == null || x.distanceKm == null || Math.abs(num(x.distanceKm) - a.distanceKm) <= 0.5);
    adopt = CB.coachRuns.find(x=> !x.garminExternalId && near(x))
         || CB.coachRuns.find(x=> { if(!x.garminExternalId || !near(x)) return false;
              const la = state.garmin.activities.find(y=> y.externalId === x.garminExternalId); return la && la.date !== x.date; });
  }
  const intro = adopt
    ? `Op ${fmt(a.date,{day:'numeric',month:'long'})} staat al een Coach-run (${adopt.distanceKm!=null?nl(adopt.distanceKm)+' km':'zonder afstand'}${adopt.rpe!=null?', RPE '+adopt.rpe:''}). Die wordt aan deze Garmin-run gekoppeld en bijgewerkt — er komt GEEN tweede run bij.

`
    : `Garmin-run van ${fmt(a.date,{day:'numeric',month:'long'})} als Coach-run gebruiken?

`;
  if(!confirm(intro + `Datum, duur, afstand, gem. bewogen tempo, HR en VO₂-max worden overgenomen. RPE komt uit Garmin (leidend, overschrijft een eigen cijfer).
Pijn, opmerking, gepland/uitgevoerd en het Coach-trainingstype blijven handmatig.`)) return;
  if(adopt){ r = adopt; r.garminExternalId = externalId; }
  const g = {
    // avgPace = gemiddeld BEWOGEN tempo: door de Garmin-normalizer berekend uit
    // movingDuration ÷ afstand op volle precisie — niet uit de afgeronde weergavewaarden.
    date: a.date, done: true, totalMin: a.durationMin, distanceKm: a.distanceKm,
    avgPace: a.avgPace, avgHr: a.avgHr, maxHr: a.maxHr, vo2max: a.vo2max,
    continuousMin: a.continuousMin != null ? a.continuousMin : (r ? r.continuousMin ?? null : null),
  };
  if(r){ Object.assign(r, g); r._source = 'garmin-sync'; }
  else {
    r = { id:'c'+Date.now().toString(36), garminExternalId: externalId, planned:'', type:'',
          rpe:null, pain:null, note:'', plannedContent:'', doneContent:'', _source:'garmin', ...g };
    CB.coachRuns.push(r);
  }
  // RPE: Garmin is leidend (overschrijft een handmatig cijfer); zonder Garmin-RPE blijft jouw invoer staan
  if(a.rpe != null) r.rpe = a.rpe;
  CB.coachRuns.sort((x,y)=> x.date.localeCompare(y.date));
  const l = ensureLog(a.date); l.checks = l.checks || {}; l.checks.mainTraining = true;
  saveState(); renderCurrent();
}

/* Garmin-activiteit -> Week 0 conditievelden (expliciete bevestiging; RPE blijft handmatig) */
function garminActivityToWeek0(externalId){
  const a = state.garmin.activities.find(x=> x.externalId === externalId); if(!a) return;
  if(!confirm(`Deze Garmin-run (${fmt(a.date,{day:'numeric',month:'long'})}) als Week 0-conditiemeting gebruiken?\n\nGevuld worden: datum, VO₂-max, loopafstand, gem. bewogen tempo, gem. HR${a.continuousMin!=null?', aaneengesloten looptijd':''}.\nRPE vul je handmatig. Kracht-, balans- en mobiliteitsmetingen en de bevroren herstel-baseline blijven ongewijzigd.`)) return;
  const M = CB.measurements.baseline;
  M.date = a.date;
  if(a.vo2max != null) M.vo2max = a.vo2max;
  if(a.distanceKm != null) M.runDistanceKm = a.distanceKm;
  if(a.avgPace) M.runPace = a.avgPace;
  if(a.avgHr != null) M.runAvgHr = a.avgHr;
  if(a.continuousMin != null) M.runContinuousMin = a.continuousMin;   // niet afleiden uit totale duur
  M._runSource = 'garmin'; M._runExternalId = externalId;
  saveState(); renderCurrent();
  alert('Week 0-conditievelden ingevuld vanuit de Garmin-run. Vul RPE nog handmatig in op het Metingen-scherm.');
}

const RENDERERS = { today:renderToday, week:renderWeek, measure:renderMeasure, progress:renderProgress, strength:renderStrength, exercises:renderExercises, garmin:renderGarmin, method:renderMethod, data:renderData };
const TITLES = { today:'Vandaag', week:'Deze week', measure:'Metingen', progress:'Progressie', strength:'Krachtlog', exercises:'Oefeningen', garmin:'Garmin', method:'Methode', data:'Data & backup' };
function renderCurrent(){ CB = state.currentBlock; (RENDERERS[ui.view]||renderToday)(); $('#pageTitle').textContent = TITLES[ui.view]||'Vandaag'; if(ui.view==='data' && typeof bkRender==='function') bkRender(); }
function showView(v){
  if(ui.view==='garmin' && v!=='garmin') ui.garminPreview = null;   // laat geen stale preview achter
  ui.moveOn = null;
  ui.view = v;
  document.querySelectorAll('.view').forEach(el=> el.classList.toggle('active', el.id==='view-'+v));
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===v));
  document.querySelectorAll('.mobile-tabs button[data-view]').forEach(b=> b.classList.toggle('active', b.dataset.view===v));

  renderCurrent(); window.scrollTo({top:0});
}

document.addEventListener('change', e=>{
  const el = e.target;
  if(el.dataset.bind){
    // als de focus intussen naar een ander gebonden veld is verplaatst: flush eerst
    // diens lopende (gedebouncede) invoer, zodat de herrender geen verse toets kwijtraakt
    const ae = document.activeElement;
    if(ae && ae!==el && ae.dataset && ae.dataset.bind){ clearTimeout(window._it); setByPath(ae.dataset.bind, ae.value, true); }
    // altijd stil opslaan; de volledige herrender (die het DOM vervangt) gebeurt pas via
    // 'focusout' hieronder, en dan alleen als je ECHT naar een niet-veld gaat. Anders kan een
    // herrender midden in het overstappen naar het VOLGENDE veld dat veld onder je vingers
    // vandaan halen — precies het probleem dat keuzelijsten had bij het overstappen ernaartoe.
    setByPath(el.dataset.bind, el.value, true);
    window._bindPending = true;
    return;
  }
  if(el.hasAttribute('data-routine-check')){
    const l = ensureLog(ui.date); l.checks = l.checks || {};
    l.routineDone = el.checked ? (l.routineDone==='deels' ? 'deels' : 'ja') : 'nee';
    l.checks.routine = el.checked;   // compat voor oude uitleeslogica
    saveState(); renderToday(); return;
  }
  if(el.hasAttribute('data-routine-deels')){
    const l = ensureLog(ui.date);
    l.routineDone = el.checked ? 'deels' : 'ja';
    (l.checks = l.checks || {}).routine = true;
    saveState(); renderToday(); return;
  }
  if(el.dataset.check){
    const l = CB.dailyLogs[ui.date] = CB.dailyLogs[ui.date] || {};
    l.checks = l.checks || {}; l.checks[el.dataset.check] = el.checked;
    saveState(); renderToday(); return;
  }
  if(el.id==='importJson' && el.files[0]) importJsonFile(el.files[0]);
  if(el.id==='garminJsonInput' && el.files[0]){
    const f = el.files[0];
    if(isZipFile(f)){ loadGarminZipFile(f); }
    else { const rd = new FileReader(); rd.onload = () => loadGarminText(rd.result, f.name); rd.readAsText(f); }
    el.value = '';
  }
});

document.addEventListener('toggle', e=>{

document.addEventListener('focusout', e=>{
  if(!e.target.dataset || !e.target.dataset.bind || !window._bindPending) return;
  // relatedTarget = het element dat NU de focus krijgt. Is dat ook een gebonden veld (bv. je klikt
  // van een tekstveld naar een keuzelijst, of bladert met Tab), dan wachten we nog even: pas
  // herrenderen zodra de focus het hele formulier echt verlaat, anders vervangt de herrender het
  // veld terwijl je er middenin klikt/kiest.
  const nxt = e.relatedTarget;
  if(nxt && nxt.dataset && nxt.dataset.bind) return;
  window._bindPending = false;
  clearTimeout(window._rr); window._rr = setTimeout(renderCurrent, 120);
});

document.addEventListener('input', e=>{
  const el = e.target;
  if(!el.dataset.bind) return;
  if(el.tagName==='TEXTAREA' || (el.tagName==='INPUT' && (el.type==='number'||el.type==='text'||el.type==='date'))){
    // schrijf stil weg tijdens typen; volledige herrender pas bij 'change' (blur) — voorkomt focusverlies
    clearTimeout(window._it); window._it = setTimeout(()=> setByPath(el.dataset.bind, el.value, true), 250);
  }
});

document.addEventListener('keydown', e=>{

});

/* zwevende grafiek-tooltip: toont datum + waarde bij mouse-over op een meetpunt */
(function chartTooltip(){
  let tip;
  const ensure = ()=> tip || (tip = document.body.appendChild(Object.assign(document.createElement('div'),{id:'chartTip'})));
  const place = (x,y)=>{
    const t = ensure(); const m = 14;
    let left = x + m, top = y + m;
    const r = t.getBoundingClientRect();
    if(left + r.width + 4 > window.innerWidth) left = x - r.width - m;
    if(top + r.height + 4 > window.innerHeight) top = y - r.height - m;
    t.style.left = Math.max(4,left) + 'px';
    t.style.top = Math.max(4,top) + 'px';
  };
  const hide = ()=>{ if(tip){ tip.classList.remove('show'); } document.querySelectorAll('svg .pt.on').forEach(g=>g.classList.remove('on')); };
  document.addEventListener('pointermove', e=>{
    const g = e.target.closest && e.target.closest('svg .pt');
    if(!g || !g.dataset.tip){ hide(); return; }
    const t = ensure();
    if(t.textContent !== g.dataset.tip) t.textContent = g.dataset.tip;
    document.querySelectorAll('svg .pt.on').forEach(x=>{ if(x!==g) x.classList.remove('on'); });
    g.classList.add('on');
    t.classList.add('show');
    place(e.clientX, e.clientY);
  }, true);
  document.addEventListener('pointerdown', e=>{ if(!(e.target.closest && e.target.closest('svg .pt'))) hide(); });
  window.addEventListener('scroll', hide, true);
})();

/* ===========================================================================
   CLOUD-SYNCHRONISATIE (Firebase: Authentication + Realtime Database) — optioneel; zonder inloggen werkt de app puur lokaal.
   Per gebruiker één plek: trainingsplan/<uid>/current  (state + hist als JSON-tekst, updated_at, device)
   plus trainingsplan/<uid>/versies/<tijdstempel> als vangnet. De regels laten alleen jouw eigen uid toe.
   Regels: nooit stilzwijgend overschrijven. Alleen lokaal gewijzigd -> upload; alleen cloud gewijzigd -> download;
   beide gewijzigd -> jij kiest (de verliezende versie wordt eerst bewaard).
   =========================================================================== */
var FB_API_KEY = 'AIzaSyDRYO6G4AUSJV_4WAlac4w9aGKfn7520RE';                          // Web API key van je Firebase-project (bedoeld om openbaar te zijn; de regels beschermen de data)
var FB_DB = 'https://trainingsplan-fa5b5-default-rtdb.europe-west1.firebasedatabase.app';  // Realtime Database URL
var FB_AUTH_BASE = 'https://identitytoolkit.googleapis.com';
var FB_TOKEN_BASE = 'https://securetoken.googleapis.com';
var SYNC_LS = 'trainingsplan-rens-sync';
var SYNC = { busy:false, msg:'', timer:null, conflict:null };
function fbConfigured(){ return !/VUL_IN/.test(FB_API_KEY) && !/VUL_IN/.test(FB_DB); }
function syncLoad(){ try{ return JSON.parse(localStorage.getItem(SYNC_LS)||'{}'); }catch(e){ return {}; } }
function syncSave(o){ try{ localStorage.setItem(SYNC_LS, JSON.stringify(o)); }catch(e){} }
function syncDevice(){ return /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'telefoon' : 'computer'; }
function fbErrText(j, fallback){
  const m = (j && j.error && (j.error.message || j.error)) || '';
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(m)) return 'E-mail of wachtwoord klopt niet';
  if(/TOO_MANY_ATTEMPTS/.test(m)) return 'Te vaak geprobeerd, wacht even en probeer opnieuw';
  return (typeof m==='string' && m) ? m : fallback;
}
function fbStoreAuth(access, refresh, expiresIn, uid, email){
  const s = syncLoad();
  s.auth = { access, refresh, exp:Date.now()+ (Number(expiresIn)||3600)*1000, uid: uid||(s.auth&&s.auth.uid), email: email||(s.auth&&s.auth.email) };
  syncSave(s); return s.auth;
}
async function fbLogin(email, password){
  const r = await fetch(FB_AUTH_BASE+'/v1/accounts:signInWithPassword?key='+encodeURIComponent(FB_API_KEY), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email, password, returnSecureToken:true }) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(fbErrText(j, 'Inloggen mislukt'));
  return fbStoreAuth(j.idToken, j.refreshToken, j.expiresIn, j.localId, j.email);
}
async function fbRefresh(){
  const s = syncLoad(); if(!s.auth) throw new Error('Niet ingelogd');
  const r = await fetch(FB_TOKEN_BASE+'/v1/token?key='+encodeURIComponent(FB_API_KEY), { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.auth.refresh) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('Sessie verlopen, log opnieuw in');
  return fbStoreAuth(j.id_token, j.refresh_token, j.expires_in, j.user_id);
}
async function fbToken(){
  const s = syncLoad(); if(!s.auth) throw new Error('Niet ingelogd');
  if(s.auth.exp - Date.now() > 60000) return s.auth;
  return fbRefresh();
}
async function fbDb(path, method, body, extra){
  let a = await fbToken(), r;
  for(let pass=0; pass<2; pass++){
    r = await fetch(FB_DB+'/'+path+'.json?auth='+encodeURIComponent(a.access)+(extra||''), {
      method: method||'GET',
      headers: body!=null ? {'Content-Type':'application/json'} : {},
      body: body!=null ? JSON.stringify(body) : undefined });
    if(r.status===401 && pass===0){ a = await fbRefresh(); continue; }
    break;
  }
  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok) throw new Error(fbErrText(j, 'Serverfout '+r.status));
  return j;
}
function syncHistPart(){ const H = HISTORICAL; return (H.logs && Object.keys(H.logs).length) ? { profile:H.profile, logs:H.logs, tests:H.tests, activities:H.activities, baselineSummary:H.baselineSummary } : null; }
function syncTime(){ return new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}); }
function syncSetMsg(m){ SYNC.msg = m; const el = $('#syncStatus'); if(el) el.textContent = m; const ss = $('#saveState'); if(ss && m) ss.textContent = m; }
function syncMarkers(cloudAt, localAt){ const s = syncLoad(); s.lastCloudAt = cloudAt; s.lastLocalAt = localAt; syncSave(s); }
async function fbGetCurrent(uid){
  const raw = await fbDb('trainingsplan/'+uid+'/current');
  if(!raw || !raw.state) return null;
  return { state:JSON.parse(raw.state), hist: raw.hist ? JSON.parse(raw.hist) : null, updated_at:raw.updated_at, device:raw.device };
}
async function syncPrune(uid){
  const keys = await fbDb('trainingsplan/'+uid+'/versies', 'GET', null, '&shallow=true');
  if(!keys) return;
  const ks = Object.keys(keys).sort();
  for(const k of ks.slice(0, Math.max(0, ks.length-20))) await fbDb('trainingsplan/'+uid+'/versies/'+k, 'DELETE');
}
async function syncPush(cloudRow, isConflict){
  const s = syncLoad(), uid = s.auth.uid, now = new Date().toISOString();
  // vorige cloudversie bewaren (max. 1x per 6 uur, en altijd bij een conflict); de laatste 20 blijven staan
  if(cloudRow && (isConflict || !s.lastVersionAt || Date.now()-Date.parse(s.lastVersionAt) > 6*3600*1000)){
    await fbDb('trainingsplan/'+uid+'/versies/'+Date.now(), 'PUT', { state:JSON.stringify(cloudRow.state), saved_at:now, device:cloudRow.device||null });
    const s2 = syncLoad(); s2.lastVersionAt = now; syncSave(s2);
    await syncPrune(uid);
  }
  // alleen schrijven als de cloud sinds ons lezen niet veranderd is (klein vangnet tegen gelijktijdige wijzigingen)
  if(cloudRow){
    const cur = await fbDb('trainingsplan/'+uid+'/current/updated_at');
    if(cur !== cloudRow.updated_at) throw new Error('RETRY');
  }
  const body = { state:JSON.stringify(state), updated_at:now, device:syncDevice() };
  const hist = syncHistPart(); if(hist && (!cloudRow || !cloudRow.hist)) body.hist = JSON.stringify(hist);
  await fbDb('trainingsplan/'+uid+'/current', 'PATCH', body);
  syncMarkers(now, state.meta.updatedAt);
  syncSetMsg('☁ Gesynchroniseerd '+syncTime());
}
function syncApplyCloud(row){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(row.state));
  if(row.hist) localStorage.setItem('trainingsplan-rens-hist', JSON.stringify(row.hist));
  syncMarkers(row.updated_at, (row.state.meta||{}).updatedAt);
  location.reload();
}
async function syncNow(retry){
  retry = retry || 0;
  if(!fbConfigured() || SYNC.busy) return;
  const s0 = syncLoad(); if(!s0.auth) return;
  SYNC.busy = true; syncSetMsg('☁ Synchroniseren…');
  try{
    const row = await fbGetCurrent(s0.auth.uid), s = syncLoad();
    if(!row){ await syncPush(null,false); return; }
    const localChanged = state.meta.updatedAt !== s.lastLocalAt;
    const cloudChanged = row.updated_at !== s.lastCloudAt;
    if(WAS_PRISTINE && !s.lastCloudAt){ syncApplyCloud(row); return; }          // nieuw apparaat: gewoon downloaden
    if(!localChanged && !cloudChanged){ syncSetMsg('☁ Gesynchroniseerd '+syncTime()); return; }
    if(!localChanged && cloudChanged){ syncApplyCloud(row); return; }
    if(localChanged && !cloudChanged){ await syncPush(row,false); return; }
    SYNC.conflict = row; syncShowConflict(row);                                    // beide gewijzigd: gebruiker kiest
    syncSetMsg('☁ Kies welke versie je wilt houden');
  }catch(e){
    if(e.message==='RETRY' && retry<2){ SYNC.busy=false; return syncNow(retry+1); }
    syncSetMsg('☁ Sync mislukt: '+e.message);
  }finally{ SYNC.busy = false; }
}
function syncSoon(){
  if(!fbConfigured() || SYNC.conflict) return; const s = syncLoad(); if(!s.auth) return;
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(()=>syncNow(), 4000);
}
function syncShowConflict(row){
  if($('#syncConflict')) return;
  const when = new Date(row.updated_at).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const d = document.createElement('div'); d.id='syncConflict';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = `<div class="card" style="max-width:440px;background:var(--card)"><h3>Twee verschillende versies</h3>
    <p class="small">Er is op dit apparaat én in de cloud iets gewijzigd (cloud: ${esc(when)}, ${esc(row.device||'onbekend apparaat')}). Kies welke je wilt houden. De andere versie wordt bewaard, dus niets gaat verloren.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn primary" data-sync="use-cloud">Cloud-versie gebruiken (deze wijzigingen worden eerst als bestand gedownload)</button>
      <button class="btn" data-sync="use-local">Deze versie gebruiken (de cloud-versie wordt bewaard)</button>
      <button class="btn sm" data-sync="later">Later beslissen</button></div></div>`;
  document.body.appendChild(d);
}
async function syncResolve(choice){
  const row = SYNC.conflict; const el = $('#syncConflict');
  if(choice==='later'){ if(el) el.remove(); SYNC.conflict = null; return; }
  if(!row) return;
  try{
    if(choice==='use-cloud'){
      dl(new Blob([JSON.stringify({ ...state, historicalData:HISTORICAL },null,2)],{type:'application/json'}), 'trainingsplan_lokaal_voor_sync_'+todayISO()+'.json');
      syncApplyCloud(row);
    } else {
      SYNC.busy = true; await syncPush(row,true); SYNC.busy = false; SYNC.conflict = null; if(el) el.remove();
    }
  }catch(e){ SYNC.busy = false; syncSetMsg('☁ Sync mislukt: '+e.message); }
}
async function syncLogin(){
  const email = ($('#syncEmail')||{}).value, pw = ($('#syncPw')||{}).value;
  if(!email || !pw){ syncSetMsg('Vul e-mail en wachtwoord in.'); return; }
  try{ await fbLogin(email, pw); syncSetMsg('☁ Ingelogd'); renderData(); syncNow(); }
  catch(e){ syncSetMsg('Inloggen mislukt: '+e.message); }
}
function syncLogout(){ const s = syncLoad(); delete s.auth; syncSave(s); syncSetMsg(''); renderData(); }
function syncCardHTML(){
  if(!fbConfigured()) return `<div class="card"><h3>Synchronisatie</h3><p class="small muted">Nog niet ingesteld op dit apparaat.</p></div>`;
  const s = syncLoad();
  if(!s.auth) return `<div class="card"><h3>Synchronisatie</h3>
    <p class="small">Log in om je data te delen tussen telefoon en computer.</p>
    <div class="field"><label>E-mail</label><input type="email" id="syncEmail" autocomplete="username"></div>
    <div class="field"><label>Wachtwoord</label><input type="password" id="syncPw" autocomplete="current-password"></div>
    <button class="btn primary" data-sync="login">Inloggen</button>
    <p class="tny muted" id="syncStatus" style="margin-top:6px">${esc(SYNC.msg)}</p></div>`;
  return `<div class="card"><h3>Synchronisatie</h3>
    <p class="small">Ingelogd als <b>${esc(s.auth.email||'')}</b>. Wijzigingen worden automatisch gedeeld.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" data-sync="now">Nu synchroniseren</button><button class="btn sm" data-sync="logout">Uitloggen</button></div>
    <p class="tny muted" id="syncStatus" style="margin-top:6px">${esc(SYNC.msg)}</p></div>`;
}
document.addEventListener('click', e=>{
  const b = e.target.closest && e.target.closest('[data-sync]'); if(!b) return;
  const a = b.dataset.sync;
  if(a==='login') syncLogin(); else if(a==='logout') syncLogout(); else if(a==='now') syncNow();
