    const h = await window.showDirectoryPicker({ id:'trainingsplan-backup', mode:'readwrite', startIn:'documents' });
    await bkSetHandle(h); await bkWrite(h); bkRender(); return true;
  }catch(e){ if(e && e.name!=='AbortError') alert('Map koppelen mislukt: ' + e.message); return false; }

function findEOCD(buf){
  const dv = new DataView(buf);
  const lo = Math.max(0, buf.byteLength - 65557);
  for(let i=buf.byteLength-22; i>=lo; i--){ if(dv.getUint32(i,true)===0x06054b50) return i; }
  return -1;

function readZipEntries(buf){
  const dv = new DataView(buf);
  const eocd = findEOCD(buf);
  if(eocd<0) throw new Error('Geen geldig ZIP-bestand gevonden (EOCD-record ontbreekt).');
  const cdCount = dv.getUint16(eocd+10,true);
  const cdOffset = dv.getUint32(eocd+16,true);
  if(cdOffset===0xffffffff || cdCount===0xffff) throw new Error('Dit ZIP-bestand gebruikt ZIP64 en wordt niet ondersteund door de in-app lezer. Gebruik garmin_export_to_summary.py.');
  const entries = []; let p = cdOffset;
  for(let i=0;i<cdCount;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('Onverwachte ZIP-structuur (central directory kon niet worden gelezen).');
    const method = dv.getUint16(p+10,true);
    const compSize = dv.getUint32(p+20,true);
    const uncompSize = dv.getUint32(p+24,true);
    const nameLen = dv.getUint16(p+28,true);
    const extraLen = dv.getUint16(p+30,true);
    const commentLen = dv.getUint16(p+32,true);
    const localOffset = dv.getUint32(p+42,true);
    const name = new TextDecoder('utf-8').decode(new Uint8Array(buf, p+46, nameLen));
    entries.push({ name, method, compSize, uncompSize, localOffset });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}
async function readZipEntryBytes(buf, entry){
  const dv = new DataView(buf);
  const lp = entry.localOffset;
  if(dv.getUint32(lp,true)!==0x04034b50) throw new Error(`Onverwachte lokale ZIP-header voor ${entry.name}.`);
  const nameLen = dv.getUint16(lp+26,true);
  const extraLen = dv.getUint16(lp+28,true);
  const dataStart = lp + 30 + nameLen + extraLen;
  const compBytes = new Uint8Array(buf, dataStart, entry.compSize);
  if(entry.method===0) return compBytes.slice();
  if(entry.method===8){
    if(typeof DecompressionStream !== 'function') throw new Error('Deze browser ondersteunt geen ZIP-decompressie (DecompressionStream ontbreekt). Gebruik een recente Chrome/Edge, of garmin_export_to_summary.py.');
    const stream = new Blob([compBytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error(`Niet-ondersteunde ZIP-compressiemethode (${entry.method}) voor ${entry.name}.`);
}

  }
  return hits;
}
async function readZipJsonAll(buf, entries, ...patterns){
  const out = [];
  for(const entry of findZipMembers(entries, ...patterns)){
    try {
      const bytes = await readZipEntryBytes(buf, entry);
      out.push(JSON.parse(new TextDecoder('utf-8').decode(bytes)));
    } catch(e){ console.warn('kon '+entry.name+' niet lezen', e); }
  }
  return out;
}
function gzNum(v){ const n = Number(v); return Number.isFinite(n) ? n : null; }
function gzPaceStr(secPerKm){
  if(secPerKm==null || secPerKm<=0) return null;
  const total = Math.round(secPerKm); const m = Math.floor(total/60), s = total%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
/* Garmin *Local-timestamps zijn ms die de lokale wandklok voorstellen; als UTC lezen
   behoudt diezelfde lokale datum/tijd (zelfde aanpak als het Python-script). */
function gzLocalDate(ms){ return new Date(ms); }
async function buildGarminDailyFromZip(buf, entries, since){
  const daily = {};
  const setd = (date,key,value)=>{ if(value==null||!date) return; (daily[date] = daily[date]||{date})[key]=value; };

  for(const health of await readZipJsonAll(buf, entries, 'healthStatusData.*\\.json$')){
    if(!Array.isArray(health)) continue;
    for(const e of health){
      const metrics = {}; (e.metrics||[]).forEach(m=>{ if(m && m.type) metrics[m.type]=m; });
      const hrv = metrics.HRV || {};
      const v = gzNum(hrv.value); if(v) setd(e.calendarDate,'hrv', Math.round(v*10)/10);
      const lo = gzNum(hrv.baselineLowerLimit), hi = gzNum(hrv.baselineUpperLimit);
      if(lo>0 && hi>0){ setd(e.calendarDate,'hrvBaselineLow', Math.round(lo*10)/10); setd(e.calendarDate,'hrvBaselineHigh', Math.round(hi*10)/10); }
    }
  }
  for(const uds of await readZipJsonAll(buf, entries, 'UDSFile_.*\\.json$', 'DI-Connect-Aggregator/.*UDS.*\\.json$')){
    if(!Array.isArray(uds)) continue;
    for(const e of uds){
      setd(e.calendarDate,'restingHr', gzNum(e.restingHeartRate));
      const stats = (e.bodyBattery && e.bodyBattery.bodyBatteryStatList) || [];
      const hi = stats.find(s=>s.bodyBatteryStatType==='HIGHEST');
      if(hi && gzNum(hi.statsValue)!=null) setd(e.calendarDate,'bodyBattery', Math.round(gzNum(hi.statsValue)));
    }
  }
  for(const sleep of await readZipJsonAll(buf, entries, 'sleepData.*\\.json$')){
    if(!Array.isArray(sleep)) continue;
    for(const e of sleep){
      if(!e.calendarDate) continue;
      const secs = ['deepSleepSeconds','lightSleepSeconds','remSleepSeconds','awakeSleepSeconds'].reduce((a,k)=> a+(gzNum(e[k])||0), 0);
      if(secs>0) setd(e.calendarDate,'sleepHours', Math.round(secs/3600*100)/100);
      const score = e.sleepScores && e.sleepScores.overallScore;
      if(score!=null) setd(e.calendarDate,'sleepScore', Math.round(score));
    }
  }
  for(const vo2 of await readZipJsonAll(buf, entries, 'MetricsMaxMetData_.*\\.json$')){
    if(!Array.isArray(vo2)) continue;
    const sorted = vo2.slice().sort((a,b)=> (a.calendarDate||'').localeCompare(b.calendarDate||'') || String(a.updateTimestamp||'').localeCompare(String(b.updateTimestamp||'')));
    for(const e of sorted){
      if(e.sport==='RUNNING'){ const val=gzNum(e.vo2MaxValue); if(val) setd(e.calendarDate,'vo2max', Math.round(val)); }
    }
  }
  return Object.keys(daily).sort().filter(d=> d>=since).map(d=>daily[d]);
}
async function buildGarminActivitiesFromZip(buf, entries, since){
  let acts = [];
  for(const raw of await readZipJsonAll(buf, entries, 'summarizedActivities.*\\.json$')){
    if(Array.isArray(raw) && raw.length && raw[0] && raw[0].summarizedActivitiesExport) acts = acts.concat(raw[0].summarizedActivitiesExport);
    else if(Array.isArray(raw)) acts = acts.concat(raw);
  }
  const out = [];
  for(const x of acts){
    const aid = x.activityId; const st = x.startTimeLocal || x.beginTimestamp;
    if(!aid || !st) continue;
    const started = gzLocalDate(st);
    const iso = started.toISOString();
    const date = iso.slice(0,10);
    if(date < since) continue;
    const durMs = gzNum(x.duration) || gzNum(x.elapsedDuration) || 0;
    const movMs = gzNum(x.movingDuration) || 0;
    const distCm = gzNum(x.distance) || 0;
    const distKm = distCm ? distCm/100000 : null;
    // avgPace = gemiddeld BEWOGEN tempo: afstand ÷ beweegtijd (movingDuration), op volle
    // precisie uit de ruwe cm/ms — niet uit afgeronde min/km. Garmin's summarized export
    // levert geen aparte "moving pace"; dit is de canonieke waarde. Zonder movingDuration
    // valt het terug op totale duur (beste beschikbare).
    let movingPace = null;
    if(distKm && distKm>0){ const t=(movMs||durMs)/1000; if(t>0) movingPace = gzPaceStr(t/distKm); }
    const cad = gzNum(x.avgDoubleCadence) ?? gzNum(x.avgRunCadence);
    const gain = gzNum(x.elevationGain), loss = gzNum(x.elevationLoss);
    const vo2 = gzNum(x.vO2MaxValue);
    out.push({
      externalId: `garmin-${aid}`, date, startTime: iso.slice(0,19),
      type: x.activityType || 'unknown',
      durationMin: durMs ? Math.round(durMs/60000*10)/10 : null,
      movingMin: movMs ? Math.round(movMs/60000*10)/10 : null,
      distanceKm: distKm ? Math.round(distKm*100)/100 : null,
      avgPace: movingPace,   // = gemiddeld bewogen tempo (moving pace)
      avgHr: gzNum(x.avgHr)!=null ? Math.round(gzNum(x.avgHr)) : null,
      maxHr: gzNum(x.maxHr)!=null ? Math.round(gzNum(x.maxHr)) : null,
      cadence: cad!=null ? Math.round(cad) : null,
      ascentM: gain ? Math.round(gain/100) : null,
      descentM: loss ? Math.round(loss/100) : null,
      vo2max: vo2 ? Math.round(vo2) : null,
      // door jou op het horloge gegeven inspanningscijfer: Garmin bewaart workoutRpe als 10..100 in stappen van 10 → 1..10
      rpe: (gzNum(x.workoutRpe)>0) ? Math.min(10, Math.max(1, Math.round(gzNum(x.workoutRpe)/10))) : null,
      continuousMin: null,   // niet betrouwbaar afgeleid — zie GARMIN_JSON_SPEC.md §4
    });
  }
  out.sort((a,b)=> a.startTime.localeCompare(b.startTime));
  return out;
}
async function garminZipToSummary(buf, fileName){
  const entries = readZipEntries(buf);
  const [daily, activities] = await Promise.all([
    buildGarminDailyFromZip(buf, entries, GARMIN_ZIP_SINCE),
    buildGarminActivitiesFromZip(buf, entries, GARMIN_ZIP_SINCE),
  ]);
  if(!daily.length && !activities.length){
    throw new Error('Geen bruikbare Garmin-bestanden gevonden in deze ZIP (healthStatusData / UDSFile / sleepData / MetricsMaxMetData / summarizedActivities). Is dit de "Uw gegevens exporteren"-ZIP van Garmin Connect?');
  }
  return { schemaVersion:1, generatedAt: new Date().toISOString(),
    source: `garmin-export-zip (in-app) <- ${fileName}`, daily, activities };
}
async function loadGarminZipFile(file){
  const status = $('#garminZipStatus'); if(status) status.textContent = 'ZIP wordt gelezen…';
  try {
    const buf = await file.arrayBuffer();
    const summary = await garminZipToSummary(buf, file.name);
    if(status) status.textContent = '';
    loadGarminText(JSON.stringify(summary), file.name);
  } catch(e){
    if(status) status.textContent = '';
    alert('Kon de Garmin export-ZIP niet lezen.\n\n' + (e && e.message || e) + '\n\nEr is niets gewijzigd.');
  }
}

/* parse + valideer + normaliseer -> { ok, error, generatedAt, source, daily:[], activities:[] } */
function parseGarminSummary(text){
  let data;
  try { data = JSON.parse(text); }
  catch(e){ return { ok:false, error:'Ongeldige JSON — het bestand kon niet worden gelezen.' }; }
  if(!data || typeof data!=='object' || Array.isArray(data))
    return { ok:false, error:'Onverwachte structuur: het toplevel moet een JSON-object zijn.' };
  if(data.schemaVersion == null)
    return { ok:false, error:'`schemaVersion` ontbreekt. Dit is geen geldig garmin_summary.json.' };
  if(Number(data.schemaVersion) !== 1)
    return { ok:false, error:`schemaVersion ${data.schemaVersion} wordt niet ondersteund (verwacht 1).` };
  if(data.daily!=null && !Array.isArray(data.daily))
    return { ok:false, error:'`daily` moet een array zijn.' };
  if(data.activities!=null && !Array.isArray(data.activities))
    return { ok:false, error:'`activities` moet een array zijn.' };

  const errs = [];
  const daily = (data.daily||[]).map((row,i)=>{
    const p = `daily[${i}]`;
    if(!row || typeof row!=='object'){ errs.push(`${p}: geen object`); return null; }
    if(!isoDate(row.date)){ errs.push(`${p}.date: "${row.date}" is geen geldige datum (YYYY-MM-DD)`); return null; }
    return {
      date: row.date,
      nightHrv:        gnum(row.hrv, p+'.hrv', errs),
      restingHr:       gnum(row.restingHr, p+'.restingHr', errs),
      sleepDuration:   gnum(row.sleepHours, p+'.sleepHours', errs),
      sleepScore:      gnum(row.sleepScore, p+'.sleepScore', errs),
      bodyBattery:     gnum(row.bodyBattery, p+'.bodyBattery', errs),
      vo2max:          gnum(row.vo2max, p+'.vo2max', errs),
      weightKg:        gnum(row.weightKg, p+'.weightKg', errs),
      hrv7d:           gnum(row.hrv7d, p+'.hrv7d', errs),
      hrvBaselineLow:  gnum(row.hrvBaselineLow, p+'.hrvBaselineLow', errs),
      hrvBaselineHigh: gnum(row.hrvBaselineHigh, p+'.hrvBaselineHigh', errs),
    };
  }).filter(Boolean);

  const activities = (data.activities||[]).map((row,i)=>{
    const p = `activities[${i}]`;
    if(!row || typeof row!=='object'){ errs.push(`${p}: geen object`); return null; }
    if(row.externalId==null || String(row.externalId).trim()===''){ errs.push(`${p}.externalId: verplicht en niet leeg`); return null; }
    if(!isoDate(row.date)){ errs.push(`${p}.date: "${row.date}" is geen geldige datum`); return null; }
    // avgPace = gemiddeld bewogen tempo (m:ss/km); wordt ongewijzigd overgenomen uit de summary — niet herberekend.
    const pace = (typeof row.avgPace==='string' && /^\d{1,2}:\d{2}$/.test(row.avgPace)) ? row.avgPace : (row.avgPace==null?null:(errs.push(`${p}.avgPace: "${row.avgPace}" verwacht m:ss`),null));
    return {
      externalId: String(row.externalId),
      date: row.date,
      startTime: typeof row.startTime==='string' ? row.startTime : null,
      type: typeof row.type==='string' && row.type ? row.type : 'unknown',
      durationMin:   gnum(row.durationMin, p+'.durationMin', errs),
      movingMin:     gnum(row.movingMin, p+'.movingMin', errs),
      distanceKm:    gnum(row.distanceKm, p+'.distanceKm', errs),
      avgPace: pace,
      avgHr:         gnum(row.avgHr, p+'.avgHr', errs),
      maxHr:         gnum(row.maxHr, p+'.maxHr', errs),
      cadence:       gnum(row.cadence, p+'.cadence', errs),
      ascentM:       gnum(row.ascentM, p+'.ascentM', errs),
      descentM:      gnum(row.descentM, p+'.descentM', errs),
      vo2max:        gnum(row.vo2max, p+'.vo2max', errs),
      continuousMin: gnum(row.continuousMin, p+'.continuousMin', errs),
      rpe:           gnum(row.rpe, p+'.rpe', errs),
    };
  }).filter(Boolean);

  if(errs.length) return { ok:false, error:'Validatiefouten:\n• ' + errs.slice(0,12).join('\n• ') + (errs.length>12?`\n• … (${errs.length-12} meer)`:'') };
  return { ok:true, generatedAt: typeof data.generatedAt==='string'?data.generatedAt:null,
           source: typeof data.source==='string'?data.source:null, daily, activities };
}

/* vergelijk met bestaande state -> preview-cijfers */
function garminPreview(parsed){
  const dailyNew=[], dailyUpd=[], weightConflicts=[];
  for(const d of parsed.daily){
    (state.garmin.daily[d.date] ? dailyUpd : dailyNew).push(d.date);
    if(d.weightKg!=null){
      const manual = num(CB.dailyLogs[d.date]?.weightKg);
      if(manual!=null && Math.abs(manual - d.weightKg) > 0.001) weightConflicts.push({ date:d.date, manual, garmin:d.weightKg });
    }
  }
  const existIds = new Set(state.garmin.activities.map(a=>a.externalId));
  const actNew = parsed.activities.filter(a=> !existIds.has(a.externalId));
  const actUpd = parsed.activities.filter(a=> existIds.has(a.externalId));
  return { dailyNew, dailyUpd, actNew, actUpd, weightConflicts };
}

/* echte import — idempotent, met snapshot + rollback */
function garminCommitImport(){
  const pv = ui.garminPreview; if(!pv) return;
  const snap = structuredClone(state);
  let autoMsg = '';
  try {
    const now = new Date().toISOString();
    const gen = pv.parsed.generatedAt;
    for(const d of pv.parsed.daily){
      const g = state.garmin.daily[d.date] = state.garmin.daily[d.date] || {};
      for(const k of ['nightHrv','restingHr','sleepDuration','sleepScore','bodyBattery','vo2max','hrv7d','hrvBaselineLow','hrvBaselineHigh'])
        if(d[k]!=null) g[k] = d[k];
      if(d.weightKg!=null) g.weightKg = d.weightKg;   // handmatige waarde wint in de weergave (recoveryTimeline is first-wins)
      g._source = 'garmin'; g._syncedAt = now; if(gen) g._generatedAt = gen;
    }
    const auto = { nieuw:0, gekoppeld:0 }, newRuns = [];
    for(const a of pv.parsed.activities){
      const ex = state.garmin.activities.find(x=> x.externalId === a.externalId);
      const rec = { ...a, _syncedAt: now, _generatedAt: gen || null };
      if(ex) Object.assign(ex, rec); else state.garmin.activities.push(rec);
      // nieuwe hardloop-activiteit -> automatisch Coach-run (Garmin leidend); al bekende activiteiten krijgen dit niet
      // opnieuw, zodat een door jou verwijderde Coach-run niet bij elke import terugkomt
      if(!ex && garminAutoCoachOn() && GARMIN_RUN_TYPES.includes(a.type)){ const how = garminApplyRun(rec); if(auto[how]!=null) auto[how]++; }
      if(!ex && GARMIN_RUN_TYPES.includes(a.type)) newRuns.push(rec);
      // RPE: het cijfer van Garmin is leidend voor gekoppelde Coach-runs (alleen dit veld wordt bijgewerkt)
      if(a.rpe != null) state.currentBlock.coachRuns.forEach(r=>{ if(r.garminExternalId === a.externalId) r.rpe = a.rpe; });
    }
    if(auto.nieuw || auto.gekoppeld) autoMsg = 'Import klaar.'+'\n\n'+'Automatisch als Coach-run overgenomen (Garmin leidend): '+auto.nieuw+' nieuw, '+auto.gekoppeld+' gekoppeld aan een bestaande run.'+'\n\n'+'Wil je een run niet meetellen? Verwijder die Coach-run op Vandaag; bij een volgende import komt hij niet terug.';
    if(runReplacesCoach() && newRuns.length){ const n = runAutoLinkAfterImport(newRuns); autoMsg = 'Import klaar. '+newRuns.length+' nieuwe hardloop-activiteit(en) gevonden.'+(n?' '+n+' automatisch gekoppeld aan een geplande training.':'')+'\n\nOnder Hardlopen › Garmin & resultaten kun je de rest zelf koppelen.'; }
    state.garmin.activities.sort((x,y)=> (x.startTime||x.date).localeCompare(y.startTime||y.date));
    state.garmin.meta = { fileName: pv.fileName || null, generatedAt: gen || null, source: pv.parsed.source || null, lastImportedAt: now };
    saveState();
  } catch(e){
    state = snap; CB = state.currentBlock; saveState();
    alert('Import mislukt — de vorige toestand is exact hersteld.\n\n' + (e && e.message || e));
    ui.garminPreview = null; renderGarmin(); return;
  }
  ui.garminPreview = null;
  renderCurrent();
  if(autoMsg) alert(autoMsg);
}

function garminAutoCoachOn(){ return CB.garminAutoCoach !== false && !runReplacesCoach(); }
/* Garmin-activiteit -> Coach-run (idempotent op garminExternalId; handmatige velden blijven).
   Zoekt eerst een bestaande run om te koppelen (zelfde dag, ±0,5 km, zonder koppeling of met kapotte koppeling). */
function garminFindAdopt(a){
  const near = x => x.date === a.date && (a.distanceKm == null || x.distanceKm == null || Math.abs(num(x.distanceKm) - a.distanceKm) <= 0.5);
  return CB.coachRuns.find(x=> !x.garminExternalId && near(x))
      || CB.coachRuns.find(x=> { if(!x.garminExternalId || !near(x)) return false;
           const la = state.garmin.activities.find(y=> y.externalId === x.garminExternalId); return la && la.date !== x.date; })
      || null;
}
/* zonder bevestiging: geeft 'nieuw' | 'gekoppeld' | 'bijgewerkt' terug. Garmin is leidend (ook voor RPE als Garmin er een heeft). */
function garminApplyRun(a){
  let r = CB.coachRuns.find(x=> x.garminExternalId === a.externalId);
  let how = r ? 'bijgewerkt' : 'nieuw';
  if(!r){ const adopt = garminFindAdopt(a); if(adopt){ r = adopt; r.garminExternalId = a.externalId; how = 'gekoppeld'; } }
  const g = {
    // avgPace = gemiddeld BEWOGEN tempo: door de Garmin-normalizer berekend uit
    // movingDuration ÷ afstand op volle precisie — niet uit de afgeronde weergavewaarden.
    date: a.date, done: true, totalMin: a.durationMin, distanceKm: a.distanceKm,
    avgPace: a.avgPace, avgHr: a.avgHr, maxHr: a.maxHr, vo2max: a.vo2max,
    continuousMin: a.continuousMin != null ? a.continuousMin : (r ? r.continuousMin ?? null : null),
  };
  if(r){ Object.assign(r, g); r._source = 'garmin-sync'; }
  else {
    r = { id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), garminExternalId: a.externalId, planned:'', type:'',
          rpe:null, pain:null, note:'', plannedContent:'', doneContent:'', _source:'garmin', ...g };
    CB.coachRuns.push(r);
  }
  // RPE: Garmin is leidend (overschrijft een handmatig cijfer); zonder Garmin-RPE blijft jouw invoer staan
  if(a.rpe != null) r.rpe = a.rpe;
  CB.coachRuns.sort((x,y)=> x.date.localeCompare(y.date));
  const l = ensureLog(a.date); l.checks = l.checks || {}; l.checks.mainTraining = true;
  return how;
}
function garminActivityToCoachRun(externalId){
  const a = state.garmin.activities.find(x=> x.externalId === externalId); if(!a) return;
  const linked = CB.coachRuns.find(x=> x.garminExternalId === externalId);
  const adopt = linked ? null : garminFindAdopt(a);
  const intro = adopt
    ? `Op ${fmt(a.date,{day:'numeric',month:'long'})} staat al een Coach-run (${adopt.distanceKm!=null?nl(adopt.distanceKm)+' km':'zonder afstand'}${adopt.rpe!=null?', RPE '+adopt.rpe:''}). Die wordt aan deze Garmin-run gekoppeld en bijgewerkt — er komt GEEN tweede run bij.\n\n`
    : `Garmin-run van ${fmt(a.date,{day:'numeric',month:'long'})} als Coach-run gebruiken?\n\n`;
  if(!confirm(intro + `Datum, duur, afstand, gem. bewogen tempo, HR en VO₂-max worden overgenomen. RPE komt uit Garmin (leidend, overschrijft een eigen cijfer).\nPijn, opmerking, gepland/uitgevoerd en het Coach-trainingstype blijven handmatig.`)) return;
  garminApplyRun(a);
  saveState(); renderCurrent();
}

/* Garmin-activiteit -> Week 0 conditievelden (expliciete bevestiging; RPE blijft handmatig) */
function garminActivityToWeek0(externalId){
  const a = state.garmin.activities.find(x=> x.externalId === externalId); if(!a) return;
  if(!confirm(`Deze Garmin-run (${fmt(a.date,{day:'numeric',month:'long'})}) als Week 0-conditiemeting gebruiken?\n\nGevuld worden: datum, VO₂-max, loopafstand, gem. bewogen tempo, gem. HR${a.continuousMin!=null?', aaneengesloten looptijd':''}.\nRPE vul je handmatig. Kracht-, balans- en mobiliteitsmetingen en de bevroren herstel-baseline blijven ongewijzigd.`)) return;
  const M = CB.measurements.baseline;
  M.date = a.date;
  if(a.vo2max != null) M.vo2max = a.vo2max;
  if(a.distanceKm != null) M.runDistanceKm = a.distanceKm;
  if(a.avgPace) M.runPace = a.avgPace;
  if(a.avgHr != null) M.runAvgHr = a.avgHr;
  if(a.continuousMin != null) M.runContinuousMin = a.continuousMin;   // niet afleiden uit totale duur
  M._runSource = 'garmin'; M._runExternalId = externalId;
  saveState(); renderCurrent();
  alert('Week 0-conditievelden ingevuld vanuit de Garmin-run. Vul RPE nog handmatig in op het Metingen-scherm.');
}
function buildPrint(mode){
  const t = $('#print-sheet');
  if(mode==='week'){
    const wi = ui.weekIdx; const ds = weekDates(wi); const ws = weekStatus(wi);
    const cfg = weekConfig(wi); const focusEx = cfg.focusExercise ? state.exercises.find(x=>x.id===cfg.focusExercise) : null;

document.addEventListener('change', e=>{
  const el = e.target;
  if(el.dataset.bind){
    // als de focus intussen naar een ander gebonden veld is verplaatst: flush eerst
    // diens lopende (gedebouncede) invoer, zodat de herrender geen verse toets kwijtraakt
    const ae = document.activeElement;
    if(ae && ae!==el && ae.dataset && ae.dataset.bind){ clearTimeout(window._it); setByPath(ae.dataset.bind, ae.value, true); }
    // altijd stil opslaan; de volledige herrender (die het DOM vervangt) gebeurt pas via
    // 'focusout' hieronder, en dan alleen als je ECHT naar een niet-veld gaat. Anders kan een
    // herrender midden in het overstappen naar het VOLGENDE veld dat veld onder je vingers
    // vandaan halen — precies het probleem dat keuzelijsten had bij het overstappen ernaartoe.
    setByPath(el.dataset.bind, el.value, true);
    window._bindPending = true;
    return;
  }
  if(el.hasAttribute('data-routine-check')){
    const l = ensureLog(ui.date); l.checks = l.checks || {};
    l.routineDone = el.checked ? (l.routineDone==='deels' ? 'deels' : 'ja') : 'nee';
    l.checks.routine = el.checked;   // compat voor oude uitleeslogica
    saveState(); renderToday(); return;
  }
  if(el.hasAttribute('data-routine-deels')){
    const l = ensureLog(ui.date);
    l.routineDone = el.checked ? 'deels' : 'ja';
    (l.checks = l.checks || {}).routine = true;
    saveState(); renderToday(); return;
  }
  if(el.hasAttribute('data-garmin-auto')){ CB.garminAutoCoach = el.checked; saveState(); renderGarmin(); return; }
  if(el.dataset.check){
    const l = CB.dailyLogs[ui.date] = CB.dailyLogs[ui.date] || {};
    l.checks = l.checks || {}; l.checks[el.dataset.check] = el.checked;
    saveState(); renderToday(); return;
  }
  if(el.id==='importJson' && el.files[0]) importJsonFile(el.files[0]);
  if(el.id==='garminJsonInput' && el.files[0]){
    const f = el.files[0];
    if(isZipFile(f)){ loadGarminZipFile(f); }
    else { const rd = new FileReader(); rd.onload = () => loadGarminText(rd.result, f.name); rd.readAsText(f); }
    el.value = '';
  }
});

document.addEventListener('focusout', e=>{
  if(!e.target.dataset || !e.target.dataset.bind || !window._bindPending) return;
  // relatedTarget = het element dat NU de focus krijgt. Is dat ook een gebonden veld (bv. je klikt
  // van een tekstveld naar een keuzelijst, of bladert met Tab), dan wachten we nog even: pas
  // herrenderen zodra de focus het hele formulier echt verlaat, anders vervangt de herrender het
  // veld terwijl je er middenin klikt/kiest.
  const nxt = e.relatedTarget;
  if(nxt && nxt.dataset && nxt.dataset.bind) return;
  window._bindPending = false;
  clearTimeout(window._rr); window._rr = setTimeout(renderCurrent, 120);
});

document.addEventListener('input', e=>{

    // schrijf stil weg tijdens typen; volledige herrender pas bij 'change' (blur) — voorkomt focusverlies
    clearTimeout(window._it); window._it = setTimeout(()=> setByPath(el.dataset.bind, el.value, true), 250);
  }
});

/* zwevende grafiek-tooltip: toont datum + waarde bij mouse-over op een meetpunt */
(function chartTooltip(){
  let tip;
  const ensure = ()=> tip || (tip = document.body.appendChild(Object.assign(document.createElement('div'),{id:'chartTip'})));
  const place = (x,y)=>{
    const t = ensure(); const m = 14;
    let left = x + m, top = y + m;
    const r = t.getBoundingClientRect();
    if(left + r.width + 4 > window.innerWidth) left = x - r.width - m;
    if(top + r.height + 4 > window.innerHeight) top = y - r.height - m;
    t.style.left = Math.max(4,left) + 'px';
    t.style.top = Math.max(4,top) + 'px';
  };
  const hide = ()=>{ if(tip){ tip.classList.remove('show'); } document.querySelectorAll('svg .pt.on').forEach(g=>g.classList.remove('on')); };
  document.addEventListener('pointermove', e=>{
    const g = e.target.closest && e.target.closest('svg .pt');
    if(!g || !g.dataset.tip){ hide(); return; }
    const t = ensure();
    if(t.textContent !== g.dataset.tip) t.textContent = g.dataset.tip;
    document.querySelectorAll('svg .pt.on').forEach(x=>{ if(x!==g) x.classList.remove('on'); });
    g.classList.add('on');
    t.classList.add('show');
    place(e.clientX, e.clientY);
  }, true);
  document.addEventListener('pointerdown', e=>{ if(!(e.target.closest && e.target.closest('svg .pt'))) hide(); });
  window.addEventListener('scroll', hide, true);
})();

function fbConfigured(){ return !/VUL_IN/.test(FB_API_KEY) && !/VUL_IN/.test(FB_DB); }

function fbErrText(j, fallback){
  const m = (j && j.error && (j.error.message || j.error)) || '';
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(m)) return 'E-mail of wachtwoord klopt niet';
  if(/TOO_MANY_ATTEMPTS/.test(m)) return 'Te vaak geprobeerd, wacht even en probeer opnieuw';
  return (typeof m==='string' && m) ? m : fallback;
}
function fbStoreAuth(access, refresh, expiresIn, uid, email){
  const s = syncLoad();
  s.auth = { access, refresh, exp:Date.now()+ (Number(expiresIn)||3600)*1000, uid: uid||(s.auth&&s.auth.uid), email: email||(s.auth&&s.auth.email) };
  syncSave(s); return s.auth;
}
async function fbLogin(email, password){
  const r = await fetch(FB_AUTH_BASE+'/v1/accounts:signInWithPassword?key='+encodeURIComponent(FB_API_KEY), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email, password, returnSecureToken:true }) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(fbErrText(j, 'Inloggen mislukt'));
  return fbStoreAuth(j.idToken, j.refreshToken, j.expiresIn, j.localId, j.email);
}
async function fbRefresh(){
  const s = syncLoad(); if(!s.auth) throw new Error('Niet ingelogd');
  const r = await fetch(FB_TOKEN_BASE+'/v1/token?key='+encodeURIComponent(FB_API_KEY), { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(s.auth.refresh) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('Sessie verlopen, log opnieuw in');
  return fbStoreAuth(j.id_token, j.refresh_token, j.expires_in, j.user_id);
}
async function fbToken(){
  const s = syncLoad(); if(!s.auth) throw new Error('Niet ingelogd');
  if(s.auth.exp - Date.now() > 60000) return s.auth;
  return fbRefresh();
}
async function fbDb(path, method, body, extra){
  let a = await fbToken(), r;
  for(let pass=0; pass<2; pass++){
    r = await fetch(FB_DB+'/'+path+'.json?auth='+encodeURIComponent(a.access)+(extra||''), {
      method: method||'GET',
      headers: body!=null ? {'Content-Type':'application/json'} : {},
      body: body!=null ? JSON.stringify(body) : undefined });
    if(r.status===401 && pass===0){ a = await fbRefresh(); continue; }
    break;
  }
  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok) throw new Error(fbErrText(j, 'Serverfout '+r.status));
  return j;
}

  const f = $('#sidebarFoot'); if(!f) return;

function syncSetMsg(m){ SYNC.msg = m; const el = $('#syncStatus'); if(el) el.textContent = m; const ss = $('#saveState'); if(ss && m) ss.textContent = m; syncFootUpdate(); }
function syncMarkers(cloudAt, localAt){ const s = syncLoad(); s.lastCloudAt = cloudAt; s.lastLocalAt = localAt; syncSave(s); }
async function fbGetCurrent(uid){
  const raw = await fbDb('trainingsplan/'+uid+'/current');
  if(!raw || !raw.state) return null;
  return { state:JSON.parse(raw.state), hist: raw.hist ? JSON.parse(raw.hist) : null, updated_at:raw.updated_at, device:raw.device };
}
async function syncPrune(uid){
  const keys = await fbDb('trainingsplan/'+uid+'/versies', 'GET', null, '&shallow=true');
  if(!keys) return;
  const ks = Object.keys(keys).sort();
  for(const k of ks.slice(0, Math.max(0, ks.length-20))) await fbDb('trainingsplan/'+uid+'/versies/'+k, 'DELETE');
}
async function syncPush(cloudRow, isConflict){
  const s = syncLoad(), uid = s.auth.uid, now = new Date().toISOString();
  // vorige cloudversie bewaren (max. 1x per 6 uur, en altijd bij een conflict); de laatste 20 blijven staan
  if(cloudRow && (isConflict || !s.lastVersionAt || Date.now()-Date.parse(s.lastVersionAt) > 6*3600*1000)){
    await fbDb('trainingsplan/'+uid+'/versies/'+Date.now(), 'PUT', { state:JSON.stringify(cloudRow.state), saved_at:now, device:cloudRow.device||null });
    const s2 = syncLoad(); s2.lastVersionAt = now; syncSave(s2);
    await syncPrune(uid);
  }
  // alleen schrijven als de cloud sinds ons lezen niet veranderd is (klein vangnet tegen gelijktijdige wijzigingen)
  if(cloudRow){
    const cur = await fbDb('trainingsplan/'+uid+'/current/updated_at');
    if(cur !== cloudRow.updated_at) throw new Error('RETRY');
  }
  const body = { state:JSON.stringify(state), updated_at:now, device:syncDevice() };
  const hist = syncHistPart(); if(hist && (!cloudRow || !cloudRow.hist)) body.hist = JSON.stringify(hist);
  await fbDb('trainingsplan/'+uid+'/current', 'PATCH', body);
  syncMarkers(now, state.meta.updatedAt);
  syncSetMsg('☁ Gesynchroniseerd '+syncTime());
}
function syncApplyCloud(row){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(row.state));
  if(row.hist) localStorage.setItem('trainingsplan-rens-hist', JSON.stringify(row.hist));
  syncMarkers(row.updated_at, (row.state.meta||{}).updatedAt);
  location.reload();
}
async function syncNow(retry){
  retry = retry || 0;
  if(!fbConfigured() || SYNC.busy) return;
  const s0 = syncLoad(); if(!s0.auth) return;
  SYNC.busy = true; syncSetMsg('☁ Synchroniseren…');
  try{
    const row = await fbGetCurrent(s0.auth.uid), s = syncLoad();
    if(!row){ await syncPush(null,false); return; }
    const localChanged = state.meta.updatedAt !== s.lastLocalAt;
    const cloudChanged = row.updated_at !== s.lastCloudAt;
    if(WAS_PRISTINE && !s.lastCloudAt){ syncApplyCloud(row); return; }          // nieuw apparaat: gewoon downloaden
    if(syncEmpty(state) && !syncEmpty(row.state)){ syncApplyCloud(row); return; } // dit apparaat heeft (nog) geen gegevens: nooit de cloud leegmaken
    if(!localChanged && !cloudChanged){ syncSetMsg('☁ Gesynchroniseerd '+syncTime()); return; }
    if(!localChanged && cloudChanged){ syncApplyCloud(row); return; }
    if(localChanged && !cloudChanged){ await syncPush(row,false); return; }
    SYNC.conflict = row; syncShowConflict(row);                                    // beide gewijzigd: gebruiker kiest
    syncSetMsg('☁ Kies welke versie je wilt houden');
  }catch(e){
    if(e.message==='RETRY' && retry<2){ SYNC.busy=false; return syncNow(retry+1); }
    syncSetMsg('☁ Sync mislukt: '+e.message);
  }finally{ SYNC.busy = false; }
}
function syncSoon(){
  if(!fbConfigured() || SYNC.conflict) return; const s = syncLoad(); if(!s.auth) return;
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(()=>syncNow(), 4000);
}
/* wat zit er in een stand (voor keuzes en herstel): dagen, trainingen, runs, Garmin */
function syncSummary(st){
  const cb = (st && st.currentBlock) || {}, rp = (st && st.runningProgram) || {}, g = (st && st.garmin) || {};
  const n = { dagen:Object.keys(cb.dailyLogs||{}).length, trainingen:(rp.sessions||[]).length, runs:(cb.coachRuns||[]).length,
              kracht:(cb.strengthSessions||[]).length, garmin:(g.activities||[]).length };
  n.text = `${n.dagen} dagen · ${n.trainingen} hardlooptrainingen · ${n.runs} Coach-runs · ${n.kracht} krachtsessies · ${n.garmin} Garmin-activiteiten`;
  return n;
}
/* een stand zonder eigen gegevens mag nooit een stand mét gegevens in de cloud overschrijven */
function syncEmpty(st){ const n = syncSummary(st); return !n.dagen && !n.trainingen && !n.runs && !n.kracht && !n.garmin && !((st && st.currentBlock && st.currentBlock.walks)||[]).length; }

  const d = document.createElement('div'); d.id='syncConflict';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = `<div class="card" style="max-width:440px;background:var(--card)"><h3>Twee verschillende versies</h3>
    <p class="small">Er is op dit apparaat én in de cloud iets gewijzigd (cloud: ${esc(when)}, ${esc(row.device||'onbekend apparaat')}). Kies welke je wilt houden. De andere versie wordt bewaard, dus niets gaat verloren.</p>
    <div class="week-track small" style="margin:0 0 10px"><div class="row"><span class="k">In de cloud</span><span class="v" style="white-space:normal;font-weight:500">${esc(syncSummary(row.state).text)}</span></div>

      <button class="btn sm" data-sync="later">Later beslissen</button></div></div>`;

}
async function syncResolve(choice){
  const row = SYNC.conflict; const el = $('#syncConflict');
  if(choice==='later'){ if(el) el.remove(); SYNC.conflict = null; return; }
  if(!row) return;
  try{
    if(choice==='use-cloud'){
      dl(new Blob([JSON.stringify({ ...state, historicalData:HISTORICAL },null,2)],{type:'application/json'}), 'Atempo_lokaal_voor_sync_'+todayISO()+'.json');
      syncApplyCloud(row);
    } else {
      SYNC.busy = true; await syncPush(row,true); SYNC.busy = false; SYNC.conflict = null; if(el) el.remove();
    }
  }catch(e){ SYNC.busy = false; syncSetMsg('☁ Sync mislukt: '+e.message); }
}

/*__HARDLOPEN_2_BEGIN__*/
/* ===========================================================================
   HARDLOPEN — deel 2: Garmin FIT Workout-bestand (gestructureerde training)
   Bouwt een FIT-bestand van het type "workout" volgens de Garmin FIT-specificatie (profiel 21.218):
     file_id (mesg 0, type=5 workout) · workout (mesg 26, sport=running) · workout_step (mesg 27, per stap)
   Een bestand wordt ALLEEN aangeboden als de ingebouwde controle (fitVerify) slaagt:
   kop-CRC, bestands-CRC, berichtstructuur, aantal stappen, duur per stap en herhaalblokken.
   Aanvullend is het encoderontwerp offline getest tegen de officiële Garmin FIT SDK (zie controleverslag).
   =========================================================================== */
const FIT_PROFILE = 21218;            // 21.218
const FIT_EPOCH_OFFSET = 631065600;   // seconden tussen 1970-01-01 en 1989-12-31
const FIT_MSG = { fileId:0, workout:26, workoutStep:27 };
const FIT_INT = { active:0, rest:1, warmup:2, cooldown:3, recovery:4, interval:5 };
const FIT_DUR = { time:0, repeatUntilStepsCmplt:6 };
const FIT_TGT = { speed:0, heartRate:1, open:2 };
const FIT_TYPE = { enum:0x00, uint8:0x02, string:0x07, uint16:0x84, uint32:0x86, uint32z:0x8C };
const FIT_INVALID32 = 0xFFFFFFFF;
const FIT_CRC_TAB = [0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
function fitCrcByte(crc, b){
  let t = FIT_CRC_TAB[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC_TAB[b & 0xF];
  t = FIT_CRC_TAB[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ t ^ FIT_CRC_TAB[(b >> 4) & 0xF];
  return crc;
}
function fitCrc(bytes, from, to){ let c = 0; for(let i=from;i<to;i++) c = fitCrcByte(c, bytes[i]); return c; }
function fitAscii(str, max){            // alleen veilige ASCII, zodat elk horloge de naam kan tonen
  const s = String(str||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[–—]/g,'-').replace(/×/g,'x').replace(/[^\x20-\x7E]/g,'');
  return s.slice(0, max);
}
const FIT_STR = 16;                      // vaste stringlengte (inclusief afsluitende nul) voor namen

/* velddefinities (veldnummer, grootte, basistype) — vast per berichtsoort */
const FIT_DEF = {
  fileId:      { num:FIT_MSG.fileId,      fields:[ [0,1,FIT_TYPE.enum], [1,2,FIT_TYPE.uint16], [2,2,FIT_TYPE.uint16], [3,4,FIT_TYPE.uint32z], [4,4,FIT_TYPE.uint32] ] },
  workout:     { num:FIT_MSG.workout,     fields:[ [4,1,FIT_TYPE.enum], [6,2,FIT_TYPE.uint16], [8,FIT_STR,FIT_TYPE.string] ] },
  workoutStep: { num:FIT_MSG.workoutStep, fields:[ [254,2,FIT_TYPE.uint16], [0,FIT_STR,FIT_TYPE.string], [1,1,FIT_TYPE.enum], [2,4,FIT_TYPE.uint32], [3,1,FIT_TYPE.enum], [4,4,FIT_TYPE.uint32], [5,4,FIT_TYPE.uint32], [6,4,FIT_TYPE.uint32], [7,1,FIT_TYPE.enum] ] },
};

/* training -> lijst FIT-stappen (herhaalblokken waar het patroon regelmatig is) */
function fitStepsFromSession(s){
  const out = [], tgt = s.target || { type:'none' };
  const runTarget = () => {
    if(tgt.type==='hr' && num(tgt.low)>0 && num(tgt.high)>0)       // hartslag in bpm: FIT telt er 100 bij op (waarden >100 = absolute bpm)
      return { targetType:FIT_TGT.heartRate, targetValue:0, low:Math.round(tgt.low)+100, high:Math.round(tgt.high)+100 };
    if(tgt.type==='pace' && num(tgt.low)>0 && num(tgt.high)>0)     // tempo (s/km) -> snelheid (m/s ×1000); langzaam tempo = lage snelheid
      return { targetType:FIT_TGT.speed, targetValue:0, low:Math.round(1000/tgt.high*1000), high:Math.round(1000/tgt.low*1000) };
    return { targetType:FIT_TGT.open, targetValue:0, low:FIT_INVALID32, high:FIT_INVALID32 };
  };
  const open = { targetType:FIT_TGT.open, targetValue:0, low:FIT_INVALID32, high:FIT_INVALID32 };
  const plain = (t, sec) => ({ name:RUN_STEP[t].garmin, durationType:FIT_DUR.time, durationValue:Math.round(sec*1000),
      ...(t==='run' ? runTarget() : open), intensity: ({ warmup:FIT_INT.warmup, run:FIT_INT.active, walk:FIT_INT.recovery, cooldown:FIT_INT.cooldown })[t] });
  for(const g of runCompress(s.steps)){
    if(g.kind==='single'){ out.push(plain(g.t, g.sec)); continue; }
    const first = out.length;
    out.push(plain('run', g.items[0].sec), plain('walk', g.items[1].sec));
    out.push({ name:'Herhalen', durationType:FIT_DUR.repeatUntilStepsCmplt, durationValue:first, targetType:FIT_TGT.open, targetValue:g.count,
               low:FIT_INVALID32, high:FIT_INVALID32, intensity:0xFF });
  }
  return out;
}

function fitWorkoutName(s){
  if(s.fitName) return fitAscii(s.fitName, 15);
  const t = runTpl(s.templateId); const base = (t ? t.id : 'Run') + ' ' + (s.date||'').slice(5).replace('-','/');
  return fitAscii('Run ' + base, 15);
}

/* minimale FIT-schrijver (little-endian, één definitie per berichtsoort) */
function fitBuildWorkout(s, nowSec, salt){
  salt = salt || 0;
  const steps = fitStepsFromSession(s);
  const body = [];
  const u8 = v => body.push(v & 0xFF), u16 = v => { body.push(v & 0xFF, (v>>8) & 0xFF); },
        u32 = v => { v = v>>>0; body.push(v & 0xFF, (v>>>8) & 0xFF, (v>>>16) & 0xFF, (v>>>24) & 0xFF); };
  const str = v => { const a = []; for(const ch of String(v)) a.push(ch.charCodeAt(0)&0x7F); while(a.length<FIT_STR) a.push(0); a.length = FIT_STR; a[FIT_STR-1] = 0; body.push(...a); };
  const defMsg = (local, def) => { u8(0x40 | local); u8(0); u8(0); u16(def.num); u8(def.fields.length); def.fields.forEach(([n,sz,bt])=>{ u8(n); u8(sz); u8(bt); }); };
  const created = (nowSec ?? Math.floor(Date.now()/1000)) - FIT_EPOCH_OFFSET + salt;
  defMsg(0, FIT_DEF.fileId);
  u8(0x00); u8(5); u16(255); u16(0); u32((((created ^ 0x5A5A5A5A) + salt*7919)>>>0) || 1); u32(created);         // type=workout, manufacturer=development
  defMsg(1, FIT_DEF.workout);
  u8(0x01); u8(1); u16(steps.length); str(fitWorkoutName(s));                                         // sport=running
  defMsg(2, FIT_DEF.workoutStep);
  steps.forEach((st,i)=>{
    u8(0x02); u16(i); str(fitAscii(st.name, FIT_STR-1)); u8(st.durationType); u32(st.durationValue);
    u8(st.targetType); u32(st.targetValue); u32(st.low); u32(st.high); u8(st.intensity);
  });
  const dataSize = body.length, header = [14, 0x20, FIT_PROFILE & 0xFF, (FIT_PROFILE>>8) & 0xFF, dataSize & 0xFF, (dataSize>>8) & 0xFF, (dataSize>>16) & 0xFF, (dataSize>>>24) & 0xFF, 0x2E, 0x46, 0x49, 0x54];
  const hc = fitCrc(header, 0, 12); header.push(hc & 0xFF, (hc>>8) & 0xFF);
  const all = new Uint8Array(header.length + body.length + 2); all.set(header,0); all.set(body, header.length);
  const fc = fitCrc(all, 0, all.length-2); all[all.length-2] = fc & 0xFF; all[all.length-1] = (fc>>8) & 0xFF;
  return all;
}

/* ---------- onafhankelijke controle van het gegenereerde bestand (eigen parser) ---------- */
function fitVerify(bytes, s){
  const err = [];
  const rd16 = (o) => bytes[o] | (bytes[o+1]<<8), rd32 = (o) => (bytes[o] | (bytes[o+1]<<8) | (bytes[o+2]<<16) | (bytes[o+3]<<24)) >>> 0;
  if(bytes.length < 16) return { ok:false, errors:['Bestand te klein'] };
  if(bytes[0]!==14) err.push('Kopgrootte is niet 14');
  if(String.fromCharCode(bytes[8],bytes[9],bytes[10],bytes[11])!=='.FIT') err.push('Kop mist ".FIT"');
  if(fitCrc(bytes,0,12)!==rd16(12)) err.push('Kop-CRC klopt niet');
  const dataSize = rd32(4);
  if(14 + dataSize + 2 !== bytes.length) err.push('Datagrootte in de kop klopt niet met de bestandsgrootte');
  if(fitCrc(bytes,0,bytes.length-2)!==rd16(bytes.length-2)) err.push('Bestands-CRC klopt niet');
  // berichten lezen
  const defs = {}; let o = 14; const msgs = [];
  while(o < 14+dataSize && !err.length){
    const h = bytes[o++];
    if(h & 0x40){                                                    // definitiebericht
      const local = h & 0x0F; if(bytes[o+1]!==0){ err.push('Alleen little-endian bestanden verwacht'); break; }
      const gnum = rd16(o+2), nf = bytes[o+4]; const f = []; let size = 0;
      for(let i=0;i<nf;i++){ f.push({ n:bytes[o+5+3*i], sz:bytes[o+6+3*i], bt:bytes[o+7+3*i] }); size += bytes[o+6+3*i]; }
      defs[local] = { gnum, f, size }; o += 5 + 3*nf;
    } else {                                                         // gegevensbericht
      const d = defs[h & 0x0F]; if(!d){ err.push('Gegevensbericht zonder definitie'); break; }
      const rec = { gnum:d.gnum }; let p = o;
      for(const fl of d.f){
        if(fl.bt===FIT_TYPE.string){ let t=''; for(let i=0;i<fl.sz && bytes[p+i];i++) t += String.fromCharCode(bytes[p+i]); rec[fl.n] = t; }
        else if(fl.sz===1) rec[fl.n] = bytes[p]; else if(fl.sz===2) rec[fl.n] = rd16(p); else if(fl.sz===4) rec[fl.n] = rd32(p);
        p += fl.sz;
      }
      msgs.push(rec); o += d.size;
    }
  }
  if(!err.length && o !== 14+dataSize) err.push('Berichten sluiten niet exact aan op de datagrootte');
  if(!err.length){
    const fid = msgs.filter(m=>m.gnum===FIT_MSG.fileId), wk = msgs.filter(m=>m.gnum===FIT_MSG.workout), st = msgs.filter(m=>m.gnum===FIT_MSG.workoutStep);
    const exp = fitStepsFromSession(s);
    if(fid.length!==1 || fid[0][0]!==5) err.push('file_id: type moet "workout" (5) zijn');
    if(wk.length!==1) err.push('Er moet precies één workout-bericht zijn'); else {
      if(wk[0][4]!==1) err.push('sport moet hardlopen (1) zijn');
      if(wk[0][6]!==exp.length) err.push('num_valid_steps ('+wk[0][6]+') klopt niet met het aantal stappen ('+exp.length+')');
      if(!wk[0][8]) err.push('Workout heeft geen naam');
    }
    if(st.length!==exp.length) err.push('Aantal stap-berichten ('+st.length+') klopt niet met verwacht ('+exp.length+')');
    else st.forEach((m,i)=>{
      const e = exp[i];
      if(m[254]!==i) err.push('Stap '+i+': message_index klopt niet');
      if(m[1]!==e.durationType) err.push('Stap '+i+': duur-type klopt niet');
      if(m[2]!==e.durationValue>>>0) err.push('Stap '+i+': duur klopt niet');
      if(e.durationType===FIT_DUR.repeatUntilStepsCmplt){
        if(!(m[2] < i)) err.push('Stap '+i+': herhaling wijst niet naar een eerdere stap');
        if(m[4]!==e.targetValue) err.push('Stap '+i+': aantal herhalingen klopt niet');
      }
      if(m[7]!==e.intensity) err.push('Stap '+i+': intensiteit klopt niet');
    });
    // totale duur uit het bestand (met herhalingen uitgerekend) moet gelijk zijn aan de duur van de training
    if(!err.length){
      let total = 0, i = 0; const dur = x => x[2]/1000;
      const times = st.map(m=> m[1]===FIT_DUR.time ? dur(m) : 0);
      for(i=0;i<st.length;i++){
        if(st[i][1]===FIT_DUR.repeatUntilStepsCmplt){
          const from = st[i][2]; let blk = 0; for(let k=from;k<i;k++) blk += times[k];
          total += blk * (st[i][4]-1);        // het blok zelf is al één keer geteld
        } else total += times[i];
      }
      const want = (s.steps||[]).reduce((a,x)=>a+x.sec,0);
      if(Math.abs(total-want)>0.5) err.push('Totale duur in bestand ('+total+' s) verschilt van de training ('+want+' s)');
    }
  }
  return { ok:!err.length, errors:err, size:bytes.length };
}
/* hoofdingang: levert alleen een bestand af als de controle slaagt */
function fitExportSession(s){
  if(!s || !s.steps || !s.steps.length) return { ok:false, errors:['Deze training heeft geen stappen.'] };
  const bad = s.steps.find(x=> !(x.sec>0) || !RUN_STEP[x.t]); if(bad) return { ok:false, errors:['Ongeldige stap in de training.'] };
  const bytes = fitBuildWorkout(s), v = fitVerify(bytes, s);
  return v.ok ? { ok:true, bytes, name:fitWorkoutName(s), size:bytes.length } : { ok:false, errors:v.errors };
}

/* ---------- alle niveaus in één keer: .fit per niveau + zip (store, zonder compressie) ---------- */
const FIT_CRC32_TAB = (()=>{ const t = []; for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t.push(c >>> 0); } return t; })();
function fitCrc32(b){ let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = FIT_CRC32_TAB[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function fitZip(files){
  const enc = s => Array.from(s).map(ch=>ch.charCodeAt(0) & 0x7F), out = [], cen = [];
  const u16 = (a,v)=>{ a.push(v & 0xFF, (v>>8) & 0xFF); }, u32 = (a,v)=>{ v = v>>>0; a.push(v & 0xFF, (v>>>8) & 0xFF, (v>>>16) & 0xFF, (v>>>24) & 0xFF); };
  const d = new Date(), dosTime = (d.getHours()<<11) | (d.getMinutes()<<5) | (d.getSeconds()>>1), dosDate = ((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate();
  files.forEach(f=>{
    const name = enc(f.name), crc = fitCrc32(f.bytes), off = out.length;
    u32(out,0x04034b50); u16(out,20); u16(out,0); u16(out,0); u16(out,dosTime); u16(out,dosDate); u32(out,crc); u32(out,f.bytes.length); u32(out,f.bytes.length); u16(out,name.length); u16(out,0);
    out.push(...name); for(let i=0;i<f.bytes.length;i++) out.push(f.bytes[i]);
    u32(cen,0x02014b50); u16(cen,20); u16(cen,20); u16(cen,0); u16(cen,0); u16(cen,dosTime); u16(cen,dosDate); u32(cen,crc); u32(cen,f.bytes.length); u32(cen,f.bytes.length);
    u16(cen,name.length); u16(cen,0); u16(cen,0); u16(cen,0); u16(cen,0); u32(cen,0); u32(cen,off); cen.push(...name);
  });
  const cdOff = out.length; out.push(...cen);
  u32(out,0x06054b50); u16(out,0); u16(out,0); u16(out,files.length); u16(out,files.length); u32(out,cen.length); u32(out,cdOff); u16(out,0);
  return Uint8Array.from(out);
}
/* bouwt voor elk niveau een apart workoutbestand (elk door fitVerify gecontroleerd); alles of niets */
/* geplande trainingen van de komende dagen als losse .fit-bestanden (datum in de naam) in één zip — om in Intervals.icu te importeren */
function fitExportPeriod(days, nowSec){
  const today = todayISO(), last = addDays(today, days-1), now = nowSec ?? Math.floor(Date.now()/1000), files = [], errors = [];
  RP().sessions.filter(s=> s.status==='planned' && s.date>=today && s.date<=last).sort(runByDate).forEach((s,i)=>{
    const t = runTpl(s.templateId), label = t ? t.name : s.name, bytes = fitBuildWorkout(s, now, i), v = fitVerify(bytes, s);
    if(v.ok) files.push({ name: s.date + '_' + fitAscii(label, 20).replace(/[^A-Za-z0-9]+/g,'_') + '.fit', bytes, title: runDateShort(s.date) + ' ' + label });
    else errors.push(s.date + ': ' + v.errors.join('; '));
  });
  if(errors.length) return { ok:false, errors };
  if(!files.length) return { ok:false, errors:['Er staan de komende ' + days + ' dagen geen trainingen gepland.'] };
  return { ok:true, files, zip: fitZip(files) };
}
function fitExportAllLevels(nowSec){
  const rp = RP(), now = nowSec ?? Math.floor(Date.now()/1000), files = [], errors = [], used = new Set();
  rp.templates.forEach((t,i)=>{
    let nm = fitAscii(t.name, 15) || ('Niveau '+(i+1)), base = nm, k = 2;
    while(used.has(nm.toLowerCase())){ nm = fitAscii(base, 12) + ' ' + (k++); }
    used.add(nm.toLowerCase());
    const s = { id:'lvl-'+t.id, name:nm, fitName:nm, templateId:t.id, steps:runStepsFromParams(t), target:{ ...(t.target||{ type:'none' }) }, date:'' };
    const bytes = fitBuildWorkout(s, now, i), v = fitVerify(bytes, s);
    if(v.ok) files.push({ name: nm.replace(/[^A-Za-z0-9]+/g,'_') + '.fit', bytes, title:nm });
    else errors.push(nm + ': ' + v.errors.join('; '));
  });
  if(errors.length || !files.length) return { ok:false, errors: errors.length ? errors : ['Geen niveaus om te exporteren.'] };
  return { ok:true, files, zip: fitZip(files) };
}

const RUN_INTENS = { rustig:'Rustig tempo', gemiddeld:'Gemiddeld tempo', pittig:'Pittig tempo' };

/* ---------- kleine bouwstenen ---------- */
function runTimelineSVG(steps, h){
  const T = runTotals(steps).total || 1, W = 360, H = h || 46; let x = 0, r = '';
  (steps||[]).forEach(s=>{
    const w = s.sec/T*W, c = RUN_STEP[s.t].color, dark = s.t!=='run';
    r += `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(w-1,1).toFixed(1)}" height="${H}" rx="3" fill="${c}"><title>${RUN_STEP[s.t].nl} ${runMinLabel(s.sec)}</title></rect>`;
    if(w>=15 && H>=34){
      const sz = w>=22 ? 13 : 11, col = dark ? '#1b3a30' : '#ffffff';
      r += `<svg x="${(x+w/2-sz/2).toFixed(1)}" y="${(H*0.14).toFixed(1)}" width="${sz}" height="${sz}" viewBox="0 0 24 24" style="stroke:${col};fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${RUN_SYM_HEAD[s.t]||''}<path d="${RUN_SYM[s.t]}"/></svg>`;
      r += `<text x="${(x+w/2).toFixed(1)}" y="${(H*0.88).toFixed(1)}" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:${col}">${runMinStr(s.sec)}</text>`;
    } else if(w>=15 && H>=24) r += `<text x="${(x+w/2).toFixed(1)}" y="${(H/2+3.5).toFixed(1)}" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:${dark?'#1b3a30':'#ffffff'}">${runMinStr(s.sec)}</text>`;
    x += w;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" class="run-tl" role="img" aria-label="Tijdlijn van de training">${r}</svg>`;
}
const runLegend = () => `<div class="run-legend">${['warmup','run','walk','cooldown'].map(t=>`<span><i style="background:${RUN_STEP[t].color}"></i>${runSymSVG(t,13,'#6b7872')} ${RUN_STEP[t].nl}</span>`).join('')}</div>`;
function runTotalsLine(steps, intensity, target){
  const T = runTotals(steps);
  const tg = target && target.type==='hr' && num(target.low) ? ` · hartslag ${target.low}–${target.high} bpm` : (target && target.type==='pace' && num(target.low) ? ` · tempo ${secToPace(target.low)}–${secToPace(target.high)} /km` : '');
  return `<div class="run-totals"><b>${runMinLabel(T.total)}</b> totaal · hardlopen <b>${runMinLabel(T.run)}</b> · wandelen <b>${runMinLabel(T.walk)}</b> <span class="tny muted">(waarvan opwarmen/afkoelen ${runMinLabel(T.warm+T.cool)})</span> · <b>${T.intervals}</b> ${T.intervals===1?'blok':'intervallen'} · ${esc(RUN_INTENS[intensity]||'Rustig tempo')}${tg}</div>`;
}
function runInp(label, path, val, o){

}
function runSel(label, path, val, opts){

const runNumOpts = (a,b,empty) => [['', empty||'—'], ...Array.from({length:b-a+1},(_,i)=>[String(a+i), String(a+i)])];

      ${['green','orange','red'].map(k=>runBtn('own|'+today+'|'+k, RUN_LIGHT[k].emoji+' '+RUN_LIGHT[k].nl, 'sm'+(rd.own===k?' active':''))).join('')}${rd.own?runBtn('own|'+today+'|','Wissen','sm'):''}</div>
    ${rp.settings.physioNote?`<div class="tny muted" style="margin-top:8px">Je hebt aanhoudende klachten aan het linkerbovenbeen (lies). De opbouw is voorzichtig bedoeld; een beoordeling door een sportfysiotherapeut is verstandig voordat je verder opbouwt.</div>`:''}</div>`;

  /* voor-controle van vandaag (open zolang er iets te doen is) */
  const pre = runPre(today), needPre = !runPreComplete(pre) || runSessionsOn(today).some(s=>s.status==='planned');
  h += `<details class="acc" ${needPre?'open':''}><summary>Voor de training — hoe voel je je vandaag? <span class="tny muted">${runPreComplete(pre)?'· ingevuld':'· ongeveer 20 seconden'}</span></summary><div class="acc-body">${runPreForm(today)}</div></details>`;

  /* na de training / volgende ochtend: alleen als er iets openstaat */
  const done = runDoneSessions().filter(s=> s.date>=addDays(today,-7));
  const needPost = done.filter(s=> !runPostComplete(s.post)).pop();
  const needNext = done.filter(s=> runPostComplete(s.post) && !runNextComplete(s.next) && s.date<today).pop();
  if(needPost) h += `<details class="acc" open><summary>Na de training — ${esc(runDateShort(needPost.date))} <span class="tny muted">· inspanning en pijn</span></summary><div class="acc-body">${runPostForm(needPost)}</div></details>`;
  if(needNext) h += `<details class="acc" open><summary>De volgende ochtend — na ${esc(runDateShort(needNext.date))} <span class="tny muted">· klachten en energie</span></summary><div class="acc-body">${runNextForm(needNext)}</div></details>`;

  /* evaluatie */
  const ev = runEvaluation();
  h += `<div class="card"><h3>Evaluatie <span class="sub">na twee uitgevoerde trainingen</span></h3>
    <p><b>${esc(ev.advice)}</b></p><ul class="small">${ev.why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>
    <div class="tny muted">Huidig niveau: <b>${esc(ev.level.name)}</b>. De beslissing blijft altijd bij jou.</div>
    <div class="run-actions">${runBtn('level|'+ev.level.id+'|handhaven','Niveau handhaven','sm')}${ev.nextTpl?runBtn('level|'+ev.nextTpl.id+'|opbouwen','Naar '+esc(ev.nextTpl.name),'sm'):''}${ev.prevTpl?runBtn('level|'+ev.prevTpl.id+'|verlagen','Terug naar '+esc(ev.prevTpl.name),'sm'):''}</div></div>`;

  return h;
}

/* ---------- TRAINING AANPASSEN ---------- */
function runSessionPicker(withSuggestions){
  const rp = RP(), today = todayISO();
  const list = rp.sessions.filter(s=> s.status==='planned' || s.date>=addDays(today,-14)).sort(runByDate);
  if(!RUI.selId || !runSes(RUI.selId)){ const n = runNextTraining() || list[0]; RUI.selId = n ? n.id : null; }
  // voorgestelde trainingsdagen (nog niet ingepland): kiezen maakt er een training van, die je daarna kunt aanpassen of verzetten
  const sugg = withSuggestions ? runSuggestionDates(today, 4).filter(d=>d>=today).slice(0,8) : [];
  if(!list.length && !sugg.length) return '';
  const lvl = runCurrentTpl();
  const items = list.map(s=>({ date:s.date, html:`<option value="${s.id}" ${s.id===RUI.selId?'selected':''}>${esc(runDateShort(s.date))} — ${esc(s.name)} (${RUN_STATUS_NL[s.status]})</option>` }))
    .concat(sugg.map(d=>({ date:d, html:`<option value="sug:${d}">${esc(runDateShort(d))} — voorstel ${esc(lvl.name)} (nog niet ingepland)</option>` })))
    .sort((x,y)=>x.date.localeCompare(y.date));
  return `<div class="field"><label>Training</label><select data-run-pick>${items.map(i=>i.html).join('')}</select></div>
    ${sugg.length ? `<div class="tny muted">Kies een voorstel om die dag in te plannen; daarna kun je de datum en de training hieronder aanpassen.</div>` : ''}`;
}
function runQ(s){      // snelle structuurvelden (worden pas bij "Stappen opnieuw opbouwen" toegepast)
  RUI.q = RUI.q || {};
  if(!RUI.q[s.id]){
    const t = runTotals(s.steps), runs = s.steps.filter(x=>x.t==='run'), walks = s.steps.filter(x=>x.t==='walk');
    RUI.q[s.id] = { warm:runMinStr(s.steps.find(x=>x.t==='warmup')?.sec||0), reps:String(runs.length||1), run:runMinStr(runs[0]?.sec||180), walk:runMinStr(walks[0]?.sec||0), cool:runMinStr(s.steps.find(x=>x.t==='cooldown')?.sec||0) };
  }
  return RUI.q[s.id];
}

      </div>`;
    h += coachCardHTML(s);
    h += `<div class="card"><h3>Resultaat registreren</h3>${runResultPicker(s)}
      ${s.status==='done'?`<details class="acc" open><summary>Na de training</summary><div class="acc-body">${runPostForm(s)}</div></details>

      <div class="run-actions">${s.status==='planned'?'':runBtn('reopen|'+s.id,'Weer op "gepland" zetten','sm')}</div></div>`;
  }
  /* Garmin-runs zonder training */
  const linked = runLinkedMap(), legacyIds = new Set(CB.coachRuns.map(r=>r.garminExternalId).filter(Boolean));
  const loose = (state.garmin.activities||[]).filter(a=> runIsRunActivity(a) && !linked[a.externalId] && !legacyIds.has(a.externalId) && a.date>=addDays(today,-60)).sort((x,y)=>(y.startTime||y.date).localeCompare(x.startTime||x.date)).slice(0,8);

    ${loose.map(a=>{ const opts = rp.sessions.filter(x=>x.status==='planned' && Math.abs((parseDate(x.date)-parseDate(a.date))/86400000)<=3).sort(runByDate);
      return `<div class="run-row"><b>${esc(runDateShort(a.date))}</b> · ${a.distanceKm!=null?nl(a.distanceKm)+' km':''} · ${a.durationMin!=null?nl(round(a.durationMin,1))+' min':''}${a.avgHr!=null?' · gem. HR '+a.avgHr:''}
        <div class="run-actions">${opts.map(x=>runBtn('link|'+x.id+'|'+a.externalId,'Koppel aan '+esc(runDateShort(x.date))+' '+esc(x.name),'sm')).join('')}${runBtn('addDoneFrom|'+a.externalId,'Voeg toe als gedane training','sm')}</div></div>`; }).join('')}</div>`;


  return h;
}
/* ---------- invoer-verwerking (komt binnen via setByPath voor '__run.*'-velden) ---------- */
function runSet(parts, raw){
  RUI.msg = ''; const rp = RP(), k = parts[0];
  const bad = t => runMsg(t,'err');
  const numIn = (v,lo,hi) => { const n = num(String(v).replace(',','.')); return (n!=null && n>=lo && n<=hi) ? n : undefined; };
  if(k==='tpl'){
    const t = runTpl(parts[1]); if(!t) return; const f = parts[2]; t.target = t.target || { type:'none', low:null, high:null };
    if(['name','label','description','notes'].includes(f)){ if(f==='name' && !String(raw).trim()) return bad('Een niveau heeft een naam nodig.'); t[f] = String(raw).trim(); }
    else if(['warmupMin','cooldownMin','runMin','walkMin'].includes(f)){ const sec = runParseMin(raw); if(sec==null || (f==='runMin' && sec<=0)) return bad('Vul een geldige duur in, bijvoorbeeld 3, 3,5 of 3:30.'); t[f] = sec/60; }
    else if(f==='reps'){ const n = parseInt(raw,10); if(!(n>=1 && n<=50)) return bad('Het aantal intervallen moet tussen 1 en 50 liggen.'); t.reps = n; }
    else if(f==='intensity'){ if(RUN_INTENS[raw]) t.intensity = raw; }
    else if(f==='tgtType'){ t.target = { type:['hr','pace'].includes(raw)?raw:'none', low:null, high:null }; }
    else if(f==='tgtLow' || f==='tgtHigh'){ const v = t.target.type==='pace' ? paceToSec(String(raw).trim()) : numIn(raw,30,230); if(v==null || v===undefined){ if(String(raw).trim()==='') { t.target[f==='tgtLow'?'low':'high'] = null; return; } return bad(t.target.type==='pace'?'Tempo als m:ss, bijvoorbeeld 6:30.':'Hartslag tussen 30 en 230.'); } t.target[f==='tgtLow'?'low':'high'] = v; }
    else if(f==='minRestDays'){ const n = numIn(raw,0,14); if(n===undefined) return bad('Rustdagen: een getal van 0 t/m 14.'); t.minRestDays = n; }
    else if(f==='goodSessionsToProceed'){ const n = numIn(raw,1,10); if(n===undefined) return bad('Aantal trainingen: een getal van 1 t/m 10.'); t.goodSessionsToProceed = Math.round(n); }
    return;
  }
  if(k==='ses'){
    const s = runSes(parts[1]); if(!s) return; const f = parts[2];
    if(f==='date'){ if(!runValidDate(raw)) return bad('Ongeldige datum.'); s.date = raw; rp.sessions.sort(runByDate); RUI.selId = s.id; }
    else if(f==='name'){ if(!String(raw).trim()) return bad('Geef de training een naam.'); s.name = String(raw).trim(); }
    else if(f==='notes') s.notes = String(raw);
    else if(f==='intensity'){ if(RUN_INTENS[raw]) s.intensity = raw; }
    else if(f==='tgtType'){ s.target = { type:['hr','pace'].includes(raw)?raw:'none', low:null, high:null }; }
    else if(f==='tgtLow' || f==='tgtHigh'){ s.target = s.target || { type:'none' }; const v = s.target.type==='pace' ? paceToSec(String(raw).trim()) : numIn(raw,30,230); if(v==null || v===undefined){ if(String(raw).trim()==='') { s.target[f==='tgtLow'?'low':'high'] = null; return; } return bad(s.target.type==='pace'?'Tempo als m:ss, bijvoorbeeld 6:30.':'Hartslag tussen 30 en 230.'); } s.target[f==='tgtLow'?'low':'high'] = v; }
    else if(f==='manDuration' || f==='manDistance'){ s.manual = s.manual || {}; const v = String(raw).trim()===''?null:numIn(raw,0,1000); if(v===undefined) return bad('Vul een geldig getal in.'); s.manual[f==='manDuration'?'durationMin':'distanceKm'] = v; }
    return;
  }
  if(k==='step'){
    const s = runSes(parts[1]); if(!s || s.status==='done') return; const i = parseInt(parts[2],10), st = s.steps[i]; if(!st) return;
    if(parts[3]==='t'){ if(RUN_STEP[raw]) st.t = raw; }
    else if(parts[3]==='min'){ const sec = runParseMin(raw); if(sec==null || sec<=0) return bad('Vul een duur groter dan 0 in, bijvoorbeeld 3 of 3:30.'); st.sec = sec; }
    return;
  }
  if(k==='q'){ RUI.q = RUI.q || {}; const q = RUI.q[parts[1]] = RUI.q[parts[1]] || {}; q[parts[2]] = String(raw); return; }
  if(k==='pre'){
    const d = parts[1]; if(!runValidDate(d)) return; const c = rp.checks[d] = rp.checks[d] || {}; const f = parts[2];
    // energie is één waarde: dezelfde als in de Ochtendcheck van die dag (kiezen of leegmaken geldt voor allebei)
    if(f==='energy'){ const l = ensureLog(d); if(raw===''){ l.energy = null; delete c.energy; } else { const n = numIn(raw,1,10); if(n===undefined) return bad('Energie: 1 t/m 10.'); l.energy = n; delete c.energy; } }
    else if(f==='painLeft'){ if(raw===''){ delete c.painLeft; } else { const n = numIn(raw,0,10); if(n===undefined) return bad('Pijn: 0 t/m 10.'); c.painLeft = n; } }
    else if(f==='painWalking' || f==='painStairs'){ const b = runBool(raw); if(b===null) delete c[f]; else c[f] = b; }
    else if(f==='note') c.note = String(raw);
    return;
  }
  if(k==='post' || k==='next'){
    const s = runSes(parts[1]); if(!s) return; const o = s[k] = s[k] || {}; const f = parts[2];
    if(f==='rpe' || f==='painDuring' || f==='energy'){ const lo = f==='painDuring'?0:1; if(raw===''){ delete o[f]; } else { const n = numIn(raw,lo,10); if(n===undefined) return bad('Waarde tussen '+lo+' en 10.'); o[f] = n; } }
    else if(f==='painIncreased' || f==='gaitChanged'){ const b = runBool(raw); if(b===null) delete o[f]; else o[f] = b; }
    else if(f==='trend'){ if(['weg','gelijk','toegenomen'].includes(raw)) o.trend = raw; else delete o.trend; }
    else if(f==='note') o.note = String(raw);
    return;
  }
  if(k==='set'){
    const f = parts[1];
    if(f==='planWeeksAhead'){ const n = numIn(raw,1,8); if(n===undefined) return bad('Weken: 1 t/m 8.'); rp.settings.planWeeksAhead = Math.round(n); }
    else if(f==='autoLinkGarmin') rp.settings.autoLinkGarmin = raw==='ja';
    else if(f==='replaceGarminCoach') rp.settings.replaceGarminCoach = raw==='ja';
    else if(f==='physioNote') rp.settings.physioNote = raw==='ja';
    else if(f==='th'){ const n = numIn(raw,0,365); if(n===undefined) return bad('Vul een geldig getal in.'); rp.settings.thresholds[parts[2]] = n; }
    return;
  }
}

/* ---------- knoppen en acties ---------- */
function runAct0(act, args, el){
  const rp = RP(), today = todayISO(); RUI.msg = '';
  const s = args[0] ? runSes(args[0]) : null;
  if(act.startsWith('coach')) return coachAct(act, args);
  switch(act){
    case 'plan': { const t = runTpl(args[1]) || runCurrentTpl(); if(rp.restDays[args[0]]) delete rp.restDays[args[0]]; const n = runPlanOn(args[0], t); if(n && n.id) runMsg(n.name+' ingepland op '+runDateShort(args[0])+'.'); break; }
    case 'planAhead': { const t = runCurrentTpl(), ds = runSuggestionDates(today, (rp.settings.planWeeksAhead||2)+1).filter(d=>d>=today);
      if(!ds.length) return runMsg('Er zijn geen vrije standaarddagen om in te vullen.');
      if(!confirm(ds.length+' training(en) van '+t.name+' inplannen op: '+ds.map(runDateShort).join(', ')+'?\n\nDit zijn voorstellen; je kunt ze altijd verplaatsen, overslaan of verwijderen.')) return;
      ds.forEach(d=>runPlanOn(d,t)); runMsg(ds.length+' trainingen ingepland.'); break; }
    case 'newOnDate': { const d = (document.getElementById('runNewDate')||{}).value; const n = runPlanOn(d, runCurrentTpl()); if(n && n.id) runMsg('Training toegevoegd op '+runDateShort(d)+'.'); break; }
    case 'addDonePrompt': { const d = prompt('Op welke datum heb je getraind? (jjjj-mm-dd)', addDays(today,-1)); if(!d) return; if(!runValidDate(d)) return runMsg('Ongeldige datum.','err'); const n = runPlanOn(d, runCurrentTpl()); n.status = 'done'; n.doneAt = runNow(); n.addedAfterwards = true; const c = runCandidates(d); if(c.length===1) runLinkActivity(n.id, c[0].externalId); RUI.selId = n.id; RUI.tab = 'garmin'; runMsg('Gedane training toegevoegd. Vul hieronder de evaluatie in.'); break; }
    case 'addDoneFrom': { const a = runActivity(args[0]); if(!a) return; const n = runPlanOn(a.date, runCurrentTpl()); n.status = 'done'; n.doneAt = runNow(); n.addedAfterwards = true; runLinkActivity(n.id, a.externalId); RUI.selId = n.id; runMsg('Toegevoegd als gedane training. Vul de evaluatie in als je wilt.'); break; }
    case 'link': { const r = runLinkActivity(args[0], args[1]); if(!r.ok) return runMsg(r.msg,'err'); runMsg('Garmin-run gekoppeld.'); break; }
    case 'unlink': if(s){ s.garminExternalId = null; s.manual = null; s.status = 'planned'; delete s.doneAt; runMsg('Uitvoering ongedaan gemaakt; de training staat weer op "gepland".'); } break;
    case 'doneManual': if(s){ s.status = 'done'; s.doneAt = runNow(); s.manual = s.manual || {}; runMsg('Als uitgevoerd gemarkeerd (zonder Garmin-run).'); } break;
    case 'skip': if(s){ s.status = 'skipped'; runMsg('Overgeslagen. Dit telt niet als uitgevoerd en niet als achteruitgang.'); coachOfferRemove(s); } break;
    case 'cancel': if(s){ s.status = 'cancelled'; runMsg('Geannuleerd.'); coachOfferRemove(s); } break;
    case 'reopen': if(s){ s.status = 'planned'; runMsg('Weer gepland.'); } break;
    case 'del': if(s){ if(s.status==='done') return runMsg('Een uitgevoerde training verwijder je niet.','err'); if(!confirm('Deze geplande training verwijderen?')) return; coachOfferRemove(s); rp.sessions = rp.sessions.filter(x=>x.id!==s.id); if(RUI.selId===s.id) RUI.selId = null; } break;
    case 'move': if(s){ RUI.selId = s.id; RUI.tab = 'edit'; runMsg('Pas de datum hieronder aan.'); } break;
    case 'rest': { const d = args[0]; if(rp.restDays[d]) delete rp.restDays[d]; else { const n = runSessionsOn(d).filter(x=>x.status==='planned').length; if(n && !confirm('Op deze dag staat een geplande training. Rustdag markeren? De training blijft staan; verplaats of annuleer hem zelf.')) return; rp.restDays[d] = true; } break; }
    case 'pause': rp.settings.paused = true; rp.settings.pausedFrom = today; runMsg('Programma gepauzeerd. Er worden geen trainingen voorgesteld.'); break;
    case 'resume': rp.settings.paused = false; rp.settings.pausedFrom = null; runMsg('Programma hervat. Er is niets verschoven; plan zelf nieuwe trainingen in.'); break;
    case 'shift': { const v = prompt('Alle komende geplande trainingen verschuiven met hoeveel dagen? (negatief = eerder)', '7'); if(v==null) return; const n = parseInt(v,10); if(!Number.isFinite(n) || n===0 || Math.abs(n)>60) return runMsg('Vul een aantal dagen in (1 t/m 60).','err'); const c = rp.sessions.filter(x=>x.status==='planned' && x.date>=today).length; if(!c) return runMsg('Er zijn geen komende geplande trainingen.'); if(!confirm(c+' geplande training(en) '+Math.abs(n)+' dag(en) '+(n>0?'later':'eerder')+' zetten?')) return; runMsg(runShiftFuture(n)+' trainingen verschoven.'); rp.sessions.sort(runByDate); break; }
    case 'rebuild': { const t = runCurrentTpl(); const fut = rp.sessions.filter(x=>x.status==='planned' && x.date>=today).length; if(!confirm('Alle komende, nog niet uitgevoerde geplande trainingen ('+fut+') verwijderen en opnieuw voorstellen op basis van '+t.name+'?\n\nUitgevoerde, overgeslagen en geannuleerde trainingen blijven staan.')) return; rp.sessions = rp.sessions.filter(x=>!(x.status==='planned' && x.date>=today)); const ds = runSuggestionDates(today,(rp.settings.planWeeksAhead||2)+1).filter(d=>d>=today); ds.forEach(d=>runPlanOn(d,t)); runMsg('Opnieuw samengesteld: '+ds.length+' trainingen van '+t.name+'.'); break; }
    case 'day': { const k = args[0], a = rp.settings.trainingDays; rp.settings.trainingDays = a.includes(k) ? a.filter(x=>x!==k) : DOW.filter(x=>a.includes(x)||x===k); break; }
    case 'level': { const t = runTpl(args[0]); if(!t) return; if(t.id!==rp.settings.currentTemplateId || args[1]==='handhaven') runSetLevel(t.id, args[1]); runMsg('Huidig niveau: '+t.name+'. Bestaande geplande trainingen zijn niet veranderd.'); break; }
    case 'own': { const d = args[0], c = rp.checks[d] = rp.checks[d] || {}; if(args[1]) c.own = args[1]; else delete c.own; break; }
    case 'sesLevel': runChangeSessionLevel(args[0], args[1]); delete (RUI.q||{})[args[0]]; break;
    case 'rebuildSteps': if(s && s.status!=='done'){ const q = runQ(s), w = runParseMin(q.warm), r = runParseMin(q.run), wa = runParseMin(q.walk), c = runParseMin(q.cool), n = parseInt(q.reps,10);
        if(r==null || r<=0 || !(n>=1 && n<=50) || w==null || wa==null || c==null) return runMsg('Controleer de snelle velden: duur als 3 of 3:30, aantal tussen 1 en 50.','err');
        s.steps = runStepsFromParams({ warmupMin:w/60, reps:n, runMin:r/60, walkMin:wa/60, cooldownMin:c/60 }); runMsg('Stappen opnieuw opgebouwd. Totaal: '+runMinLabel(runTotals(s.steps).total)+'.'); } break;
    case 'resetToTemplate': if(s && s.status!=='done'){ const t = runTpl(s.templateId); if(!t) return runMsg('Het sjabloon bestaat niet meer.','err'); s.steps = runStepsFromParams(t); s.intensity = t.intensity; s.target = { ...(t.target||{type:'none'}) }; delete (RUI.q||{})[s.id]; runMsg('Teruggezet naar de standaard van '+t.name+'.'); } break;
    case 'saveAsLevel': if(s){ const id = 'T'+runId().slice(1); const runs = s.steps.filter(x=>x.t==='run'), walks = s.steps.filter(x=>x.t==='walk');
        const t = { id, name:'Eigen niveau', label:'uit '+s.name, description:'', warmupMin:(s.steps.find(x=>x.t==='warmup')?.sec||0)/60, cooldownMin:(s.steps.find(x=>x.t==='cooldown')?.sec||0)/60, reps:Math.max(1,runs.length), runMin:(runs[0]?.sec||180)/60, walkMin:(walks[0]?.sec||0)/60, intensity:s.intensity||'rustig', target:{ ...(s.target||{type:'none'}) }, minRestDays:2, goodSessionsToProceed:2, notes:'Gemaakt op basis van een aangepaste training (uniforme intervallen).' };
        rp.templates.push(t); RUI.manage = t.id; runMsg('Nieuw niveau "Eigen niveau" toegevoegd (neemt de eerste interval als maat).'); } break;
    case 'stepAdd': if(s && s.status!=='done'){ const idx = s.steps.length && s.steps[s.steps.length-1].t==='cooldown' ? s.steps.length-1 : s.steps.length; s.steps.splice(idx,0,{ t:args[1], sec:args[1]==='run'?180:120 }); } break;
    case 'stepDel': if(s && s.status!=='done'){ if(s.steps.length<=1) return runMsg('Een training heeft minstens één stap.','err'); s.steps.splice(+args[1],1); } break;
    case 'stepDup': if(s && s.status!=='done'){ s.steps.splice(+args[1]+1,0,{ ...s.steps[+args[1]] }); } break;
    case 'stepUp': if(s && s.status!=='done' && +args[1]>0){ const i = +args[1]; [s.steps[i-1],s.steps[i]] = [s.steps[i],s.steps[i-1]]; } break;
    case 'stepDown': if(s && s.status!=='done' && +args[1]<s.steps.length-1){ const i = +args[1]; [s.steps[i+1],s.steps[i]] = [s.steps[i],s.steps[i+1]]; } break;
    case 'tplUp': case 'tplDown': { const i = rp.templates.findIndex(t=>t.id===args[0]), j = act==='tplUp' ? i-1 : i+1; if(i<0 || j<0 || j>=rp.templates.length) return; [rp.templates[i],rp.templates[j]] = [rp.templates[j],rp.templates[i]]; RUI.manage = args[0]; break; }
    case 'tplDup': { const t = runTpl(args[0]); if(!t) return; const c = JSON.parse(JSON.stringify(t)); c.id = 'T'+runId().slice(1); c.name = t.name+' (kopie)'; rp.templates.splice(rp.templates.indexOf(t)+1,0,c); RUI.manage = c.id; break; }
    case 'tplDel': { const t = runTpl(args[0]); if(!t || rp.templates.length<=1) return;
      if(runDefaultTemplates().some(d=>d.id===t.id)) return runMsg('De standaardniveaus A t/m H kun je niet verwijderen. Pas ze aan onder "Aanpassen" als je iets wilt veranderen.', 'err');
      const used = rp.sessions.filter(x=>x.templateId===t.id).length;
      if(used) return runMsg('"'+t.name+'" hoort bij '+used+' training(en) en kan daarom niet worden verwijderd.', 'err');
      if(!confirm('Niveau "'+t.name+'" verwijderen?')) return;
      if(!confirm('Weet je het zeker? "'+t.name+'" wordt definitief verwijderd.')) return;
      rp.templates = rp.templates.filter(x=>x.id!==t.id); if(rp.settings.currentTemplateId===t.id) rp.settings.currentTemplateId = rp.templates[0].id; RUI.manage = null; break; }
    case 'tplEdit': RUI.manage = RUI.manage===args[0] ? null : args[0]; break;
    case 'tplAdd': { const base = runCurrentTpl(); const c = JSON.parse(JSON.stringify(base)); c.id = 'T'+runId().slice(1); c.name = 'Nieuw niveau'; c.label = ''; rp.templates.push(c); RUI.manage = c.id; runMsg('Nieuw niveau toegevoegd (kopie van het huidige). Pas het aan onder "Aanpassen".'); break; }
    case 'edit': RUI.selId = args[0]; RUI.tab = 'edit'; break;
    case 'exportPeriod': { const r = fitExportPeriod(14); if(!r.ok) return runMsg(r.errors.join('; '), 'err');
      dl(new Blob([r.zip],{type:'application/zip'}), 'Atempo_komende_2_weken_'+today+'.zip');
      runMsg(r.files.length+' training(en) in de zip: '+r.files.map(f=>f.title).join(', ')+'. In Intervals.icu: Library (boek-icoon) › drie puntjes › Import workout, daarna elke workout naar de datum in de naam slepen.'); break; }
    case 'exportAllLevels': { const r = fitExportAllLevels(); if(!r.ok) return runMsg('Export geblokkeerd: '+r.errors.join('; '),'err');
      dl(new Blob([r.zip],{type:'application/zip'}), 'Hardlopen_niveaus_FIT.zip'); runMsg('Zip met '+r.files.length+' workouts gedownload ('+r.files.map(f=>f.title).join(', ')+'). Pak hem uit en kopieer de .fit-bestanden naar het horloge (zie de uitleg hieronder).'); break; }
  }
}
/* altijd opslaan en opnieuw tekenen, ook als een actie met een melding eindigt (zodat je die melding ziet) */

  const ra = e.target.closest && e.target.closest('[data-run-open-act]'); if(ra){ e.preventDefault(); const a = runActivity(ra.dataset.runOpenAct); const same = a ? runSessionsOn(a.date)[0] : null; if(same) RUI.selId = same.id; RUI.tab = 'garmin'; RUI.msg = ''; showView('running'); return; }
  const tab = e.target.closest && e.target.closest('[data-run-tab]'); if(tab){ RUI.tab = tab.dataset.runTab; RUI.msg = ''; const v = document.getElementById('view-running'); if(v) v.innerHTML = ''; /* geen open/dicht-stand meenemen naar een ander tabblad */ renderCurrent(); window.scrollTo({top:0}); return; }
  const b = e.target.closest && e.target.closest('[data-run-act]'); if(!b) return;
