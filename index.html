}
/* alle VO₂-max-waarden, één per datum: de Garmin-dagwaarde gaat voor, anders de waarde bij een run.
   (Voorheen won altijd de laatste run met een waarde, ook als Garmin al een nieuwere dagwaarde had.) */
function vo2Points(){
  const m = {};
  allRunRecords().filter(r=>r.done===true).forEach(r=>{ const v = num(r.vo2max); if(v!=null && r.date) m[r.date] = { x:r.date, y:v, src:'run' }; });
  Object.keys(state.garmin.daily).forEach(k=>{ const v = num(state.garmin.daily[k].vo2max); if(v!=null) m[k] = { x:k, y:v, src:'garmin' }; });
  return Object.values(m).sort((a,b)=>a.x.localeCompare(b.x));
}
function latestVo2Point(){ const p = vo2Points(); return p.length ? p[p.length-1] : null; }
function latestVo2(){ const p = latestVo2Point(); return p ? p.y : null; }
/* VO₂-max komt alleen binnen via een Garmin-export; na een week zonder nieuwe import een korte uitleg */
function vo2StaleNote(){
  const lp = latestVo2Point(), imp = state.garmin.meta && state.garmin.meta.lastImportedAt;
  if(!lp) return '';
  const days = Math.round((parseDate(todayISO()) - parseDate(lp.x))/86400000);
  if(days <= 7) return '';
  return `Laatste VO₂-max-waarde is van ${fmt(lp.x,{day:'numeric',month:'long'})}${imp?` (laatste Garmin-import ${new Date(imp).toLocaleDateString('nl-NL',{day:'numeric',month:'long'})})`:''}. Nieuwe waarden komen pas binnen na een nieuwe Garmin-export: Data & backup › Garmin-gegevens laden.`;
}

/* per-oefening krachtgeschiedenis — ALLEEN echte trainingssessies (geen leermomenten) */
function strengthHistory(exId){
  return CB.strengthSessions.filter(s=> s.entries && s.entries[exId])
    .map(s=>({ date:s.date, session:s.session, note:s.note, e:s.entries[exId] }))
    .sort((a,b)=> a.date.localeCompare(b.date));
}
/* leermoment-geschiedenis per oefening (aparte collectie) */
function learningHistory(exId){
  return (CB.learningSessions||[]).filter(x=> x.exerciseId===exId)
    .slice().sort((a,b)=> a.date.localeCompare(b.date));
}
function latestTechniqueStatus(exId){
  const h = learningHistory(exId);
  return h.length ? h[h.length-1].techniqueStatus : null;
}
function parseSetReps(v){ if(v==null) return []; return String(v).split(/[,\s/xX]+/).map(x=>num(x)).filter(x=>x!=null); }
function loadKey(e, side){
  const w = side==='L'?e.weightL : side==='R'?e.weightR : e.weight;
  const reps = parseSetReps(side==='L'?e.setRepsL : side==='R'?e.setRepsR : e.setReps);
  const top = reps.length?Math.min(...reps):null; // laagste set = zwakste; progressie vraagt álle sets aan bovengrens
  return { w:num(w), reps, minReps:top };
}
/* double-progression advies (adviseert, verplicht niets).
   Criterium: 2 vergelijkbare sessies · zelfde gewicht · alle sets aan de bovengrens ·
   techniek goed · reserve over (RIR ≥ 2, of bij ontbreken RPE ≤ 8). */
function progressionAdvice(ex){
  if(ex.kind!=='strength' || !ex.range) return [];
  if(exStage(ex.id) !== 'trainen') return [];   // geen gewichtsprogressie-advies in LEREN of VERTROUWD
  const [lo,hi] = ex.range;
  // overgangsweek-sessies tellen niet mee voor double progression (nog geen officieel programma)
  const hist = strengthHistory(ex.id).filter(h=> !isTransitionDate(h.date));
  const sides = ex.lr ? ['L','R'] : [null];
  const out = [];
  for(const side of sides){
    const rows = hist.map(h=>({ date:h.date, ...loadKey(h.e, side), rir:num(h.e.rir), rpe:num(h.e.rpeLast), tech:h.e.tech }))
                     .filter(r=> r.w!=null && r.reps.length);
    if(rows.length < 2) continue;
    const last2 = rows.slice(-2);
    const sameW  = last2[0].w === last2[1].w;
    const atTop  = last2.every(r=> r.minReps!=null && r.minReps >= hi);
    const techOk = last2.every(r=> r.tech!=='minder');
    const reserveOk = last2.every(r=>{
      if(r.rir!=null) return r.rir >= 2;
      if(r.rpe!=null) return r.rpe <= 8;
      return false;   // geen reserve-informatie → geen advies
    });
    if(sameW && atTop && techOk && reserveOk){
      out.push({ side, msg:`${side?('Zijde '+side+' — '):''}progressiecriterium bereikt: 2 sessies alle sets ${hi}, techniek goed, ~2+ herhalingen in reserve. Hogere weerstand overwegen; daarna terug naar ${lo}–${lo+2}. Jij beslist.` });
    }
  }
  if(ex.lr && out.length===1) out.push({ note:'De zwakkere zijde bepaalt wanneer je het gewicht verhoogt.' });
  return out;
}

/* ===========================================================================
   DEZE-WEEK TRACKER  (fasebewust — leermoment ≠ gemiste krachttraining)
   =========================================================================== */
function weekStatus(wi){
  const ds = weekDates(wi);
  const cfg = weekConfig(wi);
  // alleen expliciet uitgevoerd (done===true) telt; null (onbekend) en false tellen niet mee
  const runsDone = allRunRecords().filter(r=> r.done===true && inWeek(r.date,wi));
  const runsLogged = allRunRecords().filter(r=> inWeek(r.date,wi));
  const wp = weekPlan(wi);
  const prog = runReplacesCoach() ? runWeekInfo(ds) : null;     // eigen hardloopprogramma vervangt de oude Coach-planning
  const coachDays = prog ? prog.days : (Array.isArray(wp.coachDays) ? wp.coachDays : []);
  const coachTarget = prog ? prog.target : (num(wp.coachTarget) ?? (coachDays.length || null));
  const aDone = CB.strengthSessions.some(s=> s.session==='A' && inWeek(s.date,wi));
  const bDone = CB.strengthSessions.some(s=> s.session==='B' && inWeek(s.date,wi));
  const walkWeek = isLongWalkWeek(wi);
  const walkDone = CB.walks.some(w=> inWeek(w.date,wi));
  let routineDays = 0;
  for(const d of ds){ if(routineDoneish(CB.dailyLogs[d])) routineDays++; }
  // leermomenten deze week (voor de focus-oefening + eventuele herhaling van eerder geleerde)
  const learnWeek = (CB.learningSessions||[]).filter(x=> inWeek(x.date,wi));
  const focusLearn = cfg.focusExercise ? learnWeek.filter(x=> x.exerciseId===cfg.focusExercise) : [];
  return {
    wi, dates:ds, walkWeek, cfg,
    coach:{ done:runsDone.length, logged:runsLogged.length, unknown:runsLogged.filter(r=>r.done==null).length, target:coachTarget, days:coachDays, label: coachTarget!=null ? `${runsDone.length} / ${coachTarget}` : `${runsDone.length} uitgevoerd${runsLogged.length>runsDone.length?` · ${runsLogged.length-runsDone.length} onbekend/niet`:''}` },
    strengthA:{ applicable:cfg.strengthA, done:aDone },
    strengthB:{ applicable:cfg.strengthB, done:bDone },
    longWalk:{ done:walkDone, applicable:walkWeek },
    routine:{ done:routineDays, of:7 },
    learning:{
      target: cfg.learningTarget, done: focusLearn.length, total: learnWeek.length,
      focusExercise: cfg.focusExercise,
      focusTech: focusLearn.length ? focusLearn[focusLearn.length-1].techniqueStatus : (cfg.focusExercise ? latestTechniqueStatus(cfg.focusExercise) : null),
      met: !cfg.focusExercise || cfg.learningTarget===0 || focusLearn.length >= cfg.learningTarget,
    },
    openItems: [
      cfg.learningTarget>0 && cfg.focusExercise && focusLearn.length < cfg.learningTarget && `Leermoment ${exName(cfg.focusExercise)}`,
      cfg.strengthA && !aDone && 'Kracht A',
      cfg.strengthB && !bDone && 'Kracht B',
      walkWeek && !walkDone && 'Lange wandeling',
    ].filter(Boolean),
  };
}

/* uitvoering blok (%) — fasebewust: alleen wat het curriculum die week vraagt.
   Leermomenten: soft geteld, geen "achterstand". */

/* uitgevoerde trainingsminuten per week uit ECHT geregistreerde duur; geen verzonnen planning.
   'plan' bevat alleen wat we werkelijk weten (ochtendroutine-richttijd); rest = null → UI toont "—". */
function weekMinutes(wi){
  const ds = weekDates(wi);
  const target = num(CB.routineMinutesTarget) || 45;
  const done = { hardlopen:0, leermomenten:0, kracht:0, ochtendroutine:0, 'lange wandeling':0, avondwandeling:0 };
  let routineDays = 0;
  for(const d of ds){
    const l = CB.dailyLogs[d] || {};
    const rMin = num(l.routineMin);
    // routine 'gedaan' telt als 1 routinedag voor adherence, maar NIET automatisch als
    // exacte trainingsminuten — alleen een echt ingevulde routineMin telt in de minuten.
    if(rMin!=null) done.ochtendroutine += rMin;
    if(rMin!=null || routineDoneish(l)) routineDays++;
    done.avondwandeling += num(l.eveningWalkMin) || 0;
    allRunRecords().filter(r=>r.date===d).forEach(r=> done.hardlopen += num(r.totalMin)||0);
    CB.strengthSessions.filter(s=>s.date===d).forEach(s=> done.kracht += num(s.durationMin)||0);
    (CB.learningSessions||[]).filter(x=>x.date===d).forEach(x=> done.leermomenten += num(x.durationMin)||0);
    CB.walks.filter(w=>w.date===d).forEach(w=> done['lange wandeling'] += num(w.totalMin)||0);
  }
  Object.keys(done).forEach(k=> done[k]=Math.round(done[k]));
  // ochtendroutine-richttijd is een schatting, geen meting → geen 'gepland'-minuten opdringen
  const plan = { hardlopen:null, leermomenten:null, kracht:null, ochtendroutine: null, 'lange wandeling':null, avondwandeling:null };
  const doneTotal = Object.values(done).reduce((a,b)=>a+b,0);
  return { plan, done, routineDays, routineTarget:target, doneTotal };
}

/* Garmin-minuten per week (uit state.garmin.activities), gesplitst in hardlopen / wandelen / overig */
function garminWeekMinutes(wi){
  const ds = new Set(weekDates(wi));
  const out = { run:0, walk:0, other:0 };
  for(const a of (state.garmin.activities||[])){
    if(!ds.has(a.date)) continue;
    const m = num(a.durationMin) || 0;
    if(GARMIN_RUN_TYPES.includes(a.type)) out.run += m; else if(GARMIN_WALK_TYPES.includes(a.type)) out.walk += m; else out.other += m;
  }
  Object.keys(out).forEach(k=> out[k]=Math.round(out[k]));
  return out;
}
/* belastingsconflicten — signaleren, niet blokkeren */
function weekConflicts(wi){
  const ds = weekDates(wi);
  const legDays = new Set();  // datums met (voorgenomen of uitgevoerde) zware beenprikkel
  const learnLegDays = new Set(); // technische leermomenten voor benen (lichte prikkel)
  const wp = weekPlan(wi);
  const LEG_EX = new Set(['goblet-squat','rdl','split-squat','calf-a','calf-b']);
  CB.strengthSessions.filter(s=> inWeek(s.date,wi) && (s.session==='A'||s.session==='B')).forEach(s=> legDays.add(s.date));
  if(wp.strengthADay && !CB.strengthSessions.some(s=>s.session==='A'&&inWeek(s.date,wi))){ const d = ds[DOW.indexOf(wp.strengthADay)]; if(d) legDays.add(d); }
  if(wp.strengthBDay && !CB.strengthSessions.some(s=>s.session==='B'&&inWeek(s.date,wi))){ const d = ds[DOW.indexOf(wp.strengthBDay)]; if(d) legDays.add(d); }
  (CB.learningSessions||[]).filter(x=> inWeek(x.date,wi) && LEG_EX.has(x.exerciseId)).forEach(x=> learnLegDays.add(x.date));
  const runDays = new Set(allRunRecords().filter(r=> inWeek(r.date,wi)).map(r=>r.date));
  const walkDay = (isLongWalkWeek(wi) && wp.longWalkDay) ? ds[DOW.indexOf(wp.longWalkDay)] : null;
  const walkLogged = CB.walks.filter(w=> inWeek(w.date,wi)).map(w=>w.date);
  const walkDays = new Set([...(walkDay?[walkDay]:[]), ...walkLogged]);

  const out = [];
  const near = (a,b)=> Math.abs((parseDate(a)-parseDate(b))/86400000) <= 1;
  const leg = [...legDays].sort();
  for(const d of leg){
    for(const r of runDays){ if(near(d,r) && d!==r) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: zware beenprikkel ligt vlak bij een ${runReplacesCoach()?'hardlooptraining':'Garmin Coach-run'} (${fmt(r,{weekday:'short'})}).`); }
    for(const w of walkDays){ if(near(d,w) && d!==w) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: zware beenprikkel ligt vlak bij de lange wandeling (${fmt(w,{weekday:'short'})}).`); }
  }
  for(let i=1;i<leg.length;i++){ if(near(leg[i-1],leg[i])) out.push(`${fmt(leg[i-1],{weekday:'short'})}–${fmt(leg[i],{weekday:'short'})}: twee zware beenprikkels liggen dicht bij elkaar — las er een rustige dag tussen.`); }
  for(const d of learnLegDays){
    for(const r of runDays){ if(near(d,r) && d!==r) out.push(`${fmt(d,{weekday:'short',day:'numeric',month:'short'})}: technisch leermoment voor de benen ligt vlak bij een ${runReplacesCoach()?'hardlooptraining':'Garmin Coach-run'} (${fmt(r,{weekday:'short'})}) — hou het leermoment dan echt licht.`); }
  }
  return [...new Set(out)];
}

/* ===========================================================================
   RENDER-BOUWSTENEN
   =========================================================================== */
/* velden die string moeten blijven; al het andere wordt Number zodra het een zuiver getal is */
const TEXT_KEYS = new Set(['type','planned','done','tech','note','notes','avgPace','movingPace','bestPace',
  'plannedContent','doneContent','traffic','routineDone','date','startDate','hoofddoel',
  'forwardBendFloor','pushupTech','balanceRvsL','strengthADay','strengthBDay','longWalkDay',
  'setReps','setRepsL','setRepsR',
  'exerciseId','techniqueStatus','loadFeeling','reps','tagline']);
function coerce(key, raw){
  if(raw==='' || raw==null) return null;
  if(key==='longWalkEveryOtherWeek') return raw===true || raw==='ja' || raw==='true';
  // Coach-run 'Uitgevoerd': 3 echte toestanden — true / false / null (leeg = null via bovenstaande)
  if(key==='done') return raw===true||raw==='ja' ? true : raw===false||raw==='nee' ? false : null;
  // Slaapduur: accepteer u:mm (uit de Dagdata-tabel) én decimaal; sla altijd decimaal op
  if(key==='sleepHours' && typeof raw==='string' && /^\s*\d{1,2}:\d{1,2}\s*$/.test(raw)){
    const [h,m] = raw.trim().split(':').map(Number); return round(h + m/60, 4);
  }
  if(TEXT_KEYS.has(key)) return raw;
  if(typeof raw==='number') return raw;
  if(typeof raw==='string' && /^-?\d+(?:[.,]\d+)?$/.test(raw.trim())) return Number(raw.trim().replace(',','.'));
  return raw;
}
function fInput(label,path,val,type='number',extra=''){ return `<div class="field"><label>${esc(label)}</label><input type="${type}" data-bind="${path}" value="${val==null?'':esc(val)}" ${extra}></div>`; }
function fSelect(label,path,val,opts){ return `<div class="field"><label>${esc(label)}</label><select data-bind="${path}">${opts.map(o=>{ const [v,t]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t||'—')}</option>`; }).join('')}</select></div>`; }
function fText(label,path,val,wide=true){ return `<div class="field ${wide?'wide':''}"><label>${esc(label)}</label><textarea data-bind="${path}">${esc(val||'')}</textarea></div>`; }
function pctChange(base,latest){ if(base==null||latest==null||base===0) return null; return round((latest-base)/Math.abs(base)*100,1); }
function deltaCell(base,latest,dir,showPct){
  if(base==null||latest==null) return '<td class="num muted">—</td>';
  const d = latest-base;
  const good = (dir==='down'||dir==='downPace') ? d<0 : d>0;
  const p = showPct ? pctChange(base,latest) : null;
  return `<td class="num ${d===0?'':good?'delta-pos':'delta-neg'}">${(d>0?'+':'')+round(d,2)}${p!=null?` <span class="small">(${p>0?'+':''}${p}%)</span>`:''}</td>`;
}
function lineChart(rows, opts={}){
  const w=opts.w||520, h=opts.h||150, pl=40, pr=12, pt=12, pb=22;
  rows = (rows||[]).filter(r=>r&&r.y!=null);
  if(rows.length<2) return `<div class="small muted">Nog onvoldoende meetpunten (${rows.length}).</div>`;
  const s2 = (opts.series2||[]).filter(r=>r&&r.y!=null);   // optionele tweede reeks; bestaande calls geven dit niet mee
  const all = rows.concat(s2);
  const xs=all.map(r=>parseDate(r.x).getTime()), ys=all.map(r=>r.y);
  let ymin=Math.min(...ys), ymax=Math.max(...ys); if(ymin===ymax){ymin-=1;ymax+=1;}
  const p=(ymax-ymin)*0.12; ymin-=p; ymax+=p;
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const X=t=>pl+(t-xmin)/((xmax-xmin)||1)*(w-pl-pr);
  const Y=v=>pt+(ymax-v)/((ymax-ymin)||1)*(h-pt-pb);
  const poly=(arr)=>arr.map(r=>`${round(X(parseDate(r.x).getTime()),1)},${round(Y(r.y),1)}`).join(' ');
  const yl=v=>opts.invertLabel?secToPace(v):round(v,(ymax-ymin)<5?1:0);
  const gy=[0,.5,1].map(f=>{const v=ymin+(ymax-ymin)*f,y=Y(v);return `<line class="grid" x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${yl(v)}</text>`;}).join('');
  const line2 = s2.length>=2 ? `<polyline fill="none" stroke="${opts.color2||'#2A4560'}" stroke-width="2.8" points="${poly(s2)}"/>` : '';
  // per punt: onzichtbare ruime hover-zone + zichtbare stip; data-tip voedt de zwevende tooltip (#chartTip)
  const fv = v => opts.invertLabel ? secToPace(v) : round(v, 2);
  const dots = (arr, col, op, name) => arr.map(r=>{
    const cx = round(X(parseDate(r.x).getTime()),1), cy = round(Y(r.y),1);
    const t = `${fmt(r.x,{weekday:'short',day:'numeric',month:'long'})} — ${fv(r.y)}${opts.unit?' '+opts.unit:''}${name?` · ${name}`:''}`;
    return `<g class="pt" data-tip="${esc(t)}">`
      + `<circle cx="${cx}" cy="${cy}" r="8" fill="transparent" stroke="transparent"/>`
      + `<circle cx="${cx}" cy="${cy}" r="${s2.length?2:2.6}" fill="${col}"${op?` opacity="${op}"`:''}/></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet">${gy}
    <line class="axis" x1="${pl}" y1="${pt}" x2="${pl}" y2="${h-pb}"/><line class="axis" x1="${pl}" y1="${h-pb}" x2="${w-pr}" y2="${h-pb}"/>
    <polyline fill="none" stroke="${opts.color||'#3D6A92'}" stroke-width="${s2.length?1.5:2.5}" ${s2.length?'opacity="0.55"':''} points="${poly(rows)}"/>
    ${line2}
    ${s2.length ? dots(s2, opts.color2||'#2A4560', 0, opts.name2||'7-daags gemiddelde') : ''}
    ${dots(rows, opts.color||'#3D6A92', s2.length?0.6:0, s2.length?(opts.name1||'dagwaarde'):null)}
    <text x="${pl}" y="${h-6}">${fmt(rows[0].x,{day:'numeric',month:'short'})}</text>
    <text x="${w-pr}" y="${h-6}" text-anchor="end">${fmt(rows[rows.length-1].x,{day:'numeric',month:'short'})}</text></svg>`;
}

/* ===========================================================================
   VIEW: VANDAAG  — antwoord binnen 5 seconden op: wat vandaag / wat deze week / wat registreren
   =========================================================================== */
/* Eén context per dag: wat is vandaag de relevante volgende actie — "less is more".
   Geen black-box: puur datum + fase + planning + bestaande data → één primaire suggestie. */
function getTodayContext(d){
  const inTransition = isTransitionDate(d);
  const wi = weekIndexFor(d);
  const logged = {
    coach: allRunRecords().some(r=>r.date===d),
    learning: (CB.learningSessions||[]).some(x=>x.date===d),
    strengthA: CB.strengthSessions.some(s=>s.date===d && s.session==='A'),
    strengthB: CB.strengthSessions.some(s=>s.date===d && s.session==='B'),
    longwalk: CB.walks.some(w=>w.date===d),
  };
  if(inTransition || wi<0){
    return {
      period: inTransition ? 'transition' : 'before',
      cfg:null, ws:null, focusEx:null,
      title: inTransition ? 'Overgangsweek' : 'Vóór de programmastart',
      subtitle: inTransition ? `programma start ${fmt(blockStart(),{day:'numeric',month:'long'})}` : '',
      primary: null,
      logged, plannedCoach:false,
    };
  }

  const dk = dowKey(d);
  const cfg = weekConfig(wi);
  const ws = weekStatus(wi);
  const wp = weekPlan(wi);
  const focusEx = cfg.focusExercise ? state.exercises.find(x=>x.id===cfg.focusExercise) : null;
  const registeredToday = logged.coach || logged.strengthA || logged.strengthB || logged.longwalk || logged.learning;

  // --- Prioriteit: 1) expliciet op deze dag gepland  2) geregistreerd op deze dag
  //     3) vaste dagspecifieke activiteit (voorstel-dag uit weekplan)  4) openstaand weekdoel = suggestie ---
  const plannedCoach     = runReplacesCoach() ? !!runPlannedOn(d) : coachPlanDays(wi).includes(dk);
  const walkPlannedToday = ws.walkWeek && wp.longWalkDay===dk && !ws.longWalk.done;
  const strengthADayToday = cfg.strengthA && wp.strengthADay===dk && !ws.strengthA.done;
  const strengthBDayToday = cfg.strengthB && wp.strengthBDay===dk && !ws.strengthB.done;

  let primary = null;
  if(registeredToday) primary = null;                    // de kaart(en) tonen het al
  else if(plannedCoach) primary = { type:'coach', minimal:true, label: runReplacesCoach() ? 'Hardlopen — '+((runPlannedOn(d)||{}).name||'training')+' gepland vandaag' : 'Garmin Coach-run — gepland vandaag' };
  else if(walkPlannedToday) primary = { type:'longwalk', label:'Lange wandeling' };
  else if(strengthADayToday) primary = { type:'strengthA', label:'Kracht A' };
  else if(strengthBDayToday) primary = { type:'strengthB', label:'Kracht B' };

  // openstaande weekdoelen — nooit primair, alleen klein/secundair op Vandaag
  const openGoals = [];
  if(focusEx && !ws.learning.met) openGoals.push({ type:'learning', label:`Leermoment ${focusEx.name} leren` });
  if(cfg.strengthA && !ws.strengthA.done && !strengthADayToday) openGoals.push({ type:'strengthA', label:'Kracht A' });
  if(cfg.strengthB && !ws.strengthB.done && !strengthBDayToday) openGoals.push({ type:'strengthB', label:'Kracht B' });
  if(ws.walkWeek && !ws.longWalk.done && !walkPlannedToday) openGoals.push({ type:'longwalk', label:'Lange wandeling' });

  return {
    period:'program', cfg, ws, focusEx, plannedCoach, openGoals,
    learnRelevant: !!(focusEx && !ws.learning.met), walkToday: walkPlannedToday,
    title:`Week ${wi+1} · ${PHASE_LABEL[cfg.phase]||cfg.phase}`,
    primary, logged,
  };
}
/* welke invoerkaarten toont Vandaag: alleen wat al geregistreerd is, of expliciet aangeklikt
   (via de primaire actie of "Iets anders gedaan?") — nooit automatisch een volledig formulier. */
function todayCards(d){
  const set = new Set();
  if(ui.addOn===d && ui.addType) set.add(ui.addType);
  if(allRunRecords().some(r=>r.date===d)) set.add('coach');
  CB.strengthSessions.filter(s=>s.date===d).forEach(s=> set.add(s.session==='A'?'strengthA':'strengthB'));
  if(CB.walks.some(w=>w.date===d)) set.add('longwalk');
  if((CB.learningSessions||[]).some(x=>x.date===d)) set.add('learning');
  return [...set];
}

/* "Iets anders gedaan? / training aanpassen" — beheerpaneel voor bestaande records.
   Toont bewust alleen: records op de bekeken dag, plus records die (verkeerd) op een
   datum ná vandaag staan (kan niet kloppen). Geen brede ±week-lijst meer — dat gaf
   ruis met trainingen die gewoon goed staan. Nieuwe activiteit toevoegen kan ook. */
function otherActivitiesPanel(d, opts){
  opts = opts || {};
  const isFuture = !!opts.isFuture;
  const cardsToday = opts.cardsToday || [];
  const primaryType = opts.primaryType || null;
  [['c',CB.coachRuns],['s',CB.strengthSessions],['w',CB.walks],['l',CB.learningSessions]].forEach(([pre,arr])=>{
    (arr||[]).forEach(r=>{ if(!r.id) r.id = pre + Date.now().toString(36) + Math.random().toString(36).slice(2,6); });
  });
  const dashJoin = a => a.filter(Boolean).join(' · ');
  const relevant = dt => dt===d || dt>todayISO();
  const nearby = [];
  CB.coachRuns.forEach(r=>{ if(relevant(r.date)){
    const ga = r.garminExternalId ? (state.garmin.activities||[]).find(a=>a.externalId===r.garminExternalId) : null;
    nearby.push({kind:'coach', id:r.id, date:r.date, label:'Garmin Coach-run', tint:'#bcd6e5',
      detail: dashJoin([r.distanceKm!=null?`${nl(r.distanceKm)} km`:null, r.totalMin!=null?`${nl(r.totalMin)} min`:null, r.avgPace||null, r.avgHr!=null?`HR ${nl(r.avgHr)}`:null, r.maxHr!=null?`max ${nl(r.maxHr)}`:null, r.vo2max!=null?`VO₂ ${nl(r.vo2max)}`:null]),
      srcNote: ga ? `Uit Garmin-import — activiteit van ${fmt(ga.date,{weekday:'short',day:'numeric',month:'long'})}${ga.startTime?', '+ga.startTime.slice(11,16):''}` : (r._source && String(r._source).startsWith('garmin') ? 'Uit Garmin-import' : null),
      garminDate: ga && ga.date!==r.date ? ga.date : null });
  }});
  (CB.learningSessions||[]).forEach(x=>{ if(relevant(x.date)) nearby.push({kind:'learning', id:x.id, date:x.date, label:'Leermoment', tint:'#BFDCC9',
    detail: dashJoin([exName(x.exerciseId), x.durationMin!=null?`${nl(x.durationMin)} min`:null]) }); });
  CB.strengthSessions.forEach(s=>{ if(relevant(s.date)) nearby.push({kind:'strength', id:s.id, date:s.date, label:`Kracht ${s.session}`, tint:'#d5c8e6',
    detail: s.durationMin!=null?`${nl(s.durationMin)} min`:'' }); });
  CB.walks.forEach(w=>{ if(relevant(w.date)) nearby.push({kind:'walk', id:w.id, date:w.date, label:'Lange wandeling', tint:'#e6d9a8',
    detail: dashJoin([w.distanceKm!=null?`${nl(w.distanceKm)} km`:null, w.totalMin!=null?`${nl(w.totalMin)} min`:null]) }); });
  nearby.sort((a,b)=> a.date.localeCompare(b.date) || a.label.localeCompare(b.label));

  const otherTypes = [
    ['learning','+ Leermoment'], ['coach','+ Hardlopen (handmatig)'], ['longwalk','+ Lange wandeling'],
    ['strengthA','+ Kracht A'], ['strengthB','+ Kracht B'],
  ].filter(([t])=> !cardsToday.includes(t) && t!==primaryType);

  const hasFut = nearby.some(n=>n.date>todayISO());
  if(!nearby.length && !(otherTypes.length && !isFuture)) return '';
  let html = `<details class="acc"${hasFut?' open':''}><summary>Iets anders gedaan? / training aanpassen</summary><div class="acc-body">`;
  if(nearby.length){
    html += `<p class="tny muted" style="margin-top:0">${hasFut
      ? 'Een training kan niet op een datum in de toekomst staan — verzet naar de juiste dag of verwijder:'
      : 'Op deze dag geregistreerd — verzet naar de juiste dag of verwijder:'}</p>`;
    html += nearby.map(n=>{
      const moving = ui.moveOn && ui.moveOn.kind===n.kind && ui.moveOn.id===n.id;
      const fut = n.date>todayISO();
      return `<div style="border:1px solid var(--line2);border-left:3px solid ${n.tint};border-radius:10px;padding:10px 12px;margin:8px 0">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline">
          <b>${esc(n.label)}</b>
          <span class="tny muted">${esc(fmt(n.date,{weekday:'long',day:'numeric',month:'long'}))}${n.date===d?' · deze dag':(fut?' · staat in de toekomst':'')}</span>
        </div>
        ${n.detail?`<div class="small muted" style="margin-top:2px">${esc(n.detail)}</div>`:''}
        ${n.srcNote?`<div class="tny muted" style="margin-top:2px">${esc(n.srcNote)}</div>`:''}
        <div class="chips" style="margin-top:8px">
          ${moving
            ? `<input type="date" id="moveDateInput" value="${n.date}" max="${todayISO()}"><button class="btn primary sm" data-move-save="${n.kind}|${n.id}">Opslaan</button><button class="btn sm" data-move-cancel>Annuleren</button>`
            : `${n.garminDate?`<button class="btn primary sm" data-move-save-to="${n.kind}|${n.id}|${n.garminDate}">Zet op ${esc(fmt(n.garminDate,{day:'numeric',month:'long'}))} (Garmin-datum)</button>`:''}<button class="btn sm" data-move-start="${n.kind}|${n.id}">${n.garminDate?'Andere datum':'Verzetten'}</button><button class="btn danger sm" data-move-delete="${n.kind}|${n.id}">Verwijderen</button>`}
        </div>
      </div>`;
    }).join('');
  }
  if(otherTypes.length && !isFuture){
    html += `<p class="tny muted"${nearby.length?'':' style="margin-top:0"'}>Nog niet geregistreerd — toevoegen:</p>
      <div class="addbar">${otherTypes.map(([t,label])=>`<button class="btn sm" data-add="${t}|${d}">${esc(label)}</button>`).join('')}</div>`;
  }
  html += `</div></details>`;
  return html;
}

function renderToday(){
  const d = ui.date;
  const l = CB.dailyLogs[d] || {};
  const checks = l.checks || {};
  const ctx = getTodayContext(d);
  const cfg = ctx.cfg, ws = ctx.ws, focusEx = ctx.focusEx;
  const isFuture = d > todayISO();

  const eyebrow = ctx.period==='program'
    ? ctx.title
    : ctx.title + (ctx.subtitle ? ` · ${ctx.subtitle}` : '');

  let html = `<div class="pagehead">
    <div class="eyebrow">${esc(eyebrow)}</div>
    <h2>${d===todayISO()?'Vandaag':fmt(d,{weekday:'long',day:'numeric',month:'long'})}</h2>
  </div>`;

  if(ctx.period==='transition'){
    html += `<p class="tny muted" style="margin:-6px 0 10px">Overgangsweek (31 aug – 6 sep): je was actief, maar het 12-weeks programma liep nog niet — telt niet mee in adherence, leermomenten of Kracht-doelen. Ontbrekende details worden nooit achteraf ingevuld.</p>`;
  }

  html += `<div class="section-title no-print" style="margin-top:0"><div class="chips">
      <button class="btn sm" data-nav-day="-1">←</button>
      <input class="btn sm" type="date" data-bind="__date" value="${d}" style="min-width:140px">
      <button class="btn sm" data-nav-day="1">→</button>
      <button class="btn sm" data-nav-today>Vandaag</button>
  </div></div>`;

  if(!isFuture && (ctx.period==='program' || ctx.period==='transition')){
    snapshotAdvice(d);
    html += dayAdviceBlock(d, ctx.primary ? ctx.primary.type : null);
  }

  /* ---- DAG IN DE TOEKOMST: ingeklapt houden (less is more) ---- */
  if(isFuture){
    const wiF = weekIndexFor(d);
    const dkF = dowKey(d);
    const plannedC = wiF>=0 && coachPlanDays(wiF).includes(dkF);
    html += `<div class="card"><div class="answer"><div class="seg">
      <h4>${esc(fmt(d,{weekday:'long',day:'numeric',month:'long'}))}</h4>
      <div class="small muted">Dag in de toekomst. ${plannedC?'<b>'+runCoachWord()+' gepland.</b> ':''}Registreren kan op de dag zelf.</div>
      ${ctx.focusEx?`<div class="tny muted" style="margin-top:6px">Focus die week: ${esc(ctx.focusEx.name)} leren</div>`:''}
      ${wiF>=0 && !runReplacesCoach()?`<div class="chips" style="margin-top:10px">
        <button class="btn sm ${plannedC?'active':''}" data-coach-day="${wiF}|${dkF}">${plannedC?'✓ Coach-run gepland — weghalen':'+ Coach-run plannen op deze dag'}</button>
      </div>`:''}
    </div></div></div>`;
    html += otherActivitiesPanel(d, { isFuture:true, cardsToday:todayCards(d), primaryType:null });
    setViewHTML('#view-today', html);
    return;
  }

  /* ---- VANDAAG: één primaire actie, context-gedreven ---- */
  const routineDoneVal = l.routineDone || (checks.routine ? 'ja' : '');
  const routineChecked = routineDoneVal==='ja' || routineDoneVal==='deels';
  html += `<div class="card"><div class="answer">
    <div class="seg"><h4>Ochtend</h4><div class="lines">
      <label><input type="checkbox" data-check="spiritual"${checks.spiritual?' checked':''}> Meditatie · contemplatie · gebed</label>
      <label><input type="checkbox" data-routine-check${routineChecked?' checked':''}> Bestaande fysieke ochtendroutine (~${num(CB.routineMinutesTarget)||45} min)</label>
      ${routineChecked ? `<label class="tny muted" style="margin-left:26px"><input type="checkbox" data-routine-deels${routineDoneVal==='deels'?' checked':''}> deels / afwijkend uitgevoerd</label>` : ''}
    </div></div>`;
  if(ctx.primary){
    const p = ctx.primary;
    html += `<div class="seg"><h4>Vandaag</h4>
      <div class="big">${esc(p.label)}</div>
      <div class="chips" style="margin-top:8px">
        ${(p.type==='coach' && runReplacesCoach()) ? `<button class="btn primary" data-run-open="${(runPlannedOn(d)||{}).id||''}">Training openen</button>` : `<button class="btn ${p.minimal?'sm':'primary'}" data-add="${p.type}|${d}">${p.minimal?'Run registreren':'Registreren'}</button>
        ${p.type==='coach' && p.minimal ? `<a href="#" class="tny muted" style="align-self:center" data-coach-unplan="${d}">niet vandaag</a>` : ''}`}
      </div>
    </div>`;
  } else if(ctx.period==='program' && !ctx.logged.coach && !ctx.logged.strengthA && !ctx.logged.strengthB && !ctx.logged.longwalk && !ctx.logged.learning){
    html += `<div class="seg"><h4>Vandaag</h4><div class="small muted">Niets specifieks gepland — ochtendroutine is voldoende.${weekIndexFor(d)>=0 && !coachPlanDays(weekIndexFor(d)).length ? ' <a href="#" data-view="week">Coach-loopdagen voor deze week instellen →</a>' : ''}</div></div>`;
  }
  // openstaande weekdoelen — klein en secundair, nooit als primaire taak
  if((ctx.openGoals||[]).length){
    const tech = focusEx ? ws.learning.focusTech : null;
    html += `<div class="seg"><div class="tny muted">Openstaand deze week (geen verplichting voor vandaag):
      ${ctx.openGoals.map(gl=>`<a href="#" class="tny" data-add="${gl.type==='learning'?'learning':gl.type}|${d}" style="margin-left:6px">+ ${esc(gl.label)}</a>`).join(' ·')}
      ${tech && tech!=='vertrouwd' ? `<br>Techniek ${esc(focusEx.name)} tot nu toe: <b>${esc(tech)}</b> — rustig blijven oefenen.` : ''}
    </div></div>`;
  }
  // coach los gepland naast een reeds geregistreerde andere activiteit
  if(ctx.plannedCoach && !ctx.logged.coach && ctx.primary && ctx.primary.type!=='coach'){
    html += `<div class="seg"><div class="small">Ook gepland vandaag: <b>${runCoachWord()}</b>
      <div class="chips" style="margin-top:6px">
        ${runReplacesCoach() ? `<button class="btn sm" data-run-open="${(runPlannedOn(d)||{}).id||''}">Training openen</button>` : `<button class="btn sm" data-add="coach|${d}">Run registreren</button>
        <a href="#" class="tny muted" style="align-self:center" data-coach-unplan="${d}">niet vandaag</a>`}
      </div></div></div>`;
  }
  html += `<div class="seg"><div class="lines">
      <label><input type="checkbox" data-check="eveningWalk"${checks.eveningWalk?' checked':''}> Wandeling — optioneel, naar behoefte</label>
      ${checks.eveningWalk ? `<div style="margin-top:6px;max-width:160px">${fInput('Duur (min)','currentBlock.dailyLogs.'+d+'.eveningWalkMin', l.eveningWalkMin,'number','inputmode="numeric"')}</div>` : ''}
    </div></div>`;
  html += `</div></div>`;

  /* ---- invoer hoort bij het Ochtend-blok: eerst de ochtendcheck, dan het routine-detail ---- */
  html += ochtendcheckCard();
  html += routineDetailCard(d);

  /* ---- WAT AL GEREGISTREERD IS ---- */
  const cardsToday = todayCards(d);
  for(const c of cardsToday){
    if(c==='coach') html += coachCard(d);
    if(c==='learning') html += learningCard(d);
    if(c==='strengthA') html += strengthCard(d,'A');
    if(c==='strengthB') html += strengthCard(d,'B');
    if(c==='longwalk') html += walkCard(d);
  }

  /* ---- IETS ANDERS GEDAAN? / TRAINING AANPASSEN ---- */
  html += otherActivitiesPanel(d, { isFuture:false, cardsToday, primaryType: ctx.primary ? ctx.primary.type : null });

  /* ---- DEZE WEEK (fasebewust, alleen tijdens het programma) ---- */
  if(ctx.period==='program'){
    const cl = ok=> ok?'ok':'todo';
    const wiT = weekIndexFor(d);
    const cDays = coachPlanDays(wiT);
    let rows = `<div class="row"><span class="k">${runCoachWord()}</span><span class="v">${cDays.length?esc(cDays.map(k=>DOW_NL[k]).join(' · ')):(runReplacesCoach()?'geen training gepland':'geen loopdagen ingevuld')} · ${esc(ws.coach.label)}</span></div>`;
    if(ws.learning.target>0 && ws.learning.focusExercise){
      rows += `<div class="row"><span class="k">Leermoment ${esc(exName(ws.learning.focusExercise))}</span><span class="v ${ws.learning.met?'ok':'todo'}">${ws.learning.done>0?`${ws.learning.done}× gedaan`:'deze week'}</span></div>`;
    } else if(cfg.consolidation){
      rows += `<div class="row"><span class="k">Nieuwe oefening</span><span class="v na">geen deze week</span></div>`;
    }
    if(ws.strengthA.applicable) rows += `<div class="row"><span class="k">Kracht A</span><span class="v ${cl(ws.strengthA.done)}">${ws.strengthA.done?'✓ gedaan':'nog te doen'}</span></div>`;
    if(ws.strengthB.applicable) rows += `<div class="row"><span class="k">Kracht B</span><span class="v ${cl(ws.strengthB.done)}">${ws.strengthB.done?'✓ gedaan':'nog te doen'}</span></div>`;
    rows += `<div class="row"><span class="k">Lange wandeling</span><span class="v ${ws.longWalk.applicable?cl(ws.longWalk.done):'na'}">${ws.longWalk.applicable?(ws.longWalk.done?'✓ gedaan':'nog te doen'):'niet deze week'}</span></div>`;
    rows += `<div class="row"><span class="k">Ochtendroutine</span><span class="v">${ws.routine.done} / 7</span></div>`;
    html += `<div class="card"><h3>Deze week <span class="sub">${esc(ctx.title)}</span></h3><div class="week-track">${rows}</div>
    ${wiT>=0 && !runReplacesCoach()?`<div class="tny muted" style="margin-top:10px">Coach-loopdagen deze week — jouw planning, tussendoor aanpasbaar:</div>${coachDayChips(wiT)}`:''}
    ${runReplacesCoach()?`<div class="tny muted" style="margin-top:10px">Hardlooptrainingen plan je onder <a href="#" data-view="running">Hardlopen</a>.</div>`:''}
    <p class="tny muted" style="margin-top:8px"><a href="#" data-view="week">Week openen →</a></p></div>`;
  }

  /* ---- OCHTENDCHECK (minimaal, rest achter uitklap) ---- */
  function ochtendcheckCard(){
  const g = state.garmin.daily[d];
  // korte stand in de kop, zodat je ook ingeklapt ziet wat er al staat
  const ocBits = [ l.energy!=null&&l.energy!=='' ? 'energie '+l.energy : null, l.stiffness!=null&&l.stiffness!=='' ? 'stijfheid '+l.stiffness : null,
                   l.pain!=null&&l.pain!=='' ? 'pijn '+l.pain : null, l.weightKg!=null&&l.weightKg!=='' ? nl(l.weightKg)+' kg' : null ].filter(Boolean);
  return `<details class="acc"><summary>Ochtendcheck <span class="tny muted" style="font-weight:400">· ${ocBits.length ? esc(ocBits.join(' · ')) : 'nog niet ingevuld'}</span></summary><div class="acc-body">
    <div class="form-grid cols-4">
      ${fInput('Energie 1–10','currentBlock.dailyLogs.'+d+'.energy', l.energy,'number','inputmode="numeric" min="1" max="10"')}
      ${fInput('Spierpijn/stijfheid 0–10','currentBlock.dailyLogs.'+d+'.stiffness', l.stiffness,'number','inputmode="numeric" min="0" max="10"')}
      ${fInput('Pijn 0–10','currentBlock.dailyLogs.'+d+'.pain', l.pain,'number','inputmode="numeric" min="0" max="10"')}
      ${fInput('Gewicht (kg)','currentBlock.dailyLogs.'+d+'.weightKg', l.weightKg,'number','inputmode="decimal" step="0.1"')}
    </div>
    <p class="tny muted" style="margin-top:6px">Energie, stijfheid en pijn van vandaag voeden het <b>Dagadvies</b> bovenaan. Een geregistreerde 0 (bv. geen pijn) is een geldige waarde.</p>
    <details class="acc"><summary>Meer — slaap, HRV/RHR, notities</summary><div class="acc-body">
      ${g ? `<p class="tny" style="color:var(--green)">✓ Garmin beschikbaar voor deze dag — HRV ${nl(g.nightHrv)} ms · RHR ${nl(g.restingHr)} · slaap ${nl(g.sleepDuration)} u. Hieronder alleen invullen als je handmatig wilt afwijken/aanvullen.</p>` : ''}
      <div class="form-grid cols-4">
        ${fInput('HRV nacht (ms)','currentBlock.dailyLogs.'+d+'.hrv', l.hrv,'number','inputmode="numeric"')}
        ${fInput('RHR (bpm)','currentBlock.dailyLogs.'+d+'.restingHr', l.restingHr,'number','inputmode="numeric"')}
        ${fInput('Slaap (uur)','currentBlock.dailyLogs.'+d+'.sleepHours', l.sleepHours,'number','inputmode="decimal" step="0.25"')}
        ${fInput('Slaapscore (Garmin)','currentBlock.dailyLogs.'+d+'.sleepScore', l.sleepScore,'number','inputmode="numeric"')}
      </div>
      ${fText('Notities','currentBlock.dailyLogs.'+d+'.notes', l.notes)}
      <h4>Herstelbeeld — 7 kalenderdagen</h4>
      <div class="recovery-strip">
        ${[['HRV','hrv','ms'],['RHR','restingHr',''],['Slaap','sleepHours','u'],['Energie','energy','/10'],['Spierpijn','stiffness','/10'],['Pijn','pain','/10']]
          .map(([lab,k,u])=>{ const r=recent7(k); return `<div class="rc"><b>${r.value==null?'—':nl(round(r.value, k==='sleepHours'?1:0))}</b><span>${lab} ${u}<br>${r.n}/7</span></div>`; }).join('')}
      </div>
    </div></details>
  </div></details>`;
  }

  /* ---- compacte cijferstrip: alleen relevant zodra het programma loopt ---- */
  if(ctx.period==='program'){
    const asym = biggestAsymmetry();
    const e7 = recent7('energy');
    const bits = [];
    if(latestVo2()!=null) bits.push({label:'VO₂-max', value:nl(latestVo2()), sub:'laatste meting '+fmt(latestVo2Point().x,{day:'numeric',month:'short'})});
    if(latestContinuous()!=null) bits.push({label:'Aaneengesloten looptijd', value:nl(latestContinuous()), sub:`min · richting ${nl(CB.goalDistanceKm)} km`});
    if(e7.value!=null) bits.push({label:'Ochtendenergie', value:nl(round(e7.value,1)), sub:`${e7.n}/7 dagen`});
    if(asym) bits.push({label:'Grootste asymmetrie W0', value:nl(asym.val), sub:esc(asym.label)});
    if(bits.length) html += `<div class="grid cols-4">${bits.map(b=>`<div class="metric"><div class="label">${esc(b.label)}</div><div class="value">${b.value}</div><div class="sub">${b.sub}</div></div>`).join('')}</div>`;
  }

  setViewHTML('#view-today', html);
}
/* ===========================================================================
   DAGADVIES v1 — transparant, regelgebaseerd, geen black box, blokkeert niets.
   VANDAAG-waarden (energie/stijfheid/pijn) zijn primair; slaap + 7-daagse
   HRV/RHR-trend zijn context. Schalen: energie hoger = gunstiger; stijfheid
   en pijn hoger = ongunstiger. Historische waarden worden nooit geïnverteerd.
   =========================================================================== */
const ADVICE_VERSION = 1;
const ADVICE_LABEL = { green:'Normaal belastbaar', orange:'Verminderde belastbaarheid', red:'Herstel heeft prioriteit' };
const ADVICE_EMOJI = { green:'🟢', orange:'🟠', red:'🔴' };
function adviceInputs(d){
  const l = CB.dailyLogs[d] || {};
  const g = state.garmin.daily[d] || {};
  return {
    energy: num(l.energy), stiffness: num(l.stiffness), pain: num(l.pain),
    sleepHours: num(l.sleepHours) ?? num(g.sleepDuration),
    hrv7: r7('hrv', d), rhr7: r7('restingHr', d),
  };
}
function dayAdvice(d){
  const inp = adviceInputs(d);
  const base = HISTORICAL.baselineSummary || {};
  const reasons = [];   // { sev:'strong'|'moderate'|'info'|'good', text }
  const add = (sev,text)=> reasons.push({ sev, text });
  const { energy:e, stiffness:st, pain:pn, sleepHours:sl, hrv7, rhr7 } = inp;
  if(e!=null){
    if(e<=3) add('strong', `energie laag (${nl(e)}/10)`);
    else if(e===4) add('moderate', `energie aan de lage kant (4/10)`);
    else if(e>=7) add('good', `energie goed (${nl(e)}/10)`);
  }
  if(st!=null){
    if(st>=7) add('strong', `stijfheid hoog (${nl(st)}/10)`);
    else if(st>=5) add('moderate', `stijfheid verhoogd (${nl(st)}/10)`);
    else if(st<=2) add('good', `weinig stijfheid (${nl(st)}/10)`);
  }
  if(pn!=null){
    if(pn>=4) add('strong', `pijn (${nl(pn)}/10)`);
    else if(pn>=2) add('moderate', `lichte pijn (${nl(pn)}/10)`);
    else if(pn===0) add('good', `geen pijn`);
  }
  if(sl!=null){
    if(sl<5.5) add('moderate', `korte slaap (${nl(round(sl,1))} u)`);
    else if(sl<6.5) add('info', `slaap aan de korte kant (${nl(round(sl,1))} u)`);
  }
  if(rhr7!=null && base.rhrAvg!=null && rhr7 > base.rhrAvg+5) add('info', `RHR-trend > 5 bpm boven historisch gemiddelde`);
  if(hrv7!=null && base.hrvAvg!=null && hrv7 < base.hrvAvg-10) add('info', `HRV-trend duidelijk onder historisch gemiddelde`);

  const strong = reasons.filter(r=>r.sev==='strong').length;
  const moderate = reasons.filter(r=>r.sev==='moderate').length;
  const hasCore = e!=null || st!=null || pn!=null;

  let status = null;
  if(hasCore){
    if(strong>=2 || (pn!=null && pn>=6)) status = 'red';
    else if(strong>=1 || moderate>=2) status = 'orange';
    else status = 'green';
  }
  return {
    status, label: status ? ADVICE_LABEL[status] : 'Nog niet te bepalen',
    emoji: status ? ADVICE_EMOJI[status] : '⚪',
    reasons, inputs: inp, version: ADVICE_VERSION,
    summary: status ? reasons.filter(r=>['strong','moderate','good'].includes(r.sev)).slice(0,3).map(r=>r.text).join(' · ') : 'vul energie / stijfheid / pijn in',
  };
}
/* per activiteit: wat betekent dit advies concreet — nooit blokkerend */
function adviceForActivity(status, primaryType){
  if(status==='red') return 'Geen normale trainingsprikkel adviseren. Jij beslist of en wat je vandaag doet.';
  if(status==='orange'){
    if(primaryType==='coach') return 'Begin rustig; beperk zo nodig duur of intensiteit.';
    if(primaryType==='learning') return 'Kort en technisch rustig uitvoeren.';
    if(primaryType==='strengthA'||primaryType==='strengthB') return 'Verlaag zo nodig volume of gewicht; techniek eerst.';
    if(primaryType==='longwalk') return 'Rustig tempo, kort houden indien nodig.';
    return 'Rustiger aan; volume of intensiteit eventueel beperken.';
  }
  return primaryType ? 'Normaal uitvoeren.' : 'Ochtendroutine is voldoende.';
}
/* snapshot: bewaar het advies + de inputs waarop het is gebaseerd. Alleen
   (her)schrijven als de inputs veranderd zijn of er nog geen snapshot is —
   geen retroactieve herberekening van oude dagen zonder reden. */
function snapshotAdvice(d){
  if(d > todayISO()) return;
  const a = dayAdvice(d);
  if(!a.status && !(CB.dailyLogs[d] && CB.dailyLogs[d].advice)) return;
  const l = ensureLog(d);
  const key = JSON.stringify(a.inputs);
  if(l.advice && l.advice.inputsKey === key && l.advice.version === a.version) return;
  l.advice = { status:a.status, reasons:a.reasons.map(r=>r.text), version:a.version, inputs:a.inputs, inputsKey:key, computedAt: new Date().toISOString() };
}
/* strengste van automatisch advies en eigen beoordeling (rood > oranje > groen): een eigen beoordeling
   kan het advies strenger maken, maar een automatische waarschuwing nooit wegnemen. Zonder automatisch
   advies telt de eigen beoordeling. Alleen voor weergave: opgeslagen gegevens worden niet aangepast. */
const STATUS_RANK = { green:0, orange:1, red:2 };
function strictestStatus(auto, own){
  if(!(own in STATUS_RANK)) return auto || null;
  if(!(auto in STATUS_RANK)) return own;
  return STATUS_RANK[own] > STATUS_RANK[auto] ? own : auto;
}
/* effectieve dagstatus voor historie/tellingen: de strengste van het bewaarde advies en je eigen beoordeling */
function effectiveDayStatus(d){
  const l = CB.dailyLogs[d]; if(!l) return null;
  return strictestStatus(l.advice && l.advice.status, l.traffic);
}
/* -- alleen nog voor de Progressie › Herstel-trend (beschrijvend, geen advies) -- */
function recoveryFlags(){
  const e=r7('energy'), st=r7('stiffness'), sl=r7('sleepHours'), rh=r7('restingHr'), hv=r7('hrv');
  const base=HISTORICAL.baselineSummary||{};
  const out=[];
  if(e!=null && e<5) out.push('ochtendenergie < 5');
  if(st!=null && st>=5) out.push('spierpijn/stijfheid ≥ 5');
  if(sl!=null && sl<6.5) out.push('slaap < 6,5 u');
  if(rh!=null && base.rhrAvg!=null && rh > base.rhrAvg+4) out.push('RHR > 4 bpm boven historisch gemiddelde');
  if(hv!=null && base.hrvAvg!=null && hv < base.hrvAvg-8) out.push('HRV duidelijk onder historisch gemiddelde');
  return out;
}
function recoveryLabel(){
  const n = recoveryFlags().length;
  return n>=2 ? 'meerdere hersteltrends wijken af van je historische gemiddelde'
       : n===1 ? 'één hersteltrend wijkt af van je historische gemiddelde'
       : 'hersteltrends in lijn met je historische gemiddelde';
}
/* Dagadvies-blok op Vandaag: automatisch advies + "Waarom?" + koppeling aan de
   geplande activiteit + ruimte voor je eigen afwijkende beoordeling. */
function dayAdviceBlock(d, primaryType){
  const a = dayAdvice(d);
  const l = CB.dailyLogs[d] || {};
  const own = l.traffic && DAY_STATUS[l.traffic] ? l.traffic : null;
  if(!a.status){
    return `<div class="dagadvies">
      <div class="lbl">Dagadvies</div>
      <div class="status">⚪ Nog niet te bepalen</div>
      <div class="sub">vul energie, stijfheid en pijn in bij de Ochtendcheck</div>
    </div>`;
  }
  const ownPanel = own
    ? `<div class="panel">Jouw beoordeling: <b>${DAY_STATUS[own].emoji} ${esc(DAY_STATUS[own].label)}</b>${own!==a.status?' — wijkt af van het automatische advies':', gelijk aan het advies'}. <a href="#" data-own-clear="${d}">wissen</a></div>`
    : `<div class="panel">Eigen inschatting kiezen (staat los van het automatische advies):
        <span class="own-row">${['green','orange','red'].map(s=>`<a href="#" data-own-set="${d}|${s}" title="${esc(DAY_STATUS[s].label)}">${DAY_STATUS[s].emoji}</a>`).join('')}</span></div>`;
  const shown = strictestStatus(a.status, own);
  const stricterOwn = shown!==a.status, milderOwn = !!own && STATUS_RANK[own] < STATUS_RANK[a.status];
  return `<div class="dagadvies st-${shown}">
    <div class="lbl">Dagadvies${own&&own!==a.status?` <span class="own-tag">eigen ${DAY_STATUS[own].emoji}</span>`:''}</div>
    <div class="status">${stricterOwn ? `${DAY_STATUS[shown].emoji} ${esc(DAY_STATUS[shown].label)}` : `${a.emoji} ${esc(a.label)}`}</div>
    <div class="sub">${stricterOwn ? `Jouw eigen beoordeling is strenger dan het automatische advies (${a.emoji} ${esc(a.label)}).` : esc(a.summary)}</div>
    ${milderOwn ? `<div class="sub">Je eigen beoordeling (${DAY_STATUS[own].emoji} ${esc(DAY_STATUS[own].label)}) wijkt af van de automatische waarschuwing. De waarschuwing blijft zichtbaar omdat er risicofactoren zijn geregistreerd.</div>` : ''}
    <div class="act">${esc(adviceForActivity(shown, primaryType))}</div>
    <div class="toggles">
      <details><summary>Waarom?</summary><div class="panel">Gebruikte waarden (regelversie ${a.version}): ${adviceValueList(a.inputs)}. Waarden van vandaag wegen zwaarder dan de 7-daagse trend. De app beslist en blokkeert niets.</div></details>
      <details><summary>Eigen beoordeling</summary>${ownPanel}</details>
    </div>
  </div>`;
}
function adviceValueList(inp){
  const bits = [];
  if(inp.energy!=null) bits.push(`energie ${nl(inp.energy)}`);
  if(inp.stiffness!=null) bits.push(`stijfheid ${nl(inp.stiffness)}`);
  if(inp.pain!=null) bits.push(`pijn ${nl(inp.pain)}`);
  if(inp.sleepHours!=null) bits.push(`slaap ${nl(round(inp.sleepHours,1))} u`);
  if(inp.hrv7!=null) bits.push(`HRV 7d ${nl(round(inp.hrv7,0))}`);
  if(inp.rhr7!=null) bits.push(`RHR 7d ${nl(round(inp.rhr7,0))}`);
  return bits.length ? esc(bits.join(' · ')) : 'geen';
}
function latestContinuous(){ const v = allRunRecords().filter(r=>r.done===true).map(r=>num(r.continuousMin)).filter(x=>x!=null); return v[v.length-1] ?? null; }
function biggestAsymmetry(){
  const M = CB.measurements.baseline; let best=null;
  for(const def of kpiDefs().filter(x=>x.asym)){
    const L=num(M[def.key+'L']), R=num(M[def.key+'R']);
    if(L!=null&&R!=null){ const diff=Math.abs(L-R); if(!best||diff>best.val) best={ val:diff, label:`${def.label} (W0)` }; }
  }
  return best;
}

/* Bestaande trainingen beheren vanuit "Iets anders gedaan? / training aanpassen":
   verzetten (alleen de datum verandert, alle overige velden incl. garminExternalId blijven)
   of verwijderen. Geen nieuw record, geen kopie. */
const MOVE_ARRAYS = { coach:'coachRuns', strength:'strengthSessions', walk:'walks', learning:'learningSessions' };
function moveRecordDate(kind, id, newDate){
  if(!isoDate(newDate)) { alert('Ongeldige datum.'); return; }
  if(newDate > todayISO()){ alert('Een training kun je niet naar een datum in de toekomst verplaatsen — je kunt hem daar immers nog niet gedaan hebben.'); return; }
  const arr = CB[MOVE_ARRAYS[kind]];
  const rec = arr && arr.find(x=>x.id===id);
  if(!rec) return;
  rec.date = newDate;
  arr.sort((a,b)=> a.date.localeCompare(b.date));
  ui.moveOn = null;
  ui.date = clampToBlock(newDate);   // meteen naar de nieuwe datum, zodat de verplaatsing zichtbaar bevestigd wordt
  ui.weekIdx = Math.max(0, weekIndexFor(ui.date));
  saveState(); renderCurrent();
}
function deleteRecordById(kind, id){
  const arr = CB[MOVE_ARRAYS[kind]];
  const i = arr ? arr.findIndex(x=>x.id===id) : -1;
  if(i<0) return;
  arr.splice(i,1);
  ui.moveOn = null;
  saveState(); renderCurrent();
}

function coachCard(d){

  const r = idx>=0 ? CB.coachRuns[idx] : {};
  const p = idx>=0 ? `currentBlock.coachRuns.${idx}.` : `__d.coach.${d}.`;
  const summary = idx>=0 ? [r.type, r.distanceKm!=null&&nl(r.distanceKm)+' km', r.totalMin!=null&&nl(r.totalMin)+' min', r.avgPace, r.done===true?'✓ uitgevoerd':r.done===false?'niet uitgevoerd':'uitvoering ?'].filter(Boolean).join(' · ') : '';

/* velden die "vorige waarde als grijze richtwaarde" ondersteunen — uitsluitend de
   routinemetingen, nooit subjectieve dagvelden en nooit de notitie (zie UX-correctie). */
const ROUTINE_DETAIL_FIELDS = ['pushupReps','pushupTech','pushupRpe','forwardBendReps','forwardBendFloor',
  'balanceReachL','balanceReachR','balanceRvsL','legRaiseReps','toeTouchReps','ohpL','ohpR'];
/* meest recente eerdere waarde per veld, strikt vóór datum d — nooit vandaag of later,
   en per veld apart gezocht (niet blind één vorige dag kopiëren). */
function prevRoutineValue(field, d){
  const ds = Object.keys(CB.dailyLogs).filter(x=> x < d).sort();
  for(let i=ds.length-1;i>=0;i--){
    const v = CB.dailyLogs[ds[i]]?.routineDetail?.[field];
    if(v!=null && v!=='') return { value:v, date:ds[i] };
  }
  return null;
}
function relativeDayLabel(dateStr, refDate){
  const diff = Math.round((parseDate(refDate)-parseDate(dateStr))/86400000);
  if(diff===1) return 'gisteren';
  if(diff===2) return 'eergisteren';
  return fmt(dateStr,{day:'numeric',month:'short'});
}
/* "Vorige waarden overnemen" — vult per leeg veld de laatst bekende waarde in als concept
   voor vandaag. Dit IS de bevestiging (expliciete klik); daarna gewoon aanpasbaar/opslaanbaar
   via de bestaande invoerlogica. Nooit de notitie, nooit velden die al een waarde hebben. */
function applyPreviousRoutineValues(d){
  const rd = ensureLog(d).routineDetail = ensureLog(d).routineDetail || {};
  for(const f of ROUTINE_DETAIL_FIELDS){
    if(rd[f]==null || rd[f]===''){
      const prev = prevRoutineValue(f, d);
      if(prev) rd[f] = prev.value;
    }
  }
  saveState(); renderToday();
}
/* input met de vorige waarde als placeholder (grijs, nooit een echte waarde totdat getypt) */
function rdInput(label, path, val, prev){
  const ph = (val==null||val==='') && prev!=null ? ` placeholder="${esc(prev.value)}"` : '';
  return `<div class="field"><label>${esc(label)}</label><input type="number" inputmode="numeric" data-bind="${path}" value="${val==null?'':esc(val)}"${ph}></div>`;
}
/* select: géén automatische keuze — alleen een kleine grijze "vorige: …"-hint eronder */
function rdSelect(label, path, val, opts, prev){
  const prevLabel = prev!=null ? (opts.find(o=>String(o[0])===String(prev.value))||[null,prev.value])[1] : null;
  return `<div class="field"><label>${esc(label)}</label><select data-bind="${path}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(t)}</option>`).join('')}</select>
    ${(!val && prevLabel) ? `<div class="tny muted">vorige: ${esc(prevLabel)}</div>` : ''}</div>`;
}

  </div></details>`;

/* ===========================================================================
   DRAFT-BEHEER + COMMIT
   =========================================================================== */
let _draft = {};
function draftSet(parts, val){
  let ptr = _draft;
  for(let i=1;i<parts.length-1;i++){ ptr[parts[i]] = ptr[parts[i]] || {}; ptr = ptr[parts[i]]; }
  ptr[parts[parts.length-1]] = (val===''?null:val);
}
function draftGet(path){ return path.split('.').reduce((o,k)=> (o&&o[k]!=null)?o[k]:undefined, _draft); }
function normNums(o){ const out={}; for(const [k,v] of Object.entries(o||{})){
  if(k==='entries'){ const e={}; for(const [id,vals] of Object.entries(v||{})) e[id]=normNums(vals); out[k]=e; continue; }
  out[k] = coerce(k, v); } return out; }
function ensureLog(d){ return CB.dailyLogs[d] = CB.dailyLogs[d] || {}; }
/* canonical = dailyLogs[d].routineDone ('ja'|'deels'|'nee'|''); checks.routine blijft
   compatibel uitleesbaar voor oude records. 'ja' en 'deels' tellen als routinedag. */
function routineDoneish(l){ return !!(l && (l.routineDone==='ja' || l.routineDone==='deels' || (l.checks && l.checks.routine))); }

function commitDraft(spec){
  const [kind, a, b] = spec.split('|');
  if(isoDate(a) && a > todayISO()){ alert('Je kunt geen training registreren op een datum in de toekomst. Registreer op de dag zelf of daarna.'); return; }
  if(kind==='coach'){
    const d = (draftGet('coach.'+a)) || {};
    const rec = { id:'c'+Date.now().toString(36), date:a, ...normNums(d) };
    // 3 echte toestanden: 'ja'->true, 'nee'->false, leeg/anders->null (nog niet bekend)
    rec.done = d.done==='ja' ? true : d.done==='nee' ? false : null;
    CB.coachRuns.push(rec); CB.coachRuns.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.coach) delete _draft.coach[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='strength'){
    const d = (draftGet(`strength.${a}.${b}`)) || {};
    const entries = {};
    for(const [exId,vals] of Object.entries(d.entries||{})) entries[exId] = normNums(vals);
    CB.strengthSessions.push({ id:'s'+Date.now().toString(36), date:a, session:b, entries, note:d.note||'', durationMin: num(d.durationMin) });
    CB.strengthSessions.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.strength && _draft.strength[a]) delete _draft.strength[a][b];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='walk'){
    const d = (draftGet('walk.'+a)) || {};
    CB.walks.push({ id:'w'+Date.now().toString(36), date:a, ...normNums(d) });
    CB.walks.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.walk) delete _draft.walk[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.mainTraining = true;
  }
  if(kind==='learning'){
    const d = (draftGet('learning.'+a)) || {};
    const wi = Math.max(0, weekIndexFor(a));
    const rec = { id:'l'+Date.now().toString(36), date:a, ...normNums(d) };
    if(!rec.exerciseId) rec.exerciseId = weekConfig(wi).focusExercise || (state.exercises.find(e=>e.kind==='strength')||{}).id || '';
    CB.learningSessions.push(rec);
    CB.learningSessions.sort((x,y)=>x.date.localeCompare(y.date));
    if(_draft.learning) delete _draft.learning[a];
    const l = ensureLog(a); l.checks = l.checks||{}; l.checks.learnDone = true;
  }
  ui.addOn = null; ui.addType = null;
  saveState(); renderCurrent();
}
function deleteRecord(spec){
  const [kind, idx] = spec.split('|'); const i = Number(idx);
  if(kind==='coach') CB.coachRuns.splice(i,1);
  if(kind==='strength') CB.strengthSessions.splice(i,1);
  if(kind==='walk') CB.walks.splice(i,1);
  if(kind==='learning') CB.learningSessions.splice(i,1);
  saveState(); renderCurrent();
}

/* ===========================================================================
   VIEW: METINGEN  (Week 0 <-> Week 6, + historische referentie)
   =========================================================================== */
function fmtLift(e){
  if(!e) return '—';
  if(e.weightL!=null||e.weightR!=null||e.setRepsL!=null||e.setRepsR!=null)
    return `L ${nl(e.weightL)}×${esc(e.setRepsL||'–')} / R ${nl(e.weightR)}×${esc(e.setRepsR||'–')}`;
  return `${nl(e.weight)} × ${esc(e.setReps||e.reps||'–')}${e.sets?` (${e.sets} sets)`:''}`;
}
/* Historische vóór-vakantiereferentie. GEEN hardloopvelden hier — de wandeltest van 27-07
   is geen hardloopmeting en wordt apart getoond, niet als runContinuousMin/runPace/runAvgHr/runRpe. */
function histRef(key){
  const b = HISTORICAL.baselineSummary || {};
  return ({ hrv:b.hrvAvg, restingHr:b.rhrAvg, sleepHours:b.sleepHoursAvg, energy:b.morningEnergyAvg,
    stiffness:b.morningStiffnessAvg, pain:b.morningPainAvg, pushups:b.pushupsLast })[key] ?? null;
}
/* per-domein voortgang van een meting: hoeveel van de functionele KPI's zijn ingevuld.
   Herstel telt hier niet mee (komt uit het 7-daags venster, niet uit dit formulier). */
function measCompletion(M){
  const domains = {};
  for(const def of kpiDefs()){
    if(def.rec) continue;
    const dom = domains[def.dom] = domains[def.dom] || {done:0, total:0, missing:[]};
    if(def.lift && def.lr){
      // lift + L/R (row/splitSquat/ohp): opgeslagen als <key>L.weight / <key>R.weight
      dom.total += 2;
      if(M[def.key+'L']?.weight!=null) dom.done++; else dom.missing.push(def.label+' links');
      if(M[def.key+'R']?.weight!=null) dom.done++; else dom.missing.push(def.label+' rechts');
    } else if(def.lift){
      dom.total++;
      if(M[def.key]?.weight!=null) dom.done++; else dom.missing.push(def.label);
    } else if(def.lr){
      dom.total += 2;
      if(num(M[def.key+'L'])!=null) dom.done++; else dom.missing.push(def.label+' links');
      if(num(M[def.key+'R'])!=null) dom.done++; else dom.missing.push(def.label+' rechts');
    } else {
      dom.total++;
      const has = def.key==='runPace' ? !!M.runPace : num(M[def.key])!=null;
      if(has) dom.done++; else dom.missing.push(def.label);
    }
  }
  return domains;
}

   METINGEN — DAGDATA
   Weergave/editor bovenop bestaande state; GEEN tweede dataset.
   Canonical per waarde:
     - handmatig actueel : CB.dailyLogs[date].<key>   (bewerkbaar, wint)
     - Garmin fallback   : state.garmin.daily[date].<key>
     - historisch        : HISTORICAL.logs[date].<key> (17 jul – 9 aug, read-only 🔒)

const DD_DOW = ['zo','ma','di','wo','do','vr','za'];
const DD_MON = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function ddDate(iso){ const t = parseDate(iso); return `${DD_DOW[t.getDay()]} ${t.getDate()} ${DD_MON[t.getMonth()]} ${t.getFullYear()}`; }
/* slaapduur als u:mm tonen (alleen presentatie; opgeslagen waarde blijft de decimale) */
function ddSleep(hoursDec){
  if(hoursDec==null || hoursDec==='' || isNaN(hoursDec)) return null;
  let h = Math.floor(hoursDec), m = Math.round((hoursDec - h) * 60);
  if(m===60){ h++; m = 0; }
  return `${h}:${String(m).padStart(2,'0')}`;
}

  const routine = [

    { key:'balanceReachR',   label:'Balans-reik rechts',           short:'Bal R',     m:'routineDetail.balanceReachR',  g:null, h:null, num:true },
    { key:'balanceRvsL',     label:'Balans rechts t.o.v. links',   short:'Bal R/L',   m:'routineDetail.balanceRvsL',    g:null, h:null, sel:[['','—'],['gelijk','gelijk'],['iets minder','iets minder'],['duidelijk minder','duidelijk minder']] },
    { key:'legRaiseReps',    label:'Beenheffing (aantal reps)',    short:'Beenhef',   m:'routineDetail.legRaiseReps',   g:null, h:null, num:true },
    { key:'toeTouchReps',    label:'Toe-touch (aantal reps)',      short:'Toe-touch', m:'routineDetail.toeTouchReps',   g:null, h:null, num:true },
    { key:'ohpL',            label:'Overhead press links @ 9 kg',  short:'OHP L',     m:'routineDetail.ohpL',           g:null, h:null, num:true },
    { key:'ohpR',            label:'Overhead press rechts @ 9 kg', short:'OHP R',     m:'routineDetail.ohpR',           g:null, h:null, num:true },
  ];
  // hardloopwaarden komen uit de Coach-run van die dag (alleen done===true), VO2 valt terug op Garmin; read-only hier
  const run = [
    { key:'vo2max',     label:'VO₂-max (uit Coach-run, anders Garmin) — bewerk in de Coach-run op Vandaag', short:'VO₂-max',  run:true, num:true },

  if(ui.dagdataView==='alles') return core.concat(routine, run);

function dagdataRunVal(date, col, g){
  const r = allRunRecords().find(x=>x.date===date && x.done===true);
  if(col.key==='vo2max'){
    const v = r && num(r.vo2max)!=null ? num(r.vo2max) : num(g && g.vo2max);
    return v ?? null;
  }
  return r && num(r.continuousMin)!=null ? num(r.continuousMin) : null;
}
function dagdataHistVal(h, col){
  if(!h) return null;
  if(col.h==='__sleepH') return h.sleepTime ? round(timeToMin(h.sleepTime)/60,4) : (num(h.sleepHours) ?? null);
  if(!col.h) return null;
  const raw = h[col.h];
  return raw==null || raw==='' ? null : (typeof raw==='string' ? raw : num(raw));
}
function dagdataCurVal(l, g, col){
  const mp = col.m;
  let man;
  if(mp==='__routine') man = l.routineDone || (l.checks && l.checks.routine ? 'ja' : null);
  else if(mp && mp.indexOf('routineDetail.')===0) man = l.routineDetail ? l.routineDetail[mp.slice(14)] : undefined;
  else man = l[mp];
  if(man!=null && man!==''){
    return { val: (col.text||col.sel) ? man : num(man), src:'M', override: !!(col.g && g && g[col.g]!=null) };
  }
  if(col.g && g && g[col.g]!=null) return { val:num(g[col.g]), src:'G', override:false };
  return { val:null, src:null, override:false };
}
function dagdataRows(){
  const today = todayISO();
  const from = ui.dagdataRange==='all' ? '0000-00-00' : addDays(today, ui.dagdataRange==='14' ? -13 : -29);
  const dates = new Set([
    ...Object.keys(HISTORICAL.logs||{}),
    ...Object.keys(CB.dailyLogs||{}),
    ...Object.keys(state.garmin.daily||{}),
    ...allRunRecords().map(r=>r.date),
  ]);
  const cols = dagdataColumns();
  const rows = [];
  for(const date of [...dates].filter(d=> d>=from && d<=today).sort().reverse()){
    const h = HISTORICAL.logs[date];
    const isHist = !!h;
    const l = CB.dailyLogs[date] || {};
    const g = state.garmin.daily[date] || {};
    const cells = {};
    for(const col of cols){
      if(col.run){
        cells[col.key] = { val: isHist ? null : dagdataRunVal(date, col, g), src:'run', editable:false, ro:true };
      } else if(col.computed){
        // Dagadvies (read-only in de tabel): de strengste van automatisch advies en eigen beoordeling.
        // Live berekend voor weergave; de dag-snapshot (l.advice) blijft ongewijzigd.
        const au = isHist ? null : dayAdvice(date).status, s = isHist ? null : strictestStatus(au, l.traffic);
        cells[col.key] = { val: s || null, src: s && l.traffic && s===l.traffic && s!==au ? 'own' : (s?'auto':null), editable:false, ro:true };
      } else if(isHist){
        cells[col.key] = { val: dagdataHistVal(h, col), src:'H', editable:false };
      } else {
        const r = dagdataCurVal(l, g, col);
        cells[col.key] = { ...r, editable:true, path: col.m==='__routine' ? `currentBlock.dailyLogs.${date}.routineDone` : `currentBlock.dailyLogs.${date}.${col.m}` };
      }
    }
    // Prestatie-weergave: alleen dagen met minstens één waarde, zodat de tabel compact blijft
    if(ui.dagdataView==='prestatie' && !cols.some(c=>{ const v=cells[c.key].val; return v!=null && v!==''; })) continue;
    rows.push({ date, isHist, era: isHist ? 'historisch' : 'blok2', cells });
  }
  return { rows, cols };
}
function dagdataCell(row, col){
  const c = row.cells[col.key];
  const alignCls = (col.num || col.time) ? ' n' : '';
  const showVal = v => {
    if(v==null || v==='') return null;
    if(col.time) return ddSleep(typeof v==='number' ? v : parseFloat(String(v).replace(',','.')));
    if(col.sel) return (col.sel.find(o=>String(o[0])===String(v))||[,v])[1];
    return String(nl(v));
  };
  if(col.run){
    return `<td class="ro n" title="uit de Coach-run van die dag"${''}>${c.val==null ? '<span class="miss">—</span>' : esc(String(nl(c.val)))}</td>`;
  }
  if(col.computed){
    const label = c.val ? (DD_ADVICE[c.val] || c.val) : null;
    const tip = c.src==='own' ? 'jouw eigen beoordeling' : c.src==='auto' ? 'automatisch berekend dagadvies' : '';
    return `<td class="ro"${tip?` title="${esc(tip)}"`:''}>${label ? `${esc(label)}${c.src==='own'?' <span class="miss">·eigen</span>':''}` : '<span class="miss">—</span>'}</td>`;
  }
  if(row.isHist){
    const s = showVal(c.val);
    return `<td class="ro${alignCls}">${s==null ? '<span class="miss">—</span>' : esc(s)}</td>`;
  }
  if(col.sel){
    return `<td class="${alignCls?'n':''}"><select class="cell" data-bind="${c.path}">${col.sel.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(c.val??'')?'selected':''}>${esc(t)}</option>`).join('')}</select></td>`;
  }
  const garmin = c.src==='G';
  const title = garmin ? ' title="Bron: Garmin — typ om handmatig te corrigeren"'
              : c.override ? ' title="Handmatig gecorrigeerd — een latere Garmin-import overschrijft dit niet"' : '';
  const cls = 'cell' + (garmin ? ' g' : '');
  const val  = c.src==='M' ? esc(String(col.time && typeof c.val==='number' ? (ddSleep(c.val) ?? c.val) : c.val)) : '';
  const ph   = garmin ? ` placeholder="${esc(String(showVal(c.val) ?? nl(c.val)))}"` : (c.val==null ? ' placeholder="—"' : '');
  const mark = (!garmin && c.override) ? '<span class="src">✎</span>' : '';
  return `<td class="${alignCls?'n':''}"${title}><input class="${cls}" type="${col.time||col.text?'text':'number'}" ${col.time||col.text?'':'inputmode="decimal"'}${col.step?` step="${col.step}"`:''} data-bind="${c.path}" value="${val}"${ph}>${mark}</td>`;
}

  return html;

/* tweede (bovenste) zijwaartse schuifbalk boven de Dagdata-tabel, gesynchroniseerd met de tabel */
function ddSyncTopScroll(){
  const top = document.querySelector('.dd-topscroll'), wrap = document.querySelector('.dd-wrap');
  if(!top || !wrap) return;
  const inner = top.firstElementChild;
  const size = ()=>{ inner.style.width = wrap.scrollWidth + 'px'; top.style.display = wrap.scrollWidth > wrap.clientWidth + 1 ? '' : 'none'; };
  size();
  let lock = false;
  top.onscroll  = ()=>{ if(lock){lock=false;return;} lock=true; wrap.scrollLeft = top.scrollLeft; };
  wrap.onscroll = ()=>{ if(lock){lock=false;return;} lock=true; top.scrollLeft = wrap.scrollLeft; };
  top.scrollLeft = wrap.scrollLeft;
  window.addEventListener('resize', size);
}

function deltaPaceCell(bSec,wSec){
  if(bSec==null||wSec==null) return '<td class="num muted">—</td>';

}

function seriesFor(key, range){
  let rows;
  if(key==='vo2max'){
    rows = vo2Points().map(p=>({ x:p.x, y:p.y }));
  } else if(['runContinuousMin','runPaceSec','runAvgHr'].includes(key)){
    rows = allRunRecords().filter(r=>r.done===true).map(r=>{
      const y = key==='vo2max'?num(r.vo2max) : key==='runContinuousMin'?num(r.continuousMin)
              : key==='runPaceSec'?paceToSec(r.avgPace) : num(r.avgHr);
      return y==null?null:{x:r.date,y};
    }).filter(Boolean);
  } else {
    rows = recoveryTimeline().filter(r=>r[key]!=null).map(r=>({x:r.date,y:r[key]}));
  }
  rows.sort((a,b)=>a.x.localeCompare(b.x));
  if(range!=='all'){ const cut = addDays(todayISO(), -Number(range)); rows = rows.filter(r=>r.x>=cut); }
  return rows;
}
/* primaire krachtreeks = GEWICHT over tijd (geen kunstmatige score). Per punt de context. */
function strengthWeightRows(exId, range, side){
  return strengthHistory(exId).map(h=>{
    const g = loadKey(h.e, side);
    return { x:h.date, y:g.w, reps:g.reps, rir:num(h.e.rir), rpe:num(h.e.rpeLast), tech:h.e.tech };
  }).filter(r=> r.y!=null && (range==='all' || r.x >= addDays(todayISO(),-Number(range))));
}
function fmtStrengthPoint(r){
  return `${nl(r.y)} kg · ${r.reps.length?r.reps.join('+'):'–'}${r.rir!=null?` · RIR ${r.rir}`:r.rpe!=null?` · RPE ${r.rpe}`:''}${r.tech==='minder'?' · techniek minder':''}`;
}
/* ---- gewicht: uitsluitend bestaande weightKg-data uit recoveryTimeline() ---- */
function weightDailyRows(){
  return recoveryTimeline().filter(r=> r.weight!=null).map(r=>({ x:r.date, y:r.weight }))
    .sort((a,b)=> a.x.localeCompare(b.x));
}
/* voortschrijdend 7-daags gemiddelde: per meetdatum de metingen van die datum + 6 voorafgaande
   KALENDERdagen; alleen als er >=4 werkelijk gemeten dagen in dat venster zijn; 1 decimaal.
   Ontbrekende dagen tellen niet mee (geen nul, geen interpolatie). */
function weightRollingAvg(dailyRows){
  const byDate = {}; dailyRows.forEach(r=> byDate[r.x]=r.y);
  const out = [];
  for(const r of dailyRows){
    const vals = [];
    for(let i=0;i<7;i++){ const d = addDays(r.x,-i); if(byDate[d]!=null) vals.push(byDate[d]); }
    if(vals.length >= 4) out.push({ x:r.x, y: round(vals.reduce((a,b)=>a+b,0)/vals.length, 1), n:vals.length });
  }
  return out;
}
/* algemeen voortschrijdend 7-daags gemiddelde (kalendervenster: datum + 6 voorafgaande dagen);
   alleen op meetdagen, alleen echt gemeten waarden, minimaal minN meetdagen in het venster. Geen interpolatie. */
function rollingAvg(rows, minN=4){
  const by = {}; rows.forEach(r=> by[r.x]=r.y);
  const out = [];
  for(const r of rows){
    const vals = [];
    for(let i=0;i<7;i++){ const d = addDays(r.x,-i); if(by[d]!=null) vals.push(by[d]); }
    if(vals.length >= minN) out.push({ x:r.x, y: round(vals.reduce((a,b)=>a+b,0)/vals.length, 2), n:vals.length });
  }
  return out;
}
/* voor schaarse reeksen (bv. hardlopen, ~1x per week): gemiddelde van de laatste N metingen (incl. deze), vanaf 2 metingen */
function lastNAvg(rows, n=3){
  const out = [];
  for(let i=1;i<rows.length;i++){
    const w = rows.slice(Math.max(0,i-n+1), i+1);
    out.push({ x:rows[i].x, y: round(w.reduce((a,b)=>a+b.y,0)/w.length, 2), n:w.length });
  }
  return out;
}
/* grafiek met dagwaarde + 7-daags gemiddelde; gemiddelde eerst over ALLE data berekend, daarna pas op de periode gefilterd */
function chartWithAvg(key, range, o, minN){
  const full = seriesFor(key,'all');
  const last3 = minN==='last3';
  let rows = full, avg = last3 ? lastNAvg(full, 3) : rollingAvg(full, minN||4);
  if(range!=='all'){ const cut = addDays(todayISO(), -Number(range)); rows = rows.filter(r=>r.x>=cut); avg = avg.filter(r=>r.x>=cut); }
  return lineChart(rows, { ...o, series2: avg, color2:'#2A4560', name1:'meting', name2: last3 ? 'gemiddelde laatste 3 metingen' : '7-daags gemiddelde' });
}
function weightAvgWindow(endDate){
  const byDate = {}; weightDailyRows().forEach(r=> byDate[r.x]=r.y);
  const vals = []; for(let i=0;i<7;i++){ const d = addDays(endDate,-i); if(byDate[d]!=null) vals.push(byDate[d]); }
  return { value: vals.length>=4 ? round(vals.reduce((a,b)=>a+b,0)/vals.length,1) : null, n:vals.length };
}

/* Dagadvies als statistiek: per kalenderweek de dagen als gekleurde blokjes + telling.
   Status = eigen beoordeling (traffic) of het automatisch dagadvies; dagen zonder gegevens blijven grijs. */
function anyStatusCard(){
  const c = {green:0, orange:0, red:0}, cut = addDays(todayISO(), -13);
  Object.keys(CB.dailyLogs).forEach(dt=>{ if(dt>=cut && dt<=todayISO()){ const s=effectiveDayStatus(dt); if(s && c[s]!=null) c[s]++; } });
  return (c.green||c.orange||c.red) ? `<p class="adv-sum">Laatste 14 dagen: <b>${c.green}</b> normaal · <b>${c.orange}</b> rustiger · <b>${c.red}</b> herstel</p>` : '';
}
/* Dagadvies per week: één balk per week (aandeel normaal / rustiger / herstel); alleen weken met gegevens */
function adviceStatsHTML(range){
  const dates = new Set([...Object.keys(HISTORICAL.logs||{}), ...Object.keys(CB.dailyLogs)]);
  const today = todayISO(), cut = range==='all' ? '0000' : addDays(today, -Number(range));
  const days = [...dates].filter(d=> d<=today && d>=cut).sort();
  const monday = d=>{ const x=parseDate(d); return addDays(d, -((x.getDay()+6)%7)); };
  const isoWeek = d=>{ const x=parseDate(d); const th=new Date(x.getFullYear(),x.getMonth(),x.getDate()+3-((x.getDay()+6)%7)); const w1=new Date(th.getFullYear(),0,4); return 1+Math.round(((th-w1)/86400000-3+((w1.getDay()+6)%7))/7); };
  const weeks = {};
  days.forEach(d=>{
    let s = effectiveDayStatus(d);
    if(!s){ try{ s = dayAdvice(d).status || null; }catch(e){ s = null; } }
    if(!s) return;                                   // dagen zonder advies tellen niet mee en krijgen geen plek
    const m = monday(d); const w = weeks[m] = weeks[m] || { m, cnt:{green:0, orange:0, red:0}, n:0 };
    w.cnt[s]++; w.n++;
  });
  const list = Object.values(weeks).sort((x,y)=> y.m.localeCompare(x.m));
  if(!list.length) return '<p class="small muted">Nog geen dagen met advies.</p>';
  const shown = ui.adviceMore ? list : list.slice(0,8);
  const rows = shown.map(w=>{
    const pct = k => (w.cnt[k]/7*100).toFixed(1);
    const title = `Normaal ${w.cnt.green} · Rustiger ${w.cnt.orange} · Herstel ${w.cnt.red}`;
    return `<div class="advrow"><span class="advwk">wk ${isoWeek(w.m)} · ${esc(fmt(w.m,{day:'numeric',month:'short'}))}</span>
      <span class="advbar" title="${esc(title)}">${['green','orange','red'].map(k=> w.cnt[k] ? `<b class="adv-${k}" style="width:${pct(k)}%"></b>` : '').join('')}</span>
      <span class="advn">${w.n} ${w.n===1?'dag':'dagen'}</span></div>`;
  }).join('');
  return `<div class="chart-wrap">
    <div class="adv-leg"><span><i class="adv-green"></i>Normaal</span><span><i class="adv-orange"></i>Rustiger</span><span><i class="adv-red"></i>Herstel</span></div>
    ${rows}
    ${list.length>8 ? `<button class="btn sm no-print" data-adv-more>${ui.adviceMore ? 'Minder weken tonen' : 'Oudere weken tonen ('+(list.length-8)+')'}</button>` : ''}
    <div class="tny muted" style="margin-top:6px">Een balk = één week (ma–zo); de lengte toont hoeveel van de 7 dagen een advies hadden. Alleen weken met gegevens.</div></div>`;
}
function asymBars(label,lB,rB,lW,rW,endLbl='W12'){
  const vals=[lB,rB,lW,rW].map(v=>num(v)||0); const max=Math.max(...vals,1);
  const bar=(v,c,t)=>`<div style="flex:1;text-align:center"><div style="height:88px;display:flex;align-items:flex-end;justify-content:center"><div style="width:55%;background:${c};height:${(num(v)||0)/max*100}%;border-radius:5px 5px 0 0;min-height:2px"></div></div><div class="tny">${t}<br>${v==null?'—':v}</div></div>`;
  const dB=(num(lB)!=null&&num(rB)!=null)?Math.abs(num(lB)-num(rB)):null;
  const dW=(num(lW)!=null&&num(rW)!=null)?Math.abs(num(lW)-num(rW)):null;
  return `<div class="chart-wrap"><h4>${esc(label)}</h4><div style="display:flex;gap:6px">
    ${bar(lB,'#A7CBEA','L W0')}${bar(rB,'#c4b0dd','R W0')}<div style="width:10px"></div>${bar(lW,'#3D6A92','L '+endLbl)}${bar(rW,'#5b3d78','R '+endLbl)}</div>
    <div class="tny muted" style="margin-top:6px">Asymmetrie |L−R|: ${nl(dB)} (W0) → ${nl(dW)} (${endLbl})${(dB!=null&&dW!=null)?` — ${dW<dB?'afgenomen':dW>dB?'toegenomen':'gelijk'}`:''}. Trainingsinformatie, geen medische conclusie.</div></div>`;
}

  <div class="card"><h3>Video's — welke bronnen</h3>

function fmtActivity(a){
  const t = GARMIN_RUN_TYPES.includes(a.type) ? 'Hardlopen' : GARMIN_WALK_TYPES.includes(a.type) ? 'Wandelen' : GARMIN_RIDE_TYPES.includes(a.type) ? 'Fietsen' : (a.type||'Activiteit');
  const parts = [
    a.distanceKm!=null ? `${nl(a.distanceKm)} km` : null,
    a.durationMin!=null ? `${nl(round(a.durationMin,1))} min` : null,
    a.avgPace ? `${a.avgPace}/km` : null,
    a.avgHr!=null ? `gem. HR ${nl(a.avgHr)}` : null,
    a.maxHr!=null ? `max. HR ${nl(a.maxHr)}` : null,
    a.continuousMin!=null ? `aaneengesloten ${nl(round(a.continuousMin,1))} min` : null,
    a.vo2max!=null ? `VO₂-max ${nl(a.vo2max)}` : null,
  ].filter(Boolean);
  return { t, line: parts.join(' · ') };
}

function setByPath(path, raw, quiet){
  const parts = path.split('.');
  if(parts[0]==='__date'){ ui.date = clampToBlock(raw); ui.addOn=null; ui.addType=null; ui.moveOn=null; ui.weekIdx = Math.max(0,weekIndexFor(ui.date)); renderToday(); return; }
  if(parts[0]==='__d'){ draftSet(parts, raw); return; }
  if(parts[0]==='__run'){ runSet(parts.slice(1), raw); saveState(); if(!quiet){ clearTimeout(window._rr); window._rr = setTimeout(renderCurrent, 120); } return; }

  let obj = state, key;
  for(let i=0;i<parts.length-1;i++){
    key = parts[i];
    if(obj[key]==null) obj[key] = /^\d+$/.test(parts[i+1]) ? [] : {};
    obj = obj[key];
  }
  key = parts[parts.length-1];
  obj[key] = coerce(key, raw);

  CB = state.currentBlock;
  if(path.startsWith('currentBlock.startDate') || path.startsWith('currentBlock.durationWeeks')){ ui.weekIdx = Math.max(0,weekIndexFor(ui.date)); quiet = false; }
  saveState();
  if(!quiet){ clearTimeout(window._rr); window._rr = setTimeout(renderCurrent, 120); }
}

const BK_KEY = 'trainingsplan-rens-lastbackup';

function bkLast(){ try{ return localStorage.getItem(BK_KEY) || null; }catch(e){ return null; } }
function bkDue(){ const l = bkLast(); return !l || (Date.now() - new Date(l).getTime()) > BK_DAYS*86400000; }
function bkDB(){ return new Promise((res,rej)=>{ const r = indexedDB.open('trainingsplan-rens-backup',1); r.onupgradeneeded = ()=> r.result.createObjectStore('h'); r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error); }); }
async function bkGetHandle(){ try{ const db = await bkDB(); return await new Promise(res=>{ const q = db.transaction('h').objectStore('h').get('dir'); q.onsuccess = ()=> res(q.result||null); q.onerror = ()=> res(null); }); }catch(e){ return null; } }
async function bkSetHandle(h){ const db = await bkDB(); await new Promise((res,rej)=>{ const tx = db.transaction('h','readwrite'); tx.objectStore('h').put(h,'dir'); tx.oncomplete = res; tx.onerror = ()=> rej(tx.error); }); }
async function bkWrite(h){
  const name = 'Atempo_backup_' + todayISO() + '.json';
  const fh = await h.getFileHandle(name, { create:true });
  const w = await fh.createWritable();
  await w.write(JSON.stringify({ ...state, historicalData: HISTORICAL }, null, 2));
  await w.close();
  localStorage.setItem(BK_KEY, new Date().toISOString());
  return name;
