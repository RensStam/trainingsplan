a{color:var(--green)}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:17px;font-weight:800;margin:0 8px 14px;line-height:1.3}
.brand small{display:block;font-size:11.5px;font-weight:500;opacity:.65;margin-top:5px}
.nav-btn{display:flex;align-items:center;width:100%;border:0;background:transparent;color:#2A4560;padding:12px 12px;border-radius:10px;text-align:left;gap:11px;margin:2px 0;font-weight:600;font-size:14.5px;min-height:44px}
.nav-btn:hover{background:#26564699}
.nav-btn.active{background:#3D6A92;color:#fff}
.nav-ico{width:20px;text-align:center;flex:0 0 20px;opacity:.85}
.sidebar-sep{border-top:1px solid #ffffff1f;margin:12px 6px}
.sidebar-foot{font-size:11px;color:#5D7183;margin:16px 10px;line-height:1.5}
.main{min-width:0;display:flex;flex-direction:column}
#backupBar{background:var(--amber-bg);border-bottom:1px solid #e5d59b;color:var(--amber-ink);padding:9px 24px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#backupBar[hidden]{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{margin:0;font-size:19px}
.save-state{font-size:11.5px;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.mobile-menu{display:none!important}   /* het menu opent via Meer (onderaan, mobiel) of staat vast in de zijbalk */
.mobile-tabs{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650;min-height:40px;line-height:1.2}
.btn:hover{border-color:var(--green2);background:var(--mint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green3);border-color:var(--green3)}
.btn.danger{color:var(--neg);border-color:#e6c9c4}
.btn.sm{padding:7px 10px;font-size:12.5px;min-height:34px}
.btn.block{width:100%}

.content{padding:22px 24px 90px;max-width:1180px;margin:0 auto;width:100%}
.view{display:none}.view.active{display:block}
.view-tabs{margin:0 0 16px}

.pagehead{margin:0 0 20px}
.pagehead .eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green2)}
.pagehead h2{margin:4px 0 0;font-size:24px}
.pagehead p{margin:8px 0 0;color:var(--muted);max-width:760px;font-size:13.5px}

.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h3{margin:0 0 14px;font-size:16px}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:12.5px}
.card h4{margin:16px 0 8px;color:var(--green);font-size:13.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tny{font-size:11.5px}
.field input::placeholder{color:var(--muted);opacity:.85}

.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:750;background:var(--mint2);color:var(--green)}
.pill.priority{background:#fbedc2;color:var(--amber-ink)}
.pill.done{background:#DCEFE6;color:var(--pos)}
.pill.warn{background:var(--amber);color:var(--amber-ink)}
.pill.grey{background:#EAEFF2;color:#5D7183}
.tag-coach{background:var(--blue);color:var(--blue-ink)}
.tag-learning{background:#D5EAF1;color:#335B82}
.tag-strength{background:var(--purple);color:var(--purple-ink)}
.tag-longwalk{background:var(--amber);color:var(--amber-ink)}
.tag-rest{background:#EDF1F4;color:#5D7183}
.phase-pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.02em;background:#E3EEF3;color:#335B82;text-transform:uppercase}
.stage-badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:750}
.stage-leren{background:#D5EAF1;color:#335B82}
.stage-vertrouwd{background:#dceaf3;color:#3E6E8E}
.stage-trainen{background:#ece4f5;color:#5b3d78}
.dot-learn{color:#8FC5A1}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 12px}
.section-title h2{margin:0;font-size:17px}

.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 16px}
.metric .label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.metric .value{font-size:30px;font-weight:800;color:var(--green);margin-top:2px;line-height:1.05;letter-spacing:-.01em}
.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}

/* Geregistreerde training = inklapbare kaart */
details.regcard{padding:0;overflow:hidden}
details.regcard > summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:baseline;gap:8px 10px;flex-wrap:wrap}
details.regcard > summary::-webkit-details-marker{display:none}
details.regcard > summary::before{content:"▸";color:var(--muted);font-size:10px;align-self:center}
details.regcard[open] > summary::before{content:"▾"}
details.regcard > summary .rc-title{font-weight:750;font-size:14.5px;color:var(--ink)}
details.regcard > summary .rc-sum{font-size:11.5px;color:var(--muted)}
details.regcard[open] > summary{border-bottom:1px solid var(--line2)}
details.regcard .rc-body{padding:14px 16px 16px}

/* Dagadvies — compact, hiërarchie: advies centraal, rest achter toggles */
.dagadvies{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 14px;border-left:3px solid var(--line2);margin-bottom:16px}
.dagadvies.st-green{border-left-color:var(--pos)}
.dagadvies.st-orange{border-left-color:var(--amber)}
.dagadvies.st-red{border-left-color:var(--neg)}
.dagadvies .lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dagadvies .lbl .own-tag{margin-left:6px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.dagadvies .status{font-size:15.5px;font-weight:750;color:var(--ink);line-height:1.25;margin-top:1px}
.dagadvies .sub{font-size:12px;color:var(--muted);margin-top:1px}
.dagadvies .act{font-size:12.5px;color:var(--ink);margin-top:5px}
.dagadvies .toggles{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:7px}
.dagadvies .toggles details{flex:0 0 auto}
.dagadvies .toggles details[open]{flex:1 1 100%}
.dagadvies .toggles summary{font-size:11.5px;font-weight:650;color:var(--green);cursor:pointer;list-style:none}
.dagadvies .toggles summary::-webkit-details-marker{display:none}
.dagadvies .toggles summary::marker{content:""}
.dagadvies .toggles .panel{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
.dagadvies .toggles .own-row{margin-left:8px;font-size:16px}
.dagadvies .toggles .own-row a{text-decoration:none;margin-right:6px}

/* Today: crisp segmented answer */
.answer{display:flex;flex-direction:column;gap:2px}
.answer .seg{padding:14px 0;border-top:1px solid var(--line2)}
.answer .seg:first-child{border-top:0;padding-top:2px}
.answer .seg h4{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.answer .seg .big{font-size:17px;font-weight:750;color:var(--ink);line-height:1.35}
.answer .seg .lines label{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.answer .seg .lines label input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--green)}

.week-track{display:flex;flex-direction:column}
.week-track .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:14.5px}
.week-track .row:first-child{border-top:0}
.week-track .k{font-weight:600}
.week-track .v{font-variant-numeric:tabular-nums;font-weight:750;text-align:right;overflow-wrap:anywhere}
.week-track .v.todo{color:var(--amber-ink)}
.week-track .v.ok{color:var(--pos)}
.week-track .v.na{color:var(--muted);font-weight:500}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.field{display:flex;flex-direction:column}
.field label{font-size:11.5px;color:var(--muted);font-weight:700;margin:0 0 5px}
.field input,.field select,.field textarea{width:100%;border:1px solid #CBD8E0;border-radius:10px;padding:11px 12px;background:var(--card);min-height:44px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--green2);outline-offset:0;border-color:var(--green2)}
.field textarea{min-height:64px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field.wide{grid-column:1/-1}

.recovery-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.recovery-strip .rc{background:var(--mint);border:1px solid var(--line2);border-radius:10px;padding:10px 6px;text-align:center}
.recovery-strip .rc b{display:block;font-size:18px;color:var(--ink);line-height:1.1}
.recovery-strip .rc span{font-size:10.5px;color:var(--muted)}

.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dayslot{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.dayslot.today{border-color:var(--green2);box-shadow:0 0 0 2px var(--green2) inset}
.dayslot .dhead{padding:8px 9px;font-size:11.5px;font-weight:800;background:var(--mint);display:flex;justify-content:space-between;align-items:center}
.dayslot .dbody{padding:9px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat-chip{border-radius:8px;padding:4px 8px;font-size:11px;font-weight:750;text-align:center}

.warnline{background:var(--amber-bg);border:1px solid #e5d59b;border-radius:10px;padding:10px 13px;font-size:12.5px;color:var(--amber-ink);margin:6px 0}
.advice{background:var(--mint2);border:1px solid #BFDCC9;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#335B82;margin:6px 0}
.notice{background:var(--amber-bg);border:1px solid #e5d59b;border-radius:12px;padding:12px 14px;font-size:13px;color:#4a4433}

.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;min-width:560px}
table.data th{background:var(--ink);color:#fff;text-align:left;font-size:11.5px;font-weight:700;padding:10px}
table.data td{border-bottom:1px solid var(--line2);padding:9px 10px;font-size:13px;vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data td.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tr.group td{background:var(--mint);font-weight:700;color:var(--ink)}
/* Dagdata-tabel: rustige dagtabel, datumkolom sticky */
table.dagdata{min-width:0;border-collapse:collapse}
table.dagdata th,table.dagdata td{padding:9px 13px;font-size:13px;white-space:nowrap;border-bottom:1px solid var(--line2);border-right:0}
table.dagdata thead th{border-bottom:2px solid var(--line)}
table.dagdata th.n,table.dagdata td.n{text-align:right}
table.dagdata tbody tr:last-child td{border-bottom:0}
table.dagdata th:first-child,table.dagdata td:first-child{position:sticky;left:0;z-index:2;text-align:left}
table.dagdata td.dd-date{min-width:118px;font-weight:600;font-variant-numeric:normal}
table.dagdata th:first-child{background:var(--ink);z-index:4}
/* tabel scrolt in eigen kader: zijwaartse schuifbalk altijd in beeld, kopregel + datum blijven staan */
.advrow{display:flex;align-items:center;gap:12px;margin:6px 0}.advwk{min-width:104px;white-space:nowrap;font-size:12px;color:var(--muted)}.advbar{flex:1;display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--line2)}.advbar b{display:block;height:100%}.advn{min-width:58px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.adv-green{background:#5aa57a}.adv-orange{background:#e08a1e}.adv-red{background:#c0392b}.adv-sum{font-size:13px;margin:0 0 8px}.adv-leg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:0 0 8px}.adv-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.dd-topscroll{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:2px}
.dd-topscroll>div{height:1px}
.table-wrap.dd-wrap{max-height:calc(100vh - 90px);min-height:260px;overflow:auto;overscroll-behavior:contain}
table.dagdata thead th{position:sticky;top:0;z-index:3}
table.dagdata td:first-child{background:var(--card)}
table.dagdata tr.ro td:first-child{background:#F3F6F8}
table.dagdata tr.ro td{color:#5D7183;background:#FAFBFC}
table.dagdata tr.ro .lock{opacity:.5;font-size:11px}
table.dagdata tbody tr:hover td{background:#EAF3F7}
table.dagdata tbody tr:hover td:first-child{background:#E3EEF3}
table.dagdata input.cell,table.dagdata select.cell{width:100%;min-width:52px;box-sizing:border-box;border:1px solid transparent;background:transparent;
  font:inherit;text-align:right;padding:4px 5px;border-radius:6px;color:inherit}
table.dagdata td.n{min-width:58px}
table.dagdata select.cell{text-align:left}
table.dagdata input.cell.g{color:var(--muted)}   /* Garmin-waarde: lichter, geen losse letter */
table.dagdata input.cell:hover,table.dagdata select.cell:hover{border-color:var(--line2)}
table.dagdata input.cell:focus,table.dagdata select.cell:focus{border-color:var(--green);background:var(--card);color:var(--ink);outline:none}
table.dagdata input.cell::placeholder{color:var(--muted);opacity:.75}
table.dagdata .src{font-size:10px;color:var(--muted);margin-left:2px}
table.dagdata .miss{color:var(--muted)}
.dd-flabel{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px;min-width:62px}
.delta-pos{color:var(--pos);font-weight:700}
.delta-neg{color:var(--neg);font-weight:700}

.klist{display:flex;flex-direction:column;gap:8px}
.krow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.krow b{color:var(--ink)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:12px;height:12px;border-radius:4px;display:inline-block}

.exercise-card h4{margin:0 0 2px;color:var(--ink);font-size:15px}
.exercise-card .dose{display:inline-block;background:var(--mint2);color:var(--green);border-radius:999px;padding:3px 10px;font-weight:750;font-size:11.5px;margin:7px 0}
.exercise-card p{margin:6px 0;font-size:13px}
.needs-review{display:inline-block;background:#f0e3cd;color:#7a5a1c;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}

.chart-wrap{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px}
.chart-wrap h4{margin:0 0 8px;font-size:13.5px}
svg .axis{stroke:#CBD8E0;stroke-width:1}
svg .grid{stroke:#EDF2F5;stroke-width:1}
svg text{fill:#5D7183;font-size:10px}
svg .pt{cursor:crosshair}
svg .pt.on circle:last-child,svg .pt:hover circle:last-child{r:4.5}
#chartTip{position:fixed;z-index:9999;pointer-events:none;background:#22364A;color:#fff;
  font-size:12px;line-height:1.3;padding:5px 9px;border-radius:7px;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;transition:opacity .08s;transform:translateY(-2px)}
#chartTip.show{opacity:1}

.range-toggle{display:flex;gap:6px;flex-wrap:wrap}
.range-toggle .btn.active{background:var(--green);border-color:var(--green);color:#fff}

.hidden{display:none!important}
details.acc{border:1px solid var(--line);border-radius:11px;margin:10px 0;background:var(--card)}
details.acc>summary{cursor:pointer;font-weight:700;padding:12px 14px;background:var(--mint);border-radius:11px;font-size:13.5px;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:"▸ ";color:var(--green2)}
details.acc[open]>summary::before{content:"▾ "}
details.acc[open]>summary{border-radius:11px 11px 0 0}
details.acc .acc-body{padding:14px}
pre.sketch{overflow:auto;background:#EDF2F5;padding:12px;border-radius:10px;font-size:11px;line-height:1.55}

@media print{
  .sidebar,.topbar,.no-print,.mobile-tabs{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .view{display:none!important}#print-sheet{display:block!important}
  .card{box-shadow:none;border:1px solid #aaa}
}
#print-sheet{display:none}
.print-page{page-break-after:always;padding:6mm}
.print-page:last-child{page-break-after:auto}

/* ---- tablet ---- */
@media(max-width:1000px){
  .grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ---- mobile: bottom tab bar ---- */
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:50;left:-280px;width:264px;transition:left .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{left:0}
  /* menuknop bovenaan niet tonen: de knop Meer onderaan opent hetzelfde menu */
  .topbar{padding:12px 14px}
  .content{padding:16px 13px 96px}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
  .form-grid,.form-grid.cols-2,.form-grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .weekbar{grid-template-columns:1fr;gap:8px}
  .recovery-strip{grid-template-columns:repeat(3,1fr)}
  .pagehead h2{font-size:21px}
  .top-actions{display:none}
  .mobile-tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .mobile-tabs button{border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:650;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:52px;border-radius:9px}
  .mobile-tabs button .ti{font-size:18px;line-height:1}
  .mobile-tabs button.active{color:var(--green);background:var(--mint)}
}
@media(max-width:560px){
  .form-grid,.form-grid.cols-2,.form-grid.cols-4{grid-template-columns:1fr}
  .recovery-strip{grid-template-columns:repeat(3,1fr)}
  .metric .value{font-size:26px}
}
@media(max-width:380px){
  .content{padding:14px 10px 96px}
  .card{padding:16px}
}
/*__HARDLOPEN_CSS_BEGIN__*/
/* ===== Hardlopen (module) ===== */
.run-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.run-msg{background:var(--mint);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;margin:0 0 12px}
.run-msg.err{background:#fbeaea;border-color:#e3b3b3;color:#7a2222}
.run-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px;align-items:center}
.run-actions.big .btn{padding:11px 16px;font-size:14px}
.run-row{padding:10px 0;border-top:1px solid var(--line2)}
.run-row:first-of-type{border-top:0}
.run-big{font-size:17px}
.run-next-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.run-detail{border-top:1px solid var(--line2);margin-top:10px;padding-top:10px}
.run-totals{font-size:13px;margin:8px 0}
.run-tl{display:block;margin:6px 0;max-width:100%}
.run-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.run-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.run-light{display:flex;gap:12px;align-items:flex-start}
.run-bulb{font-size:30px;line-height:1}
.run-status.st-green{border-left:5px solid #5aa57a}
.run-status.st-orange{border-left:5px solid #e08a1e}
.run-status.st-red{border-left:5px solid #c0392b}
.run-ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.run-level{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.run-level.cur{border-color:var(--green);background:var(--mint)}
.run-level-top{margin-bottom:2px}
.run-level.editing{grid-column:1/-1}
.run-level-edit{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.run-week{margin:12px 0}
.run-week-h{font-weight:800;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.run-cal{display:flex;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:5px 0;background:var(--card)}
.run-cal.sug{border-style:dashed;background:transparent}
.run-cal.rest{background:var(--mint)}
.run-cal.done{border-left:4px solid #5aa57a}
.run-cal.skipped,.run-cal.cancelled{opacity:.7}
.run-cal-d{min-width:78px;font-size:12px;font-weight:700;color:var(--muted)}
.run-cal-b{flex:1}
.run-move input[type=date]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px}
.run-steps{display:flex;flex-direction:column;gap:6px}
.run-step{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.run-step select,.run-step input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit}
.run-step input{width:70px}
.run-kpis{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.run-kpis .rc{flex:1;min-width:120px}
.run-ol{padding-left:20px;margin:6px 0}.run-ol li{margin:4px 0}
@media(max-width:560px){ .run-cal{flex-direction:column;gap:2px}.run-cal-d{min-width:0}.run-actions.big .btn{flex:1 1 100%} }
/* gekozen knop (trainingsdagen, niveau van een training) duidelijk zichtbaar */
.run-tabs .btn.active,.run-actions .btn.active{background:var(--green);border-color:var(--green);color:#fff}
/* kalender: elke dag van de week; rustdagen rustig, trainingen uitklapbaar */
.run-day{display:block;border:1px solid var(--line);border-radius:10px;margin:4px 0;background:var(--card)}
.run-day>summary,.run-day.rest{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 11px;list-style:none;cursor:pointer;background:transparent}
.run-day>summary::-webkit-details-marker{display:none}
.run-day.rest{background:transparent;border-color:var(--line2);color:var(--muted);padding:5px 11px;cursor:default;font-size:13.5px}
.run-day.done{border-left:4px solid #5aa57a}
.run-day.skipped,.run-day.cancelled{opacity:.7}
.run-day-d{font-size:12px;font-weight:700;color:var(--muted)}
.run-day-s{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.run-day>.acc-body{padding:2px 11px 10px}
@media(max-width:560px){ .run-day>summary,.run-day.rest{grid-template-columns:60px minmax(0,1fr)} .run-day-s{grid-column:2;justify-content:flex-start} }
details.acc.run-day>summary::before{content:none}   /* geen uitklappijltje: de hele regel is de knop */
/*__HARDLOPEN_CSS_END__*/

/* ===== Atempo huisstijl (alleen merk en kleur) ===== */
body{background:radial-gradient(900px 340px at 0% -8%, #E6F3F7 0%, rgba(230,243,247,0) 62%), radial-gradient(900px 340px at 100% -8%, #E4F1EA 0%, rgba(228,241,234,0) 60%), var(--paper)}
.sidebar{background:linear-gradient(180deg,#E6F3F7 0%,#EAF4F2 55%,#DDEFE6 100%);color:var(--ink);border-right:1px solid var(--line)}
.brand{margin:0 4px 12px}
.brand img{display:block;width:100%;max-width:200px;height:auto;margin:0 auto}
.brand small{display:block;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);opacity:1;margin-top:8px;letter-spacing:.02em}
.nav-btn{color:var(--ink)}
.nav-btn:hover{background:rgba(79,126,168,.13)}
.nav-btn.active{background:linear-gradient(135deg,#4F7EA8,#3D6A92);color:#fff}
.sidebar-sep{border-top:1px solid rgba(42,69,96,.14)}
.sidebar-foot{color:var(--muted)}
.topbar{background:rgba(255,255,255,.92);backdrop-filter:blur(6px)}
.btn.primary{background:linear-gradient(135deg,#4F7EA8,#3D6A92);border-color:#3D6A92}
.btn.primary:hover{background:#335B82;border-color:#335B82}
.brandstrip{display:none;justify-content:center;align-items:center;padding:8px 16px 4px;background:linear-gradient(180deg,#E6F3F7,rgba(250,250,247,0))}
.brandstrip .full{height:88px;width:auto;max-width:100%;object-fit:contain}
@media(max-width:860px){
  .brandstrip{display:flex}
  .sidebar{box-shadow:0 0 40px rgba(42,69,96,.28)}
}
@media print{ .brandstrip{display:none!important} }

<script>
"use strict";
/* ===========================================================================
   Atempo (voorheen Trainingsplan Rens 2.0) — single-file, lokaal.
   Twee lagen:  historicalData (read-only, vóór vakantie)  +  currentBlock (nieuw).
   Opslag: localStorage (+ optionele Firebase-synchronisatie). Back-up: JSON + HTML. schemaVersion voor migraties.
   =========================================================================== */
const SCHEMA_VERSION = 6;
const APP_VERSION = "block2-2.5.5";
const APP_BUILD = "2026-11-01";   // zichtbaar bovenaan onder de paginatitel — zo zie je meteen of de nieuwste versie geladen is
const STORAGE_KEY = "trainingsplan-rens-blok2";
/* Overgangsweek (vaste historische periode): het programma en de registratiemethode waren nog
   niet definitief. Geen officiële trainingsweek, geen adherence, geen achteraf-reconstructie. */
const TRANSITION_START = '2026-08-31';
const TRANSITION_END = '2026-09-06';
const TRANSITION_END_PLUS1 = '2026-09-07';   // formele start van het 12-weeks programma
function isTransitionDate(d){ return d>=TRANSITION_START && d<=TRANSITION_END; }
/* echte recursieve read-only bescherming voor historicalData (elk genest object/array) */
function deepFreeze(obj){
  if(!obj || typeof obj !== 'object' || Object.isFrozen(obj)) return obj;
  Object.freeze(obj);
  Object.getOwnPropertyNames(obj).forEach(key => deepFreeze(obj[key]));
  return obj;
}
const HISTORICAL = deepFreeze((()=>{
  const h = JSON.parse(document.getElementById('historical-data').textContent);
  // gepubliceerde (openbare) versie bevat geen persoonlijke historie; die komt uit de cloud en wordt lokaal gecachet
  if(!h.logs || !Object.keys(h.logs).length){
    try{ const priv = JSON.parse(localStorage.getItem('trainingsplan-rens-hist')||'null'); if(priv) Object.assign(h, priv); }catch(e){}
  }
  return h;
})());

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
/* zet view-HTML neer maar behoud open/dicht-status van <details class="acc">-uitklappers
   (anders klapt elke re-render — bv. na het invullen van een veld — ze weer dicht). */
function setViewHTML(sel, html){
  const el = $(sel); if(!el) return;
  const prevOpen = [...el.querySelectorAll('details.acc')].map(d=>d.open);
  // focus + caret behouden over de herrender heen (voorkomt "cursor schiet uit het veld"
  // bij het van veld naar veld klikken/tabben terwijl een re-render loopt)
  const ae = document.activeElement;
  let refocus = null;
  if(ae && el.contains(ae) && ae.dataset && ae.dataset.bind){
    refocus = { bind: ae.dataset.bind };
    try { refocus.start = ae.selectionStart; refocus.end = ae.selectionEnd; } catch(e){}
  }
  // scrollposities (pagina + scrollende kaders zoals de Dagdata-tabel) behouden over de herrender
  const pageY = window.scrollY;
  const boxes = [...el.querySelectorAll('.dd-wrap')].map(b=>[b.scrollLeft,b.scrollTop]);
  el.innerHTML = viewTabsHtml(sel) + html;
  el.querySelectorAll('.dd-wrap').forEach((b,i)=>{ if(boxes[i]){ b.scrollLeft=boxes[i][0]; b.scrollTop=boxes[i][1]; } });
  if(Math.abs(window.scrollY-pageY)>2) window.scrollTo(0,pageY);
  el.querySelectorAll('details.acc').forEach((d,i)=>{ if(prevOpen[i]) d.open = true; });
  if(refocus){
    const next = el.querySelector('[data-bind="' + refocus.bind.replace(/["\\]/g,'\\$&') + '"]');
    if(next){
      next.focus();
      try { if(refocus.start!=null && next.setSelectionRange) next.setSelectionRange(refocus.start, refocus.end); } catch(e){}
    }
  }
}
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDate = s => new Date(s+'T12:00:00');
const todayISO = () => iso(new Date());
const addDays = (s,n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return iso(d); };
const num = v => { if(v===''||v==null) return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
const esc = v => String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt = (s,o={weekday:'long',day:'numeric',month:'long'}) => parseDate(s).toLocaleDateString('nl-NL',o);
const nl = n => (n==null?'—':String(n).replace('.',','));
const round = (n,d=1) => n==null?null:Math.round(n*10**d)/10**d;
const avg = a => { const v = a.map(num).filter(x=>x!=null); return v.length ? v.reduce((x,y)=>x+y,0)/v.length : null; };
const paceToSec = p => (!p||!/^\d{1,2}:\d{2}$/.test(p)) ? null : (p.split(':').reduce((m,s,i)=> i===0?+s*60:m+ +s,0));
const secToPace = s => s==null?'':Math.floor(s/60)+':'+pad(Math.round(s%60));
const timeToMin = v => { if(v==null||v==='') return null; if(typeof v==='number') return v;
  if(/^\d{1,2}:\d{2}$/.test(v)){ const [h,m]=v.split(':').map(Number); return h*60+m; } return num(v); };

const DOW = ['mon','tue','wed','thu','fri','sat','sun'];
const DOW_NL = {mon:'Ma',tue:'Di',wed:'Wo',thu:'Do',fri:'Vr',sat:'Za',sun:'Zo'};
const dowKey = d => DOW[(parseDate(d).getDay()+6)%7];

const CATS = {
  coach:    {label:'Hardlopen', short:'Run', cls:'tag-coach', legs:false, group:'hardlopen'},
  learning: {label:'Leermoment', short:'Leren', cls:'tag-learning', legs:false, group:'leren'},
  strengthA:{label:'Kracht A', short:'Kracht A', cls:'tag-strength', legs:true, group:'kracht'},
  strengthB:{label:'Kracht B', short:'Kracht B', cls:'tag-strength', legs:true, group:'kracht'},
  longwalk: {label:'Lange wandeling', short:'L. wandeling', cls:'tag-longwalk', legs:false, group:'lange wandeling'},
  recovery: {label:'Herstel / vrij', short:'Vrij', cls:'tag-rest', legs:false, group:'herstel'},
};
const catInfo = c => CATS[c] || CATS.recovery;

/* ===========================================================================
   12-WEEKS CURRICULUM  (opbouw + integratie; geen tijdelijk programma)
   Na week 12 stopt de training niet — week 12 is het vertrekpunt voor het vervolg.
   focusExercise = de NIEUWE beweging die je die week rustig leert.
   =========================================================================== */
const PHASE_LABEL = { leren:'Leren', consolideren:'Consolideren', uitbreiden:'Uitbreiden & combineren', integreren:'Integreren' };
/* Kleurcodes voor het Dagadvies. Sinds v1.5.0 wordt de status transparant en
   regelgebaseerd berekend (dayAdvice()); l.traffic is nog uitsluitend de
   optionele eigen afwijkende beoordeling van de gebruiker en overschrijft het
   automatische advies nooit — het staat er los naast. Blokkeert nooit iets. */
const DAY_STATUS = {
  green:  { emoji:'🟢', label:'Groen' },
  orange: { emoji:'🟠', label:'Oranje' },
  red:    { emoji:'🔴', label:'Rood' },
};
function blockCurriculum(){
  return [
    {week:1,  phase:'leren',        focusExercise:'goblet-squat',   learningTarget:1, strengthA:false, strengthB:false,
              learningGoal:'Squatpatroon leren: eerst naar een stoel zonder gewicht, dan lichaamsgewicht, dan de kettlebell als het past.'},
    {week:2,  phase:'leren',        focusExercise:'rdl',            learningTarget:1, strengthA:false, strengthB:false,
              learningGoal:'Heupscharnier (RDL) leren. Goblet squat mag kort terugkomen als herhaling.'},
    {week:3,  phase:'leren',        focusExercise:'row-a',          learningTarget:1, strengthA:false, strengthB:false,
              learningGoal:'Trekbeweging (single-arm row) leren. Squat en RDL blijven bekende bewegingen om kort te herhalen.'},
    {week:4,  phase:'leren',        focusExercise:'split-squat',    learningTarget:1, strengthA:false, strengthB:false,
              learningGoal:'Split squat leren met extra aandacht voor links/rechts-controle. Geen prestatiedruk.'},
    {week:5,  phase:'consolideren', focusExercise:null,             learningTarget:0, strengthA:false, strengthB:false, consolidation:true,
              learningGoal:'Geen nieuwe oefening. Squat, RDL, row en split squat herhalen. Eén korte combinatiesessie met 2–3 bekende oefeningen mag.'},
    {week:6,  phase:'uitbreiden',   focusExercise:'side-plank',     learningTarget:1, strengthA:false, strengthB:false, checkpoint:'tussenmeting',
              learningGoal:'Side plank leren, links/rechts apart. Technische kwaliteit boven tijd. Deze week ook de tussenmeting (Week 6).'},
    {week:7,  phase:'uitbreiden',   focusExercise:'suitcase-carry', learningTarget:1, strengthA:false, strengthB:false,
              learningGoal:'Suitcase carry leren: rompstabiliteit, grip, rechtop lopen onder asymmetrische belasting.'},
    {week:8,  phase:'uitbreiden',   focusExercise:'calf-a',         learningTarget:1, strengthA:false, strengthB:false,
              learningGoal:'Één eenvoudige kuitvariant (staande calf raise). Kuiten/enkels rustig ondersteunen naast het hardlopen.'},
    {week:9,  phase:'consolideren', focusExercise:null,             learningTarget:0, strengthA:false, strengthB:false, consolidation:true,
              learningGoal:'Geen nieuwe oefening. Beoordelen: welke bewegingen voelen vertrouwd, welke nog niet, hoe verdraagt de combinatie met Garmin Coach. Vanaf hier mag de overgang naar Kracht A/B beginnen.'},
    {week:10, phase:'integreren',   focusExercise:null,             learningTarget:0, strengthA:true,  strengthB:false,
              learningGoal:'Eén korte geïntegreerde krachtsessie (Kracht A) proberen. Geen eis van twee volledige sessies.'},
    {week:11, phase:'integreren',   focusExercise:null,             learningTarget:0, strengthA:true,  strengthB:true,
              learningGoal:'Als herstel en planning goed zijn: Kracht A én Kracht B, beide kort.'},
    {week:12, phase:'integreren',   focusExercise:null,             learningTarget:0, strengthA:true,  strengthB:true, checkpoint:'eindmeting',
              learningGoal:'Uitvoeren, observeren, evalueren. Geen piekweek, geen eindspurt. Deze week ook de eindmeting (Week 12).'},
  ];
}
function weekConfig(wi){
  const c = blockCurriculum();
  if(wi>=0 && wi<c.length) return c[wi];
  return { week:wi+1, phase:'integreren', focusExercise:null, learningTarget:0, strengthA:true, strengthB:true,
           learningGoal:'Vervolg na week 12: structureel trainen op basis van wat aantoonbaar goed werkt.' };
}

/* ===========================================================================
   HARDLOPEN — PERSOONLIJK TRAININGSPROGRAMMA  (zelfstandige module, deel 1: gegevens & logica)
   Opslag: state.runningProgram (één plek; gaat mee in JSON-back-up, HTML-export en cloud-sync).
   Garmin-activiteiten blijven de bron voor gemeten prestaties: een training verwijst alleen naar

const RUN_STEP = {

/* strakke lijnsymbolen (24×24, één lijnkleur): lopend, wandelend, opwarmen (stijgend), afkoelen (dalend) */

const RUN_DAY_NL = { mon:'maandag', tue:'dinsdag', wed:'woensdag', thu:'donderdag', fri:'vrijdag', sat:'zaterdag', sun:'zondag' };
const RUN_STATUS_NL = { planned:'gepland', done:'uitgevoerd', skipped:'overgeslagen', cancelled:'geannuleerd' };
const RUN_LIGHT = {
  green:  { emoji:'🟢', nl:'Groen',  head:'Niveau behouden of eventueel uitbreiden' },
  orange: { emoji:'🟠', nl:'Oranje', head:'Niveau niet verhogen' },

const RP = () => state.runningProgram;
const runId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const runNow = () => new Date().toISOString();
const runValidDate = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s+'T12:00:00'));
const runReplacesCoach = () => !!(state.runningProgram && state.runningProgram.settings && state.runningProgram.settings.replaceGarminCoach);

/* ---------- tijd-helpers ---------- */
function runParseMin(raw){            // "3", "3,5", "3:30" -> seconden | null bij ongeldig
  if(raw==null) return null;
  const s = String(raw).trim().replace(',','.');
  if(s==='') return null;
  if(/^\d+:\d{1,2}$/.test(s)){ const [m,ss] = s.split(':').map(Number); return ss>59 ? null : m*60+ss; }
  const n = Number(s);
  return (Number.isFinite(n) && n>=0 && n<=300) ? Math.round(n*60) : null;
}
function runMinStr(sec){              // 180 -> "3", 210 -> "3:30"
  if(sec==null || !Number.isFinite(sec)) return '';
  const m = Math.floor(sec/60), s = Math.round(sec - m*60);
  return s ? m+':'+String(s).padStart(2,'0') : String(m);
}
const runMinLabel = sec => runMinStr(sec) + ' min';

/* ---------- stappen, structuur, totalen ---------- */
function runStepsFromParams(p){
  const S = [], sec = m => Math.round(Number(m)*60);
  if(p.warmupMin>0) S.push({ t:'warmup', sec:sec(p.warmupMin) });
  for(let i=0;i<Math.max(1,p.reps|0);i++){
    S.push({ t:'run', sec:sec(p.runMin) });
    if(p.walkMin>0) S.push({ t:'walk', sec:sec(p.walkMin) });
  }
  if(p.cooldownMin>0) S.push({ t:'cooldown', sec:sec(p.cooldownMin) });
  return S;
}
function runTotals(steps){
  const T = { total:0, run:0, walkRecovery:0, warm:0, cool:0, intervals:0 };
  for(const s of (steps||[])){
    T.total += s.sec;
    if(s.t==='run'){ T.run += s.sec; T.intervals++; }
    else if(s.t==='walk') T.walkRecovery += s.sec;
    else if(s.t==='warmup') T.warm += s.sec;
    else if(s.t==='cooldown') T.cool += s.sec;
  }
  T.walk = T.walkRecovery + T.warm + T.cool;      // alles wat wandelen is
  return T;
}
/* groepeert opeenvolgende gelijke (hardlopen, wandelen)-paren tot één herhaalblok — voor omschrijving, Garmin-instructies en FIT */
function runCompress(steps){
  const out = []; let i = 0; const S = steps||[];
  while(i < S.length){
    const a = S[i], b = S[i+1];
    if(a.t==='run' && b && b.t==='walk'){
      let n = 1;
      while(S[i+2*n] && S[i+2*n+1] && S[i+2*n].t==='run' && S[i+2*n+1].t==='walk' && S[i+2*n].sec===a.sec && S[i+2*n+1].sec===b.sec) n++;
      if(n>=2){ out.push({ kind:'repeat', count:n, items:[{t:'run',sec:a.sec},{t:'walk',sec:b.sec}] }); i += 2*n; continue; }
    }
    out.push({ kind:'single', t:a.t, sec:a.sec }); i++;
  }
  return out;
}
function runDescribeSteps(steps){
  return runCompress(steps).map(g=>{
    if(g.kind==='repeat') return `${g.count} × (${runMinLabel(g.items[0].sec)} hardlopen + ${runMinLabel(g.items[1].sec)} wandelen)`;
    return `${runMinLabel(g.sec)} ${({warmup:'opwarmen',run:'hardlopen',walk:'wandelen',cooldown:'afkoelen'})[g.t]}`;
  }).join(' · ');
}
function runShortStructure(steps){            // "4 × 3 min hardlopen" / "20 min aaneengesloten"
  const g = runCompress(steps).find(x=> x.kind==='repeat' || x.t==='run');
  if(!g) return '';
  if(g.kind==='repeat') return `${g.count} × ${runMinLabel(g.items[0].sec)} hardlopen`;
  const runs = (steps||[]).filter(s=>s.t==='run');
  return runs.length>1 ? runs.map(s=>runMinLabel(s.sec)).join(' + ') + ' hardlopen' : `${runMinLabel(g.sec)} aaneengesloten hardlopen`;
}

/* ---------- standaardprogramma ---------- */
function runDefaultTemplates(){
  const T = (id,label,reps,runMin,walkMin)=>({ id, name:'Niveau '+id, label, description:'', warmupMin:5, cooldownMin:5, reps, runMin, walkMin,
    intensity:'rustig', target:{ type:'none', low:null, high:null }, minRestDays:2, goodSessionsToProceed:2, notes:'' });
  return [
    T('A','Herstart',4,3,2), T('B','',4,3.5,2), T('C','',4,4,2), T('D','',4,5,1),
    T('E','',2,10,2), T('F','20 min aaneengesloten',1,20,0), T('G','25 min aaneengesloten',1,25,0), T('H','30 min aaneengesloten',1,30,0),
  ];
}
function runDefaultSettings(){
  return {
    replaceGarminCoach:true,            // dit programma is het actieve hardloopschema; oude Coach-planning staat uit
    trainingDays:['tue','sat'],         // voorlopige standaarddagen (aanpasbaar)
    currentTemplateId:'A',
    paused:false, pausedFrom:null,
    planWeeksAhead:2,
    autoLinkGarmin:true,                // Garmin-run koppelen aan geplande training als dat eenduidig is
    physioNote:true,
    thresholds:{ greenPainMax:0, painOrange:1, painRed:6, energyOrange:5, energyRed:2, painDuringBad:5, goodMaxPain:3, staleDays:28 },
  };
}
function runDefaultProgram(){
  return { version:RUN_SCHEMA, createdAt:runNow(), settings:runDefaultSettings(), templates:runDefaultTemplates(),
           sessions:[], checks:{}, restDays:{}, levelLog:[] };
}
/* tolerant normaliseren (oude back-ups, handmatig bewerkte JSON): ontbrekende delen aanvullen, onbekende velden bewaren */
function runNormalize(rp){
  const d = runDefaultProgram();
  if(!rp || typeof rp!=='object') return d;
  const m = { ...rp };
  m.version = RUN_SCHEMA;
  m.settings = { ...d.settings, ...(rp.settings||{}) };
  m.settings.thresholds = { ...d.settings.thresholds, ...((rp.settings||{}).thresholds||{}) };
  if(!Array.isArray(m.settings.trainingDays)) m.settings.trainingDays = d.settings.trainingDays.slice();
  m.templates = Array.isArray(rp.templates) && rp.templates.length ? rp.templates.filter(t=>t && t.id).map(t=>({ ...runDefaultTemplates()[0], ...t, target:{ ...(t.target||{type:'none',low:null,high:null}) } })) : d.templates;
  m.sessions = Array.isArray(rp.sessions) ? rp.sessions.filter(s=>s && s.id).map(s=>({ status:'planned', steps:[], notes:'', garminExternalId:null, ...s,
      steps:(Array.isArray(s.steps)?s.steps:[]).filter(x=>x && RUN_STEP[x.t] && Number.isFinite(x.sec) && x.sec>0).map(x=>({ ...x })) })) : [];
  m.checks = (rp.checks && typeof rp.checks==='object') ? { ...rp.checks } : {};
  m.restDays = (rp.restDays && typeof rp.restDays==='object') ? { ...rp.restDays } : {};
  m.levelLog = Array.isArray(rp.levelLog) ? rp.levelLog.slice() : [];
  // herstel: de standaardniveaus A–H kunnen niet verdwijnen; ontbreekt er een, dan komt het terug met de originele inhoud
  const defs = runDefaultTemplates(), restored = [];
  defs.forEach(dt=>{ if(!m.templates.some(t=>t.id===dt.id)){ m.templates.push({ ...dt, target:{ ...dt.target } }); restored.push(dt.id); } });
  if(restored.length){
    const order = id => { const i = defs.findIndex(dt=>dt.id===id); return i<0 ? 99 : i; };
    m.templates.sort((x,y)=> order(x.id)-order(y.id));
    // was het huidige niveau nooit bewust gekozen (geen niveau-geschiedenis), dan weer het niveau van je eerstvolgende geplande training
    const next = m.sessions.filter(s=>s.status==='planned').sort((x,y)=>(x.date||'').localeCompare(y.date||''))[0];
    if(!m.levelLog.some(l=>l.to===m.settings.currentTemplateId) && next && restored.includes(next.templateId)){
      m.levelLog.push({ date:todayISO(), at:runNow(), from:m.settings.currentTemplateId, to:next.templateId, reason:'hersteld na verwijderen' });
      m.settings.currentTemplateId = next.templateId;
    }
  }
  if(!m.templates.some(t=>t.id===m.settings.currentTemplateId)) m.settings.currentTemplateId = m.templates[0].id;
  return m;
}
const runTpl = id => RP().templates.find(t=>t.id===id) || null;
const runCurrentTpl = () => runTpl(RP().settings.currentTemplateId) || RP().templates[0];
const runSes = id => RP().sessions.find(s=>s.id===id) || null;
const runByDate = (a,b) => (a.date||'').localeCompare(b.date||'') || (a.createdAt||'').localeCompare(b.createdAt||'');

function runNewSession(date, tpl){
  return { id:runId(), date, templateId:tpl.id, name:tpl.name + (tpl.label ? ' – '+tpl.label : ''), status:'planned',
    steps: runStepsFromParams(tpl), intensity:tpl.intensity||'rustig', target:{ ...(tpl.target||{type:'none',low:null,high:null}) },
    notes:'', createdAt:runNow(), garminExternalId:null, manual:null, post:null, next:null };
}
function runSessionsOn(date){ return RP().sessions.filter(s=>s.date===date).sort(runByDate); }
function runIsoWeek(d){
  const x = parseDate(d); const th = new Date(x.getFullYear(), x.getMonth(), x.getDate()+3-((x.getDay()+6)%7));
  const w1 = new Date(th.getFullYear(),0,4);
  return 1 + Math.round(((th-w1)/86400000 - 3 + ((w1.getDay()+6)%7))/7);
}
const runMonday = d => addDays(d, -((parseDate(d).getDay()+6)%7));

/* ---------- Garmin-koppeling (alleen verwijzing, nooit kopie van meetwaarden) ---------- */
function runIsRunActivity(a){ return !!a && GARMIN_RUN_TYPES.includes(a.type); }
function runActivity(extId){ return extId ? (state.garmin.activities||[]).find(a=>a.externalId===extId) || null : null; }
function runLinkedMap(){ const m = {}; RP().sessions.forEach(s=>{ if(s.garminExternalId) m[s.garminExternalId] = s.id; }); return m; }
function runCandidates(date){            // Garmin-runs op die dag die nog aan geen enkele training hangen
  const linked = runLinkedMap();
  return (state.garmin.activities||[]).filter(a=> runIsRunActivity(a) && a.date===date && !linked[a.externalId]).sort((x,y)=>(x.startTime||'').localeCompare(y.startTime||''));
}
function runLinkActivity(sesId, extId){
  const s = runSes(sesId); if(!s) return { ok:false, msg:'Training niet gevonden.' };
  const a = runActivity(extId); if(!a) return { ok:false, msg:'Garmin-activiteit niet gevonden.' };
  const lm = runLinkedMap(); if(lm[extId] && lm[extId]!==sesId) return { ok:false, msg:'Deze Garmin-activiteit hoort al bij een andere training.' };
  s.garminExternalId = extId; s.status = 'done'; s.doneAt = s.doneAt || runNow();
  return { ok:true };
}
/* na een Garmin-import: alleen koppelen als het eenduidig is (precies één run die dag, precies één open training die dag) */
function runAutoLinkAfterImport(newActs){
  if(!RP().settings.autoLinkGarmin) return 0;
  let n = 0;
  for(const a of (newActs||[])){
    if(!runIsRunActivity(a)) continue;
    const cands = runCandidates(a.date); if(cands.length!==1 || cands[0].externalId!==a.externalId) continue;
    const open = runSessionsOn(a.date).filter(s=> s.status==='planned' && !s.garminExternalId);
    if(open.length===1 && runLinkActivity(open[0].id, a.externalId).ok) n++;
  }
  return n;
}
/* actuele meetgegevens van een uitgevoerde training — gelezen uit Garmin, niet bewaard */
function runResultOf(s){
  const a = runActivity(s.garminExternalId);
  if(a) return { source:'garmin', durationMin:a.durationMin, distanceKm:a.distanceKm, avgPace:a.avgPace, avgHr:a.avgHr, maxHr:a.maxHr, vo2max:a.vo2max, missing:false };
  if(s.garminExternalId) return { source:'garmin', missing:true };       // verwijzing bestaat, activiteit ontbreekt in de data
  if(s.manual) return { source:'handmatig', durationMin:num(s.manual.durationMin), distanceKm:num(s.manual.distanceKm), missing:false };
  return null;
}

/* ---------- registratie: voor / na / volgende ochtend ---------- */
/* voor-controle van een dag. Energie is één waarde met de Ochtendcheck (dailyLogs); een oude energie die alleen
   bij Hardlopen is opgeslagen, telt alleen als de Ochtendcheck van die dag geen energie heeft */
function runPre(date){
  const c = RP().checks[date] || null, l = (CB && CB.dailyLogs) ? CB.dailyLogs[date] : null, e = l ? num(l.energy) : null;
  if(!c && e==null) return null;
  const m = { ...(c||{}) };
  if(e!=null){ m.energy = e; m.energyFrom = 'ochtendcheck'; }
  return m;
}
const runBool = v => v==='ja' ? true : v==='nee' ? false : null;
const runBoolStr = v => v===true ? 'ja' : v===false ? 'nee' : '';
function runPreComplete(c){ return !!c && num(c.energy)!=null && num(c.painLeft)!=null && typeof c.painWalking==='boolean' && typeof c.painStairs==='boolean'; }
const runPostComplete = p => !!p && num(p.rpe)!=null && num(p.painDuring)!=null && typeof p.painIncreased==='boolean' && typeof p.gaitChanged==='boolean';
const runNextComplete = n => !!n && !!n.trend && num(n.energy)!=null;

/* uitkomst van één uitgevoerde training */
function runOutcome(s){
  const th = RP().settings.thresholds;
  if(!runPostComplete(s.post) || !runNextComplete(s.next)){
    const miss = []; if(!runPostComplete(s.post)) miss.push('na de training'); if(!runNextComplete(s.next)) miss.push('de volgende ochtend');
    return { state:'incomplete', text:'Nog niet compleet: '+miss.join(' en ')+'.' };
  }
  const bad = [], p = s.post, n = s.next;
  if(p.painIncreased===true) bad.push('pijn nam toe tijdens het hardlopen');
  if(p.gaitChanged===true) bad.push('looppatroon veranderde');
  if(n.trend==='toegenomen') bad.push('klachten namen de volgende ochtend toe');
  if(num(p.painDuring)>=th.painDuringBad) bad.push('pijn tijdens hardlopen '+p.painDuring+'/10');
  if(bad.length) return { state:'bad', text:'Niet goed verdragen: '+bad.join(', ')+'.' };
  if(num(p.painDuring)<=th.goodMaxPain) return { state:'good', text:'Goed verdragen.' };
  return { state:'mixed', text:'Verdragen, maar met merkbare pijn ('+p.painDuring+'/10).' };
}
const runDoneSessions = () => RP().sessions.filter(s=>s.status==='done').sort(runByDate);

/* herstelstatus (ondersteunend, geen medisch oordeel). Ontbrekende gegevens -> nooit automatisch groen. */
function runReadiness(date){
  const th = RP().settings.thresholds, pre = runPre(date);
  const reasons = [], missing = [];
  let red = false, orange = false;
  const R = t => { red = true; reasons.push({ sev:'red', text:t }); };
  const O = t => { orange = true; reasons.push({ sev:'orange', text:t }); };
  if(!runPreComplete(pre)){ missing.push('Voor-controle van vandaag is nog niet (volledig) ingevuld'); }
  if(pre){
    if(pre.painWalking===true) R('Klachten tijdens normaal wandelen');
    if(num(pre.painLeft)!=null && pre.painLeft>=th.painRed) R('Pijn linkerbeen '+pre.painLeft+'/10');
    if(num(pre.energy)!=null && pre.energy<=th.energyRed) R('Zeer lage energie ('+pre.energy+'/10)');
    if(num(pre.painLeft)!=null && pre.painLeft>=th.painOrange && pre.painLeft<th.painRed) O('Nog klachten aan het linkerbeen ('+pre.painLeft+'/10)');
    if(pre.painStairs===true) O('Klachten bij traplopen');
    if(num(pre.energy)!=null && pre.energy>th.energyRed && pre.energy<=th.energyOrange) O('Beperkte energie ('+pre.energy+'/10)');
  }
  const last = runDoneSessions().filter(s=>s.date<=date).pop() || null;
  if(!last){ missing.push('Nog geen eerdere training geregistreerd'); }
  else {
    const oc = runOutcome(last);
    const ago = Math.round((parseDate(date)-parseDate(last.date))/86400000);
    if(oc.state==='incomplete') missing.push('Evaluatie van de vorige training ('+fmt(last.date,{day:'numeric',month:'long'})+') ontbreekt: '+oc.text);
    else if(oc.state==='bad'){ R('Vorige training ('+fmt(last.date,{day:'numeric',month:'long'})+'): '+oc.text.replace('Niet goed verdragen: ','')); }
    else if(oc.state==='mixed') O('Vorige training: '+oc.text);
    if(ago>th.staleDays) O('Laatste training is '+ago+' dagen geleden — voorzichtig herstarten');
  }
  const own = (pre && pre.own && RUN_LIGHT[pre.own]) ? pre.own : null;
  let auto;
  if(red) auto = 'red';
  else if(orange) auto = 'orange';
  else if(missing.length) auto = 'orange';
  else if(num(pre.painLeft)>th.greenPainMax) auto = 'orange';
  else auto = 'green';
  if(!red && !orange && missing.length) reasons.push({ sev:'info', text:'Gegevens ontbreken — daarom geen groene status.' });
  // trainingsadvies = de strengste van automatisch en eigen beoordeling (rood > oranje > groen):
  // een eigen beoordeling kan het advies strenger maken, maar een automatische waarschuwing nooit wegnemen
  const RANK = { green:0, orange:1, red:2 };
  const shown = own && RANK[own] > RANK[auto] ? own : auto;
  return { auto, own, shown, ownMilder: !!own && RANK[own] < RANK[auto], reasons, missing, last, hasPre: !!pre };
}
/* korte, leesbare kop voor het overzicht (gaat over het gecombineerde advies) */
function runStatusHeadline(rd){
  if(rd.own && rd.shown===rd.own && rd.own!==rd.auto) return 'Jouw eigen beoordeling: '+RUN_LIGHT[rd.own].head.toLowerCase()+'.';
  const first = rd.reasons.find(r=>r.sev==='red') || rd.reasons.find(r=>r.sev==='orange');
  if(rd.auto==='red') return (first ? first.text+' — ' : '')+'vandaag niet hardlopen.';
  if(rd.auto==='orange'){
    if(first && /linkerbeen/.test(first.text)) return 'Nog klachten aan linkerbeen – niet automatisch opbouwen.';
    return (first ? first.text+' — ' : 'Gegevens ontbreken — ')+'niveau niet verhogen.';
  }
  return 'Geen waarschuwingen. Opbouwen blijft jouw keuze.';
}

/* evaluatie na twee uitgevoerde trainingen + voorstel (altijd handmatige beslissing) */
function runEvaluation(){
  const rp = RP(), lvl = runCurrentTpl(), done = runDoneSessions();
  const rd = runReadiness(todayISO());
  const idx = rp.templates.findIndex(t=>t.id===lvl.id), nextTpl = rp.templates[idx+1] || null, prevTpl = idx>0 ? rp.templates[idx-1] : null;
  const atLevel = done.filter(s=> s.templateId===lvl.id);
  let streak = 0; for(let i=atLevel.length-1;i>=0;i--){ if(runOutcome(atLevel[i]).state==='good') streak++; else break; }
  const need = Math.max(1, num(lvl.goodSessionsToProceed) || 2);
  const last2 = done.slice(-2).map(s=>({ s, oc:runOutcome(s) }));
  let advice, why = [];
  if(done.length<2){ advice = 'Nog te weinig trainingen om te evalueren'; why.push('Na twee uitgevoerde trainingen volgt hier een evaluatie.'); }
  else if(rd.shown==='red' || last2.some(x=>x.oc.state==='bad')){
    advice = rd.shown==='red' ? 'Eerst verder herstel afwachten' : 'Belasting verminderen';
    why.push(...last2.filter(x=>x.oc.state==='bad').map(x=> fmt(x.s.date,{day:'numeric',month:'short'})+': '+x.oc.text));
    if(rd.shown==='red') why.push(...rd.reasons.filter(r=>r.sev==='red').map(r=>r.text));
  }
  else if(rd.shown==='orange' || last2.some(x=>x.oc.state!=='good')){ advice = 'Huidig niveau handhaven'; why.push(...rd.reasons.filter(r=>r.sev!=='info').map(r=>r.text), ...rd.missing); if(!why.length) why.push('Nog niet alle evaluaties zijn compleet.'); }
  else if(streak>=need && nextTpl){ advice = 'Voorzichtig uitbreiden overwegen'; why.push(streak+' trainingen op '+lvl.name+' goed verdragen (nodig: '+need+').'); }
  else { advice = 'Huidig niveau handhaven'; why.push('Op '+lvl.name+' zijn '+streak+' van de '+need+' benodigde trainingen goed verdragen.'); }
  return { advice, why, streak, need, level:lvl, nextTpl, prevTpl, doneCount:done.length };
}

/* ---------- kalender ---------- */
function runNextTraining(){
  const rp = RP(); if(rp.settings.paused) return null;
  const t = todayISO();
  return rp.sessions.filter(s=> s.status==='planned' && s.date>=t).sort(runByDate)[0] || null;
}
const runOverdue = () => RP().sessions.filter(s=> s.status==='planned' && s.date<todayISO()).sort(runByDate);
function runSuggestionDates(from, weeks){       // standaarddagen zonder training of rustdag
  const rp = RP(), out = [];
  if(rp.settings.paused) return out;
  const start = runMonday(from);
  for(let i=0;i<weeks*7;i++){
    const d = addDays(start,i); if(d<todayISO()) continue;
    if(!rp.settings.trainingDays.includes(dowKey(d))) continue;
    if(rp.restDays[d]) continue;
    if(rp.sessions.some(s=>s.date===d && s.status!=='cancelled')) continue;
    out.push(d);
  }
  return out;
}
function runRestWarnings(s){
  const tpl = runTpl(s.templateId), minRest = tpl ? (num(tpl.minRestDays) ?? 2) : 2, out = [];
  for(const o of RP().sessions){
    if(o.id===s.id || o.status==='cancelled' || o.status==='skipped' || !o.date) continue;
    const diff = Math.abs(Math.round((parseDate(o.date)-parseDate(s.date))/86400000));
    if(diff>0 && diff-1 < minRest) out.push(`Slechts ${diff-1} rustdag(en) tussen ${fmt(s.date,{day:'numeric',month:'short'})} en ${fmt(o.date,{day:'numeric',month:'short'})} (minimaal ${minRest} gewenst).`);
    if(diff===0) out.push('Er staat op dezelfde dag al een andere training.');
  }
  if(RP().restDays[s.date]) out.push('Deze dag is als rustdag gemarkeerd.');
  return out;
}

/* Eén samengestelde lijst voor weergave: historische Coach-runs + uitgevoerde trainingen uit dit programma.
   Programma-runs bestaan hier alleen als afgeleide rijen (gelezen uit Garmin) — er wordt niets gekopieerd of dubbel opgeslagen. */
function allRunRecords(){
  const base = CB.coachRuns || [];
  const rp = state.runningProgram; if(!rp) return base;
  const extra = [];
  for(const s of rp.sessions){
    if(s.status!=='done') continue;

    extra.push({ id:'p:'+s.id, date:s.date, done:true, distanceKm:r.distanceKm ?? null, totalMin:r.durationMin ?? null, avgPace:r.avgPace || null,

      garminExternalId:s.garminExternalId || null, _program:true });

  return extra.length ? base.concat(extra).sort((a,b)=>a.date.localeCompare(b.date)) : base;
}

function migrate(saved){
  // --- pre-v3: onbekende oudere vorm -> herkenbare velden onder currentBlock ---
  if(!saved.schemaVersion || saved.schemaVersion < 3){
    const legacyBlock = saved.currentBlock || saved.block || {};
    saved = { schemaVersion:3, meta:saved.meta||{}, currentBlock:{
      ...legacyBlock,
      dailyLogs: saved.dailyLogs || legacyBlock.dailyLogs || {},
      coachRuns: saved.coachRuns || legacyBlock.coachRuns || [],
      strengthSessions: saved.strengthSessions || legacyBlock.strengthSessions || [],
      walks: saved.walks || saved.longWalks || legacyBlock.walks || [],
      measurements: saved.measurements || legacyBlock.measurements || {baseline:{},week6:{}},
    }, exercises:saved.exercises, sources:saved.sources, rationale:saved.rationale, garmin:saved.garmin };
  }
  // --- v3 -> v4: 6-weeks krachtblok wordt 12-weeks opbouw-/integratieblok ---
  if(saved.schemaVersion < 4){
    const cb = saved.currentBlock = saved.currentBlock || {};
    if(!cb.durationWeeks || cb.durationWeeks <= 6) cb.durationWeeks = 12;   // 6 -> 12
    if(!Array.isArray(cb.learningSessions)) cb.learningSessions = [];
    if(!cb.exerciseStage || typeof cb.exerciseStage !== 'object') cb.exerciseStage = {};
    cb.measurements = cb.measurements || {};
    if(!cb.measurements.week12) cb.measurements.week12 = {};     // Week 6-data blijft ongewijzigd
    if(!cb.measurements.week12eval) cb.measurements.week12eval = {};
    saved.schemaVersion = 4;
  }
  // --- v4 -> v5: formele programmastart 31-08 -> 07-09; 31-08 t/m 06-09 wordt overgangsweek ---
  if(saved.schemaVersion < 5){
    const cb = saved.currentBlock = saved.currentBlock || {};
    if(cb.startDate === '2026-08-31') cb.startDate = TRANSITION_END_PLUS1;   // alleen de auto-gegenereerde default corrigeren, geen handmatige keuze overschrijven
    saved.schemaVersion = 5;
  }
  // --- v5 -> v6: hardloopmodule (state.runningProgram). Bestaande gegevens worden niet aangeraakt. ---
  if(saved.schemaVersion < 6){
    saved.runningProgram = saved.runningProgram || runDefaultProgram();
    saved.schemaVersion = 6;
  }
  return saved;
}
function mergeState(base, savedRaw){
  const saved = migrate(structuredClone(savedRaw));
  const m = structuredClone(base);
  m.meta = { ...base.meta, ...(saved.meta||{}) };
  m.meta.appVersion = APP_VERSION;
  m.schemaVersion = SCHEMA_VERSION;
  const sb = saved.currentBlock || {};
  m.currentBlock = { ...base.currentBlock, ...sb };
  m.currentBlock.goals = base.currentBlock.goals;
  m.currentBlock.secondary = base.currentBlock.secondary;
  m.currentBlock.hoofddoel = base.currentBlock.hoofddoel;
  m.currentBlock.tagline = base.currentBlock.tagline;
  m.currentBlock.weekGoals = { ...base.currentBlock.weekGoals, ...(sb.weekGoals||{}) };
  m.currentBlock.weekPlans = { ...(sb.weekPlans||{}) };
  m.currentBlock.dailyLogs = { ...(sb.dailyLogs||{}) };
  m.currentBlock.coachRuns = Array.isArray(sb.coachRuns)?sb.coachRuns:[];
  m.currentBlock.strengthSessions = Array.isArray(sb.strengthSessions)?sb.strengthSessions:[];
  m.currentBlock.learningSessions = Array.isArray(sb.learningSessions)?sb.learningSessions:[];
  m.currentBlock.exerciseStage = (sb.exerciseStage && typeof sb.exerciseStage==='object') ? { ...sb.exerciseStage } : {};
  m.currentBlock.walks = Array.isArray(sb.walks)?sb.walks:[];
  m.currentBlock.measurements = { ...base.currentBlock.measurements, ...(sb.measurements||{}) };
  m.currentBlock.measurements.baseline = { ...(sb.measurements?.baseline||{}) };
  m.currentBlock.measurements.week6 = { ...(sb.measurements?.week6||{}) };
  m.currentBlock.measurements.week12 = { ...(sb.measurements?.week12||{}) };
  m.currentBlock.measurements.week12eval = { ...(sb.measurements?.week12eval||{}) };
  m.currentBlock.measurements.baselineRecovery = { ...(sb.measurements?.baselineRecovery||{}) };
  if(Array.isArray(saved.exercises)){
    m.exercises = base.exercises.map(ex=>{ const s = saved.exercises.find(x=>x.id===ex.id);
      return s ? { ...ex, load:s.load??ex.load, videoUrl:s.videoUrl??ex.videoUrl } : ex; });
  }
  if(Array.isArray(saved.sources)) m.sources = saved.sources;
  if(Array.isArray(saved.rationale)) m.rationale = saved.rationale;
  if(saved.garmin && typeof saved.garmin==='object'){
    m.garmin = {
      daily: { ...(saved.garmin.daily||{}) },
      activities: Array.isArray(saved.garmin.activities) ? saved.garmin.activities : [],
      meta: { ...(saved.garmin.meta||{}) },
    };
  }
  m.runningProgram = runNormalize(saved.runningProgram);
  return m;
}

function blockStart(){ return CB.startDate; }

function clampToBlock(d){ const e=blockEnd(); return d>e ? e : d; }   // geen ondergrens: vrij terugbladeren naar oudere dagen blijft mogelijk
function weekIndexFor(d){
  const diff = Math.floor((parseDate(d) - parseDate(blockStart()))/86400000);
  if(diff < 0) return -1;
  return Math.min(blockWeeks()-1, Math.floor(diff/7));
}
function weekStartISO(wi){ return addDays(blockStart(), wi*7); }
function weekDates(wi){ const s = weekStartISO(wi); return Array.from({length:7}, (_,i)=> addDays(s,i)); }
function inWeek(dateStr, wi){ const ds = weekDates(wi); return dateStr>=ds[0] && dateStr<=ds[6]; }

function coachPlanDays(wi){ if(runReplacesCoach()) return runWeekInfo(weekDates(wi)).days; const c = weekPlan(wi).coachDays; return Array.isArray(c) ? c : []; }

/* herstel-tijdlijn: historische logs + nieuwe dailyLogs + garmin-samenvatting  */
function recoveryTimeline(){
  const map = {};
  const put = (d,k,v)=>{ if(v==null||v==='') return; (map[d] = map[d]||{date:d}); if(map[d][k]==null) map[d][k]=v; };
  for(const [d,l] of Object.entries(HISTORICAL.logs||{})){
    put(d,'energy', num(l.morningEnergy)); put(d,'stiffness', num(l.morningStiffness)); put(d,'pain', num(l.morningPain));
    put(d,'restingHr', num(l.rhr)); put(d,'hrv', num(l.hrv));
    put(d,'sleepHours', l.sleepTime ? round(timeToMin(l.sleepTime)/60,2) : num(l.sleepHours));
    put(d,'pushups', num(l.pushups)); put(d,'weight', num(l.weightKg)); put(d,'era','historisch');
  }
  for(const [d,l] of Object.entries(CB.dailyLogs)){
    const g = state.garmin.daily[d] || {};
    put(d,'energy', num(l.energy)); put(d,'stiffness', num(l.stiffness)); put(d,'pain', num(l.pain));
    put(d,'restingHr', num(l.restingHr) ?? num(g.restingHr));
    put(d,'hrv', num(l.hrv) ?? num(g.nightHrv));
    put(d,'sleepHours', num(l.sleepHours) ?? num(g.sleepDuration));
    put(d,'weight', num(l.weightKg));
    put(d,'pushups', num(l.routineDetail?.pushupReps));
    for(const f of ['forwardBendReps','legRaiseReps','toeTouchReps','ohpL','ohpR','balanceReachL','balanceReachR']) put(d, f, num(l.routineDetail?.[f]));
    put(d,'era','blok2');
  }
  // energie uit de voor-controle bij Hardlopen telt mee als er die dag geen Ochtendcheck-energie is
  for(const [d,ck] of Object.entries((state.runningProgram && state.runningProgram.checks) || {})) put(d,'energy', num(ck && ck.energy));
  for(const [d,g] of Object.entries(state.garmin.daily)){
    // 'put' is first-wins: handmatige dailyLogs-waarden (hierboven) blijven voorrang houden
    put(d,'hrv', num(g.nightHrv)); put(d,'restingHr', num(g.restingHr)); put(d,'sleepHours', num(g.sleepDuration));
    put(d,'weight', num(g.weightKg));
  }
  return Object.values(map).sort((a,b)=> a.date.localeCompare(b.date));
}
/* 7-daagse hersteltrend = KALENDERVENSTER: vandaag en de 6 voorafgaande dagen.
   Geeft {value, n, of} zodat de UI "3 van 7 dagen" / "onvoldoende data" kan tonen. */
function recent7(key, refDate){
  const end = refDate || todayISO();
  const start = addDays(end, -6);
  const rows = recoveryTimeline().filter(r=> r.date>=start && r.date<=end && r[key]!=null);
  return { value: rows.length ? avg(rows.map(r=>r[key])) : null, n: rows.length, of:7, start, end };
}
function r7(key, refDate){ return recent7(key, refDate).value; }   // korte vorm waar alleen de waarde telt
/* Week 0-herstelwaarde: bevroren snapshot als vastgelegd, anders de live 7-daagse trend */
function w0Recovery(key){
  const M = CB.measurements;
  if(M.baselineFrozen && M.baselineRecovery && M.baselineRecovery[key]!=null)
    return { v:M.baselineRecovery[key], frozen:true };
  const r = recent7(key);
  return { v:r.value, frozen:false, n:r.n };
}
function freezeBaseline(){
  const M = CB.measurements;
  M.baselineRecovery = {};
  // Week 0 hoort bij de overgangsweek: vast venster 31 aug - 6 sep, niet "vandaag"
  const refDate = TRANSITION_END;
  for(const k of ['hrv','restingHr','sleepHours','energy','stiffness','pain']){
    const r = recent7(k, refDate); if(r.value!=null) M.baselineRecovery[k] = round(r.value, k==='sleepHours'?2:1);
  }
  M.baselineFrozen = true;
  M.baselineFrozenAt = todayISO();
  if(!M.baseline.date) M.baseline.date = refDate;
